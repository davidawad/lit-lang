# Civil appeals to the Rhode Island Supreme Court under Article I of the
# Supreme Court Rules, Appellate Procedure (revised February 17, 2026,
# sources/ri-supreme), from the appellant's side. Computation of time is
# Art. I, Rule 20(a): the last day rolls forward past a Saturday, Sunday
# or legal holiday, and lit/core has no Rhode Island counting rule or
# holiday calendar, so the periods are stated in notes, not encoded as
# counted deadlines. The Supreme Court is the State's court of last
# resort; review of its judgment by certiorari belongs to lit/scotus.
[package]
name = "ri-supreme-court-civil-appeals"
version = "0.1.0"
language = 1
pack_id = "ri-supreme-court-civil-appeals"
forum = "ri-supreme"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "rhode-island"
title = "Rhode Island Supreme Court, civil appeals"
description = "Civil appeals from the Superior Court to the Rhode Island Supreme Court under Article I of the Supreme Court Rules, as far as the vendored text states: the notice of appeal and its time, the transcript and transmission of the record, docketing, the Rule 12A statement and counter-statement and the single justice conference, the show cause calendar or full briefing with the word limits, argument, decision and reargument."
in_force = "2026-02-17"
known_at = "2026-10-28"
unknown_before = "2026-02-17"
jurisdiction = "Rhode Island Supreme Court (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
ri-state-rules = { version = "^0.1.0", path = "../ri-rules" }

[sources.ri-sup-ct-art-i]
title = "Rhode Island Supreme Court Rules, Article I, Appellate Procedure (revised February 17, 2026)"
url = "https://www.courts.ri.gov/Courts/SupremeCourt/Documents/Supreme-Rules-Article1.pdf"
path = "sources/ri-supreme/ri-supreme-article-i-appellate-procedure-sectioned.txt"
path_sha256 = "b772b2aec643f4376e27912e04acb1c643d4714990851597fd4d8425f1df6e2f"
sha256 = "9341c74f7a5dcad574e43e1a1903407da66d538b337958434d21ff6795ca715c"
as_of = "2026-02-17"
cite_prefixes = ["R.I. Sup. Ct. R. App. P."]
section_heading = "Art. I Rule {n}"
