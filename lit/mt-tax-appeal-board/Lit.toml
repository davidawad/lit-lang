# Proceedings before the Montana State Tax Appeal Board under Mont. Code
# Ann. title 15, chapter 2. No text of the chapter, of the board's rules
# (Admin. R. Mont. title 1, chapter 2) or of its procedure is vendored under
# sources/, so every cite is a hole naming the pinpoint the outline pointed
# to and no period, form or fee is stated. The structure is the outline's:
# an appeal filed with the board, a hearing, the board's decision, and
# review of it, which is its own package.
[package]
name = "mt-tax-appeal-board"
version = "0.1.0"
language = 1
pack_id = "mt-tax-appeal-board"
forum = "mt-tax-appeal-board"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "montana"
title = "Montana State Tax Appeal Board"
description = "An appeal before the Montana State Tax Appeal Board: filing, the hearing, the decision, and review. Every cite is a hole: Mont. Code Ann. title 15, chapter 2 and the board's rules are not vendored, so no period, form or fee is stated."
in_force = "2025-01-01"
known_at = "2026-10-28"
unknown_before = "2025-01-01"
jurisdiction = "Montana State Tax Appeal Board"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
mt-state-rules = { version = "^0.1.0", path = "../mt-rules" }

[sources.mca-15-2]
title = "Montana Code Annotated, title 15, chapter 2 (State Tax Appeal Board), not vendored"
url = "https://archive.legmt.gov/bills/mca/title_0150/chapter_0020/parts_index.html"
