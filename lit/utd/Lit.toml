# The United States District Court for the District of Utah's Local Rules
# of Civil Practice (DUCivR) as a local-rule layer over lit/frcp (28 U.S.C.
# § 2071; FRCP 83(a)): it declares only the periods and limits the local
# rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule; when the court is closed by
# order of the Chief Judge, a deadline falling that day runs to the next
# day the court is open (DUCivR 6-1). The rules are effective December 1,
# 2025 (DUCivR 1-1; sources/d-utah); earlier editions are not vendored, so
# a query before that date is a hole in the corpus. The criminal rules
# (forum utd-criminal) and the bankruptcy rules (DUCivR 83-6) are out of
# scope. An appeal goes to the Tenth Circuit under lit/frap and lit/ca10.
[package]
name = "utd-local-rules"
version = "0.1.0"
language = 1
pack_id = "utd-local-rules"
forum = "utd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the District of Utah: Local Rules of Civil Practice"
description = "The District of Utah's Local Rules of Civil Practice as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the filing fee, motion responses and replies and their page and word limits, evidentiary objections, supplemental authority, amicus memoranda, short form discovery motions, attorney's fees and the bill of costs, objections to a magistrate judge's order, consent to a magistrate judge, and removed actions."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "United States District Court, D. Utah"
counting = "frcp6"

[package.roles]
