# Criminal cases in the Alabama trial courts under the Alabama Rules of
# Criminal Procedure (sources/al-criminal-trial-court), with the criminal
# notice of appeal under Ala. R. App. P. 4(b) (sources/al-state-appellate).
# The criminal rules are the per-rule PDFs the Alabama Judicial System
# serves with no edition or effective date: their PROVENANCE marks them
# CURRENCY UNCONFIRMED, so every period they state is a hole here (noted,
# never asserted) until the edition is confirmed; their cites are bound to
# the vendored text for structure only. Alabama has no fixed-day
# speedy-trial rule (Rule 8.1 sets priorities). The appeal hands off to
# lit/al-court-of-criminal-appeals.
[package]
name = "al-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "al-criminal-trial-court"
forum = "al-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "alabama"
title = "Alabama trial courts, criminal"
description = "Criminal cases in the Alabama circuit courts under the Alabama Rules of Criminal Procedure: arrest and initial appearance, release, preliminary hearing, indictment, arraignment, pretrial motions, discovery, plea or trial, judgment of acquittal, new trial, sentencing and the criminal notice of appeal (Ala. R. App. P. 4(b)). The criminal rules' own periods are holes: the vendored edition's currency is unconfirmed."
in_force = "2025-10-01"
known_at = "2026-10-28"
unknown_before = "2025-10-01"
jurisdiction = "Alabama trial courts of general criminal jurisdiction"

