# The Rules of the United States Bankruptcy Appellate Panel of the Ninth
# Circuit over lit/frbp (FRBP 8026; 9th Cir. BAP R. Preamble): it declares
# only the periods and the limit the panel's own rules state and
# re-encodes no FRBP period (notice, election, record, briefing, rehearing
# and the direct-review periods are lit/frbp's; 28 U.S.C. § 158(c)(1)
# election is lit/frbp's too). The rules are those adopted February 24,
# 2000, as revised June 15, 2015, the latest revision the panel's site
# lists (sources/fed-ca9-bap/PROVENANCE.md); no later order amends them,
# so the revision is the only layer. The package is in force from the FRBP
# December 1, 2025 edition it composes with, a lower bound: a query before
# then is a hole in the corpus. Each period is counted under FRBP 9006(a),
# the FRCP 6(a) method (core's frcp6). Like lit/bap8 it is a base package,
# not a `kind = "local-rule"` layer: its forum `bap9` is in none of
# lit/core's forum families (the bankruptcy family holds the bankruptcy
# courts, not the appellate panels), so a layer there would be L2011.
[package]
name = "ninth-circuit-bankruptcy-appellate-panel"
version = "0.1.0"
language = 1
pack_id = "ninth-circuit-bankruptcy-appellate-panel"
forum = "bap9"
authority = "FederalRule"
title = "Ninth Circuit Bankruptcy Appellate Panel Procedure"
description = "Appeals before the Bankruptcy Appellate Panel of the Ninth Circuit under the current Federal Rules of Bankruptcy Procedure (lit/frbp) and the panel's rules: the order attached to the notice, district court election and transfer, the excerpts of the record, fax filing, clerk orders and their review, brief extensions and dismissal for failure to prosecute, oral argument, en banc hearing, disposition and publication, rehearing and further review in the Ninth Circuit."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "Bankruptcy Appellate Panel of the Ninth Circuit"
counting = "frcp6"

[package.roles]
applicant = "self"
appellee = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods themselves (Part 8 appeal periods); this package layers the panel's rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

