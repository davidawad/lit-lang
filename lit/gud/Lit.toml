kind = "local-rule"
title = "District Court of Guam: Civil Local Rules of Practice"
description = "The District Court of Guam's Civil Local Rules of Practice (CVLR) as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion briefing and its page limits, oral argument requests, evidentiary hearing disclosures, reconsideration, the pro se Rule 12 notice, the scheduling notice and the Scheduling and Planning Conference Report, the standard pretrial times, the mediator's report, expedited discovery letter briefs, costs and attorney's fees, summary judgment concise statements, settlement of judgments, magistrate judge consent by an added party, and the withdrawal and disposition of exhibits."
in_force = "2019-07-22"
known_at = "2026-10-28"
unknown_before = "2019-07-22"
jurisdiction = "District Court of Guam"
counting = "frcp6"

