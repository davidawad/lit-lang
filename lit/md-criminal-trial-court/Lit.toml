# Criminal causes in the Maryland circuit courts (and the District Court
# where Title 4 says so) under Title 4 of the Maryland Rules, with the
# criminal notice of appeal of Rule 8-202. Both texts are the Westlaw
# public-access extracts (sources/md-criminal-trial-court and
# sources/md-appellate-civil), whose pages state "Current with amendments
# received through September 1, 2026"; every cite resolves against the
# sectioned extracts, and every period is stated in a note as the rule
# states it. Computation of time is Md. Rule 1-203, which is
# not vendored, and lit/core has no Maryland counting rule, so no period
# is a counted deadline. The speedy-trial statute, Code, Criminal Procedure
# Article, § 6-103, is not vendored; Rule 4-271 is the rule. Federal habeas
# is lit/habeas's.
[package]
name = "md-criminal-trial-court"
