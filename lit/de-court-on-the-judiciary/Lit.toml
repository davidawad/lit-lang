# Judicial discipline proceedings in the Court on the Judiciary of
# Delaware, from the respondent judge's side. Del. Const. art. IV, § 37
# and the Rules of the Court on the Judiciary are not vendored: every step
# keeps the outline's structure with its cite a hole and states no period
# or standard. The vendored Supreme Court Rules (PDF of Feb. 3, 2026;
# sources/de-supreme-civil) state only that a complaint filed in the Court
# on the Judiciary is referred by the Chief Justice to a Panel for review
# and investigation (Supr. Ct. R. 68(a)).
[package]
family = "state-civil"
name = "de-court-on-the-judiciary"
version = "0.1.0"
language = 1
pack_id = "de-court-on-the-judiciary"
forum = "de-court-on-the-judiciary"
authority = "StateRule"
jurisdiction_id = "delaware"
title = "Court on the Judiciary of Delaware"
description = "Judicial discipline proceedings in the Court on the Judiciary of Delaware: the structure from complaint and referral to a Panel (Del. Supr. Ct. R. 68(a)) through formal charges, answer, hearing and decision, with every value a hole (Del. Const. art. IV, section 37 and the Court on the Judiciary Rules are not vendored)."
in_force = "2026-02-03"
known_at = "2026-10-28"
unknown_before = "2026-02-03"
jurisdiction = "Court on the Judiciary of Delaware"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

