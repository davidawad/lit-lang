# The United States District Court for the Eastern District of Michigan's
# Local Rules (civil) as a local-rule layer over lit/frcp (28 U.S.C. § 2071;
# FRCP 83(a)): it declares only the periods and limits the civil Local
# Rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule. The rules are the edition
# "Current as of January 1, 2026" (sources/mied); the amendments the court
# lists as effective November 1, 2026 are not vendored, so this layer
# speaks for the January 1, 2026 text only. The criminal (LCrR) and
# admiralty rules are out of scope. An appeal goes to the Sixth Circuit
# under lit/frap and lit/ca6.
[package]
name = "mied-local-rules"
version = "0.1.0"
language = 1
pack_id = "mied-local-rules"
forum = "mied"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Eastern District of Michigan: Local Rules (civil)"
description = "The Eastern District of Michigan's civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion responses and replies and brief page limits, reconsideration of non-final orders, filing discovery material on order, the mediation memorandum and post-settlement closing papers, the bill of costs, attorney fee motions and responses, Social Security fee motions, entry of judgments on notice, responses and replies to objections to a magistrate judge's rulings, and consent to a magistrate judge by a party added later."
in_force = "2026-01-01"
known_at = "2026-10-28"
unknown_before = "2026-01-01"
jurisdiction = "United States District Court, E.D. Mich."
counting = "frcp6"

[package.roles]
