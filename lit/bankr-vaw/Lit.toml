# The Local Rules of the U.S. Bankruptcy Court for the Western District of
# Virginia over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods the Local Rules themselves state and re-encodes no FRBP
# period. It is a base package, not a `kind = "local-rule"` layer:
# lit/core has no bankruptcy forum family (L2011 for `bankr-vaw`), as for
# lit/bankr-md. Each period is counted under FRBP 9006(a), the FRCP 6(a)
# method (core's frcp6). The rules are those effective March 14, 2025; the
# standing orders listed after that date do not amend them
# (sources/bankr-vaw/PROVENANCE.md), so the consolidation is the only
# layer. The earlier editions are not vendored, so a query before March
# 14, 2025 is a hole in the corpus.
[package]
name = "bankr-vaw-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-vaw-local-rules"
forum = "bankr-vaw"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Western District of Virginia: Local Rules"
description = "The Bankr. W.D. Va. Local Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): consolidated mailing matrices, employment objections, chapter 7 fee applications, small business and subchapter V conditional disclosure statements, chapter 11 final decrees, payment advices, eviction-deposit lessor responses, chapter 13 discharge certifications and disputes, signed originals, voluntary dismissal of discharge complaints, appeal record copies and transmittal, hearing notices and motion responses (LBR 9013-1), jury-trial consents, exhibits and proposed orders."
in_force = "2025-03-14"
known_at = "2026-10-28"
unknown_before = "2025-03-14"
jurisdiction = "U.S. Bankruptcy Court for the Western District of Virginia"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.vawb-lr]
title = "Local Rules of the United States Bankruptcy Court for the Western District of Virginia (effective March 14, 2025)"
url = "https://www.vawb.uscourts.gov/sites/default/files/local_rules/Local%20Rules%20-%202025.pdf"
path = "sources/bankr-vaw/vaw-local-rules-2025-03-14-sectioned.txt"
path_sha256 = "6362cfab8acb3cd76ac5b8759be2adf4ba4f4e7bde1deb64d3b5d838bb4b9ffd"
sha256 = "5cdaff5d0d28d196090167b3f0cb419f2372cfd0e148a966dfdccaa89d890988"
as_of = "2025-03-14"
cite_prefixes = ["W.D. Va. LBR"]
section_heading = "Rule {n}"
