description = "The Middle District of Alabama's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the entrapment notice, the standard criminal discovery exchange, presentence records, counsel, the drug-test challenge procedure in revocation proceedings and collateral forfeiture."
