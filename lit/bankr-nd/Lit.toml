# The Bankruptcy Local Rules of the U.S. Bankruptcy Court for the District
# of North Dakota over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods and page limits the rules state and re-encodes
# no FRBP period. Each period is counted under FRBP 9006(a), the FRCP 6(a)
# method (core's frcp6).
#
# Layers, in date order: the rules effective February 6, 2023 (L.R.
# 1001-1(C); the consolidation), then the order adopting L.R. 9013-2
# (corporate ownership statements) effective April 3, 2023. The vendored
# consolidation already prints L.R. 9013-2 in the order's words, and the
# rule states no period, page limit or service rule (the statement is filed
# with a corporation's first paper), so the order changes no declaration
# here and needs no dated version. No earlier edition is vendored, so a
# query before February 6, 2023 is a hole in the corpus.
[package]
name = "bankr-nd-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-nd-local-rules"
forum = "bankr-nd"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of North Dakota: Bankruptcy Local Rules"
description = "The Bankr. D.N.D. Bankruptcy Local Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): omitted creditors added by amended schedules, joint administration objections, the default 14-day notice, the chapter 11 claims deadline, unclaimed funds, notice after reopening, adversary motion briefing and page limits (L.R. 7007-1), adversary settlements, motion response time (L.R. 9013-1) and judgment on the pleadings in contested matters."
in_force = "2023-02-06"
known_at = "2026-10-28"
unknown_before = "2023-02-06"
jurisdiction = "U.S. Bankruptcy Court for the District of North Dakota"
counting = "frcp6"

[package.instrument]
source = "ndb-lbr"
issuer = "United States Bankruptcy Court for the District of North Dakota"
date = "2023-02-06"
designation = "Bankruptcy Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

