# The U.S. District Court for the Northern District of Texas's Local Civil
# Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP
# 83(a)): it declares only the periods and limits the Local Civil Rules
# themselves state and re-encodes no FRCP deadline. Each period is counted
# under FRCP 6, which governs a period stated in a local rule (FRCP 6(a));
# Texas's own holidays (FRCP 6(a)(6)(C)) are not vendored and not modeled.
# The rules are the edition "Effective September 1, 2026" (sources/txnd),
# so in_force is that date; earlier editions are not vendored, so a query
# before it is a hole in the corpus. The criminal rules are
# lit/txnd-criminal's; the attorney rules are not encoded. An appeal goes
# to the Fifth Circuit under lit/frap.
[package]
name = "txnd-local-rules"
version = "0.1.0"
language = 1
pack_id = "txnd-local-rules"
forum = "txnd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Northern District of Texas: Local Civil Rules"
description = "The U.S. District Court for the Northern District of Texas's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): ECF registration, the motion response and reply periods, brief and summary-judgment page limits, death-penalty habeas page limits, the pretrial order, exhibit, witness and deposition designations, proposed findings, class certification, master and magistrate-judge objection briefing, the bill of costs, default, the summary-judgment cutoff, the stay of an inter-district transfer, exhibits and sealed documents after final disposition, and the certificate of interested persons on removal."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "U.S. District Court for the Northern District of Texas (civil)"
# FRCP 6(a)(6)(C): the holidays of Texas close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-texas`).
counting = "frcp6-texas"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "txnd-lr"
issuer = "U.S. District Court for the Northern District of Texas"
date = "2026-09-01"
designation = "Local Civil Rules (effective September 1, 2026)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.txnd-lr]
title = "Local Civil Rules of the United States District Court for the Northern District of Texas (effective September 1, 2026)"
url = "https://www.txnd.uscourts.gov/sites/default/files/documents/CIVRULES.pdf"
path = "sources/txnd/tx-nd-local-civil-rules-sectioned.txt"
path_sha256 = "02d1282a92209c098499f53867dfa6434370a1c46ef4235c890f9ec955baef06"
sha256 = "46a817694c28c41732b91b2b672fe23ee08ad28f8c633a97534312a1b1f29dba"
as_of = "2026-09-01"
cite_prefixes = ["N.D. Tex. LR"]
section_heading = "LR {n}"
