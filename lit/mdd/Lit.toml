# The District of Maryland's Local Rules as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods
# the Local Rules themselves state and re-encodes no FRCP deadline. Each
# period is counted under FRCP 6(a), which governs "any local rule". The
# rules are the edition dated December 1, 2025 (sources/mdd). An appeal
# to the Fourth Circuit is lit/frcp's and lit/ca4's.
[package]
name = "mdd-local-rules"
version = "0.1.0"
language = 1
pack_id = "mdd-local-rules"
forum = "mdd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, District of Maryland: Local Rules (civil)"
description = "The District of Maryland's Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): withdrawal of counsel, removal filings, dismissal for want of prosecution, motions to compel, motion briefing and reconsideration, pretrial orders, bills of costs and attorneys' fees motions."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "United States District Court, D. Maryland"
# FRCP 6(a)(6)(C): the holidays of Maryland close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-maryland`).
counting = "frcp6-maryland"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "mdd-lr"
issuer = "United States District Court for the District of Maryland"
date = "2025-12-01"
designation = "Local Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.mdd-lr]
title = "Local Rules of the United States District Court for the District of Maryland (December 1, 2025)"
url = "https://www.mdd.uscourts.gov/sites/mdd/files/LocalRules.pdf"
path = "sources/mdd/mdd-local-rules-sectioned.txt"
path_sha256 = "287ac2420ed78aaff0f6d8b3d6c081393df5111e19f4180b88a054b951e286b4"
sha256 = "0548bdddab14f278b80ad91c2625837e65ad06ddfe9613107a72a0121174cae9"
as_of = "2025-12-01"
cite_prefixes = ["D. Md. Local Rule"]
section_heading = "Local Rule {n}"
