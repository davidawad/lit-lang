# The United States District Court for the Western District of
# Tennessee's Local Rules as a local-rule layer over lit/frcp (28 U.S.C.
# § 2071; FRCP 83(a)): it declares only the periods and limits the civil
# Local Rules themselves state and re-encodes no FRCP deadline. FRCP 6
# computes any period these Local Rules prescribe (LR 6.1(a)). The rules
# are the edition "Revised November 17, 2025" (sources/tnwd); earlier
# editions are not vendored, so a query before that date is a hole in the
# corpus. The Local Criminal Rules (LCrR, forum tnwd-criminal) and the
# separate Local Patent Rules are not encoded. An appeal goes to the
# Sixth Circuit under lit/frap and lit/ca6.
[package]
name = "tnwd-local-rules"
version = "0.1.0"
language = 1
pack_id = "tnwd-local-rules"
forum = "tnwd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Western District of Tennessee: Local Rules (civil)"
description = "The Western District of Tennessee's civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion responses, leave to reply and memorandum page limits, motions pending on removal, prisoner production, amended pleadings after leave, motion to dismiss and summary judgment briefing, trial memoranda, supplementation before trial, post-trial proposed findings, costs and attorney's fees, appeals from magistrate judges' orders, and dismissal papers after a notice of settlement."
in_force = "2025-11-17"
known_at = "2026-10-28"
unknown_before = "2025-11-17"
jurisdiction = "United States District Court, W.D. Tennessee"
counting = "frcp6"

