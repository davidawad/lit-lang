# The Eastern District of New York's civil Local Rules (the Joint Local
# Rules of the Southern and Eastern Districts, effective January 2, 2026)
# as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a); Local
# Civ. R. 1.1): it declares only the periods and limits the Local Rules
# themselves state and re-encodes no FRCP deadline. Each period is counted
# under FRCP 6, to which Local Civ. R. 6.1 refers. The rules are the
# edition effective January 2, 2026, vendored once under sources/sdny for
# both districts; earlier editions are not vendored, so a query before
# that date is a hole in the corpus. The rules marked "Southern District
# Only" are lit/nysd's; the criminal, admiralty and patent rules are not
# encoded. An appeal goes to the Second Circuit under lit/frap.
[package]
name = "nyed-local-rules"
version = "0.1.0"
language = 1
pack_id = "nyed-local-rules"
forum = "nyed"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Eastern District of New York: Local Civil Rules"
description = "The Eastern District of New York's civil Local Rules (Joint Local Rules of the S.D.N.Y. and E.D.N.Y.) as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion service periods, reconsideration and its word limits, memorandum word limits, supplemental disclosure statements, the pro se Rule 12 notice, amended pleadings, prisoner pro se discovery, exhibits, taxation of costs, objections to magistrate judges' orders, Social Security briefing, and court-annexed arbitration under Local Civil Rule 83.7."
in_force = "2026-01-02"
known_at = "2026-10-28"
unknown_before = "2026-01-02"
jurisdiction = "United States District Court, E.D.N.Y."
counting = "frcp6"

