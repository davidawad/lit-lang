# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Southern
# District of New York over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods the Local Bankruptcy Rules themselves state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective September 30, 2024 (sources/bankr-nys/PROVENANCE.md); the
# court's page lists no later amendment and no amending order is vendored,
# so the consolidation is the only layer. No earlier edition is vendored,
# so a query before September 30, 2024 is a hole in the corpus.
[package]
name = "bankr-nys-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-nys-local-rules"
forum = "bankr-nys"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Southern District of New York: Local Bankruptcy Rules"
description = "The Bankr. S.D.N.Y. Local Bankruptcy Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): the involuntary chapter 11 affidavit, health care case conferences, final chapter 7 compensation, chapter 9 and 11 vote certifications, ineffective elections and confirmation objections, post-confirmation orders and closing reports, cure of residential judgments of possession, final financing orders, section 521(i) dismissal objections, added creditors' exemption objections, filing fees, small sales and auctions, contention interrogatories and document inspection, pre-motion letters, motion practice (LBR 9006-1), presentment, jury consent, reargument, redaction, exhibits, orders settled or submitted and proof of service."
in_force = "2024-09-30"
known_at = "2026-10-28"
unknown_before = "2024-09-30"
jurisdiction = "U.S. Bankruptcy Court for the Southern District of New York"
counting = "frcp6"

[package.instrument]
source = "nysb-lbr"
issuer = "United States Bankruptcy Court for the Southern District of New York"
date = "2024-09-30"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

