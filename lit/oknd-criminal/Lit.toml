# The U.S. District Court for the Northern District of Oklahoma's local
# criminal rules (LCrR) as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods and limits the
# local criminal rules themselves state and re-encodes no FRCrimP, Speedy
# Trial Act or FRAP 4(b) period (one source of truth: lit/frcrimp). Each
# period is counted under FRCrimP 45(a), which governs "any local rule",
# so each deadline names `forum frcrimp`. The rules are the Local Rules
# effective July 31, 2026 (Criminal Rules part; sources/nd-okla), the
# edition the court serves as current, so in_force is that date; earlier
# editions are not vendored, so a query before it is a hole in the corpus.
# An appeal goes to the Tenth Circuit under lit/frcrimp's FRAP 4(b) period
# and lit/ca10.
[package]
name = "oknd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "oknd-criminal-local-rules"
forum = "oknd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Northern District of Oklahoma: Local Criminal Rules"
description = "The U.S. District Court for the Northern District of Oklahoma's local criminal rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): expert-witness disclosures, objections of record to the presentence report, departure and variance motions and sentencing memoranda with their responses, the probation office's sentencing recommendation, the motion and response periods, and the brief page limit."
in_force = "2026-07-31"
known_at = "2026-10-28"
unknown_before = "2026-07-31"
jurisdiction = "U.S. District Court for the Northern District of Oklahoma (criminal)"
counting = "frcrimp45"

