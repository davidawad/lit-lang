# Discretionary review in the Supreme Court of Puerto Rico (Tribunal
# Supremo) of a civil judgment or resolution of the Court of Appeals, by
# certiorari, from lit/pr-tribunal-apelaciones (lg-u561.5). The petition's
# term, its interruption by reconsideration and the certification writ are
# in P.R. R. Civ. P. 52.2 and 52.3 (sources/pr-primera-instancia-civil) and
# Regl. T.A. R. 84 (sources/pr-tribunal-apelaciones), both Spanish. The
# Reglamento del Tribunal Supremo (4 LPRA Ap. XXI-B) and the Ley de la
# Judicatura de 2003 are not vendored, so the petition's form and length,
# the grant standard, merits briefing, argument and reconsideration in the
# Supreme Court are holes. lit/core has no Puerto Rico counting rule, so the
# periods are stated in notes, not encoded as counted deadlines. The
# package routes on lit/pr-rules' trigger events.
[package]
name = "pr-supreme-court"
version = "0.1.0"
language = 1
pack_id = "pr-supreme-court"
forum = "pr-supreme-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "puerto-rico"
title = "Supreme Court of Puerto Rico (Tribunal Supremo), certiorari review of Court of Appeals civil decisions"
description = "Certiorari in the Supreme Court of Puerto Rico from a civil judgment or resolution of the Court of Appeals, as far as the vendored text states: the jurisdictional thirty- or sixty-day term (P.R. R. Civ. P. 52.2(b), (c)), its interruption by a timely motion for reconsideration in the Court of Appeals (P.R. R. Civ. P. 52.2(f); Regl. T.A. R. 84(A)), the absence of a stay on filing (P.R. R. Civ. P. 52.3(b)), the grant or denial of the writ, and appellate costs (P.R. R. Civ. P. 44.1(c)). The Reglamento del Tribunal Supremo is not vendored; what it governs is a hole."
in_force = "2025-12-19"
known_at = "2026-10-28"
unknown_before = "2025-12-19"
jurisdiction = "Supreme Court of Puerto Rico (Tribunal Supremo), civil"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the trigger events.
pr-state-rules = { version = "^0.1.0", path = "../pr-rules" }

