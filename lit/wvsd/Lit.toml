# The United States District Court for the Southern District of West
# Virginia's Local Rules of Civil Procedure as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods and
# limits the Local Rules of Civil Procedure themselves state and re-encodes
# no FRCP deadline. FRCP 6(a) computes a period stated in a local rule. The
# rules are the Local Rules of Procedure effective December 1, 2009, as
# amended through June 8, 2017 (cover list; sources/wvsd), which the
# court's local-rules page links with no later amendment. The Local Rules
# of Criminal Procedure are out of scope. An appeal goes to the Fourth
# Circuit under lit/frap and lit/ca4.
[package]
name = "wvsd-local-rules"
version = "0.1.0"
language = 1
pack_id = "wvsd-local-rules"
forum = "wvsd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Southern District of West Virginia: Local Rules of Civil Procedure"
description = "The Southern District of West Virginia's Local Rules of Civil Procedure as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the waiver-of-service request, response and reply memoranda and the memorandum page limit, Social Security review (consent, the Commissioner's response, briefs and their page limits, EAJA fees), the Rule 26(f) meeting and report, initial and expert disclosures, case management and final pretrial conference filings, discovery answers after objections, the motion-to-compel waiver, dismissal for want of prosecution, jury instructions and proposed findings, and the bill of costs."
in_force = "2017-06-08"
known_at = "2026-10-28"
unknown_before = "2017-06-08"
jurisdiction = "United States District Court, S.D. W. Va."
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

