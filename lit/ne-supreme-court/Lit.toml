# How a Nebraska civil case comes before the Nebraska Supreme Court rather
# than the Court of Appeals: the petition to bypass and the removal under
# Neb. Rev. Stat. § 24-1106(2), (3) (sources/ne-district), and an original
# action under Neb. Ct. R. App. P. § 2-115(A) (sources/nebctapp). The
# rules on the bypass petition's procedure and time (§ 24-1106(2) leaves
# them to the court's rules), on further review of a Court of Appeals
# decision and on rehearing are not vendored: further review is held as a
# hole. The merits stages (briefing, submission, decision) are the same
# Neb. Ct. R. App. P. sections for both courts and are lit/nebctapp's.
[package]
name = "ne-supreme-court-civil"
version = "0.1.0"
language = 1
pack_id = "ne-supreme-court-civil"
forum = "ne-supreme-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "nebraska"
title = "Nebraska Supreme Court, civil"
description = "How a civil case comes before the Nebraska Supreme Court, as far as the vendored statute and rules state: direct review on a petition to bypass the Court of Appeals or removal (Neb. Rev. Stat. § 24-1106(2), (3)), an original action by leave of court (Neb. Ct. R. App. P. § 2-115(A)), and further review of a Court of Appeals decision, held as a hole (its rule is not vendored)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Nebraska Supreme Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
ne-state-rules = { version = "^0.1.0", path = "../ne-rules" }

