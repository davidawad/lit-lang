# The Western District of North Carolina's Local Civil Rules as a
# local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods and limits the Local Civil Rules themselves
# state and re-encodes no FRCP deadline. FRCP 6(a) computes a period stated
# in a local rule. The rules are the Local Rules, 2017 Edition as revised
# effective December 1, 2022 (sources/ncwd), the latest the court's page
# lists. The Local Criminal Rules in the same document are out of scope.
# An appeal goes to the Fourth Circuit under lit/frap and lit/ca4.
[package]
name = "ncwd-local-rules"
version = "0.1.0"
language = 1
pack_id = "ncwd-local-rules"
forum = "ncwd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Western District of North Carolina: Local Civil Rules"
description = "The Western District of North Carolina's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): waiver of service for North Carolina prison employees and the time to answer after a filed waiver, the brief page limit, motion responses and replies, the Social Security reply brief, the Initial Attorney's Conference and its certificate, the consent stipulation after a stay ruling, the pro se settlement program opt-in, notice of a document subpoena to a non-party, and the bill of costs, objections and review."
in_force = "2022-12-01"
known_at = "2026-10-28"
unknown_before = "2022-12-01"
jurisdiction = "United States District Court, W.D. North Carolina"
counting = "frcp6"

