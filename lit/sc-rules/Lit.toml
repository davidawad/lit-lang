# The South Carolina base library (lg-u561.5): what the South Carolina court
# packages share. The South Carolina Appellate Court Rules (sources/sc-appellate-civil)
# govern the Court of Appeals (lit/sc-court-of-appeals) and the Supreme Court
# (lit/sc-supreme-court); the court packages route their graphs on this
# library's trigger events. It declares no period: the rules' periods are
# stated in the court packages' notes. No procedure of its own.
[package]
name = "sc-state-rules"
version = "0.1.0"
language = 1
pack_id = "sc-state-rules"
forum = "sc-state-rules"
authority = "StateRule"
jurisdiction_id = "south-carolina"
title = "South Carolina state court rules (base library)"
description = "The rule layer South Carolina's court packages share: the trigger events of the South Carolina Appellate Court Rules, and the trigger events their graphs route on. No procedure of its own."
in_force = "2026-04-30"
known_at = "2026-10-28"
unknown_before = "2026-04-30"
jurisdiction = "South Carolina state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
