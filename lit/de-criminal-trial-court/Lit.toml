# Criminal cases in the Superior Court of the State of Delaware under its
# Rules of Criminal Procedure (Del. Super. Ct. Crim. R.), as far as the
# vendored text states. The base text is the PDF the court serves
# (sources/de-criminal-trial-court/), which states no edition date (PDF
# metadata created 2026-03-23); its PROVENANCE entry records CURRENCY
# UNCONFIRMED, so in_force is the retrieval date and an earlier query is a
# hole in the corpus. By the PM's standing ruling of 2026-10-27 such a
# source yields holes, not values: this package cites the rules only for
# the structure of the case (which rule governs which step) and states no
# period, limit or amount from them. Delaware's speedy-trial protection in
# these rules is Rule 48(b) (dismissal for unnecessary delay), which states
# no period. Title 11 of the Delaware Code (release under 11 Del. C. §
# 2104 and the other bail provisions the rules cite) is not vendored; those
# cites stay holes, as do the Court of Common Pleas and Family Court
# criminal rules (not vendored). The appeal hand-off cites Del. Supr. Ct.
# R. 6(a)(iii), whose vendored text is the Supreme Court Rules PDF of
# February 3, 2026 (sources/de-supreme-civil/); lit/core has no counting
# rule for the Delaware Supreme Court Rules, so its period is stated in a
# note, not encoded as a counted deadline.
[package]
family = "state-civil"
name = "de-superior-court-criminal"
version = "0.1.0"
language = 1
pack_id = "de-superior-court-criminal"
forum = "de-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "delaware"
title = "Superior Court of Delaware, criminal"
description = "Criminal cases in the Superior Court of the State of Delaware under its Rules of Criminal Procedure, as far as the vendored text states: the structure of the case from complaint and initial appearance through preliminary examination, indictment or information, arraignment, pretrial motions, plea or trial, post-trial motions, sentence and judgment, and postconviction relief; no period from the currency-unconfirmed rules is stated. An appeal goes to the Delaware Supreme Court under Del. Supr. Ct. R. 6(a)(iii)."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Superior Court of the State of Delaware (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

