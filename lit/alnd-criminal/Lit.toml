# The Northern District of Alabama's Local Rules as a local-rule layer
# over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)) at its criminal forum.
# The Local Rules effective December 4, 2019 (sources/nd-ala) have no
# criminal rules: the assignment of criminal matters to magistrate judges
# is left to the court's General and Standing Orders (LR 72.1(c)), which
# are not vendored. The layer declares no period and re-encodes no FRCrimP,
# Speedy Trial Act or FRAP period.
