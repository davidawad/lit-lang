# Civil actions in the Civil Division of the Superior Court of the District
# of Columbia under its Rules of Civil Procedure, as far as the vendored
# text states. The base text is the "Download All Rules" version the court
# serves (sources/dc-state-civil): it states no edition date, carries
# comments to 2026 amendments, and its PDF is dated 2026-05-13, so in_force
# is that date; earlier editions are not vendored, so a query before it is
# a hole in the corpus. Computation of time is Super. Ct. Civ. R. 6(a),
# with the District's legal holidays (District of Columbia Emancipation Day
# among them), for which lit/core has no counting rule, so the periods are
# stated in notes, not encoded as counted deadlines. An appeal hands off to
# lit/dc-state-appellate (D.C. App. R., sources/dc-state-appellate).
[package]
name = "dc-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "dc-superior-court-civil"
forum = "dc-state-civil"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "district-of-columbia"
title = "Superior Court of the District of Columbia, civil"
description = "Civil actions in the Superior Court of the District of Columbia under its Rules of Civil Procedure, as far as the vendored text states: commencement and the 60-day time to file proof of service, the time to answer and its alteration by a Rule 12 motion, motions practice, default and its 14-day effective date, amendment, the scheduling conference, the jury demand, summary judgment, post-trial motions, entry of judgment, relief from judgment, voluntary dismissal, and the 30-day notice of appeal, which hands off to the District of Columbia Court of Appeals package (lit/dc-state-appellate)."
in_force = "2026-05-13"
known_at = "2026-10-28"
unknown_before = "2026-05-13"
jurisdiction = "Superior Court of the District of Columbia (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The District's shared rule layer (its trigger events).
dc-state-rules = { version = "^0.1.0", path = "../dc-rules" }

[sources.dc-scr-civ]
title = "Superior Court of the District of Columbia, Rules of Civil Procedure, 'Download All Rules' version as served (no edition date; PDF dated 2026-05-13; retrieved 2026-10-27)"
url = "https://www.dccourts.gov/sites/default/files/superior-rules/Superior-Court-Rules-of-Civil-Procedure-Download-All-Rules-Version.pdf"
path = "sources/dc-state-civil/scr-civil-rules-sectioned.txt"
