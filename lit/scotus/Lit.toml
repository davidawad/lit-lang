title = "Supreme Court of the United States, certiorari practice through decision and rehearing"
description = "Review on certiorari of a judgment of a state court of last resort or a United States court of appeals under the 2026 Rules of the Supreme Court and 28 U.S.C. §§ 1254 and 2101: the petition and its time, extension, the brief in opposition, distribution and disposition, briefing on the merits, argument, decision, rehearing and the mandate."
in_force = "2026-03-16"
known_at = "2026-10-28"
unknown_before = "2026-03-16"
jurisdiction = "Supreme Court of the United States"
counting = "sup-ct-30"

