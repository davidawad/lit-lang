# The Middle District of Alabama's Local Criminal Rules (Part 2 of its
# Local Rules) as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a)): it declares only the periods those rules themselves
# state and re-encodes no FRCrimP, Speedy Trial Act or FRAP period. Each
# period is counted under FRCrimP 45, which M.D. Ala. LCrR 57.1(2) names
# and which governs "any local rule". The rules are effective December 1,
# 2010 (sources/md-ala; the cover records an October 1, 2011 amendment to
# LR 83.4(g)). Part 1's general provisions also reach criminal proceedings
# (LCrR 1.1(c)); they are not restated here.
