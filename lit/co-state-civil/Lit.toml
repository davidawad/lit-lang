# Civil actions in the Colorado district courts under the Colorado Rules of
# Civil Procedure. The base text is the 2023 Colorado Revised Statutes
# court-rules volume (OLLS; its notes cite Rule Change 2023(13), effective
# July 20, 2023, as the latest, sources/co-state-civil); the Supreme
# Court's later Rule Change orders vendored beside it are applied on top in
# date order. Of the rules cited here, Rule Change 2024(08) (May 2, 2024)
# amended C.R.C.P. 12(a)(1) and Rule Change 2024(03) (January 11, 2024)
# C.R.C.P. 121 section 1-15; each is its own source and the values it
# states cite it. No later order touches the other rules cited (C.R.C.P.
# 3, 4(m), 38, 41, 50, 55(a)-(c), 56(a)-(d), 58, 59, 60; C.A.R. 3 and 4).
# Computation of time is C.R.C.P. 6(a), with Colorado's legal holidays,
# for which lit/core has no counting rule, so the periods are stated in
# notes, not encoded as counted deadlines. An appeal hands off to
# lit/co-state-appellate (C.A.R., sources/co-state-appellate). The package
# is in force from the latest vendored C.R.C.P. order, Rule Change 2026(11)
# of April 23, 2026.
[package]
name = "co-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "co-district-court-civil"
forum = "co-state-civil"
authority = "StateRule"
jurisdiction_id = "colorado"
title = "Colorado District Courts, civil"
description = "Civil actions in the Colorado district courts under the Colorado Rules of Civil Procedure, as far as the vendored text states: commencement and the time limit for service, the time to answer and its alteration by a Rule 12 motion, motion briefing under the statewide practice standards, default, summary judgment, the jury demand, trial and post-trial relief, entry of judgment, relief from judgment, and the notice of appeal, which hands off to the Colorado appellate package (lit/co-state-appellate)."
in_force = "2026-04-23"
known_at = "2026-10-28"
unknown_before = "2026-04-23"
jurisdiction = "Colorado district courts (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

