# CLI test fixture (tests/cov_cmd_*.rs): the SPEC §12 package plus the
# relations, exceptions, backward and untriggered deadlines `where`,
# `query` and `explain-value` report. Its package name and pack id differ.
[package]
name = "cov-example"
version = "0.1.0"
language = 1
pack_id = "cov-pack"
forum = "frcp"
