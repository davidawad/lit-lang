# The Local Rules of the U.S. Bankruptcy Court for the Northern District of
# Alabama over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only
# the periods the rules themselves state and re-encodes no FRBP period. It
# is a base package, not a `kind = "local-rule"` layer: lit/core has no
# bankruptcy forum family (L2011 for `bankr-aln`), as for lit/bankr-dc.
# Each period is counted under FRBP 9006(a), the FRCP 6(a) method (core's
# frcp6).
#
# Layers: the Local Rules with an effective date of March 1, 2023 (Rule
# 1001-1(d)) are the only vendored text (sources/bankr-aln/PROVENANCE.md).
# The text as served carries each rule's own effective-date note, the
# latest the October 1, 2025 note that 28 U.S.C. § 81 (2024) abrogated Rule
# 1071-1 (divisions), which states no period; the court's combined
# administrative orders were checked and amend no rule text, so the
# consolidation is the only layer. No earlier edition is vendored, so a
# query before March 1, 2023 is a hole in the corpus.
[package]
name = "bankr-aln-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-aln-local-rules"
forum = "bankr-aln"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Northern District of Alabama: Local Rules"
description = "The Bankr. N.D. Ala. Local Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): installment filing fees (Rule 1006-1), negative-notice claim objections (Rule 3007-1), chapter 13 confirmation objections, the stay-relief fact summary sheet, a debtor's duties upon conversion to chapter 7, § 522(f) lien avoidance on negative notice (Rule 4003-2) and the withdrawal of exhibits."
in_force = "2023-03-01"
known_at = "2026-10-28"
unknown_before = "2023-03-01"
jurisdiction = "U.S. Bankruptcy Court for the Northern District of Alabama"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.alnb-lbr]
title = "Local Rules of the United States Bankruptcy Court for the Northern District of Alabama (effective March 1, 2023)"
url = "https://www.alnb.uscourts.gov/sites/alnb/files/Local%20Rules%20Mar%201%202023.pdf"
path = "sources/bankr-aln/alnb-lbr-2023-03-01-sectioned.txt"
path_sha256 = "c77145ef8f68fef90b0bb137cb3cffcdd7e3626ed97d50e7656e44a55def26e8"
sha256 = "5e5857f6dbeb5df15e26ce8ede0d9f6c5d12cf3324149a89a1a4a202d8fc3e08"
as_of = "2023-03-01"
cite_prefixes = ["Bankr. N.D. Ala. R."]
section_heading = "Rule {n}"
