# The U.S. District Court for the Northern Mariana Islands' Criminal
# Local Rules (LCrR) as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the period the local criminal
# rules themselves state and re-encodes no FRCrimP, Speedy Trial Act or
# FRAP 4(b) period (one source of truth: lit/frcrimp). The period is
# counted under FRCrimP 45(a), which governs "any local rule", so the
# deadline names `forum frcrimp`. The rules are the edition effective
# January 1, 2004 (Rev. 01/04), which the court still presents as current
# (sources/fed-dnmi); earlier editions are not vendored, so a query before
# that date is a hole in the corpus. The court's general Local Rules apply
# to criminal filings except as the criminal rules provide (LCrR
# preamble) and live in lit/nmid. An appeal goes to the Ninth Circuit
# under lit/frcrimp's FRAP 4(b) period.
[package]
name = "nmid-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "nmid-criminal-local-rules"
forum = "nmid-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Northern Mariana Islands: Criminal Local Rules"
description = "The District Court for the Northern Mariana Islands' Criminal Local Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the time for filing FRCrimP 12(b) pretrial motions after the entry of plea."
in_force = "2004-01-01"
known_at = "2026-10-28"
unknown_before = "2004-01-01"
jurisdiction = "U.S. District Court for the Northern Mariana Islands (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "dnmi-lcrr"
issuer = "U.S. District Court for the Northern Mariana Islands"
date = "2004-01-01"
designation = "Criminal Local Rules"

[dependencies]
