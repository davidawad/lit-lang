kind = "local-rule"
title = "U.S. District Court for the District of Hawaii: Criminal Local Rules"
description = "The District of Hawaii's Criminal Local Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): positions on a multi-defendant continuance, the joint trial presentation statement, sealing motions and their oppositions, motion continuances, replies and joinders, declining discovery, the final presentence report and sentencing motion, hearing and memorandum schedule, expedited sentencing, the transcript, briefs and page limit on an appeal from a magistrate judge's conviction, proposed-order objections, reconsideration, sealed-warrant notice and filing by self-represented defendants."
in_force = "2023-01-01"
