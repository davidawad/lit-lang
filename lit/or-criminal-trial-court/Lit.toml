language = 1
pack_id = "or-circuit-court-criminal"
forum = "or-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "oregon"
title = "Oregon circuit courts, criminal"
description = "Criminal prosecutions in the Oregon circuit courts under ORS chapters 131 to 138: arraignment and the release decision, the preliminary hearing or grand jury, discovery, the omnibus hearing, the ORS 135.746 trial-commencement limits and dismissal, pleas, jury trial and verdict, sentencing, the 30-day ORS 138.071 notice of appeal and the two-year post-conviction petition, with every period stated in notes from the vendored statutes."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Oregon circuit courts (criminal)"

