name = "change-frcp-2009-amendment"
version = "1.0.0"
language = 1
pack_id = "change-frcp-2009-amendment"
forum = "frcp"
family = "district-civil"
authority = "FederalRule"
title = "Change example: the 2009 FRCP time amendments (Rule 59(e))"
in_force = "2009-12-01"
known_at = "2026-10-26"
kind = "amendment"

[package.roles]
