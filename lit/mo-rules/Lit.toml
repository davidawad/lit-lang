# The Missouri base library (lg-u561.5): the trigger events the Missouri
# court packages route their graphs on: lit/mo-circuit, lit/moctapp,
# lit/moctapp-ed, lit/moctapp-sd, lit/moctapp-wd and lit/mo-supreme. It
# declares no period: the Missouri Supreme Court Rules are not vendored
# (courts.mo.gov blocked the fetch, lg-3sut, #15). No procedure of its
# own.
[package]
name = "mo-state-rules"
version = "0.1.0"
language = 1
pack_id = "mo-state-rules"
forum = "mo-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "missouri"
title = "Missouri state court rules (base library)"
description = "The rule layer Missouri's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Missouri state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
