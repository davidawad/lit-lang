# Criminal cases in the Tennessee trial courts under the Tennessee Rules of
# Criminal Procedure as published rule by rule on the Tennessee courts'
# pages and fetched October 28, 2026 (sources/tn-criminal-trial-court),
# with the appeal as of right under Tenn. R. App. P. 4 (sources/tn-appellate,
# the text lit/tn-appellate binds). The criminal rules' pages state no
# consolidated edition date and the 2026 rules package amending them is not
# vendored, so the source is marked CURRENCY UNCONFIRMED: the package binds
# cites to that text for the structure of the case, but every period the
# criminal rules state stays a hole until a dated edition or the 2026
# package is vendored. The speedy-trial statute (Tenn. Code Ann.
# § 40-14-101) is not vendored; Rule 48(b) is the rules' dismissal for
# unnecessary delay. An appeal goes to the Court of Criminal Appeals
# (lit/tn-court-of-criminal-appeals); federal habeas is lit/habeas.
