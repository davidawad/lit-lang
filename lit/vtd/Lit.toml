title = "United States District Court, District of Vermont: Local Rules of Procedure (civil)"
description = "The District of Vermont's civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion briefing and its page limits, reconsideration, Social Security briefing, bankruptcy appeal records and withdrawal of the reference, early neutral evaluation, the discovery schedule and third-party schedules, videotaped deposition designations, pro se and in forma pauperis witness lists, jury instructions, proposed findings, and summary judgment statements."
in_force = "2026-04-20"
