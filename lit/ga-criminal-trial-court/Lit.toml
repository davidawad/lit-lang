# Criminal cases in the Georgia superior courts under the criminal practice
# rules of the Uniform Superior Court Rules (Rules 30-36, the April 9, 2026
# file, sources/ga-state-civil). The Supreme Court's order of October 5,
# 2026 amends Rules 4.3, 10.2 and 21 from November 5, 2026, none of them
# cited here. Georgia's criminal procedure code, O.C.G.A. Title 17 (the
# speedy-trial demand of §§ 17-7-170 and 17-7-171 included), and the
# criminal notice of appeal of O.C.G.A. § 5-6-38 are not vendored, so
# their periods are holes. The rules' own periods are stated in notes: the
# Georgia computation of time (O.C.G.A. § 1-3-1) is not vendored either.
