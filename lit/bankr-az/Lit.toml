# The Local Rules of Bankruptcy Procedure of the U.S. Bankruptcy Court for
# the District of Arizona over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075):
# it declares only the periods and limits the Local Rules themselves state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frbp9006). The rules are those "as
# revised through June 2026", effective June 1, 2026 (sources/bankr-az);
# no amending order is vendored, so there are no dated layers and a query
# before June 1, 2026 is a hole in the corpus.
[package]
name = "bankr-az-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-az-local-rules"
forum = "bankr-az"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of Arizona: Local Rules of Bankruptcy Procedure"
description = "The Bankr. D. Ariz. Local Rules of Bankruptcy Procedure over the Federal Rules of Bankruptcy Procedure (lit/frbp): filing fees, the master mailing list, declarations and Social Security statements, 21-day negative notice, the chapter 7 trustee questionnaire, the chapter 13 rules (trustee forms, conduit payments, real property claims, plan dismissal, trustee recommendations, confirmation orders), Subchapter V claims, claim objections, stay relief, cash collateral, lien avoidance, exhibits, sales, executory contracts, abandonment, redemption, pretrial statements, costs, motion and summary judgment briefing and page limits, default-judgment authority and removal."
in_force = "2026-06-01"
known_at = "2026-10-28"
unknown_before = "2026-06-01"
jurisdiction = "U.S. Bankruptcy Court for the District of Arizona"
# FRBP 9006(a)(6)(C): Arizona's holidays close a forward-counted period, here and in
# the FRBP periods this package recounts (core's `frbp9006-arizona`).
counting = "frbp9006-arizona"
recounts = ["frbp-bankruptcy-procedure"]

[package.instrument]
source = "azb-lr"
issuer = "United States Bankruptcy Court for the District of Arizona"
date = "2026-06-01"
designation = "Local Rules of Bankruptcy Procedure"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.azb-lr]
title = "Local Rules of Bankruptcy Procedure, U.S. Bankruptcy Court for the District of Arizona (as revised through June 2026)"
