# Criminal cases in the West Virginia circuit courts under the West
# Virginia Rules of Criminal Procedure (sources/wv-criminal-trial-court),
# whose single page states no edition date: its PROVENANCE records
# CURRENCY UNCONFIRMED, so every cite is a hole, `?("..., CURRENCY
# UNCONFIRMED")`, and every period is stated in a note as the vendored
# text states it, unverified. The criminal notice of intent to appeal and
# the time to perfect the appeal are the Rules' own (W. Va. R. Crim. P.
# 37(b)). The speedy-trial statute, W. Va. Code § 62-3-21, is not vendored
# (a hole); Rule 48(b) is the rule. lit/core has no West Virginia counting
# rule, so no period is a counted deadline. Federal habeas is
# lit/habeas's.
