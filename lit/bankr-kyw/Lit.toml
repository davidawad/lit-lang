# The Local Rules of the U.S. Bankruptcy Court for the Western District of
# Kentucky over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only
# the periods the Local Rules themselves state and re-encodes no FRBP
# period. Each period is counted under FRBP 9006(a), the FRCP 6(a) method
# (core's frcp6). The rules are those effective December 1, 2025, which
# supersede all previous local rules and general orders (W.D. Ky. L.B.R.
# 9029-1(a)(4)); the court's general orders page lists no later order
# amending them (sources/bankr-kyw/PROVENANCE.md), so the consolidation is
# the only layer. The earlier editions are not vendored, so a query before
# December 1, 2025 is a hole in the corpus.
[package]
name = "bankr-kyw-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-kyw-local-rules"
forum = "bankr-kyw"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Western District of Kentucky: Local Rules"
description = "The Bankr. W.D. Ky. Local Rules (effective December 1, 2025) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): petition execution, filings after conversion to chapter 7, the Subchapter V deposit, post-confirmation notices, final reports and closing motions, the patient care ombudsman motion, the chapter 11 final decree certification, chapter 12 and 13 discharge certifications, chapter 13 secured and priority claims, deficiency claims and their objections, plan payment turnover, stay-relief responses, proof of insurance, complete attachments, and abandonment on a report of no distribution."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Western District of Kentucky"
counting = "frcp6"

[package.instrument]
source = "kywb-lbr"
issuer = "United States Bankruptcy Court for the Western District of Kentucky"
date = "2025-12-01"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

