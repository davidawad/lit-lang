# Civil actions in the Louisiana district courts under the Louisiana Code
# of Civil Procedure, as published by the Legislature on legis.la.gov and
# retrieved on October 27, 2026 after the 2026 Regular Session
# (sources/la-district-court/la-ccp.txt: only the articles this package
# cites), and the Louisiana District Court Rules, Title II, with
# amendments through March 31, 2022. The Code takes precedence over the
# District Court Rules (Rule 9.8, Comment (a)). Computation of time is La.
# C.C.P. art. 5059, which is not vendored, and core has no Louisiana
# judicial calendar, so the periods are stated in notes, not encoded as
# counted deadlines. A Code article the vendored text does not hold (the
# devolutive appeal delay, art. 2087; setting aside a default; the jury
# bond, art. 1734; compromise, La. C.C. art. 3071) is named in a note,
# never cited. An appeal hands off to lit/la-appellate.
[package]
name = "la-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "la-district-court-civil"
forum = "la-district-court"
authority = "StateRule"
jurisdiction_id = "louisiana"
title = "Louisiana district courts, civil"
description = "Civil actions in the Louisiana district courts under the Code of Civil Procedure and the District Court Rules (Title II), as far as the vendored text states: commencement and the request for service, the delay for answering, exceptions and memoranda, default judgment, discovery, summary judgment, jury trial, motions for new trial and judgment notwithstanding the verdict, abandonment and voluntary dismissal, and the hand-off to appeal (lit/la-appellate)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Louisiana district courts (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

