# Civil actions in the Washington Superior Courts under the Superior Court
# Civil Rules (CR) as the Washington Courts site served them on 2026-10-27
# (sources/wa-superior: CR 3, 4, 12, 26, 38, 41, 50, 55, 56, 58 and 59,
# each with its own amendment history, the latest September 1, 2025). CR
# 6 (computation of time) is not vendored, so the rules' periods are
# stated in notes, not encoded as counted deadlines. An appeal binds to RAP
# 5.2 (sources/wa-court-of-appeals) and hands off to lit/wa-court-of-appeals.
# The package is in force from September 1, 2026, the latest amendment date
# of the vendored RAP text: before it the per-rule text served in 2026 is
# not proved the law, no amendment history being vendored.
[package]
name = "wa-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "wa-superior-court-civil"
forum = "wa-superior"
authority = "StateRule"
title = "Washington Superior Court, civil"
description = "Civil actions in the Washington Superior Courts under the Superior Court Civil Rules, as far as the vendored rules state: commencement, summons and service, the answer, Rule 12 motions, default, discovery conferences, summary judgment, jury demand, dismissal and settlement, judgment as a matter of law, new trial and reconsideration, and entry of judgment. An appeal hands off to the Washington appellate package (lit/wa-court-of-appeals)."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "Washington Superior Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.wa-cr]
