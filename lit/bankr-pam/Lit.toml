path = "sources/bankr-pam/pam-local-rules-2025-10-01-sectioned.txt"
path_sha256 = "fd4523eab1f579b53434f6679ffda4b2e28e3e427e1e7aeaf80ec93ac34a2bc0"
sha256 = "1c6323593218fcf52670cbcd3d987728b579d6f1b53db1882dc5508c43f839e4"
