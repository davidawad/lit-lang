description = "The Middle District of North Carolina's Local Rules of Criminal Practice as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the draft presentence report, the position paper on sentencing factors and its response, and the sealing response and objection periods of the Local Civil Rules that LCrR 57.1 applies to criminal proceedings."
