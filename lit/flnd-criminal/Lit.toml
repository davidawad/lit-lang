kind = "local-rule"
title = "United States District Court, Northern District of Florida: Local Rules (criminal)"
description = "The Northern District of Florida's criminal-case Local Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): retained counsel's withdrawal window, the standard criminal discovery exchange and its defense notices, the pretrial discovery conference, sentencing memoranda and appeals from a magistrate judge in a consent misdemeanor case."
in_force = "2015-11-24"
known_at = "2026-10-28"
