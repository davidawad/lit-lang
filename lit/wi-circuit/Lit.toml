# Civil actions in the Wisconsin circuit courts under chapters 801 to 806
# of the Wisconsin Statutes, the rules of civil procedure, as published and
# certified October 1, 2026 (sources/wi-circuit). Computation of time is
# Wis. Stat. § 801.15(1)(b), which, unlike FRCP 6(a), extends the last day
# only when the clerk of courts office is closed and excludes Saturdays,
# Sundays and holidays from a period of less than 11 days; lit/core has no
# counting rule for it, so the periods are stated in notes, not encoded as
# counted deadlines. An appeal hands off to the Wisconsin Court of Appeals
# package (lit/wisctapp).
[package]
name = "wi-circuit-court-civil"
version = "0.1.0"
language = 1
pack_id = "wi-circuit-court-civil"
forum = "wi-circuit"
authority = "StateRule"
jurisdiction_id = "wisconsin"
title = "Wisconsin circuit court, civil"
description = "Civil actions in the Wisconsin circuit courts under Wis. Stat. chs. 801 to 806, as far as the vendored text states: commencement and service, the answer, motions to dismiss and amendment, default judgment, scheduling, discovery, summary judgment, trial, motions after verdict and reconsideration, entry and notice of entry of judgment, relief from judgment, and the appeal to the Court of Appeals (lit/wisctapp)."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Wisconsin circuit court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

