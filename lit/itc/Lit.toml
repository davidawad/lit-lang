# USITC Section 337 investigations, ported from packs/itc-337.json
# (`litigate import`, then made typed, dated, cited and tested by hand).
#
# Lifetime: the graph models 19 C.F.R. Part 210 as amended by 90 FR 225
# (Jan. 3, 2025; effective Feb. 3, 2025), the text the pack's notes describe
# (proportional discovery in § 210.27(b), the 7-hour deposition day in
# § 210.28(b)). That rule "shall apply to investigations and proceedings
# instituted subsequent to" its effective date, so a matter instituted
# earlier has no version in force (L3007) rather than a wrong one; the
# pre-2025 sections are not modeled. Each node and period carries the
# effective date of 90 FR 225 (19 C.F.R. §§ 210.5 and 210.29, last amended
# by 78 FR 23474, effective May 20, 2013, included: the pre-2025 law is
# not modeled) or, for 19 U.S.C.
# § 1337(b)-(j), Pub. L. 103-465, § 321(a), applicable from Jan. 1, 1995
# (§ 322). Source notes are per section, so versions are too.
#
# Part 210 is an agency's rules of practice under 19 U.S.C. §§ 1333, 1335
# and 1337 (19 C.F.R. § 210.1): authority `Regulation`. Its periods yield to
# a Commission or administrative law judge order (§ 210.6(a)), so each
# delegates to `CaseOrder`.
[package]
name = "itc-337"
version = "0.1.0"
language = 1
pack_id = "itc-337"
forum = "itc"
family = "itc"
authority = "Regulation"
title = "ITC Section 337 Unfair Import Investigation"
description = "Institution → response/default → discovery (incl. CBI protective-order posture) → prehearing/summary determination → evidentiary hearing → Initial Determination → Commission petition-for-review → Commission Final Determination/remedy → Presidential (USTR) review → remedy enforcement → optional Federal Circuit appeal, under 19 U.S.C. § 1337 and 19 CFR Part 210. Direct structural counterpart to content/statecharts/mpep-prosecution.json for the non-FRCP ITC pack. Stage ids and rule refs are drawn verbatim from content/rulepacks/itc-337-pack.json."
jurisdiction = "USITC / 19 CFR Part 210"
in_force = "2025-02-03"
known_at = "2026-08-26"
counting = "itc210"

[package.roles]
applicant = "self"
either = "nature"
examiner = "nature"
office = "nature"

[sources.usc-1337]
title = "19 U.S.C. § 1337 (Unfair practices in import trade)"
url = "https://www.law.cornell.edu/uscode/text/19/1337"
path = "sources/usc-19-1337.txt"
path_sha256 = "3865d7c3c1b4d9c0883d3eb29fd160c3c789d8cb8ffed675311e5dccd0892408"

