description = "The Eastern District of California's Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion opposition and reply, continuances, prisoner-action motions, objections to reply evidence, pretrial statements, costs, statutory attorney's fees, and reconsideration of and objections to magistrate judge rulings."
