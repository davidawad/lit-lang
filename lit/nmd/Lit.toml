# The District of New Mexico's Local Rules of Civil Procedure as a
# local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a); the
# Administrative Order of October 1, 2020 adopting them "Under the
# authority of 28 U.S.C. § 2071, Rule 83 of the Federal Rules of Civil
# Procedure"): it declares only the periods and limits the civil rules
# themselves state and re-encodes no FRCP deadline. Each period is
# counted under FRCP 6(a), with New Mexico's holidays closing a
# forward-counted period (FRCP 6(a)(6)(C); core's `frcp6-new-mexico`, the NMRA
# 1-006(A)(7) list), which also counts lit/frcp's periods in a matter in
# this court (`recounts`); FRCP 6(a) is the rule D.N.M.LR-Civ. 7.4(a) names for motion
# briefing and that governs "any local rule". The rules are the edition
# effective July 1, 2011 as amended effective October 1, 2020
# (sources/d-nm); earlier editions are not vendored, so a query before
# that date is a hole in the corpus. The criminal rules (forum
# nmd-criminal) are not encoded. An appeal goes to the Tenth Circuit
# under lit/frap (D.N.M.LR-Civ. 73.3).
[package]
name = "nmd-local-rules"
version = "0.1.0"
language = 1
pack_id = "nmd-local-rules"
forum = "nmd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, District of New Mexico: Local Rules of Civil Procedure"
description = "The District of New Mexico's Local Rules of Civil Procedure as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion response and reply periods and page limits, supplemental authorities, exhibit page limits, the joint status report, objections to discovery, dismissal for want of prosecution, costs and attorney's fees motions, and the state-court record in removed actions."
in_force = "2020-10-01"
known_at = "2026-10-28"
unknown_before = "2020-10-01"
jurisdiction = "United States District Court, D. New Mexico"
counting = "frcp6-new-mexico"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
