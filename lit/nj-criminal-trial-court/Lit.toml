# Criminal cases in the Superior Court of New Jersey, Law Division,
# Criminal Part, under Part III of the New Jersey Court Rules (Rules
# Governing Criminal Practice), as far as the vendored text states. The
# base text is the Judiciary's Rules of Court tree as served
# (sources/nj-criminal-trial-court/), which states no edition date; its
# PROVENANCE entry records CURRENCY UNCONFIRMED, so in_force is the
# retrieval date and an earlier query is a hole in the corpus. By the PM's
# standing ruling of 2026-10-27 such a source yields holes, not values:
# this package cites the rules only for the structure of the case (which
# rule governs which step) and states no period, limit or amount from
# them, including the speedy-trial periods of R. 3:25-4. The Criminal
# Justice Reform Act (N.J.S.A. 2A:162-15 et seq.), the Code of Criminal
# Justice, and the Part I and Part II rules the criminal rules rely on
# (jury waiver under R. 1:8-1, the time for appeal under R. 2:4-1) are not
# vendored; those cites stay holes. The appeal hand-off cites R. 2:2-3
# from the cited appellate rules vendored with amendments effective on or
# before September 1, 2026 (sources/nj-appellate-civil/).
[package]
family = "state-civil"
