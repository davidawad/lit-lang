# Felony and misdemeanor prosecutions in the Nebraska district courts.
# Nebraska criminal procedure is statutory (Neb. Rev. Stat. chapter 29),
# and only a targeted set is vendored (sources/ne-criminal-trial-court):
# the speedy-trial sections 29-1201 to 29-1209 (a PARTIAL set) and the
# criminal appeal and postconviction sections 29-2301 to 29-2308.01 and
# 29-3001 to 29-3005, both as the Nebraska Legislature serves them with no
# edition date: CURRENCY UNCONFIRMED. Their cites are holes naming the
# section, each value the vendored text's, unverified; the rest of chapter
# 29 (arrest, bail, preliminary hearing, discovery, new trial) is not
# vendored, and its cites are holes with no value. The notice of appeal is
# Neb. Rev. Stat. § 25-1912, which governs "judgments and sentences upon
# convictions for felonies and misdemeanors", bound to the Legislature's
# text the civil packages pin (sources/ne-district, current as of
# 2026-10-27); the package runs from the criminal sections' retrieval,
# 2026-10-28. Periods are stated in
# notes: lit/core has no Nebraska counting rule. An appeal continues
# before the Court of Appeals or Supreme Court (lit/nebctapp).
[package]
name = "ne-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "ne-criminal-trial-court"
forum = "ne-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "nebraska"
title = "Nebraska District Courts, criminal"
description = "Criminal prosecutions in the Nebraska district courts, as far as the vendored statutes state: the six-month speedy-trial period and its exclusions and absolute discharge (Neb. Rev. Stat. §§ 29-1207, 29-1208; held as holes, CURRENCY UNCONFIRMED), the 30-day notice of appeal and its termination by post-trial motions (§ 25-1912), the suspension of sentence on notice of appeal (§ 29-2301), and the one-year limitation on postconviction motions (§ 29-3001; a hole). The rest of chapter 29 is not vendored and stays a hole."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Nebraska district courts (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

