# The U.S. District Court for the Northern District of California's
# Criminal Local Rules (Crim. L.R.) as a local-rule layer over lit/frcrimp
# (28 U.S.C. § 2071; FRCrimP 57(a)): it declares only the periods and
# limits the local criminal rules themselves state and re-encodes no
# FRCrimP, Speedy Trial Act or FRAP 4(b) period (one source of truth:
# lit/frcrimp). Each period is counted under FRCrimP 45(a), which governs
# "any local rule", so each deadline names `forum frcrimp`. The rules are
# the edition revised July 29, 2026 (the rule pages' footer;
# sources/fed-ndcal); earlier editions are not vendored, so a query before
# that date is a hole in the corpus. The Civil Local Rules apply where not
# inconsistent (Crim. L.R. 2-1) and live in lit/cand. An appeal goes to
# the Ninth Circuit under lit/frcrimp's FRAP 4(b) period.
[package]
name = "cand-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "cand-criminal-local-rules"
forum = "cand-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Northern District of California: Criminal Local Rules"
description = "The Northern District of California's Criminal Local Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the related-case response, the Rule 16 meeting of counsel, the pretrial conference statement, the presentence investigation and report schedule, sentencing memoranda, the revocation dispositional report, noticed and ex parte motions, refiling after a sealing ruling, and the briefs and page limits on an appeal from a magistrate judge's conviction."
in_force = "2026-07-29"
known_at = "2026-10-28"
unknown_before = "2026-07-29"
jurisdiction = "U.S. District Court for the Northern District of California (criminal)"
