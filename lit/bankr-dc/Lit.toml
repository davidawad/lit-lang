# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the District
# of Columbia over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods the Local Bankruptcy Rules themselves state and
# re-encodes no FRBP period (LBR 1007-1(b)'s involuntary creditor list,
# 1007-1(e)(2)'s schedules, 1019-1's post-conversion schedule,
# 3003-1(a)(2)'s governmental claims and 7004-2(b)'s summons service are
# lit/frbp's or the Code's). Each period is counted under FRBP 9006(a),
# the FRCP 6(a) method (core's frbp9006). The rules are those "in effect as
# of February 1, 2026", General Order 2026-01 (new LBR 2016-3, revised
# 9013-1 and 9014-1, effective that day) incorporated; no later order
# amends them (sources/bankr-dc/PROVENANCE.md), so the consolidation is
# the only layer. The earlier editions are not vendored, so a query before
# February 1, 2026 is a hole in the corpus.
[package]
name = "bankr-dc-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-dc-local-rules"
forum = "bankr-dc"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of Columbia: Local Bankruptcy Rules"
description = "The Bankr. D.D.C. Local Bankruptcy Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): petition and filing-fee cures, extensions of time for schedules and plans, joint administration, professional employment and compensation, chapter 11 and subchapter V claims bar dates, claim objections, chapter 13 confirmation and discharge, lien avoidance, sales and abandonment, adversary-proceeding discovery, costs, fees and default, motion practice (LBR 9013-1), removal, transcript redaction and proposed orders."
in_force = "2026-02-01"
known_at = "2026-10-28"
unknown_before = "2026-02-01"
jurisdiction = "U.S. Bankruptcy Court for the District of Columbia"
counting = "frbp9006"

[package.instrument]
source = "dcb-lbr"
issuer = "United States Bankruptcy Court for the District of Columbia"
date = "2026-02-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

