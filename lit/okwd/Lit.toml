# The U.S. District Court for the Western District of Oklahoma's Local
# Civil Rules (LCvR) as a local-rule layer over lit/frcp (28 U.S.C.
# § 2071; FRCP 83(a); the Preamble: the rules "supplement the Federal
# Rules of Civil Procedure ... with local court procedure"): it declares
# only the periods and limits the local civil rules themselves state and
# re-encodes no FRCP deadline. The rules are the Local Court Rules revised
# as of April 23, 2026 (Local Civil Rules part; sources/wd-okla), the
# edition the court serves as current, so in_force is that date; earlier
# editions are not vendored, so a query before it is a hole in the
# corpus. The criminal rules are lit/okwd-criminal and bankruptcy matters
# lit/bankr-okw. An appeal goes to the Tenth Circuit under lit/frap.
[package]
name = "okwd-local-rules"
version = "0.1.0"
language = 1
pack_id = "okwd-local-rules"
forum = "okwd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Western District of Oklahoma: Local Civil Rules"
description = "The U.S. District Court for the Western District of Oklahoma's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the filing fee after a denied pauper application, return of service, motion briefing and its page limits, amended pleadings, the joint status report, mediation, notice of bankruptcy, deposition notice, nonparty document subpoenas, costs and attorney's fees, removed actions, bankruptcy appeals and withdrawal of the reference, and transcript redaction."
in_force = "2026-04-23"
known_at = "2026-10-28"
unknown_before = "2026-04-23"
jurisdiction = "U.S. District Court for the Western District of Oklahoma"
counting = "frcp6"

