# typos (https://github.com/crate-ci/typos) spell-checker config.
# Run locally: `typos`. CI runs it via the `typos` job in ci.yml.

[default]
extend-ignore-re = [
    # Legal citations and docket-style tokens sometimes read as typos.
]

[default.extend-words]
# Legal terms: sur-reply, Federal Rules of Evidence, and the "payment
# advices" of 11 U.S.C. § 521(a)(1)(B)(iv) the bankruptcy local rules name.
sur = "sur"
Sur = "Sur"
advices = "advices"
Advices = "Advices"
FRE = "FRE"
# Temporary restraining order; Chief Judge Howard T. Markey (tests/cases/).
TRO = "TRO"
Markey = "Markey"
# Mapp v. Ohio (lit/frcrimp); "Thm" abbreviates Theorem; "unparseable" is a
# standard spelling used in litigate diagnostics.
Mapp = "Mapp"
Thm = "Thm"
unparseable = "unparseable"
# Deliberate misspelling in the did-you-mean unit test (litigate-syntax).
chanse = "chanse"
# ACI = associative, commutative, idempotent (docs/litigate/research).
ACI = "ACI"
# num-rational's numerator accessor, `Ratio::numer` (litigate-smt).
numer = "numer"
# Federal court codes used as forum ids: bankruptcy courts as bankr-<code>
# (lg-u561: E.D.N.C., E.D. Tenn., S.D. Ala., M.D. Ga.) and district courts in
# lit/core's forum list (D. Del., D. Guam, D. Neb.).
nce = "nce"
tne = "tne"
als = "als"
gam = "gam"
ded = "ded"
gud = "gud"
ned = "ned"
# GRAP: Guam Rules of Appellate Procedure (lit/gu-supreme, lit/gu-superior).
GRAP = "GRAP"
grap = "grap"

[default.extend-identifiers]
# Short graph-algorithm locals (node a/b, node n/d).
ba = "ba"
nd = "nd"
# Short keys in marketing/graph/index.html (terminal "tje", label position "tpos").
tje = "tje"
tpos = "tpos"

[files]
extend-exclude = [
    "packs/*.json",  # legal-procedure JSON packs -- case names, citations
    "tests/fixtures/",  # verbatim copies of upstream packs
    "marketing/*/index.html",  # animation scripts with short locals (tje, tpos)
    "sources/*.txt",  # vendored L0 primary-law text (see sources/PROVENANCE.md); PDF/HTML
                       # extraction preserves the original's line-wrap hyphenation verbatim
                       # ("Represen-\ntation"), which reads as typos but isn't ours to fix
    "sources/change-corpus/",  # vendored primary-source rule histories and rulings
                               # (OCR/PDF text), same reason as sources/*.txt
    "sources/*/*.txt",  # per-forum vendored rule text (lg-f3q8): the courts' own
                        # misspellings ("BANRUPTCY") are theirs, kept verbatim
    "sources/**/original/",  # as-served originals (lg-f3q8.80): the courts' bytes,
                             # markup and misspellings included, never edited
    # litigate tests and snapshots misspell names on purpose to exercise
    # did-you-mean suggestions and unresolved-name diagnostics.
    "crates/litigate-*/tests/",
    "Cargo.lock",
    "flake.lock",
    "devenv.lock",
    "target/",
    "dist/",
]
