authority = "LocalRule"
kind = "local-rule"
title = "Eighth Circuit Bankruptcy Appellate Panel Procedure"
description = "Appeals before the Eighth Circuit Bankruptcy Appellate Panel under the current Federal Rules of Bankruptcy Procedure and panel rules. A district court election is a handoff; district local rules are outside this panel package."
in_force = "2025-12-01"
known_at = "2026-10-07"
unknown_before = "2025-12-01"
counting = "frbp9006"

[package.instrument]
source = "bap-local-rules"
issuer = "United States Bankruptcy Appellate Panel for the Eighth Circuit"
date = "2023-12-01"
designation = "Local Rules (revised December 1, 2023)"

[package.roles]
applicant = "self"
appellee = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods themselves (Part 8 appeal periods); this package layers the panel's local rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

