# The deadline domain's change files (lg-2j7e): the base layer of the
# district-court appeal time before the Federal Rules of Appellate
# Procedure, as the Federal Rules of Civil Procedure stated it from the
# amendments of December 27, 1946 (effective March 19, 1948) until Rule
# 6(a) began closing Saturdays on July 1, 1963. Rule 73(a) (the 1946 text,
# and the 1948 text that renamed the "circuit court of appeals"): 30 days
# from entry of the judgment, terminated by a timely Rule 50(b), 52(b) or 59
# motion and run in full again from the order on it; Rule 59(b) and (e):
# 10 days after entry; Rule 6(b): none of them may be enlarged but as they
# state. Counted under Rule 6(a) and 6(e) as adopted in 1938, which close
# Sundays and legal holidays only. Vendored from the U.S. Reports back
# matter (vols. 308, 329 and 335) in sources/change-frcp-19*-excerpt.txt.
# The expect tests of tests/expect/ replay the appeals of the cases the
# library cites that ran under these rules (Foman v. Davis, 1960-61).
[package]
name = "change-frcp-1948-appeal"
version = "1.0.0"
language = 1
pack_id = "change-frcp-1948-appeal"
forum = "frcp"
family = "district-civil"
authority = "FederalRule"
title = "Deadline domain: FRCP 59 and 73(a) appeal time before 1963, counted under 1938 Rule 6(a) (base)"
in_force = "1948-03-19"
known_at = "2026-10-29"

[package.roles]
appellant = "self"
appellee = "opponent"
court = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../../../../lit/core" }

