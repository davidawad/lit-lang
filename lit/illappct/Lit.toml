# Civil appeals to the Illinois Appellate Court, and petitions for leave
# to appeal to the Illinois Supreme Court, under the Illinois Supreme
# Court Rules the outline cites, each as the court linked it on 2026-10-27
# with its own amendment history (sources/illappct). Computation of time
# is the Statute on Statutes (5 ILCS 70/1.11), which is not vendored and
# has no counting rule in lit/core, so the rules' periods are stated in
# notes, not encoded as counted deadlines. The Illinois Constitution
# (art. VI, § 6), Rules 326 and 343 (record and briefing schedule) and 28
# U.S.C. § 1257 are not vendored and are not cited. A circuit court
# appeal arrives from lit/il-circuit.
[package]
name = "illappct-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "illappct-appellate-civil"
forum = "illappct"
authority = "StateRule"
jurisdiction_id = "illinois"
title = "Illinois Appellate Court and Supreme Court, civil appeals"
description = "Civil appeals from the Illinois circuit courts to the Appellate Court, with rehearing, mandate and petitions for leave to appeal to the Illinois Supreme Court, under the Illinois Supreme Court Rules as far as the vendored text states, with the brief and rehearing petition length limits of Rules 341(b) and 367(a)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Illinois Appellate Court; Illinois Supreme Court"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.ill-sct-rules]
title = "Illinois Supreme Court Rules (the rules the outlines cite, each as linked from the court's Supreme Court Rules page on 2026-10-27)"
url = "https://www.illinoiscourts.gov/rules-law/supreme-court-rules"
path = "sources/illappct/ill-sct-rules-cited.txt"
path_sha256 = "3a70c5b53b40b924fa22edaf53095a4d8f92574093db11af7c463e176a287fb9"
cite_prefixes = ["Ill. S. Ct. R."]
section_heading = "Ill. S. Ct. R. {n}"
