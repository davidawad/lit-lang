# Discretionary review in the Supreme Court of Washington of a Court of
# Appeals decision terminating review, under the Rules of Appellate
# Procedure (RAP) as the Washington Courts site served them on 2026-10-27
# (sources/wa-court-of-appeals: RAP 10.3, 11.2, 12.2, 12.4, 12.5 and 13.4,
# the latest amendment effective September 1, 2026). RAP 18.6 (computation
# of time), RAP 13.7 (proceedings after acceptance) and RAP 18.17 (length)
# are not vendored, so the periods are stated in notes, not counted.
# The Court of Appeals decision and the petition arrive from
# lit/wa-court-of-appeals. Direct review (RAP 4.2) and review in the
# Supreme Court of the United States are not modeled.
[package]
name = "wa-supreme-court-review"
version = "0.1.0"
language = 1
pack_id = "wa-supreme-court-review"
forum = "wa-supreme-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "washington"
title = "Supreme Court of Washington, discretionary review of Court of Appeals decisions"
description = "Discretionary review in the Supreme Court of Washington of a Court of Appeals decision terminating review under RAP 13.4, as far as the vendored rules state: the petition and its time, the answer and reply, the RAP 13.4(b) grounds, decision without argument, briefing, oral argument, disposition, reconsideration and the mandate."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "Supreme Court of Washington (discretionary review, civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
wa-state-rules = { version = "^0.1.0", path = "../wa-rules" }

[sources.wa-rap]
title = "Washington Rules of Appellate Procedure, cited subset (RAP 2.2, 5.2, 9.2, 10.3, 11.2, 12.2, 12.4, 12.5, 13.4), current per-rule text as served 2026-10-27 (latest amendment effective September 1, 2026)"
url = "https://www.courts.wa.gov/court_rules/?fa=court_rules.list&group=app&set=RAP"
path = "sources/wa-court-of-appeals/wa-rap-cited-sectioned.txt"
path_sha256 = "37da82ba6f7d769642ccfd23037601cbf2b1b43fa2139c7d4d396e6affbc578a"
sha256 = "75cb31f3e763abbc7d643cdc993299a4604ef20a6a770c867e3e2faca0f1e77f"
as_of = "2026-09-01"
cite_prefixes = ["RAP"]
section_heading = "RAP {n}"
