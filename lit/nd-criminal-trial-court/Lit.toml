# Criminal prosecutions in the North Dakota district courts under the
# North Dakota Rules of Criminal Procedure (sources/nd-criminal-trial-court,
# the rules as published rule by rule by the North Dakota courts). The
# pages give per-rule amendment histories but no consolidated edition
# date: CURRENCY UNCONFIRMED. Every cite to them is therefore a hole naming
# its pinpoint, each value in a note the vendored text's, unverified, as
# for lit/bankr-arw. The defendant's notice of appeal binds to the North
# Dakota Rules of Appellate Procedure as in force on 2026-10-27
# (sources/ndctapp, N.D.R.App.P. 4(b), whose (b)(1)(A) was amended
# effective September 1, 2026), the text lit/ndctapp pins, so the package
# runs from that date. North Dakota's speedy-trial statute (N.D.C.C.
# § 29-19-02) is not vendored and stays a hole; Rule 48(b) dismissal for
# unnecessary delay is the rules' own remedy. Computation of time is
# N.D.R.Crim.P. 45 with state holidays, for which lit/core has no counting
# rule, so the periods are stated in notes. An appeal continues before the
# Supreme Court (lit/ndctapp); postconviction relief (N.D.C.C. ch. 29-32.1)
# and federal habeas (lit/habeas) are not vendored here.
[package]
name = "nd-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "nd-criminal-trial-court"
forum = "nd-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "north-dakota"
title = "North Dakota District Courts, criminal"
description = "Criminal prosecutions in the North Dakota district courts under the North Dakota Rules of Criminal Procedure, every rule cite a hole pending a dated text (CURRENCY UNCONFIRMED): the initial appearance and probable cause, the preliminary hearing, arraignment and pleas, pretrial motions and their deadline, the omnibus hearing, dismissal for unnecessary delay (Rule 48(b); the speedy-trial statute is not vendored), the 14-day acquittal, new trial and arrest-of-judgment motions, sentencing, sentence reduction within 120 days, and the defendant's 30-day notice of appeal (N.D.R.App.P. 4(b), bound to vendored text)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "North Dakota district courts (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

