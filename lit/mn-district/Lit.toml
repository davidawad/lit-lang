title = "Minnesota district court, civil"
description = "Civil actions in the Minnesota district courts under the Minnesota Rules of Civil Procedure (amendments effective July 1, 2025), from commencement through judgment, post-trial motions and the notice of appeal. An appeal hands off to the Minnesota Court of Appeals package (lit/minnctapp)."
in_force = "2025-07-01"
