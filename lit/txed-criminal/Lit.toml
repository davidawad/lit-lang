# The U.S. District Court for the Eastern District of Texas's local
# criminal rules (Local Rules CR-1 to CR-59) as a local-rule layer over
# lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares only the
# periods and limits the local criminal rules themselves state and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (one source
# of truth: lit/frcrimp). Each period is counted under FRCrimP 45(a),
# which governs "any local rule", so each deadline names `forum frcrimp`.
# The rules are the consolidated edition the court serves as current
# ("Consolidated Local Rules as of February 9, 2026", page header "Local
# Rules Effective December 1, 2025"; sources/txed), which incorporates
# General Orders 25-07 and 26-02, so in_force is that date; earlier
# editions are not vendored, so a query before it is a hole in the
# corpus. General Order 26-08 (September 21, 2026) amends only the civil
# rule CV-3(d). The court's Speedy Trial Act plan (18 U.S.C. § 3165) is
# not vendored. An appeal goes to the Fifth Circuit under lit/frcrimp's
# FRAP 4(b) period and lit/ca5.
