# The Local Rules for the U.S. Bankruptcy Court for the District of
# Delaware over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only
# the periods and page limits the Local Rules themselves state and
# re-encodes no FRBP period. Each period is counted under FRBP 9006(a),
# the FRCP 6(a) method (core's frcp6), as Local Rule 9006-1(a) directs.
#
# Layers: the Local Rules effective February 1, 2025 (Rule 1001-1(e)) are
# the only vendored text (sources/bankr-de/PROVENANCE.md); the court's
# general orders page lists no later order amending them, so the
# consolidation is the only layer. No earlier edition is vendored, so a
# query before February 1, 2025 is a hole in the corpus.
[package]
name = "bankr-de-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-de-local-rules"
forum = "bankr-de"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of Delaware: Local Rules"
description = "The Bankr. D. Del. Local Rules (effective February 1, 2025) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): the extended chapter 11 schedules period, notice of chapter 11 schedule amendments, the claims agent's motion and duties, creditor matrices after conversion or a final decree, Rule 2004 examination notices, the subchapter V bar date, status report and plan forms, plan supplements, disclosure statement and voting notice, combined hearings, the 40- and 60-page plan papers limits, final decrees, chapter 13 plans and the final cure, stay relief responses, chapter 7 and 15 closing, reopening, sale procedures, adversary summonses, briefing (30- and 15-page brief limits), scheduling and pretrial conferences, discovery motions, depositions, appeals, motion notice and objections (Local Rule 9006-1), Delaware counsel, withdrawal, first day orders, exhibits, mediation and arbitration."
in_force = "2025-02-01"
known_at = "2026-10-28"
unknown_before = "2025-02-01"
jurisdiction = "U.S. Bankruptcy Court for the District of Delaware"
counting = "frcp6"

[package.instrument]
source = "bankr-de-lbr"
issuer = "United States Bankruptcy Court for the District of Delaware"
date = "2025-02-01"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.bankr-de-lbr]
title = "Local Rules for the United States Bankruptcy Court for the District of Delaware (effective February 1, 2025)"
