# The U.S. District Court for the District of Oregon's Local Rules of
# Criminal Procedure (Crim. LR) as a local-rule layer over lit/frcrimp (28
# U.S.C. § 2071; FRCrimP 57(a)). The vendored text is the court's
# printable criminal-procedure page as served on 2026-10-28, which states
# no edition date; each rule carries its own amendment history (the
# latest, September 3, 2024), and its PROVENANCE entry records CURRENCY
# UNCONFIRMED beyond that (sources/fed-dor). By the PM's standing ruling
# of 2026-10-27 such a source yields holes, not values: this layer names
# the local criminal rules' periods in notes, says that each is not
# stated, and encodes no deadline; in_force is the retrieval date and an
# earlier query is a hole in the corpus. No FRCrimP, Speedy Trial Act or
# FRAP 4(b) period is restated (one source of truth: lit/frcrimp). The
# civil Local Rules the criminal rules cross-reference live in lit/ord. An
# appeal goes to the Ninth Circuit under lit/frcrimp's FRAP 4(b) period.
