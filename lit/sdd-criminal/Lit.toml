# The District of South Dakota's Criminal Local Rules of Practice (D.S.D.
# Crim. LR) as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a)): it declares only the periods and limits the criminal
# rules themselves state and re-encodes no FRCrimP, Speedy Trial Act or
# FRAP 4(b) period.
#
# The only vendored text is the court's "Complete Set" of the criminal
# rules (sources/sdd), which the PROVENANCE entry records as CURRENCY
# UNCONFIRMED: the court's page states no effective date. Every period
# therefore has a hole cite naming its pinpoint, the value the vendored
# text's, unverified, as for lit/bankr-arw. The set's pages are footed
# 2/28/2025, and the Eighth Circuit Judicial Council order printed at its
# end (JCO 3440, February 24, 2025) makes the amended civil and criminal
# rules effective as of its date, so the package runs from February 24,
# 2025; whether a later amendment exists is what stays unconfirmed. A
# query before that date is a hole in the corpus. The civil rules are
# lit/sdd's. Habeas (28 U.S.C. §§ 2254, 2255) is lit/habeas's; an appeal
# goes to the Eighth Circuit under FRAP 4(b) (lit/frcrimp) and lit/ca8.
