# From 2011-06-17 (the date the final ID issued (the 12 days actually run
# from service, which the sources don't date)): 19 C.F.R. § 210.43(a)(1):
# 12 days, computed under 19 C.F.R. § 201.14(a) (via § 210.6(a)). The
# count begins with the first business day after the event: Friday Jun 17
# -> Monday Jun 20 (day 1). Because the period is 7 days or more, calendar
# days are counted: day 12 = Friday Jul 1, not a holiday. Jun 20, 2011 was
# an ordinary business day; Juneteenth became a federal holiday only in
# 2021. Due 2011-07-01. Petitions filed 2011-07-05, four days after this
# date. That suggests the ID was served after its issue date, or the time
# was extended; neither is in the sources read. (Before the engine's
# holiday calendar respected Juneteenth's 2021 start, the op anchored at
# Jun 21 and returned Jul 5.)
#
# From 2013-12-13 (the panel's judgment): Fed. Cir. R. 40(a)(1)(B): 45
# days because the Commission, a U.S. agency, is a party (links.json
# patches cafc@itc). Dec 13 + 18 = Dec 31; + 27 = Jan 27 (45), a Monday.
# Due 2014-01-27. Petition filing dates not found; rehearing en banc was
# granted in May 2014.
