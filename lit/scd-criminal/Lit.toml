# The District of South Carolina's Local Criminal Rules as a local-rule
# layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares
# only the periods the Local Criminal Rules themselves state and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (those are
# lit/frcrimp's). Each period is counted under FRCrimP 45, which Local
# Crim. Rule 45.01 applies to these rules. The rules are the edition "with
# revisions through July 17, 2019", republished November 23, 2020, which
# the court's rules page presents as current (sources/scd; an old edition,
# recorded as such in its PROVENANCE). Federal habeas is lit/habeas's; an
# appeal to the Fourth Circuit is lit/frcrimp's and lit/ca4's.
