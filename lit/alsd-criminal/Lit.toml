# The Southern District of Alabama's Criminal Rules (Part C of its Local
# Rules, "S.D. Ala. CrLR") as a local-rule layer over lit/frcrimp (28
# U.S.C. § 2071; FRCrimP 57(a)): it declares only the periods those rules
# themselves state and re-encodes no FRCrimP, Speedy Trial Act or FRAP
# period. Each period is counted under FRCrimP 45(a), which governs "any
# local rule". The rules are effective August 1, 2015 (sources/sd-ala).
# Part A's General Rules also govern criminal proceedings (GenLR 1(a));
# they are not restated here.
