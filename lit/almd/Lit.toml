kind = "local-rule"
title = "United States District Court, Middle District of Alabama: Local Rules (civil)"
description = "The Middle District of Alabama's civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): proof of service and filed waivers, the conflict disclosure statement, subpoena and writ requests before trial, the bill of costs and the claim for extraordinary expenses of appointed counsel."
in_force = "2011-10-01"
known_at = "2026-10-28"
