title = "Maryland trial courts, criminal"
description = "Criminal causes in the Maryland trial courts under Title 4 of the Maryland Rules, as far as the vendored text states: the preliminary-hearing request, mandatory motions and their response, discovery, the 180-day trial date of Rule 4-271, the motion for new trial and revisory power, the revisory power over a sentence, and the 30-day criminal notice of appeal of Rule 8-202."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "Maryland trial courts of general criminal jurisdiction"

