description = "The Western District of Tennessee's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): motion responses and the memorandum page limit, the discovery request after arraignment and the government's response, the defense's reciprocal discovery response and expert notices before a pretrial hearing and trial, the earliest scheduling conference, the window for the sentencing hearing, and the parties' positions on sentencing factors."
