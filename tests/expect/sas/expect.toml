# <https://www.cafc.uscourts.gov/opinions-orders/15-1346.order.11-3-2016.1.pdf>;
# Supreme Court docket No. 16-969
# <https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/16-969.html>;
# SAS Institute Inc. v. Iancu, 584 U.S. 357 (2018) (opinion)
# <https://www.law.cornell.edu/supremecourt/text/16-969>.
#
# From 2014-08-06 (the final written decision): 37 C.F.R. § 90.3(a): 63
# days. Aug 6 + 25 = Aug 31; + 30 = Sep 30 (55); + 8 = Oct 8 (63), a
# Wednesday. Due 2014-10-08. Notice-of-appeal dates not found; the appeals
# are Nos. 2015-1346 and -1347.
#
# From 2016-11-07 (denial of rehearing en banc (Sup. Ct. R. 13.3)): Sup.
# Ct. R. 13.1: 90 days. Nov 7 + 23 = Nov 30; + 31 = Dec 31 (54); + 31 =
# Jan 31 (85); + 5 = Feb 5 (90), a Sunday, so it rolls to Monday Feb 6.
# Due 2017-02-06. Petition filed 2017-01-31, within the window. Recorded
# as due unknown: lit/core declares Sup. Ct. R. 30.1 only from its 2023
# edition, and the earlier editions are not vendored, so no counting rule
# is in force on the trigger date.
#
