# Criminal cases in the Virginia circuit courts under Part Three A of the
# Rules of Supreme Court of Virginia, Rule 1:1, and the criminal notice of
# appeal of Rule 5A:6 (sources/va-circuit-civil, all Parts as currently
# effective, the latest amendment effective September 15, 2026), with the
# speedy-trial statute, Code of Virginia § 19.2-243
# (sources/va-criminal-trial-court). The statute's page states no edition
# date and its PROVENANCE records CURRENCY UNCONFIRMED, so its cites are
# holes, `?("..., CURRENCY UNCONFIRMED")`, and its periods are stated in
# notes as the vendored text states them, unverified; the Rules cites
# bind. lit/core has no Virginia counting rule, so no period is a counted
# deadline. Federal habeas is lit/habeas's.
