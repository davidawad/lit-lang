# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Southern
# District of California over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075):
# it declares only the periods and limits the Local Bankruptcy Rules
# themselves state and re-encodes no FRBP period. It is a base package,
# not a `kind = "local-rule"` layer: lit/core has no bankruptcy forum
# family (L2011, as for lit/bankr-ak). Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those of
# December 1, 2025 (sources/bankr-cas, bound with the Administrative
# Procedures, which are not encoded); no amending order is vendored, so
# there are no dated layers and a query before December 1, 2025 is a hole
# in the corpus.
[package]
name = "bankr-cas-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-cas-local-rules"
forum = "bankr-cas"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Southern District of California: Local Bankruptcy Rules"
description = "The Bankr. S.D. Cal. Local Bankruptcy Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): suggestion of death, deficiency dismissal, conversion schedules, stay extension and imposition notices, notices of intended action, Rule 2004 examinations, employment, mortgage payment changes, chapter 11 claims, chapter 13 classification, plan objections, modifications, confirmation orders and valuation, chapter 11 ballots and confirmation, final decrees, stay relief, books and records, insider compensation, withdrawal of the reference, privacy ombudsmen, adversary conferences, pretrial and trial, orders and judgments, motion timing and the 25- and 10-page brief limits, and U.S. Trustee statements of position."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Southern District of California"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.casb-lbr]
title = "Local Bankruptcy Rules, U.S. Bankruptcy Court for the Southern District of California (December 1, 2025)"
url = "https://www.casb.uscourts.gov/sites/casb/files/2025_LBR_and_AdminProc_2025-12-01_R2.pdf"
path = "sources/bankr-cas/casb-lbr-2025-12-01-sectioned.txt"
path_sha256 = "b6ae868f4f58bb688466e8bb07b79ca5d2afe0436c81570d60de2039a01178e6"
sha256 = "9af0effcd09df1001e7ce6e0cdfdb613f1091148b8fcf47dbb51b3b869bcd16b"
as_of = "2025-12-01"
cite_prefixes = ["Bankr. S.D. Cal. LBR"]
section_heading = "LBR {n}"
