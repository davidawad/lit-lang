# Criminal cases in the Colorado trial courts of general criminal
# jurisdiction under the Colorado Rules of Criminal Procedure (Crim. P.),
# as far as the vendored text states. The base text is the 2023 Colorado
# Revised Statutes court-rules volume, Chapter 29 (OLLS; current through
# Rule Change 2023(13), sources/co-criminal-trial-court), STALE for later
# changes: the Supreme Court's later Rule Change orders vendored beside it
# amend Crim. P. 4.1 (2024(14)), 49 (2025(06)), 24 (2025(15)), 41 (2025(16))
# and 35, 37 and 37.1 (2026(13), effective July 1, 2026). This package cites
# none of the amended subdivisions for a value; it is in force from the
# latest of those orders. The speedy-trial rule is Crim. P. 48(b) (its
# statutory counterpart, C.R.S. 18-1-405, is not vendored). Computation of
# time is Crim. P. 45, for which lit/core has no counting rule, so the
# periods are stated in notes, not encoded as counted deadlines. An appeal
# hands off to the Colorado Court of Appeals under C.A.R. 4(b) (the 2023
# C.A.R. text, sources/co-state-appellate; no vendored Rule Change amends
# C.A.R. 4(b)) and lit/co-state-appellate.
[package]
name = "co-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "co-criminal-trial-court"
forum = "co-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "colorado"
title = "Colorado trial courts, criminal"
description = "Felony cases in the Colorado trial courts under the Colorado Rules of Criminal Procedure, as far as the vendored text states: arrest and first appearance, the preliminary hearing, charge, arraignment, pretrial motions, the Crim. P. 48(b) six-month speedy-trial rule, plea or trial, post-trial motions, sentencing and judgment. An appeal goes to the Colorado Court of Appeals under C.A.R. 4(b)."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "Colorado trial courts of general criminal jurisdiction"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

