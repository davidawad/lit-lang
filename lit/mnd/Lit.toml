# The District of Minnesota's Local Rules as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the civil
# periods and limits the Local Rules themselves state and re-encodes no
# FRCP deadline. Each period is counted under FRCP 6(a), which governs "any
# local rule" (2009 Advisory Committee's Note to LR 1.1(f)). The rules are
# the complete set dated June 10, 2026 (sources/mnd), the date LR 6.1 was
# abrogated and replaced; that date stands for the edition. An appeal goes
# to the Eighth Circuit under lit/frap and lit/ca8.
[package]
name = "mnd-local-rules"
version = "0.1.0"
language = 1
pack_id = "mnd-local-rules"
forum = "mnd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, District of Minnesota: Local Rules (civil)"
description = "The District of Minnesota's civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): filing after service, motions to extend time, nondispositive and dispositive motion briefing and its word and line limits, the Rule 26(f) report, trial preparation, costs and attorney's fees, and review of magistrate judge rulings."
in_force = "2026-06-10"
known_at = "2026-10-28"
unknown_before = "2026-06-10"
jurisdiction = "United States District Court, D. Minnesota"
# FRCP 6(a)(6)(C): the holidays of Minnesota close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-minnesota`).
counting = "frcp6-minnesota"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "mnd-lr"
issuer = "United States District Court for the District of Minnesota"
date = "2026-06-10"
designation = "Local Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.mnd-lr]
title = "Local Rules of the United States District Court for the District of Minnesota (complete set, June 10, 2026)"
url = "https://www.mnd.uscourts.gov/sites/mnd/files/Local-Rules-Master.pdf"
path = "sources/mnd/local-rules-sectioned.txt"
path_sha256 = "55de9589101301bed6b7ee7835d50d4f628b1dc51f9ce2c3365e845bfa1b50cf"
sha256 = "01aa8892b4d346f976b203d66a6739fa8b1bb028d3b005092ddd003da796eda1"
as_of = "2026-06-10"
cite_prefixes = ["D. Minn. LR"]
section_heading = "LR {n}"
