# District Courts of Travis County, Texas (lg-u561.5): the statewide
# package lit/tx-district-court for this county. Its graph is the statewide
# one: the Travis County district courts' local rules (Tex. R. Civ. P. 3a)
# are not vendored, so nothing here departs from the Texas Rules of Civil
# Procedure yet.
#
# Civil suits under the Texas Rules of Civil Procedure "Last Amended
# October 1, 2026" (sources/tx-district-court), so in_force is that date;
# earlier editions are not vendored, so a query before it is a hole in the
# corpus. Time is computed under Tex. R. Civ. P. 4; lit/core has no
# counting rule for Texas's legal holidays, so the periods are stated in
# notes, not encoded as counted deadlines. The appeal goes to a Texas court
# of appeals under the Texas Rules of Appellate Procedure
# (lit/tx-courts-of-appeals).
[package]
name = "tx-district-court-travis-civil"
version = "0.1.0"
language = 1
pack_id = "tx-district-court-travis-civil"
forum = "tx-district-court-travis"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "texas"
title = "District Courts of Travis County, Texas (Austin), civil"
description = "District Courts of Travis County, Texas: the county's local rules supplement the Texas Rules of Civil Procedure; they are not vendored and not modeled. Civil suits under the Texas Rules of Civil Procedure (October 1, 2026): petition and citation, service, the answer day, the Rule 91a motion to dismiss and special exceptions, default judgment, the discovery control plan and initial disclosures, discovery sanctions, summary judgment, the jury request, trial and judgment, findings of fact, the motion for new trial and plenary power, dismissal for want of prosecution and reinstatement, nonsuit, and the notice of appeal (lit/tx-courts-of-appeals)."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "District Courts of Travis County, Texas (Austin), civil"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
tx-state-rules = { version = "^0.1.0", path = "../tx-rules" }

[sources.tx-trcp]
title = "Texas Rules of Civil Procedure, last amended October 1, 2026 (Supreme Court of Texas)"
