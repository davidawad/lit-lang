# The Local Rules of the U.S. Bankruptcy Court for the Eastern District of
# Wisconsin over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only
# the periods the Local Rules themselves state and re-encodes no FRBP
# period. It is a base package, not a `kind = "local-rule"` layer: lit/core
# has no bankruptcy forum family (L2011 for `bankr-wie`), as for
# lit/bankr-ct. Each period is counted under FRBP 9006(a), the FRCP 6(a)
# method (core's frcp6). The rules are those adopted effective January 1,
# 2026 (LBR 1001-1; sources/bankr-wie/PROVENANCE.md); no amending order is
# vendored, so the consolidation is the only layer. The earlier rules are
# not vendored, so a query before January 1, 2026 is a hole in the corpus.
[package]
name = "bankr-wie-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-wie-local-rules"
forum = "bankr-wie"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Eastern District of Wisconsin: Local Rules"
description = "The Bankr. E.D. Wis. Local Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): documents for the trustee, a deceased debtor's declaration, Rule 2004 protective motions, employment and compensation, supplemental claims, claim objections, chapter 13 confirmation and modification objections, chapter 11 and subchapter V closing, adequate protection notices, stay relief, discharge forms and certifications, withdrawal of the reference, dismissal of discharge proceedings, summary judgment, expedited motions, § 362(c) and § 1112(b) motions, the negative-notice objection period and proposed orders."
in_force = "2026-01-01"
known_at = "2026-10-28"
unknown_before = "2026-01-01"
jurisdiction = "U.S. Bankruptcy Court for the Eastern District of Wisconsin"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.wieb-lr]
title = "Local Rules of the United States Bankruptcy Court for the Eastern District of Wisconsin (January 1, 2026)"
url = "https://www.wieb.uscourts.gov/sites/default/files/forms/2026%20Local%20Rules%20WIEB.pdf"
path = "sources/bankr-wie/wieb-lbr-2026-01-01-sectioned.txt"
path_sha256 = "fb9b0c005a53ccc8b3f3e96825651136b91a8bf7151027f700ce2abd7197fa52"
sha256 = "9f700de2358b703535be9579d89bc57cc5ee5a73247abca9a0ec66f9bf04a1d6"
as_of = "2026-01-01"
cite_prefixes = ["Bankr. E.D. Wis. LBR"]
section_heading = "LBR {n}"
