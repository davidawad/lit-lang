# Civil actions in the Alaska Superior Court under the Alaska Rules of
# Civil Procedure as the court system served them on 2026-10-27 (latest
# stated amendment SCO 2045, effective April 23, 2026; sources/ak-superior).
# Computation of time is Civil Rule 6(a), which excludes intermediate
# Saturdays, Sundays and legal holidays from periods under seven days and
# has no counting rule in lit/core, so the rules' periods are stated in
# notes, not encoded as counted deadlines; Civil Rule 6(c) adds three
# calendar days after service by non-electronic mail. An appeal hands off
# to lit/ak-supreme.
[package]
name = "ak-superior-court-civil"
version = "0.1.0"
