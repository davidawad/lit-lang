name = "cacd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "cacd-criminal-local-rules"
forum = "cacd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Central District of California: Local Criminal Rules"
description = "The Central District of California's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the government's response to a motion to suppress and the notice waiving cross-examination of a declarant, the expert disclosure times before trial, the filing of an assignment of deposited bail monies, and the settlement conference request, criminal-history summary and written plea agreement in a complex case."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
