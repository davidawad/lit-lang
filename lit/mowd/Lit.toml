version = "0.1.0"
language = 1
pack_id = "mowd-local-rules"
forum = "mowd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Western District of Missouri: Local Rules (civil)"
description = "The Western District of Missouri's Local Civil Rules (effective July 9, 2026) as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): opposing and reply suggestions and their page limits, the amended certificate of interest, Social Security answers and briefs, habeas reply suggestions, amended pleadings after leave, the proposed scheduling order, non-stenographic deposition notice, additional peremptory challenges, bills of costs, notice of intent to seek a default, settlement of judgments, receivers' inventories, withdrawal of exhibits, transcript redaction, pro hac vice compliance and objections to in forma pauperis fees."
in_force = "2026-07-09"
known_at = "2026-10-28"
