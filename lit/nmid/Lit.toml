# The District Court for the Northern Mariana Islands' Local Rules as a
# local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods and limits the Local Rules themselves state and
# re-encodes no FRCP deadline. LR 6.1 makes FRCP 6(a) govern computation of
# time under the Local Rules. The rules are those "Effective November 1,
# 2017" (sources/fed-dnmi), the court's current general local rules. An
# appeal goes to the Ninth Circuit under lit/frap.
[package]
name = "nmid-local-rules"
version = "0.1.0"
language = 1
pack_id = "nmid-local-rules"
forum = "nmid"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "District Court for the Northern Mariana Islands: Local Rules"
description = "The District Court for the Northern Mariana Islands' Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion opposition and reply periods and the brief page limits, the case management conference statement, track discovery cut-offs, pretrial briefs, jury instructions and translations, the final pretrial conference, juror cost notice, the nonresident cost bond, receivership notices and reports, exhibit removal, and the unsealing of sealed documents."
in_force = "2017-11-01"
known_at = "2026-10-28"
unknown_before = "2017-11-01"
jurisdiction = "District Court for the Northern Mariana Islands"
counting = "frcp6"

