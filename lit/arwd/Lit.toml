# The Local Rules of the United States District Courts for the Eastern
# and Western Districts of Arkansas, as applied in the Western District,
# as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods the Local Rules themselves state and
# re-encodes no FRCP deadline. Each period is counted under FRCP 6, which
# L.R. 7.2(b) adopts by name ("including subparagraph 6(d)"). The rules
# are one joint text for both districts (sources/ared, the "Complete
# Copy" last modified 2020-11-17; its newest amendment note is L.R. 5.1's,
# November 5, 2020), so the package runs from that date and a query
# before it is a hole in the corpus; lit/ared declares the same rules for
# the Eastern District. The criminal rules are not encoded. An appeal
# goes to the Eighth Circuit under lit/frap and lit/ca8.
[package]
name = "arwd-local-rules"
version = "0.1.0"
language = 1
pack_id = "arwd-local-rules"
forum = "arwd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Western District of Arkansas: Local Rules (civil)"
description = "The civil Local Rules of the Eastern and Western Districts of Arkansas, as applied in the Western District, as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): filing after service, amended pleadings, pro se responses, motion responses and summary judgment replies, class certification responses, attorney's fee motions and objections, review of magistrate judge rulings and recommendations, and review of bankruptcy court dismissal orders."
in_force = "2020-11-05"
known_at = "2026-10-28"
unknown_before = "2020-11-05"
jurisdiction = "United States District Court, W.D. Arkansas"
counting = "frcp6"

