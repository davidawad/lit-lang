# Civil actions in the Kentucky circuit courts under the Kentucky Rules of
# Civil Procedure (CR), current with amendments received through October 1,
# 2026 as published on the Westlaw public-access site the Kentucky courts
# point to (sources/ky-circuit-court). Computation of time is CR 6.01: the
# day of the event is excluded, a last day falling on a Saturday, Sunday or
# legal holiday runs to the next day that is none of those, and a period of
# less than seven days excludes intermediate Saturdays, Sundays and legal
# holidays; lit/core has no counting rule or holiday calendar for Kentucky,
# so the periods are stated in notes, not encoded as counted deadlines. The
# appeal is taken under the Rules of Appellate Procedure (RAP 2, 3;
# sources/ky-appellate) to lit/ky-court-of-appeals.
[package]
name = "ky-circuit-court-civil"
version = "0.1.0"
language = 1
pack_id = "ky-circuit-court-civil"
forum = "ky-circuit-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "kentucky"
title = "Kentucky circuit courts, civil"
description = "Civil actions in the Kentucky circuit courts under the Kentucky Rules of Civil Procedure, as far as the vendored text states: commencement and the summons, the time to answer and its alteration by a CR 12 motion, amendment, default and setting it aside, discovery and sanctions, summary judgment, the jury demand, directed verdict and judgment notwithstanding it, new trial and alteration of judgment, relief from judgment, dismissal for want of prosecution and voluntary dismissal, entry of judgment and its notation of service, and the 30-day appeal under RAP 3."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Kentucky circuit courts (general civil jurisdiction)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the RAP brief limits and trigger events.
ky-state-rules = { version = "^0.1.0", path = "../ky-rules" }

