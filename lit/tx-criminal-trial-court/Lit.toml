# Criminal cases in the Texas trial courts of general criminal
# jurisdiction under the Texas Code of Criminal Procedure, as far as the
# vendored text states, with the trial-court steps of the Texas Rules of
# Appellate Procedure (the motion for new trial, Tex. R. App. P. 21, and
# the criminal appeal, Tex. R. App. P. 25.2 and 26.2). The Code is the
# Legislature's text "current through the 89th 2nd Called Legislative
# Session, 2025", retrieved 2026-10-28 (sources/tx-criminal-trial-court);
# its articles carry no per-article effective date in this form, so
# in_force is the retrieval date and an earlier query is a hole in the
# corpus. The TRAP are those "Last Amended February 6, 2026"
# (sources/tx-appellate). The vendored Code states no speedy-trial period:
# the right is the accused's "speedy public trial" (art. 1.05), and
# chapter 32A (Speedy Trial) holds only the trial priorities of art.
# 32A.01; the release-for-delay periods of art. 17.151
# and the indictment period of art. 32.01 are the Code's time limits on
# pretrial detention and charge. Time under the TRAP is computed under
# Tex. R. App. P. 4.1, and the Code's periods count Texas days; lit/core
# has no counting rule for Texas's legal holidays, so periods are stated
# in notes, not encoded as counted deadlines. A non-death appeal goes to a
# Texas court of appeals; a death sentence goes directly to the Court of
# Criminal Appeals (lit/tx-court-of-criminal-appeals). Federal habeas
# belongs to lit/habeas.
