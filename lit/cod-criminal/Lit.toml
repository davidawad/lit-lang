# The U.S. District Court for the District of Colorado's local criminal
# rules (D.C.COLO.LCrR) as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods the local criminal
# rules themselves state and re-encodes no FRCrimP, Speedy Trial Act or
# FRAP 4(b) period (one source of truth: lit/frcrimp). Each period is
# counted under FRCrimP 45(a), which governs "any local rule", so each
# deadline names `forum frcrimp`. The rules are the Local Rules of Practice
# effective December 1, 2025 (Section II, Criminal Rules; sources/d-colo),
# the edition the court serves as current, so in_force is that date;
# earlier editions are not vendored, so a query before it is a hole in the
# corpus. An appeal goes to the Tenth Circuit under lit/frcrimp's FRAP
# 4(b) period and lit/ca10.
[package]
name = "cod-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "cod-criminal-local-rules"
forum = "cod-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Colorado: Local Criminal Rules"
description = "The U.S. District Court for the District of Colorado's local criminal rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the notice of disposition, the discovery conference memorandum, the sentencing statements, departure and variance motions and sentencing-related documents, notice of an unrepresented party's change of address, objection to the disposal of exhibits, and requests for disability accommodation."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "U.S. District Court for the District of Colorado (criminal)"
counting = "frcrimp45"
family = "district-criminal"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
