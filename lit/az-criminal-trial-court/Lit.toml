# Criminal cases in the Arizona Superior Court under the Arizona Rules of
# Criminal Procedure (Ariz. R. Crim. P.), as served on the Westlaw
# public-access site the Arizona courts link, "current with amendments
# received and effective through October 1, 2026"
# (sources/az-criminal-trial-court); in_force is that date and an earlier
# query is a hole in the corpus. Rule 8 is the speedy-trial rule and Rule
# 31 governs criminal appeals, both in the same set. Time is computed
# under Rule 1.10, which excludes intermediate Saturdays, Sundays and
# legal holidays from periods under 7 days and adds 5 calendar days after
# certain kinds of service; lit/core has no counting rule for it, so the
# rules' periods are stated in notes, not encoded as counted deadlines.
# The Arizona Revised Statutes the rules cite (release under A.R.S.
# § 13-3961, victims' rights) are not vendored and stay holes.
