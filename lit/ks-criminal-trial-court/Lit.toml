# Criminal cases in the Kansas district courts under the Kansas Code of
# Criminal Procedure (K.S.A. chapter 22), as far as the vendored text
# states. Kansas has no separate court rules of criminal procedure:
# criminal procedure is statutory. The text is the Revisor of Statutes'
# chapter 22 section pages as served on October 28, 2026
# (sources/ks-criminal-trial-court), which state no edition date; its
# PROVENANCE entry records CURRENCY UNCONFIRMED, so in_force is the
# retrieval date and an earlier query is a hole in the corpus. By the PM's
# standing ruling of 2026-10-27 such a source yields holes, not values:
# this package cites the statutes only for the structure of the case
# (which section governs which step) and states no period, limit or amount
# from them, including the K.S.A. 22-3402 speedy-trial deadlines and the
# K.S.A. 22-3608 time to appeal. An appeal goes to the Court of Appeals or
# the Supreme Court under K.S.A. 22-3601.
