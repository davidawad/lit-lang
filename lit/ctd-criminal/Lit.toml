# The U.S. District Court for the District of Connecticut's Local Criminal
# Rules (D. Conn. L. Cr. R.), the Local Civil Rules they apply in criminal
# proceedings (L. Cr. R. 1(c)) and the Criminal Appendix's Standing Order
# on Discovery (L. Cr. R. 16(a)), as a local-rule layer over lit/frcrimp
# (28 U.S.C. § 2071; FRCrimP 57(a)): it declares only the periods and
# limits those rules themselves state and re-encodes no FRCrimP, Speedy
# Trial Act or FRAP 4(b) period (one source of truth: lit/frcrimp). Each
# period is counted under FRCrimP 45(a), which governs "any local rule",
# so each deadline names `forum frcrimp`. The rules are the court's
# current compilation (cover "Amended December 1, 2009", each rule
# carrying its own amendment date; the latest criminal amendment is L. Cr.
# R. 32, January 12, 2026, and the compilation's latest is September 25,
# 2026; sources/dct), so in_force is that date; earlier editions are not
# vendored, so a query before it is a hole in the corpus. An appeal goes
# to the Second Circuit under lit/frcrimp's FRAP 4(b) period and lit/ca2.
[package]
name = "ctd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "ctd-criminal-local-rules"
forum = "ctd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Connecticut: Local Criminal Rules"
description = "The District of Connecticut's Local Criminal Rules, the Local Civil Rules they apply and the Standing Order on Discovery as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the discovery conference and the parties' disclosures, expert disclosures before the final pretrial conference, motion opposition and reply periods and page limits, reconsideration, the presentence report and sentencing-memorandum schedule counted from the guilty plea or verdict, and the sentencing-memorandum page limit."
in_force = "2026-09-25"
known_at = "2026-10-28"
unknown_before = "2026-09-25"
jurisdiction = "U.S. District Court for the District of Connecticut (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "ctd-lcrr"
issuer = "United States District Court for the District of Connecticut"
