title = "United States District Court for the Eastern District of Pennsylvania: Local Rules of Civil Procedure"
description = "The Eastern District of Pennsylvania's Local Rules of Civil Procedure as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the Commissioner's response in a Social Security review, the motion opposition period, the post-trial transcript order, reconsideration, third-party joinder, dismissal for inactivity and vacatur of a settlement dismissal, the demand for trial de novo after compulsory arbitration, taxation of costs, and objections to a magistrate judge's orders and reports."
