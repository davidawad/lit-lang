# Civil appeals in the Court of Appeals of Georgia, as far as the Court's
# rules (effective March 26, 2026) state. The periods the rules set are in
# notes, not deadlines: Rule 3 extends a deadline falling on a weekend or
# holiday, but how a period is counted (O.C.G.A. § 1-3-1) and the state
# holidays are not vendored, and lit/core has no Georgia counting rule.
# The notice-of-appeal period (O.C.G.A. § 5-6-38) and appellate
# jurisdiction (O.C.G.A. §§ 5-6-34, 5-6-35) are statutes that are not
# vendored either. Certiorari ends this package: the Supreme Court of
# Georgia's rules (sources/ga-state-appellate/gasc-rules-2026-07-02.txt)
# are vendored but not modeled here.
[package]
name = "ga-court-of-appeals-civil-appeals"
version = "0.1.0"
language = 1
pack_id = "ga-court-of-appeals-civil-appeals"
forum = "gactapp"
authority = "StateRule"
title = "Court of Appeals of Georgia, civil appeals"
description = "Civil appeals in the Court of Appeals of Georgia under the Court's rules effective March 26, 2026: docketing, briefing, oral argument requests, decision, reconsideration, notice of intent to seek certiorari and remittitur."
in_force = "2026-03-26"
known_at = "2026-10-27"
unknown_before = "2026-03-26"
jurisdiction = "Court of Appeals of Georgia"

[package.roles]
