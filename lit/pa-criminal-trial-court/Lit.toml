description = "Criminal court cases in the Pennsylvania courts of common pleas under the Pennsylvania Rules of Criminal Procedure, as far as the vendored text states: arrest and complaint, preliminary arraignment and bail, the preliminary hearing (or an indicting grand jury), the information and arraignment, discovery and the omnibus pretrial motion, prompt trial under Rule 600, plea or trial, sentencing, the post-sentence motion, and the appeal (Pa.R.A.P. 903) or a post-conviction petition (Rule 901)."
