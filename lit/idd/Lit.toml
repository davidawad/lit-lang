# The United States District Court for the District of Idaho's Local Civil
# Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)):
# it declares only the periods and limits the Local Civil Rules themselves
# state and re-encodes no FRCP deadline. Each period is counted under FRCP
# 6(a), which governs "any local rule"; Loc. Civ. R. 1.1(e)(1) presumes
# local practice consistent with the federal rules. The rules are the
# court's complete Civil Local Rules packet (printed October 27, 2026),
# "Revised and adopted August 17, 2026" (its announcement page;
# sources/fed-didaho). The Local Criminal Rules (forum idd-criminal) are
# out of scope. An appeal goes to the Ninth Circuit under lit/frap and
# lit/ca9.
[package]
name = "idd-local-rules"
version = "0.1.0"
language = 1
pack_id = "idd-local-rules"
forum = "idd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, District of Idaho: Local Civil Rules"
description = "The District of Idaho's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the service status report, signature-authenticity objections, motion briefing and its page limits, amended pleadings, the Rule 26(f) and ADR conferences, trial submissions and trial memoranda, voir dire and jury instruction requests, costs and their retaxing, attorney fee briefing, Social Security fee motions, jury cost notice, magistrate judge objections, motions pending on removal, attorney discipline and withdrawal."
in_force = "2026-08-17"
known_at = "2026-10-28"
unknown_before = "2026-08-17"
jurisdiction = "United States District Court, D. Idaho"
# FRCP 6(a)(6)(C): Idaho's holidays close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-idaho`).
counting = "frcp6-idaho"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "idd-lr"
issuer = "United States District Court for the District of Idaho"
date = "2026-08-17"
designation = "Local Rules of Civil and Criminal Practice (revised and adopted August 17, 2026): Local Civil Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.idd-lr]
title = "Local Rules of Civil and Criminal Practice before the United States District Court for the District of Idaho, Local Civil Rules (revised and adopted August 17, 2026), complete rule packet printed October 27, 2026"
