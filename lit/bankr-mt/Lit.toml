# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the District
# of Montana over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods and limits the Local Bankruptcy Rules themselves state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective December 1, 2025 (sources/bankr-mt); the 2026 proposed
# amendments are not in force and earlier editions are not vendored.
# Appeals go to the Ninth Circuit BAP or the District Court under FRBP
# Part VIII (lit/frbp).
[package]
name = "bankr-mt-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-mt-local-rules"
forum = "bankr-mt"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of Montana: Local Bankruptcy Rules"
description = "The Bankr. D. Mont. Local Bankruptcy Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): petition service and fees, missing documents, conversion, fee notices, creditors' meetings, professionals, late claims in chapter 12 and 13 cases, the chapter 11 claims bar date, plan amendment and objections, administrative expense estimates, ballots, debtor duties and reports, exhibits, trustee reports, withdrawal of the reference, discovery, summary judgment, motion practice (Mont. LBR 9013-1) and its memoranda limits, motions to vacate, and jury trials."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "U.S. Bankruptcy Court for the District of Montana"
counting = "frcp6"

[package.instrument]
source = "mtb-lbr"
issuer = "United States Bankruptcy Court for the District of Montana"
date = "2025-12-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

