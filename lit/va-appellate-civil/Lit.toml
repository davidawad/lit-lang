title = "Court of Appeals of Virginia and Supreme Court of Virginia, civil"
description = "A civil appeal of right to the Court of Appeals of Virginia, through rehearing, review in the Supreme Court of Virginia and the mandate, as far as the vendored Rules of the Supreme Court of Virginia state."
in_force = "2026-09-15"
