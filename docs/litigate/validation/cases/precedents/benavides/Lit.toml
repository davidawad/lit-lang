# The circuit split `frap-4a6-notice` (lg-i1qw; docs/litigate/VALIDATION.md
# §4): Benavides v. Bureau of Prisons holds that only a written notice from the clerk or a party opens the 7-day window (reading A).
# It binds only in its own circuit (docs/litigate/CHANGE.md §2.8), so a
# world selects its reading by location.
