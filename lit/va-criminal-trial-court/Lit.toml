description = "Criminal cases in the Virginia circuit courts under Part Three A of the Rules of Supreme Court of Virginia, as far as the vendored text states: pretrial motions 7 days before trial, discovery motions 10 days before trial, the speedy-trial limits of Code § 19.2-243, the motion to set aside the verdict within 21 days after the final order, the 21 days of trial-court control under Rule 1:1, and the 30-day notice of appeal of Rule 5A:6. The statute is CURRENCY UNCONFIRMED, so its cites are holes."
