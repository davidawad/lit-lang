# The Western District of Virginia's Local Rules, Title III (Criminal
# Rules), as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a)): it declares only the periods the criminal rules
# themselves state and re-encodes no FRCrimP, Speedy Trial Act or FRAP
# 4(b) period (those are lit/frcrimp's). Each period is counted under
# FRCrimP 45(a), which governs "any local rule". The rules are the Local
# Rules of August 2013, revised October 25, 2025 (sources/vawd). Federal
# habeas is lit/habeas's; an appeal to the Fourth Circuit is
# lit/frcrimp's and lit/ca4's.
[package]
name = "vawd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "vawd-criminal-local-rules"
forum = "vawd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Western District of Virginia: Local Rules, Title III (Criminal)"
description = "The Western District of Virginia's criminal Local Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the appellant's statement of grounds and memorandum on an appeal from a magistrate judge's conviction or sentence, with or without a transcript, and the appellee's responsive memorandum."
in_force = "2025-10-25"
known_at = "2026-10-28"
unknown_before = "2025-10-25"
jurisdiction = "United States District Court, W.D. Va. (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
