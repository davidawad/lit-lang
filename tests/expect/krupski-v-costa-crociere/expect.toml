# Krupski v. Costa Crociere S.p.A., 560 U.S. 538 (2010) (lg-wvlf.5; public
# record). The petition for certiorari against the base layer of the
# 2005-2013 Rules of the Supreme Court (docs/litigate/change/scotus-base),
# from the Court's docket No. 09-337 (https://www.supremecourt.gov/search.
# aspx?filename=/docketfiles/09-337.htm, as served in sources/change-
# corpus/dockets/; the case's `docket N` is the row of its Proceedings and
# Orders). The Eleventh Circuit decided the appeal June 22, 2009 (docket
# header) and no rehearing was sought; Krupski filed the petition
# September 15, 2009 (row 1, "Petition for a writ of certiorari filed").
# Rule 13.1 (2007 Rules): 90 days from June 22 is Sunday, September 20, so
# it runs to Monday, September 21 (Rule 30.1). The Court granted the
# petition January 15, 2010 and reversed June 7, 2010. The petition was
# docketed and granted, so the Court held it timely (Rule 13.2). The
# merits holding edits no period the library models, so no precedent layer
# is added. Re-record with `litigate test tests/expect --bless`, and say
# why in the commit.

paths = ["docs/litigate/change/scotus-base"]

[[run]]
world = "ca11.world"

[run.expect.w1]
verdict = "clean"
in_force = ["change-certiorari-base"]

[run.expect.w1.outcome]
petition = "timely"

[[run.expect.w1.deadlines]]
deadline = "change-certiorari-base::petition-period"
trigger = "2009-06-22"
due = "2009-09-21"
status = "discharged"
cite = "Sup. Ct. R. (2007) 13.1"
counted_by = "Sup. Ct. R. (2007) 30.1"
