# A civil appeal to the Maine Supreme Judicial Court sitting as the Law
# Court under the Maine Rules of Appellate Procedure (including amendments
# effective November 1, 2024, sources/me-law-court). Computation of time
# is M.R. App. P. 1A: intermediate weekends, legal holidays and clerk's
# office closures are excluded from periods of 6 days or fewer, and core
# has no Maine counting rule or holiday calendar, so the rules' periods
# are stated in notes, not encoded as counted deadlines. A civil action
# in the Superior Court is lit/me-superior-civil.
