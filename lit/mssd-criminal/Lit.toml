# The U.S. District Court for the Southern District of Mississippi's Uniform Local Criminal
# Rules (U.L.Cr.R., one text with the Northern District) as a local-rule
# layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares
# only the periods and limits the local criminal rules themselves state
# and re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (one
# source of truth: lit/frcrimp). Each period is counted under FRCrimP
# 45(a), which governs "any local rule", so each deadline names
# `forum frcrimp`; U.L.Cr.R. 47(A) likewise moves a deadline that falls on
# a Saturday, Sunday or legal holiday to the next business day. The rules
# are the edition the court serves as current ("EFFECTIVE December 1,
# 2019"; sources/mssd), so in_force is that date; earlier editions are not
# vendored, so a query before it is a hole in the corpus. The Uniform
# Local Civil Rules apply "where applicable" (U.L.Cr.R. 1) and are bound
# by lit/mssd, not restated here. The court's Speedy Trial Act plan (18
# U.S.C. § 3165) is not vendored. An appeal goes to the Fifth Circuit
# under lit/frcrimp's FRAP 4(b) period and lit/ca5.
