# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Eastern
# District of New York over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods the Local Bankruptcy Rules themselves state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective December 13, 2019; the September 17, 2026 amendment updates
# the cover page only (sources/bankr-nye/PROVENANCE.md), so it changes no
# rule and the consolidation is the only layer. No earlier edition is
# vendored, so a query before December 13, 2019 is a hole in the corpus.
[package]
name = "bankr-nye-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-nye-local-rules"
forum = "bankr-nye"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Eastern District of New York: Local Bankruptcy Rules"
description = "The Bankr. E.D.N.Y. Local Bankruptcy Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): photo identification, involuntary chapter 11 affidavits and disclosure statements, notices of presentment, chapter 13 mandatory disclosures, final chapter 7 compensation, counsel's retainer disclosure, claims after schedule amendments, chapter 13 plan service and modification, chapter 9 and 11 ballots, certifications and confirmation objections, post-confirmation timetables and final decrees, cure of residential judgments of possession, amended exemptions, adjourned matters, small sales and auctions, contention interrogatories and document inspection, remands, motion practice (LBR 9006-1), mediation, redaction, exhibits and orders settled on notice."
in_force = "2019-12-13"
known_at = "2026-10-28"
unknown_before = "2019-12-13"
jurisdiction = "U.S. Bankruptcy Court for the Eastern District of New York"
counting = "frcp6"

[package.instrument]
source = "nyeb-lbr"
issuer = "United States Bankruptcy Court for the Eastern District of New York"
date = "2019-12-13"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

