# The Court of Criminal Appeals of Texas, the state's court of last resort
# in criminal cases, under the Texas Rules of Appellate Procedure (Tex. R.
# App. P. 66 to 79, with the general rules they use), as far as the
# vendored text states: discretionary review of a court of appeals'
# decision, the direct appeal of a death sentence or of a non-capital bail
# denial, postconviction habeas applications under Code of Criminal
# Procedure articles 11.07 and 11.071, and rehearing. The base text is the
# TRAP "Last Amended February 6, 2026" (sources/tx-appellate), so
# in_force is that date; earlier editions are not vendored, so a query
# before it is a hole in the corpus. The Court's later miscellaneous
# docket orders (sources/tx-court-of-criminal-appeals) are dated layers
# that do not change these periods: Misc. Docket No. 26-001 finally
# approves TRAP 31.8, which the vendored TRAP already carries; No. 26-003
# adopts a comment to Tex. R. Evid. 404; No. 26-004 approves Technology
# Standards v11.0 for electronic filing under TRAP 9. The Code of Criminal
# Procedure is the Legislature's text "current through the 89th 2nd Called
# Legislative Session, 2025" (sources/tx-criminal-trial-court). Time is
# computed under Tex. R. App. P. 4.1, whose legal holidays are Texas's;
# lit/core has no counting rule for them, so the periods are stated in
# notes, not encoded as counted deadlines. The court of appeals side
# (Tex. R. App. P. 25 to 51 in criminal cases) and the trial court are
# lit/tx-criminal-trial-court's hand-off; federal habeas belongs to
# lit/habeas.
