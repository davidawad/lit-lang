title = "United States District Court for the District of Minnesota: Local Rules (criminal)"
description = "The District of Minnesota's Local Rules, as applied in its criminal cases, as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the statement regarding transcript redaction, the criminal discovery and pretrial motion schedule, withdrawal of a document after a motion to seal is denied, responses to objections to a magistrate judge's ruling, and the sentencing position papers, witness and exhibit lists, responses and downward departure motions."
in_force = "2026-06-10"
