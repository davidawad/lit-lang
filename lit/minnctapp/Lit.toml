sha256 = "35f2dc1e2847e13cba11df37a73290ce7fb5d469024e70b77f349526dddfb068"
as_of = "2025-04-01"
cite_prefixes = ["Minn. R. Civ. App. P."]
section_heading = "Rule {n}"
