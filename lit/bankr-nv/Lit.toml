# The Local Rules of Bankruptcy Practice of the U.S. Bankruptcy Court for
# the District of Nevada over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075):
# it declares only the periods and limits the Local Rules themselves state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frbp9006). The rules are those
# updated March 2, 2021 (sources/bankr-nv): Administrative Order 2021-04,
# amending LR 9018 that day, is the latest local-rule amendment and is in
# the edition, so there are no dated layers. A query before March 2, 2021
# is a hole in the corpus.
[package]
name = "bankr-nv-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-nv-local-rules"
forum = "bankr-nv"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of Nevada: Local Rules of Bankruptcy Practice"
description = "The Bankr. D. Nev. Local Rules of Bankruptcy Practice over the Federal Rules of Bankruptcy Procedure (lit/frbp): notice to other courts, involuntary defaults, joint administration, proof of service, rejection and chapter 11 and Subchapter V claims, chapter 11 claim objections, status reports and confirmation declarations, chapter 13 distribution objections, cash collateral stipulations, wage orders, chapter 13 final accounts and certificates of compliance, transcripts, amended pleadings, motions in limine, summary judgment, the LR 9014 hearing schedule and LR 9014.1 negative notice, jury consent, proposed orders and the 20- and 15-page brief limits."
in_force = "2021-03-02"
known_at = "2026-10-28"
unknown_before = "2021-03-02"
jurisdiction = "U.S. Bankruptcy Court for the District of Nevada"
# FRBP 9006(a)(6)(C): Nevada's holidays close a forward-counted period, here and in
# the FRBP periods this package recounts (core's `frbp9006-nevada`).
counting = "frbp9006-nevada"
recounts = ["frbp-bankruptcy-procedure"]

[package.instrument]
source = "nvb-lr"
issuer = "United States Bankruptcy Court for the District of Nevada"
date = "2021-03-02"
designation = "Local Rules of Bankruptcy Practice"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.nvb-lr]
title = "Local Rules of Bankruptcy Practice, U.S. Bankruptcy Court for the District of Nevada (updated March 2, 2021)"
url = "https://www.nvb.uscourts.gov/downloads/rules/local-rules-2021_final.pdf"
