# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the District
# of Maine over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only
# the periods and page limits the Local Rules themselves state and
# re-encodes no FRBP period. Each period is counted under
# FRBP 9006(a), the FRCP 6(a) method (core's frbp9006). The rules are the Local
# Rules effective December 1, 2025; the court's general orders page lists
# no later order amending them (sources/bankr-me/PROVENANCE.md), so the
# consolidation is the only layer. The earlier editions are not vendored,
# so a query before December 1, 2025 is a hole in the corpus.
[package]
name = "bankr-me-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-me-local-rules"
forum = "bankr-me"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "United States Bankruptcy Court, District of Maine: Local Bankruptcy Rules"
description = "The District of Maine Bankruptcy Court's Local Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): the affiliates statement, means-test forms and business-asset schedule after conversion, Rule 2004 protective orders, proof-of-claim periods for added and disputed creditors and in Chapter 9 and 11 cases, Chapter 13 claim objections, the Chapter 11 trustee's § 1106(a)(5) action and plan-mailing certificate, hearing continuances, orders entered without a hearing, adversary settlements, removal papers, and the discovery-memorandum and reply page limits."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "United States Bankruptcy Court, D. Maine"
# FRBP 9006(a)(6)(C): the holidays of Maine close a forward-counted period, here and in
# the FRBP periods this package recounts (core's `frbp9006-maine`).
counting = "frbp9006-maine"
recounts = ["frbp-bankruptcy-procedure"]

[package.instrument]
source = "bankr-me-lbr"
issuer = "United States Bankruptcy Court for the District of Maine"
date = "2025-12-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.bankr-me-lbr]
title = "Local Rules of the United States Bankruptcy Court for the District of Maine (effective December 1, 2025)"
url = "https://www.meb.uscourts.gov/sites/meb/files/20251208_USBC_Local_Rules.pdf"
path = "sources/bankr-me/me-local-rules-2025-12-01-sectioned.txt"
path_sha256 = "273fb79115535b9f394aa01f721eaf65696901951f630e2c2821bc754dc88441"
sha256 = "8d39d35d3ba8f8d3d288a6139fb56575db701a3e1b46c42e51b41daa382dad1e"
