# Appeals to the Oklahoma Court of Criminal Appeals, Oklahoma's court of
# last resort in criminal cases, under the Rules of the Court of Criminal
# Appeals (Okla. Stat. tit. 22, ch. 18, app.), as far as the vendored text
# states. The text is the rule pages the court serves at okcca.net,
# retrieved October 28, 2026 (sources/ok-court-of-criminal-appeals): no
# consolidated edition date is published, the pages carry their own
# amendment notes, and in_force is the retrieval date; an earlier query is
# a hole in the corpus. The rules' own computation (Rule 1.4: first day
# excluded, last included) has no counting rule in lit/core, so the
# periods are stated in notes, not encoded as counted deadlines. Title 22
# (Sections 1051 to 1089), which the rules cite, is not vendored. A
# petition for certiorari to the Supreme Court of the United States is a
# federal hand-off under Sup. Ct. R. 13.
