# The Tenth Circuit Bankruptcy Appellate Panel Local Rules over lit/frbp
# (FRBP 8026; 10th Cir. BAP L.R. 8001-3(a)): it declares only the periods
# the panel's own rules state and re-encodes no FRBP period (notice,
# election, record, briefing, motions and rehearing are lit/frbp's; the 28
# U.S.C. § 158(c)(1) election is lit/frbp's too). The rules are those
# effective January 1, 2026 (sources/ca10-bap/PROVENANCE.md), the edition
# the panel's site lists; no later order amends them, so the edition is
# the only layer. The FRBP Part VIII text printed with them is the
# December 1, 2024 edition; the FRBP cites here bind to the December 1,
# 2025 edition lit/frbp vendors instead. The package is in force from the
# rules' effective date, a lower bound: a query before then is a hole in
# the corpus. Each period is counted under FRBP 9006(a) (10th Cir. BAP
# L.R. 8026-8(a)), the FRCP 6(a) method (core's frcp6), with Colorado's
# holidays closing a forward-counted period (L.R. 8026-8(b); FRBP
# 9006(a)(6)(C); `bap10-9006`), which also counts lit/frbp's periods in an
# appeal before the panel (`recounts`). Like lit/bap8 and lit/bap9 it is a
# base package, not a `kind = "local-rule"` layer: its forum `bap10` is in
# none of lit/core's forum families (the bankruptcy family holds the
# bankruptcy courts, not the appellate panels), so a layer there would be
# L2011.
[package]
name = "tenth-circuit-bankruptcy-appellate-panel"
version = "0.1.0"
language = 1
pack_id = "tenth-circuit-bankruptcy-appellate-panel"
forum = "bap10"
authority = "FederalRule"
title = "Tenth Circuit Bankruptcy Appellate Panel Procedure"
description = "Appeals before the Bankruptcy Appellate Panel of the Tenth Circuit under the current Federal Rules of Bankruptcy Procedure (lit/frbp) and the panel's local rules: the combined statements, fees, the motion for leave and its reply, district court election, the appendix as the record, intervention, oral argument, constitutional-question notice, dismissal for failure to prosecute and reinstatement, disposition and mandate, rehearing and further review in the Tenth Circuit."
in_force = "2026-01-01"
known_at = "2026-10-28"
unknown_before = "2026-01-01"
jurisdiction = "Bankruptcy Appellate Panel of the Tenth Circuit"
counting = "bap10-9006"
recounts = ["frbp-bankruptcy-procedure"]

[package.roles]
applicant = "self"
appellee = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods themselves (Part 8 appeal periods); this package layers the panel's local rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

