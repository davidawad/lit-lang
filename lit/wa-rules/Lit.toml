# The Washington base library (lg-u561.5): the trigger events the Washington court
# packages route their graphs on: lit/wa-superior, lit/wa-court-of-appeals and the
# outlines outlines/ninth-circuit/washington/state-supreme-court.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "wa-state-rules"
version = "0.1.0"
language = 1
pack_id = "wa-state-rules"
forum = "wa-state-rules"
authority = "StateRule"
jurisdiction_id = "washington"
title = "Washington state court rules (base library)"
description = "The rule layer Washington's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "Washington state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
