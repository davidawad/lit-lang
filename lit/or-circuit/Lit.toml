# Civil actions in the Oregon circuit courts under the Oregon Rules of
# Civil Procedure, as far as the vendored text states: the rules as
# published by the Oregon Legislature, titled "Oregon Rules of Civil
# Procedure (2025)" (sources/or-circuit). Time is computed under ORCP
# 10 A, whose legal holidays are those of ORS 187.010 and 187.020, not the
# federal ones; lit/core has no counting rule for them, so the periods are
# stated in notes, not encoded as counted deadlines. The notice of appeal
# is governed by ORS 19.255 (not vendored) and ORAP 2.05; the appeal is
# lit/or-court-of-appeals.
[package]
name = "or-circuit-civil"
version = "0.1.0"
language = 1
pack_id = "or-circuit-civil"
forum = "or-circuit"
authority = "StateRule"
jurisdiction_id = "oregon"
title = "Oregon Circuit Court, civil"
description = "Civil actions in the Oregon circuit courts under the Oregon Rules of Civil Procedure, as far as the vendored text states: commencement, the 30-day time to appear and defend, Rule 21 motions and pleading after them, amendment, the order of default and the judgment by default, discovery sanctions, summary judgment and its timing, trial, judgment notwithstanding the verdict and new trial with their 55-day deemed denial, the statement of attorney fees and costs, relief from judgment, voluntary dismissal and the offer to allow judgment, and the notice of appeal under the Oregon Rules of Appellate Procedure."
in_force = "2026-10-16"
known_at = "2026-10-28"
unknown_before = "2026-10-16"
jurisdiction = "Oregon Circuit Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

