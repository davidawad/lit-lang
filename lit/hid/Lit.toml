# The District of Hawaii's Local Rules (civil and general chapters) as a
# local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods and limits the Local Rules themselves state and
# re-encodes no FRCP deadline. Each period is counted under FRCP 6(a),
# which governs "any local rule"; LR1.4(d) defines days as calendar days.
# The rules are those amended by the administrative order of August 26,
# 2019, effective September 1, 2019 (LR1.2; sources/fed-dhaw). An appeal
# goes to the Ninth Circuit under lit/frap.
[package]
name = "hid-local-rules"
version = "0.1.0"
language = 1
pack_id = "hid-local-rules"
forum = "hid"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, District of Hawaii: Local Rules (civil and general)"
description = "The District of Hawaii's Local Rules (civil and general chapters) as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): sealing, proof of service, motion briefing and its page and word limits, counter motions and joinders, the pre-filing conference, amended pleadings, scheduling and settlement conference statements, the Rule 26(f) report, expedited discovery letter briefs, related cases, jury cost assessment, jury instructions, draft findings, costs, attorney's fees, summary judgment concise statements, settlement of judgments, reconsideration, receivers, magistrate judge objections, self-represented litigants, attorney status, address and discipline, mediator objections, prisoner and § 2255 actions, and review of bankruptcy court appeal orders."
in_force = "2019-09-01"
known_at = "2026-10-28"
unknown_before = "2019-09-01"
jurisdiction = "United States District Court, D. Hawaii"
counting = "frcp6"

[package.roles]
