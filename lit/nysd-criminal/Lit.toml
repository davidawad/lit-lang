# The U.S. District Court for the Southern District of New York's Local
# Criminal Rules, the Joint Local Rules it shares with the Eastern
# District, as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a); Local Criminal Rule 1.1): it declares only the periods
# and limits the Local Criminal Rules themselves state and re-encodes no
# FRCrimP, Speedy Trial Act or FRAP 4(b) period (one source of truth:
# lit/frcrimp). Each period is counted under FRCrimP 45(a), which governs
# "any local rule" (Local Criminal Rule 45.1 is withdrawn), so each
# deadline names `forum frcrimp`. The rules are the edition effective
# January 2, 2026 (sources/sdny); earlier editions are not vendored, so a
# query before that date is a hole in the corpus. lit/nyed-criminal binds
# the same text for the Eastern District. An appeal goes to the Second
# Circuit under lit/frcrimp's FRAP 4(b) period and lit/ca2.
