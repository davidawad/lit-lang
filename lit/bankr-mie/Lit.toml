# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Eastern
# District of Michigan over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods and page limits the rules themselves state and
# re-encodes no FRBP period. Each period is counted under FRBP 9006(a), the
# FRCP 6(a) method (core's frcp6).
#
# Layers, in date order: the rules as vendored (title page: amendments
# through December 10, 2018; the text already shows the changes of
# Administrative Orders 19-03, 19-10 and 19-12 of 2019), then AO 24-13
# (LBR 1071-1, effective June 1, 2024), AO 25-14 (LBR 2016-1(c), effective
# October 6, 2025) and AO 25-15 (LBR 2015-3(a)(5), November 24, 2025). Only
# AO 25-15 restates a period, which takes a dated version from its date
# (local-rules.lit); the other orders change no period. AOs 19-03, 19-10
# and 19-12 are OCR extracts (verify numbers), so no value rests on them.
# The earlier editions are not vendored, so a query before December 10,
# 2018 is a hole in the corpus.
[package]
name = "bankr-mie-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-mie-local-rules"
forum = "bankr-mie"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Eastern District of Michigan: Local Bankruptcy Rules"
description = "The Bankr. E.D. Mich. Local Bankruptcy Rules, with Administrative Order 25-15 as a dated layer, as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): dismissal hearing requests, pro se declarations, chapter 13 payment orders, payment advices, credit counseling certifications, conversion from chapter 13, tax-return dismissal motions, entity resolutions, nonappearance dismissals, meeting documents, committee notices, quarterly business statements, the chapter 13 completion notice, objections and final report, interim fees, payment changes, the chapter 11 bar date, claim objection responses, § 1111(b) elections, § 1305 claims, modified plans, solicitation, consummation timetables, expedited financing orders, stay extension motions, pre-confirmation payments, domestic support certifications, reopened cases, sales by notice, pretrial orders, mediation, § 727 dismissals, fee awards, default judgments, fixed hearing agendas, motion responses (LBR 9014-1), removed jury demands, settlements, proposed orders, reconsideration, and the brief page limits."
in_force = "2018-12-10"
known_at = "2026-10-28"
unknown_before = "2018-12-10"
jurisdiction = "U.S. Bankruptcy Court for the Eastern District of Michigan"
counting = "frcp6"

[package.instrument]
source = "mieb-lbr"
issuer = "United States Bankruptcy Court for the Eastern District of Michigan"
date = "2018-12-10"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

