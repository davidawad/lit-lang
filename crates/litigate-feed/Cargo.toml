[package]
name = "litigate-feed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Opinion feed: new CourtListener opinions from modeled courts, or citing a modeled precedent, as beads naming the elements they may edit"

[lib]
name = "litigate_feed"
path = "src/lib.rs"

[[bin]]
name = "litigate-feed"
path = "src/main.rs"

[dependencies]
# The packages' elements: `litigate build` over an in-memory copy of lit/.
litigate-cli = { path = "../litigate-cli" }
clap.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# The CourtListener REST API. Native only: litigate-cli, which the browser
# build links, stays free of network code.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd.workspace = true

[lints]
workspace = true
