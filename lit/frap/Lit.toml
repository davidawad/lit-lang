# The texts the package's dated versions took effect with, from the annual
# editions of 28 U.S.C. App. (sources/PROVENANCE.md): a version citing the
# text it took effect with needs no amendment history. The 2009 edition
# (current through Feb. 1, 2010) prints the FRAP as amended Dec. 1, 2009,
# the package's start; none of its rules was next amended before Dec. 1,
# 2010. The 2002 edition prints FRAP 4 as amended Dec. 1, 2002 (the
# earlier appeal periods' start); the 2017 edition prints FRAP 32 as
# amended Dec. 1, 2016 (the type-volume limits' start).
[sources.frap-2009]
title = "Federal Rules of Appellate Procedure, 28 U.S.C. App. (2009 ed.): Rules 3-5, 8, 11, 27, 28, 28.1, 31, 32, 35, 39-42 as amended through Dec. 1, 2009"
