# The Local Rules of Bankruptcy Procedure of the U.S. Bankruptcy Court for
# the District of Connecticut over lit/frbp (FRBP 9029(a); 28 U.S.C.
# § 2075): it declares only the periods the Local Bankruptcy Rules
# themselves state and re-encodes no FRBP period. It is a base package, not
# a `kind = "local-rule"` layer: lit/core has no bankruptcy forum family
# (L2011 for `bankr-ct`), as for lit/bankr-dc. Each period is counted under
# FRBP 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective March 16, 2026, which supersede the rules effective August 2,
# 2021 (sources/bankr-ct/PROVENANCE.md); no amending order is vendored, so
# the consolidation is the only layer. The earlier edition is not vendored,
# so a query before March 16, 2026 is a hole in the corpus.
[package]
name = "bankr-ct-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-ct-local-rules"
forum = "bankr-ct"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the District of Connecticut: Local Rules of Bankruptcy Procedure"
description = "The Bankr. D. Conn. Local Rules of Bankruptcy Procedure as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): amended creditor lists, joint administration, a debtor's death or incompetency, conversion documents, Rule 2004 agreements, post-confirmation reports, the subchapter V trustee deposit, committee lists, notice to disputed creditors, the § 1111(b) election, chapter 11, 12 and 13 confirmation objections, documents and payment advices for the trustee, public sales, adversary service certificates, foreign-service answers, adversary motion responses, briefs and the initial pretrial order, the Contested Matter Procedure (LBR 9014-1), removal and changes of address."
in_force = "2026-03-16"
known_at = "2026-10-28"
unknown_before = "2026-03-16"
jurisdiction = "U.S. Bankruptcy Court for the District of Connecticut"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.ctb-lbr]
title = "Local Rules of Bankruptcy Procedure of the United States Bankruptcy Court for the District of Connecticut (effective March 16, 2026)"
url = "https://www.ctb.uscourts.gov/sites/ctb/files/Local%20Rules_2026_03_16with%20appdncs.pdf"
path = "sources/bankr-ct/ct-local-rules-2026-03-16-sectioned.txt"
path_sha256 = "da2242972b4d43ccd7786c9b51b7f26ed935e902b3381031130da570bb359926"
sha256 = "f8877ab74b73ae64cff1eb1183116a8d979849d9369cc7d92ef32ea1c46b7b4f"
as_of = "2026-03-16"
cite_prefixes = ["Bankr. D. Conn. LBR"]
section_heading = "LBR {n}"
