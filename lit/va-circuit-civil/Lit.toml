# Civil actions in a Virginia circuit court under the Rules of the Supreme
# Court of Virginia, Parts One, Three and Four (the Court's all-Parts
# compilation as currently effective; the latest amendment it states is
# effective September 15, 2026; sources/va-circuit-civil). Computation of
# time is Code § 1-210, which is not vendored and has no counting rule in
# lit/core, so the rules' periods are stated in notes, not encoded as
# counted deadlines; Rule 1:7 adds days for the mode of service. Code
# sections the outline cited (§§ 8.01-273, 8.01-296) are not vendored and
# are not cited. An appeal hands off to lit/va-appellate-civil.
[package]
name = "va-circuit-court-civil"
version = "0.1.0"
language = 1
pack_id = "va-circuit-court-civil"
forum = "va-circuit-civil"
authority = "StateRule"
jurisdiction_id = "virginia"
title = "Virginia Circuit Court, civil"
description = "Civil actions in a Virginia circuit court under the Rules of the Supreme Court of Virginia, as far as the vendored text states. An appeal hands off to the Virginia appellate package (lit/va-appellate-civil)."
in_force = "2026-09-15"
known_at = "2026-10-27"
unknown_before = "2026-09-15"
jurisdiction = "Virginia Circuit Court (civil)"

[package.roles]
