# The United States District Court for the District of Colorado's Local
# Rules of Practice, Civil (D.C.COLO.LCivR), as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods the
# LCivR rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule, with Colorado's holidays
# closing a forward-counted period (FRCP 6(a)(6)(C); `cod-6`), which also
# counts lit/frcp's periods in a matter in this court (`recounts`). The rules are the Local Rules
# of Practice "Effective December 1, 2025" (cover "Revised 3/4/2026",
# sources/d-colo), the edition the court's local-rules page lists. The
# criminal (LCrR), patent, AP-docket and attorney rules are out of scope.
# An appeal goes to the Tenth Circuit under lit/frap and lit/ca10.
[package]
name = "cod-local-rules"
version = "0.1.0"
language = 1
pack_id = "cod-local-rules"
forum = "cod"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the District of Colorado: Local Rules of Practice (civil)"
description = "The District of Colorado's Local Rules of Practice, Civil, as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): notice of a changed address, motion and summary-judgment responses and replies, supplemental authority, restricted documents, the amended pleading after leave, deposition notice, consent to magistrate judge jurisdiction, subpoena service, the bill of costs, objections to disposal of exhibits, the state court record on removal, disability accommodations, and the bankruptcy withdrawal-of-reference response and objections."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "United States District Court, D. Colo."
counting = "cod-6"
recounts = ["frcp-civil-procedure"]

[package.roles]
