# The U.S. District Court for the District of Puerto Rico's Local
# Criminal Rules (L.Crim.R. 101 to 162) as a local-rule layer over
# lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares only the
# periods and limits the local criminal rules themselves state and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (one source
# of truth: lit/frcrimp). Motion, opposition and reply periods are
# governed by FRCrimP 45 (L.Crim.R. 147(d)), and FRCrimP 45(a) governs
# "any local rule", so each deadline names `forum frcrimp`. The rules are
# the Local Rules with amendments through October 16, 2024 (sources/dpr),
# the edition lit/prd also binds; earlier editions are not vendored, so a
# query before it is a hole in the corpus. An appeal goes to the First
# Circuit under lit/frcrimp's FRAP 4(b) period.
