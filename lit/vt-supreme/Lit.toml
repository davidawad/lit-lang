# A civil appeal from the Vermont Superior Court to the Vermont Supreme
# Court under the Vermont Rules of Appellate Procedure, current with rule
# changes received through March 16, 2026 (sources/vt-supreme).
# Computation of time is V.R.C.P. 6(a) (V.R.A.P. 26(a)), whose legal
# holidays include any day the State of Vermont declares; core has no
# Vermont holiday calendar, so the rules' periods are stated in notes, not
# encoded as counted deadlines. The Supreme Court is Vermont's only
# appellate court; review in the Supreme Court of the United States is not
# modeled. A civil action in the Superior Court is lit/vt-superior-civil.
[package]
name = "vt-supreme-court-civil-appeals"
version = "0.1.0"
language = 1
pack_id = "vt-supreme-court-civil-appeals"
forum = "vt-supreme"
authority = "StateRule"
jurisdiction_id = "vermont"
title = "Vermont Supreme Court, civil appeals"
description = "A civil appeal from the Vermont Superior Court to the Vermont Supreme Court under the Vermont Rules of Appellate Procedure, as far as the vendored text states: notice and timeliness, transcript and record, briefing and its word limits, argument or submission on the briefs, judgment, reargument and mandate."
in_force = "2026-03-16"
known_at = "2026-10-28"
unknown_before = "2026-03-16"
jurisdiction = "Vermont Supreme Court (civil appeals)"

