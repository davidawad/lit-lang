# The U.S. District Court for the Western District of Texas's civil Local
# Court Rules (Rules CV-1 to CV-88) as a local-rule layer over lit/frcp
# (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods and limits
# the civil rules themselves state and re-encodes no FRCP deadline. Each
# period is counted under FRCP 6, which governs a period stated in a local
# rule (FRCP 6(a)); Texas's own holidays (FRCP 6(a)(6)(C)) are not vendored
# and not modeled. The rules are the complete copy the court serves as
# current (cover "Effective: April 26, 2023", civil rules "Effective June
# 24, 2021"; sources/txwd), so in_force is April 26, 2023; earlier
# editions are not vendored, so a query before it is a hole in the corpus.
# The criminal rules are lit/txwd-criminal's; the attorney rules and the
# appendices are not encoded. An appeal goes to the Fifth Circuit under
# lit/frap.
[package]
name = "txwd-local-rules"
version = "0.1.0"
language = 1
pack_id = "txwd-local-rules"
forum = "txwd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Western District of Texas: Local Court Rules (civil)"
description = "The U.S. District Court for the Western District of Texas's civil Local Court Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the civil cover sheet, motion page limits and the response and reply periods, amendment in answer to a first Rule 12(b) motion, the proposed scheduling order, late discovery motions, pretrial disclosures and objections, objections to authenticity, executed interrogatory answers, the bill of costs, the removal of exhibits, and the completion of ADR."
in_force = "2023-04-26"
known_at = "2026-10-28"
unknown_before = "2023-04-26"
jurisdiction = "U.S. District Court for the Western District of Texas (civil)"
counting = "frcp6"

