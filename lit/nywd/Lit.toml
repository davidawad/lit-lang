title = "United States District Court, Western District of New York: Local Rules of Civil Procedure"
description = "The Western District of New York's Local Rules of Civil Procedure as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): unsealed filings after a denied sealing motion, Social Security briefs and EAJA and § 406(b) petitions, motion briefing and page limits, amended pleadings, settlement-conference demands, pretrial statements, privilege logs at depositions, deposition notice and video depositions, dismissal on settlement and for failure to prosecute, costs, objections to magistrate judges' recommendations, and exhibits."
in_force = "2026-01-15"
