# The step a reopened appeal takes (lg-fq2.5; docs/litigate/VALIDATION.md
# §4): filing the notice of appeal within the reopened period of FRAP
# 4(a)(6), so a matter replays the filing against the period the
# validation package declares, in a world before and after an overruling.
# It declares no period of its own.
[package]
name = "change-validation-replay"
version = "1.0.0"
language = 1
pack_id = "change-validation-replay"
forum = "frap"
family = "circuit-appellate"
authority = "FederalRule"
title = "Validation: a notice of appeal in a reopened appeal period"
in_force = "1991-12-01"
known_at = "2026-10-27"

[package.roles]
appellant = "self"
court = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../../../../../lit/core" }
