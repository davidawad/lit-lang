# The Michigan base library (lg-u561.5 pattern): the trigger events the
# Michigan court packages route their graphs on: lit/mi-circuit-court,
# lit/mi-appellate and lit/mi-supreme-court.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "mi-state-rules"
version = "0.1.0"
language = 1
pack_id = "mi-state-rules"
forum = "mi-state-rules"
authority = "StateRule"
jurisdiction_id = "michigan"
title = "Michigan state court rules (base library)"
description = "The rule layer Michigan's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-09-02"
known_at = "2026-10-28"
unknown_before = "2026-09-02"
jurisdiction = "Michigan state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
