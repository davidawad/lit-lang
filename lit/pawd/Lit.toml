# The United States District Court for the Western District of
# Pennsylvania's Local Rules of Court as a local-rule layer over lit/frcp
# (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods the Local
# Civil Rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule. The rules are the edition
# effective November 1, 2016 (sources/pawd); the amendments the court
# proposed in Administrative Order 2026-17 are not in force. An appeal goes
# to the Third Circuit under lit/frap.
[package]
name = "pawd-local-rules"
version = "0.1.0"
language = 1
pack_id = "pawd-local-rules"
forum = "pawd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Western District of Pennsylvania: Local Civil Rules"
description = "The Western District of Pennsylvania's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the late disclosure statement and the RICO case statement, consent to a magistrate judge in prisoner civil rights cases, pretrial statements and their supplementation, the class action joint report, summary judgment opposition and reply, and objections to a magistrate judge's orders and reports."
in_force = "2016-11-01"
known_at = "2026-10-28"
unknown_before = "2016-11-01"
jurisdiction = "United States District Court, W.D. Pa."
counting = "frcp6"

