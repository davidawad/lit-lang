# The United States District Court for the Middle District of Tennessee's
# Local Criminal Rules (LCrR) as a local-rule layer over lit/frcrimp (28
# U.S.C. § 2071; FRCrimP 57(a)): it declares only the periods and limits the
# Local Criminal Rules themselves state and re-encodes no FRCrimP, Speedy
# Trial Act or FRAP 4(b) period. FRCrimP 45(a) computes a period stated in
# a local rule. The rules are the criminal part of the Local Rules of Court
# dated May 15, 2025 (sources/tnmd), the only local-rules edition the court
# publishes. The court may deviate from any local rule when the case needs
# it (LCrR 1.01(a)). An appeal goes to the Sixth Circuit under lit/frap and
# lit/ca6; federal habeas is lit/habeas.
[package]
name = "tnmd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "tnmd-criminal-local-rules"
forum = "tnmd-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Middle District of Tennessee: Local Criminal Rules"
description = "The Middle District of Tennessee's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): responses and replies to pretrial motions requiring a determination of law and their page limits, automatic discovery after arraignment, discovery motions and responses, the earliest sentencing hearing, the probation officer's disclosure after objections, position papers, the § 3553(a) statement and other sentencing filings before the hearing, and motions to produce prisoners."
in_force = "2025-05-15"
known_at = "2026-10-28"
unknown_before = "2025-05-15"
jurisdiction = "United States District Court, M.D. Tenn. (criminal)"
counting = "frcrimp45"

