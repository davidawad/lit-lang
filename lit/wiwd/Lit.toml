# The United States District Court for the Western District of Wisconsin's
# Local Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP
# 83(a)): it declares only the periods the Local Rules themselves state and
# re-encodes no FRCP deadline. FRCP 6(a) computes a period stated in a
# local rule. The rules are the five-rule edition dated 5/2018
# (sources/wiwd), which the court's local-rules page lists as current. An
# appeal goes to the Seventh Circuit under lit/frap.
[package]
name = "wiwd-local-rules"
version = "0.1.0"
language = 1
