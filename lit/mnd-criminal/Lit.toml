# The District of Minnesota's Local Rules, as applied in its criminal
# cases, as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a)): it declares only the periods the Local Rules themselves
# state for a criminal case and re-encodes no FRCrimP, Speedy Trial Act
# or FRAP 4(b) period. The rules apply "in all civil and criminal actions"
# (LR 1.1(c)) and have no separate criminal part; the criminal provisions
# are LR 5.5(b)(2), 12.1, 49.1, 72.2 and 83.10. The text is the complete
# set dated June 10, 2026 (sources/mnd), the edition the court lists as
# current, so the package runs from that date; earlier editions are not
# vendored. lit/mnd declares the civil layer. Habeas (28 U.S.C. §§ 2254,
# 2255) is lit/habeas's; an appeal goes to the Eighth Circuit under FRAP
# 4(b) (lit/frcrimp) and lit/ca8.
