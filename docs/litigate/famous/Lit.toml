# The famous cases (lg-wvlf.3): the periods the ten expect tests
# tests/expect/{arthrex, blue-and-gold, celotex, ebay, hughes, iqbal,
# oil-states, sas, suprema, twombly} count, ported from the tests/cases
# JSON walks. Each period runs from one trigger event of its own, so a
# matter counts only the periods whose triggers it records. Counting is
# lit/core's (FRAP 26, Sup. Ct. R. 30, 19 C.F.R. § 201.14) and lit/mpep's
# 37 C.F.R. § 1.7, by the version in force on each trigger's date. Public
# law and the opinions' own facts only.
[package]
name = "famous-cases"
version = "1.0.0"
language = 1
pack_id = "famous-cases"
forum = "frap"
authority = "FederalRule"
title = "Famous cases: the appeal, rehearing and certiorari periods they count"
in_force = "1968-07-01"
known_at = "2026-10-28"

[package.roles]
applicant = "self"
court = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../../../lit/core" }
# 37 C.F.R. § 1.7 (`uspto-1-7`), the PTAB notice-of-appeal period's counting.
mpep-prosecution = { version = "^0.1.0", path = "../../../lit/mpep" }

