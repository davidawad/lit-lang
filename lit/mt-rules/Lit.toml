# The Montana base library (lg-u561.5): the trigger events the Montana court
# packages route their graphs on: lit/mt-district, lit/mt-supreme and the
# State Tax Appeal Board outline (outlines/ninth-circuit/montana/state-tax-appeal-board).
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "mt-state-rules"
version = "0.1.0"
language = 1
pack_id = "mt-state-rules"
forum = "mt-state-rules"
authority = "StateRule"
jurisdiction_id = "montana"
title = "Montana state court rules (base library)"
description = "The rule layer Montana's court packages share: the trigger events of its rules, and the trigger events their graphs route on. No procedure of its own."
in_force = "2021-10-12"
known_at = "2026-10-28"
unknown_before = "2021-10-12"
jurisdiction = "Montana state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
