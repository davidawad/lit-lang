# The Georgia base library (lg-u561.5): what the Georgia court packages
# share. The Supreme Court of Georgia package (lit/ga-supreme-court) routes
# its graph on this library's trigger events. It declares no period: the
# rules' periods are stated in the court packages' notes. No procedure of
# its own.
[package]
name = "ga-state-rules"
version = "0.1.0"
language = 1
pack_id = "ga-state-rules"
forum = "ga-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "georgia"
title = "Georgia state court rules (base library)"
description = "The rule layer Georgia's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-07-02"
known_at = "2026-10-28"
unknown_before = "2026-07-02"
jurisdiction = "Georgia state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
