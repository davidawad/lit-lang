# The Nevada base library (lg-f3q8.105): what the Nevada court packages
# share. The Nevada Rules of Appellate Procedure (amendments through May
# 21, 2025, sources/nv-supreme) govern both the Supreme Court
# (lit/nv-supreme) and the Court of Appeals (lit/nv-court-of-appeals), so
# their brief and petition limits are declared once here; the court
# packages, lit/nv-district included, also route their graphs on its
# trigger events. No procedure of its own.
[package]
name = "nv-state-rules"
version = "0.1.0"
language = 1
pack_id = "nv-state-rules"
forum = "nv-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "nevada"
title = "Nevada state court rules (base library)"
description = "The rule layer Nevada's court packages share: the brief, rehearing, en banc and review petition limits of NRAP 32(a)(7), 40(g), 40A(f) and 40B(f), and the trigger events their graphs route on. No procedure of its own."
in_force = "2025-05-21"
known_at = "2026-10-28"
unknown_before = "2025-05-21"
jurisdiction = "Nevada state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.nv-nrap]
title = "Nevada Rules of Appellate Procedure, effective July 1, 1973, including amendments through May 21, 2025 (Supreme Court of Nevada)"
url = "https://nvcourts.gov/nevada_court_rules/nevada_appellate_court_rules2/nevada_rules_of_appellate_procedure"
path = "sources/nv-supreme/nrap-sectioned.txt"
path_sha256 = "da5766edaa2c73cdcc84090d1ffb4b9c8ed94bf19d19983a8d5fcc647a0b4ee5"
sha256 = "7fae8b53b741809dbea22d8af492bc8571c51ea4c63280f488713086b358c020"
as_of = "2025-05-21"
cite_prefixes = ["NRAP"]
section_heading = "NRAP {n}"
