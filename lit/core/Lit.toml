courts = ["cal-supreme"]
cite = "Auto Equity Sales, Inc. v. Superior Court, 57 Cal. 2d 450, 455 (1962); Raven v. Deukmejian, 52 Cal. 3d 336, 352 (1990): lower federal decisions on federal law are persuasive, not binding"

