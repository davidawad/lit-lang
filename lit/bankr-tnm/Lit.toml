# The Local Rules of Court of the U.S. Bankruptcy Court for the Middle
# District of Tennessee over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods the rules themselves state and re-encodes no
# FRBP period. Each period is counted under FRBP 9006(a), the FRCP 6(a)
# method (core's frcp6). The rules are those amended and restated as of
# July 28, 2025, the only vendored text (sources/bankr-tnm/PROVENANCE.md),
# so the consolidation is the only layer; the court's administrative orders
# were not read for rule amendments and the LBR 9013-1 Motion Practice
# Procedures are not vendored, so the motion notice periods are holes
# (local-rules.lit). The earlier editions are not vendored, so a query
# before July 28, 2025 is a hole in the corpus.
[package]
name = "bankr-tnm-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-tnm-local-rules"
forum = "bankr-tnm"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Middle District of Tennessee: Local Rules of Court"
description = "The Bankr. M.D. Tenn. Local Rules of Court (amended and restated as of July 28, 2025) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): schedules after conversion to chapter 7, notice to added creditors, nonappearance dismissals, rescheduled meetings, prisoner production, complex chapter 11 elections, omnibus hearing objections and monthly fee statements, secured creditor lien information, chapter 13 confirmation objections, agreed stay orders, the involuntary debtor's responsible person, vehicle repossession for lapsed insurance, no asset abandonment, summary judgment replies, contested matter responses and disclosures (LBR 9014-1), and exhibit withdrawal."
in_force = "2025-07-28"
known_at = "2026-10-28"
unknown_before = "2025-07-28"
jurisdiction = "U.S. Bankruptcy Court for the Middle District of Tennessee"
counting = "frcp6"

[package.instrument]
source = "tnmb-lbr"
issuer = "United States Bankruptcy Court for the Middle District of Tennessee"
date = "2025-07-28"
designation = "Local Rules of Court"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

