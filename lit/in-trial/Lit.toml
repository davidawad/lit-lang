# Civil actions in the Indiana trial courts (circuit and superior) under the
# Indiana Rules of Trial Procedure, as far as the vendored text states: the
# rules as updated effective August 1, 2026 (sources/in-trial). Time is
# computed under Trial Rule 6(A), which, unlike FRCP 6(a), rolls a last day
# falling on a legal holiday as defined by Indiana statute or a day the
# office is closed, and excludes intermediate Saturdays, Sundays, legal
# holidays and closed days from a period of less than seven days; lit/core
# has no counting rule for it, so the periods are stated in notes, not
# encoded as counted deadlines. The notice of appeal is governed by the
# Indiana Rules of Appellate Procedure (sources/indctapp), encoded in
# lit/indctapp.
[package]
name = "in-trial-court-civil"
version = "0.1.0"
language = 1
pack_id = "in-trial-court-civil"
forum = "in-trial"
authority = "StateRule"
jurisdiction_id = "indiana"
title = "Indiana trial courts (circuit, superior), civil"
description = "Civil actions in the Indiana circuit and superior courts under the Indiana Rules of Trial Procedure, as far as the vendored text states: commencement, the time to respond and its automatic enlargement, Rule 12 motions and amendment, default and default judgment, the jury demand, pre-trial conferences, discovery and its sanctions, summary judgment and its timing, dismissal for failure to prosecute, offers of judgment, entry of judgment, the motion to correct error and its deemed denial, relief from judgment, and the notice of appeal under the Indiana Rules of Appellate Procedure (lit/indctapp)."
in_force = "2026-08-01"
known_at = "2026-10-28"
unknown_before = "2026-08-01"
jurisdiction = "Indiana trial courts (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

