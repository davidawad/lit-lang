title = "U.S. District Court for the Eastern District of Texas: Local Criminal Rules"
description = "The U.S. District Court for the Eastern District of Texas's local criminal rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the motion response, reply and sur-reply periods and page limits, transcript redaction, the removal of exhibits, and objections to magistrate judge rulings."
in_force = "2026-02-09"
known_at = "2026-10-28"
unknown_before = "2026-02-09"
