# The Local Rules of the U.S. Bankruptcy Court for the District of
# Minnesota over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only
# the periods the rules and the court's en banc order supplementing them
# state and re-encodes no FRBP period. It is a base package, not a `kind =
# "local-rule"` layer: lit/core has no bankruptcy forum family (L2011 for
# `bankr-mn`), as for lit/bankr-dc. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6).
#
# Layers, in date order: the Local Rules effective September 3, 2025 (the
# consolidation), then the Amended En Banc Order on Required Review of
# Claims by Attorney for Debtor (dated February 11, 2026), which supplements
# LR 1007-3-1. Its paragraph (a), the debtor's attorney's review of the
# claims register not later than 21 days after the non-governmental claims
# bar date, "continues to be in effect for any claim filed on or after
# August 1, 2025" (the date of the original July 18, 2025 order, not
# vendored), so that period is a dated version from August 1, 2025, known
# February 11, 2026; its paragraph (b), the revised Notice of
# Responsibilities form for cases commenced on or after February 23, 2026,
# is a form and states no period. No earlier edition of the rules is
# vendored, so a query before September 3, 2025 is a hole in the corpus
# for every other period.
[package]
name = "bankr-mn-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-mn-local-rules"
forum = "bankr-mn"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the District of Minnesota: Local Rules"
description = "The Bankr. D. Minn. Local Rules and the en banc order supplementing LR 1007-3-1 as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): health care business supplemental lists, continued meetings of creditors, the United States trustee's employment report, adversary compensation disclosures, Rule 2019 statements before solicitation, chapter 11 and subchapter V claims deadlines, chapter 7 certifications, withdrawal of the reference, trustee motions on assets not abandoned at closing, summary judgment timing (LR 7056-1), motion practice timing (LR 9006-1), exhibit removal and the debtor's attorney's claims review."
in_force = "2025-09-03"
known_at = "2026-10-28"
unknown_before = "2025-09-03"
jurisdiction = "U.S. Bankruptcy Court for the District of Minnesota"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.mnb-lbr]
title = "Local Rules of the United States Bankruptcy Court for the District of Minnesota (effective September 3, 2025)"
url = "https://www.mnb.uscourts.gov/sites/mnb/files/MNB%20Local%20Rules%20Complete.pdf"
path = "sources/bankr-mn/mnb-lbr-2025-09-03-sectioned.txt"
path_sha256 = "1603cdec27b6a6ea932debe1af7bd9c4c3c61440bfda275eecae52d2565065de"
sha256 = "cd5a2f0e5e8c1f339883a59aaf16a1ca466c978bd03e3d77c9eaaab0fc1052a7"
as_of = "2025-09-03"
cite_prefixes = ["D. Minn. Bankr. LR"]
section_heading = "Rule {n}"

[sources.mnb-en-banc-claims-review]
title = "Amended En Banc Order, In re: Required Review of Claims by Attorney for Debtor (February 11, 2026; supplements LR 1007-3-1)"
url = "https://www.mnb.uscourts.gov/sites/mnb/files/En%20banc%20order%20re%20claims%20review%20-%202.11.26.pdf"
path = "sources/bankr-mn/mnb-en-banc-order-claims-review-2026-02-11-sectioned.txt"
path_sha256 = "25946c9a75cd128ec52eb701308d93f9de0ff8d12f4f2cfecf8cfc674ba32870"
sha256 = "612726c95e5097b0929ea0268fb70cb72f6e8137cb2fa784cc363ee35cf89574"
# Dated February 11, 2026; its paragraph (a), the only text cited, is by
# its own paragraph (c) in effect for claims filed on or after August 1,
# 2025, so that is the date the cited text is in force from.
as_of = "2025-08-01"
cite_prefixes = ["D. Minn. Bankr. (Amended En Banc Order, Feb. 11, 2026) LR"]
section_heading = "En Banc Order LR {n}"
