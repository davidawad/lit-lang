forum = "nj-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "new-jersey"
title = "Superior Court of New Jersey, Law Division, criminal"
description = "Criminal cases in the Superior Court of New Jersey under Part III of the Rules of Court, as far as the vendored text states: the structure of the case from complaint-warrant or complaint-summons and first appearance through pretrial release or detention, the probable-cause hearing, indictment or accusation, arraignment, pretrial motions, plea or trial, post-verdict motions, sentence and judgment, and post-conviction relief; no period from the currency-unconfirmed rules is stated. An appeal goes to the Appellate Division (R. 2:2-3); its period (R. 2:4-1) is not vendored."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Superior Court of New Jersey, Law Division (criminal)"

