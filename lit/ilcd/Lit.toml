# The Local Rules of the United States District Court for the Central
# District of Illinois (civil rules) as a local-rule layer over lit/frcp
# (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods and limits
# the local rules themselves state and re-encodes no FRCP deadline. Each
# period is counted under FRCP 6(a), which governs "any local rule". The
# rules are those effective September 3, 2026 (sources/ilcd). An appeal
# goes to the Seventh Circuit under lit/frap.
[package]
name = "ilcd-local-rules"
version = "0.1.0"
language = 1
pack_id = "ilcd-local-rules"
forum = "ilcd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "C.D. Illinois: Local Rules (civil)"
description = "The civil Local Rules of the Central District of Illinois as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): waiver-of-service proof, notice of changed contact information, transcript redaction, motion responses and replies, summary judgment briefing, habeas and post-conviction documents, authenticity objections, trial briefs and the final pretrial order, prisoner and detainee case answers, motions and pretrial filings, mediation notices and submissions, objections to assignment, attorney's fees and bills of costs, appeals from magistrate judges, and removal of exhibits."
in_force = "2026-09-03"
known_at = "2026-10-28"
unknown_before = "2026-09-03"
jurisdiction = "United States District Court, C.D. Illinois"
# FRCP 6(a)(6)(C): the holidays of Illinois close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-illinois`).
counting = "frcp6-illinois"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "ilcd-lr"
issuer = "United States District Court for the Central District of Illinois"
date = "2026-09-03"
designation = "Local Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.ilcd-lr]
title = "Local Rules, United States District Court, Central District of Illinois (effective September 3, 2026)"
url = "https://www.ilcd.uscourts.gov/sites/ilcd/files/September%202026%20Version%20.pdf"
path = "sources/ilcd/ilcd-local-rules-sectioned.txt"
path_sha256 = "2bdc7aa2fdba1320384af050e6ad4d271a1f466233eaa62537a912b68cfb7b26"
sha256 = "d7135a3d60e8a2cbfa16f5fe513007602626de34340b0a07815cb3a70d2a8c30"
as_of = "2026-09-03"
cite_prefixes = ["C.D. Ill. Civ. L.R."]
section_heading = "Rule {n}"
