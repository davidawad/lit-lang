# Civil actions in a South Carolina circuit court (the court of common
# pleas) under the South Carolina Rules of Civil Procedure, as the rule
# pages on sccourts.org served them on 2026-10-28 (sources/sc-circuit-civil);
# the latest amendment they state is the Supreme Court's order of April 30,
# 2026, effective that day (Rules 50, 52, 53, 54, 59; the order is vendored
# beside the pages and its text is already on them). Rule 6(a) computes
# time and excludes intermediate weekends and holidays from periods under
# seven days; no lit/core counting rule encodes it, so the rules' periods
# are stated in notes, not counted deadlines. An appeal hands off to
# lit/sc-court-of-appeals.
[package]
name = "sc-circuit-court-civil"
version = "0.1.0"
language = 1
pack_id = "sc-circuit-court-civil"
forum = "sc-circuit-civil"
authority = "StateRule"
jurisdiction_id = "south-carolina"
title = "South Carolina Circuit Court, civil"
description = "Civil actions in a South Carolina circuit court under the South Carolina Rules of Civil Procedure, as far as the vendored text states. An appeal hands off to the South Carolina appellate package (lit/sc-court-of-appeals)."
in_force = "2026-04-30"
known_at = "2026-10-28"
unknown_before = "2026-04-30"
jurisdiction = "South Carolina Circuit Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: its trigger events (lg-u561.5).
sc-state-rules = { version = "^0.1.0", path = "../sc-rules" }

[sources.scrcp]
