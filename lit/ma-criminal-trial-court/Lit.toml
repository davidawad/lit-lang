# Criminal cases in the Massachusetts trial courts of general criminal
# jurisdiction (the Superior Court and the District Court) under the
# Massachusetts Rules of Criminal Procedure (Mass. R. Crim. P.),
# including amendments effective November 1, 2025
# (sources/ma-criminal-trial-court/). Computation of time is Mass. R.
# Crim. P. 46(a): intermediate Saturdays, Sundays and legal holidays are
# excluded from periods under 7 days, and core has no Massachusetts
# counting rule or holiday calendar, so the rules' periods (Rule 36's
# speedy-trial limit included) are stated in notes, not encoded as
# counted deadlines. The criminal appeal goes to the Appeals Court under
# Mass. R. A. P. 4(b), whose text includes amendments effective September
# 1, 2026 (sources/ma-appeals-sjc/); in_force is that later date, since
# the earlier appellate text is not vendored. The General Laws (c. 276
# bail and detention, c. 278 and c. 263) are not vendored; those cites
# stay holes.
[package]
name = "ma-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "ma-criminal-trial-court"
forum = "ma-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "massachusetts"
title = "Massachusetts Superior and District Courts, criminal"
description = "Criminal cases in the Massachusetts Superior and District Courts under the Massachusetts Rules of Criminal Procedure, as far as the vendored text states: the 24-hour probable-cause determination, arraignment and counsel, indictment or complaint, the pretrial conference and hearing, automatic discovery, pretrial motions, the Rule 36 speedy-trial limits and dismissal, plea or trial, required finding of not guilty, new trial, sentencing and judgment. An appeal goes to the Appeals Court within 30 days under Mass. R. A. P. 4(b)."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "Massachusetts Superior and District Courts (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

