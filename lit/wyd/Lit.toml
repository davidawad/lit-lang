# The District of Wyoming's Local Civil Rules as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a); U.S.D.C.L.R. 1.2: the rules
# "may be modified in accordance with Fed. R. Civ. P. 83"): it declares
# only the periods and limits the civil rules themselves state and
# re-encodes no FRCP deadline. Each period is computed "in accordance with
# the applicable Federal Rules of Civil Procedure" (U.S.D.C.L.R. 6.1(a)),
# that is FRCP 6(a). The rules are the edition "January 2022"
# (sources/d-wyo), listed as current on the court's local-rules page when
# retrieved on 2026-10-27. The edition states a month but no effective
# day, so the package binds it as in force on the retrieval date; earlier
# editions are not vendored, so a query before that date is a hole in the
# corpus. The criminal rules (forum
# wyd-criminal) and bankruptcy matters (U.S.D.C.L.R. 85; lit/bankr-wy)
# are not encoded. An appeal goes to the Tenth Circuit under lit/frap.
[package]
name = "wyd-local-rules"
version = "0.1.0"
language = 1
pack_id = "wyd-local-rules"
forum = "wyd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, District of Wyoming: Local Civil Rules"
description = "The District of Wyoming's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): return of service, motion briefing and its page limits, amended pleadings, the discovery plan, deposition notice, dismissal of settled and inactive cases, costs and attorney's fees, magistrate-judge consent and reconsideration, and the state court record on removal."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "United States District Court, D. Wyoming"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "wyd-lr"
issuer = "United States District Court for the District of Wyoming"
date = "2026-10-27"
designation = "Local Civil Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.wyd-lr]
title = "Local Rules of the United States District Court for the District of Wyoming, Civil (January 2022)"
url = "https://www.wyd.uscourts.gov/sites/wyd/files/local_rules/2022%20Civil%20Local%20Rules%20-%20FINAL.pdf"
