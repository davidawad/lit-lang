# The Local Rules of the U.S. Bankruptcy Court for the Northern District of
# West Virginia over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods and the page limit the Local Rules themselves
# state and re-encodes no FRBP period. It is a base package, not a `kind =
# "local-rule"` layer: lit/core has no bankruptcy forum family (L2011 for
# `bankr-wvn`), as for lit/bankr-md. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective October 1, 2019, in the court's file updated for General Order
# 20-06, which rescinded LBR 7016-1; the order itself is not vendored, so
# it is not a dated layer here and LBR 7016-1 is not encoded. No later
# general order amends the rules (sources/bankr-wvn/PROVENANCE.md). The
# earlier editions are not vendored, so a query before October 1, 2019 is
# a hole in the corpus.
[package]
name = "bankr-wvn-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-wvn-local-rules"
forum = "bankr-wvn"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Northern District of West Virginia: Local Rules"
description = "The Bankr. N.D.W. Va. Local Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): discharge-objection extensions for added creditors, venue objections, meeting-location requests, meeting appearance and continuance requests, § 362(c)(3) stay extensions, proposed orders, transcript redaction, reports of sale, adversary motion responses and replies (LBR 7007-1), the 25-page limit, motion responses (LBR 9013-1) and hearing objections."
in_force = "2019-10-01"
known_at = "2026-10-28"
unknown_before = "2019-10-01"
jurisdiction = "U.S. Bankruptcy Court for the Northern District of West Virginia"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.wvnb-lr]
title = "Local Rules of the United States Bankruptcy Court for the Northern District of West Virginia (effective October 1, 2019; updated for General Order 20-06)"
url = "https://www.wvnb.uscourts.gov/sites/wvnb/files/local_rules/Local%20Bankurptcy%20Rules%2018-mp-2%20-%20update%20RE%20GO%2020-6%20and%20LBR%207016.pdf"
path = "sources/bankr-wvn/wvn-local-rules-2019-10-01-sectioned.txt"
path_sha256 = "9f8dd0c8ed05ecdc9968fa80acb8fa10712448dc3e91830b45d18ee943445ce0"
sha256 = "9f5bbe4cd1002f56c7271fd1cabfdddd2dcb41451e54082dba86e96c2cca0102"
as_of = "2019-10-01"
cite_prefixes = ["N.D.W. Va. LBR"]
section_heading = "Rule {n}"
