# The Local Rules of the United States District Courts for the Eastern
# and Western Districts of Arkansas, as applied in the Eastern District's
# criminal cases, as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods the Local Rules
# themselves state for a criminal case and re-encodes no FRCrimP,
# Speedy Trial Act or FRAP 4(b) period. The rules are one joint text for
# both districts and both kinds of case (sources/ared, the "Complete Copy"
# last modified 2020-11-17; its newest amendment note is L.R. 5.1's,
# November 5, 2020), so the package runs from that date; lit/arwd-criminal
# declares the same rules for the Western District and lit/ared the civil
# layer. The rules have no separate criminal part: L.R. 72.1, parts I-VI,
# assign criminal matters to magistrate judges and state no period. Habeas
# (28 U.S.C. §§ 2254, 2255) is lit/habeas's; an appeal goes to the Eighth
# Circuit under FRAP 4(b) (lit/frcrimp) and lit/ca8.
