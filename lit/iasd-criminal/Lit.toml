forum = "iasd-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Southern District of Iowa: Local Criminal Rules"
description = "The Southern District of Iowa's Local Criminal Rules (the joint N.D. and S.D. Iowa rules of December 7, 2020) as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the motion to revoke or amend a release or detention order, the written waiver of appearance at arraignment, the non-trial and trial-related motion deadlines, delivery of subpoenas and writs to the Marshal, additional peremptory challenges, resistances to motions, and responses to objections to a magistrate judge's ruling."
in_force = "2020-12-07"
