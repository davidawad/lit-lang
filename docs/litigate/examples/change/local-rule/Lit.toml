# Change example (docs/litigate/CHANGE.md §4): a local rule. S.D.N.Y. and
# E.D.N.Y. Joint Local Civil Rule 6.1(a) (effective January 2, 2026) fixes
# the time to serve opposing papers on a discovery motion, a period the FRCP
# leaves open, counted under FRCP 6, "unless provided otherwise ... by the
# court in a judge's individual practices or in a direction in a particular
# case": it delegates the period to a standing order and to a case order.
