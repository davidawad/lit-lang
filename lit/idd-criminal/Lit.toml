# The U.S. District Court for the District of Idaho's Local Rules of
# Criminal Practice (Dist. Idaho Loc. Crim. R.) as a local-rule layer over
# lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares only the
# periods and limits the local criminal rules themselves state and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (one source
# of truth: lit/frcrimp). Each period is counted under FRCrimP 45(a),
# which governs "any local rule", so each deadline names `forum frcrimp`.
# The rules are the court's complete Criminal Local Rules packet (printed
# October 27, 2026), whose announcement page reads "Revised and adopted
# August 17, 2026" (sources/fed-didaho); earlier editions are not
# vendored, so a query before that date is a hole in the corpus. The
# general provisions of the Local Rules of Civil Practice apply where not
# in conflict (Loc. Crim. R. 1.1(f)) and live in lit/idd. An appeal goes
# to the Ninth Circuit under lit/frcrimp's FRAP 4(b) period.
[package]
name = "idd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "idd-criminal-local-rules"
forum = "idd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Idaho: Local Criminal Rules"
description = "The District of Idaho's Local Rules of Criminal Practice as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the transcript and briefs on an appeal from a magistrate judge's conviction, and the page limits and response period for objections to a magistrate judge's order or report and recommendation."
in_force = "2026-08-17"
known_at = "2026-10-28"
unknown_before = "2026-08-17"
jurisdiction = "U.S. District Court for the District of Idaho (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
