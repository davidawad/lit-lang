# The U.S. District Court for the Western District of Wisconsin's local
# rules in criminal cases as a local-rule layer over lit/frcrimp (28
# U.S.C. § 2071; FRCrimP 57(a)). The court serves five Local Rules (dated
# 5/2018; sources/wiwd) and no local criminal rules: its current
# local-rules PDF, re-read on 2026-10-28, and its local-rules page list
# nothing else. None of the five states a period for a criminal case, so
# this layer declares no deadline: every FRCrimP, Speedy Trial Act and
# FRAP 4(b) period is lit/frcrimp's (one source of truth), and the
# package records which of the court's rules reach a criminal case. The
# court's Speedy Trial Act plan (18 U.S.C. § 3165), its Administrative
# Procedures for Electronic Filing and Service and any standing criminal
# orders are not vendored. in_force is the edition's date (5/2018, read as
# May 1, 2018); earlier editions are not vendored. An appeal goes to the
# Seventh Circuit under lit/frcrimp's FRAP 4(b) period and lit/ca7.
