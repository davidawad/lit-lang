# The Oregon Tax Court and the direct appeal of its decisions to the
# Oregon Supreme Court. The Tax Court Rules (TCR) and the Tax Court
# statutes (ORS chapter 305, including ORS 305.280, 305.501, 305.560 and
# 305.445) are not vendored, so the appeal to the Tax Court, its filing
# period, the Magistrate and Regular Divisions and the trial-level
# procedure stay holes. The direct appeal to the Supreme Court is taken
# under the Oregon Rules of Appellate Procedure (ORAP 12.05(2): ORAP
# chapters 2 and 3; sources/or-court-of-appeals): the notice of appeal,
# summary determination of appealability, the briefs and their word limits
# (lit/or-rules), the decision and the appellate judgment. Time is
# computed under ORAP 1.25, whose legal holidays are those of ORS 187.010
# and 187.020; lit/core has no counting rule for them, so every period is
# stated in a note, not encoded as a counted deadline.
[package]
name = "or-tax-court"
version = "0.1.0"
language = 1
pack_id = "or-tax-court"
forum = "or-tax-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "oregon"
title = "Oregon Tax Court, and direct appeal to the Supreme Court"
description = "Appeals in the Oregon Tax Court, whose rules and statutes are not vendored and stay holes, and the direct appeal of a Tax Court judgment to the Oregon Supreme Court under ORAP 12.05: the notice of appeal and its contents, summary determination of appealability and its 14-day review, the briefs with their ORAP 5.80 times and ORAP 5.05 word limits or a special briefing schedule, the decision, reconsideration within 14 days, and the appellate judgment withheld 28 days and effective when sent to the Tax Court."
in_force = "2026-10-16"
known_at = "2026-10-28"
unknown_before = "2026-10-16"
jurisdiction = "Oregon Tax Court"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the Supreme Court brief limits and trigger events.
or-state-rules = { version = "^0.1.0", path = "../or-rules" }

