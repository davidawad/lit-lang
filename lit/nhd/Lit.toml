# The United States District Court for the District of New Hampshire's
# Local Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP
# 83(a)): it declares only the periods and limits the Local Rules
# themselves state and re-encodes no FRCP deadline. LR 6.1 computes every
# period under FRCP 6(a), and FRCP 6(d) only for a period that runs from
# service. The rules are the Local Rules as amended through December 1,
# 2025 (sources/dnh). The Local Criminal Rules are out of scope. An appeal
# goes to the First Circuit under lit/frap.
[package]
name = "nhd-local-rules"
version = "0.1.0"
language = 1
pack_id = "nhd-local-rules"
forum = "nhd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the District of New Hampshire: Local Rules (civil)"
description = "The District of New Hampshire's Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): objection, reply and surreply periods with the memorandum page limits, disclosure statements in removed actions, scheduling-conflict extensions, motions to strike and for reconsideration, pseudonym litigants, final pretrial statements and deposition designations, compliance with discovery orders, settlement papers, in forma pauperis witness motions, bills of costs, responses to objections to a magistrate judge's order, and the state court record in removed actions."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "United States District Court, D.N.H."
counting = "frcp6"

