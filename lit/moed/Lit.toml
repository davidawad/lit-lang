# The Eastern District of Missouri's Local Rules (civil) as a local-rule
# layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the
# periods and limits the Local Rules themselves state and re-encodes no
# FRCP deadline. Each period is counted under FRCP 6(a), which governs
# "any local rule". The cover states no edition date; the document's own
# revision table lists its latest revisions as effective December 15,
# 2025 (L.R. 2.09, 3.01, 6.03, 12.01 and the Patent Rules; sources/moed),
# so the package runs from that date and a query before it is a hole in
# the corpus. The criminal provisions are lit/moed-criminal's; the Local
# Patent Rules are not encoded. An appeal goes to the Eighth Circuit
# under lit/frap and lit/ca8.
[package]
name = "moed-local-rules"
version = "0.1.0"
language = 1
pack_id = "moed-local-rules"
forum = "moed"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Eastern District of Missouri: Local Rules (civil)"
description = "The Eastern District of Missouri's civil Local Rules (revisions effective December 15, 2025) as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the supplemental disclosure statement, self-represented litigants' subpoena and writ requests, motion oppositions, replies and the page limit, the summary judgment opposition, ADR disclosures and memoranda, exhibit removal, attorney's fee motions, bills of costs and objections, bankruptcy appeal motions, Social Security briefing, condemnation title filings, admiralty sale objections and confirmation, and the sealing opposition, reply and stay of a denial."
in_force = "2025-12-15"
known_at = "2026-10-28"
unknown_before = "2025-12-15"
jurisdiction = "United States District Court, E.D. Missouri"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "moed-lr"
issuer = "United States District Court for the Eastern District of Missouri"
date = "2025-12-15"
designation = "Local Rules (revisions effective December 15, 2025)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.moed-lr]
