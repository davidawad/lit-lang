path = "sources/usc-additional.txt"
# 28 U.S.C. § 1295(a)(4)(A) is the Federal Circuit jurisdiction § 319
# appeals invoke; the pack has no 28 U.S.C. source of its own, and the
# section is vendored in this same file.
cite_prefixes = ["28 U.S.C."]
section_heading = "28 U.S.C. § {n}"

