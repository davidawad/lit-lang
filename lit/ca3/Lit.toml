# The United States Court of Appeals for the Third Circuit as a local-rule
# layer over lit/frap (FRAP 47(a)): it declares only the periods the
# circuit's own vendored text states and re-encodes no FRAP period. The
# bound texts are the Internal Operating Procedures (effective January 6,
# 2023) and the July 1, 2023 amendment of L.A.R. 26.1. The consolidated
# Local Appellate Rules of August 1, 2011 (sources/ca3/lar-2011-08-01.txt)
# are CURRENCY UNCONFIRMED (sources/ca3/PROVENANCE.md): no value or cite is
# taken from them until a current edition is vendored.
[package]
name = "third-circuit-court-of-appeals"
version = "0.1.0"
language = 1
pack_id = "third-circuit-court-of-appeals"
forum = "ca3"
family = "circuit-appellate"
authority = "LocalRule"
kind = "local-rule"
title = "United States Court of Appeals for the Third Circuit"
description = "A civil appeal in the Third Circuit: its Internal Operating Procedures and the 2023 L.A.R. 26.1 filing-time rule over the FRAP periods of lit/frap; the answer to a petition for panel rehearing or rehearing en banc."
jurisdiction = "United States Court of Appeals for the Third Circuit"
in_force = "2024-12-01"
known_at = "2026-10-28"
unknown_before = "2024-12-01"
counting = "frap26"

[package.instrument]
source = "ca3-iops"
issuer = "United States Court of Appeals for the Third Circuit"
date = "2023-01-06"
designation = "Internal Operating Procedures (effective January 6, 2023)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frap-appellate-procedure = { version = "^0.1.0", path = "../frap" }

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

