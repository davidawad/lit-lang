# A civil action in a Mississippi chancery court under the Mississippi
# Rules of Civil Procedure, which govern procedure in the chancery courts
# as in the circuit and county courts (M.R.C.P. 1; the courts.ms.gov file
# dated 2026-07-01, amendments in the text through September 10, 2025;
# sources/ms-circuit-court). Two tracks are modeled: an ordinary action
# answered under M.R.C.P. 12, and the actions and matters M.R.C.P. 4(i)
# enumerates (domestic relations, adoption, heirship, estates and the
# like), which are set by a returnable summons, require no answer and are
# never taken as confessed. Chancery jurisdiction rests on the
# Constitution and statute, and the Uniform Chancery Court Rules are not
# vendored: which matters belong in chancery, whether a jury may be had,
# and the chancery courts' local practice are not stated. Computation of
# time is M.R.C.P. 6(a), which counts by Mississippi legal holidays and
# days the courthouse or clerk's office is closed; lit/core has no
# Mississippi counting rule, so periods are stated in notes, not counted.
# Appeals go to lit/ms-appellate.
[package]
name = "ms-chancery-courts-civil"
version = "0.1.0"
language = 1
pack_id = "ms-chancery-courts-civil"
forum = "ms-chancery-courts"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "mississippi"
title = "Mississippi chancery courts, civil"
description = "A civil action in a Mississippi chancery court under the Mississippi Rules of Civil Procedure, as far as the vendored text states: commencement, service and its 120-day limit, the answer and Rule 12 motions, default, the Rule 4(i) actions triable 7 or 30 days after service on a returnable summons without an answer or default, discovery, summary judgment, trial by the court with findings under Rule 52, post-trial motions, judgment, dismissal, and the notice of appeal under M.R.A.P. 4."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "Mississippi chancery courts (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

