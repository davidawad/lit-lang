# The United States District Court for the Eastern District of Kentucky's
# Joint Local Rules of Civil Practice (shared with the Western District) as
# a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods and limits the Joint Local Civil Rules
# themselves state and re-encodes no FRCP deadline. FRCP 6(a) computes a
# period stated in a local rule; LR 6.1 and 6.2 fix only the last day's end
# (midnight Eastern time) and the roll of a date certain. The rules are the
# edition the court serves as "KY_Amended_Civil_Rules_August_2026"
# (sources/kyed); the document states no effective date (LR 86.1:
# amendments take effect on each Joint General Order, none vendored), so
# this layer speaks from the date it was taken, October 27, 2026. An appeal
# goes to the Sixth Circuit under lit/frap and lit/ca6.
[package]
name = "kyed-local-rules"
version = "0.1.0"
language = 1
pack_id = "kyed-local-rules"
forum = "kyed"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Eastern District of Kentucky: Joint Local Rules of Civil Practice"
description = "The Eastern District of Kentucky's Joint Local Rules of Civil Practice as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the response to a motion for an extension of time, motion responses and replies and their page limits, the supplemental state court record and refiled state court motions after removal, marshal-served subpoenas, the bill of costs, the motion for attorney's fees, objections to a magistrate judge's non-dispositive order, Social Security fee petitions and responses, and the cutoff for an attorney's withdrawal before trial or a dispositive hearing."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "United States District Court, E.D. Ky."
# FRCP 6(a)(6)(C): the holidays of Kentucky close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-kentucky`).
counting = "frcp6-kentucky"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "kyed-lr"
issuer = "United States District Court for the Eastern District of Kentucky"
date = "2026-10-27"
designation = "Joint Local Rules of Civil Practice (KY_Amended_Civil_Rules_August_2026)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRCP periods; this package layers only the court's local civil rules over them.
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.kyed-lr]
title = "Joint Local Rules of Civil Practice, United States District Courts for the Eastern and Western Districts of Kentucky (KY_Amended_Civil_Rules_August_2026)"
url = "https://www.kyed.uscourts.gov/sites/kyed/files/KY_Amended_Civil_Rules_August_2026.pdf"
path = "sources/kyed/kyed-joint-local-civil-rules-sectioned.txt"
path_sha256 = "57d7a49d9a6bc2a6538632417ed1d42b36ccd97bca95654c1752bc5bf967b91a"
sha256 = "f7942d10800716fe5cc62401a47f6ef71d8db68cbc5516a504df2263597d1086"
as_of = "2026-10-27"
cite_prefixes = ["E.D. Ky. LR"]
section_heading = "LR {n}"
