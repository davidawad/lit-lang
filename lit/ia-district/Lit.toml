# Civil actions in the Iowa district court under the Iowa Rules of Civil
# Procedure (Iowa Court Rules, chapter 1, running header July 2023, in the
# Iowa Legislature's compilation of September 30, 2026; sources/ia-district).
# Time is computed under Iowa Code section 4.1(34) (Iowa R. Civ. P.
# 1.1801), which is not vendored, and core has no Iowa holiday calendar,
# so the rules' periods are stated in notes, not encoded as counted
# deadlines. A notice of appeal hands off to
# lit/iowactapp (Iowa Rules of Appellate Procedure, chapter 6).
[package]
name = "ia-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "ia-district-court-civil"
forum = "ia-district"
authority = "StateRule"
jurisdiction_id = "iowa"
title = "Iowa District Court, civil"
description = "Civil actions in the Iowa district court under the Iowa Rules of Civil Procedure, as far as the vendored text states: commencement and service of the original notice, the time to move or answer, pre-answer motions and motion practice, default and the notice of intent, discovery and scheduling, jury demand, summary judgment, voluntary dismissal and dismissal for want of prosecution, findings and post-trial motions, and the notice of appeal (lit/iowactapp)."
in_force = "2026-09-30"
known_at = "2026-10-28"
unknown_before = "2026-09-30"
jurisdiction = "Iowa District Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

