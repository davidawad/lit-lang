# The U.S. District Court for the Western District of New York's Local
# Rules of Criminal Procedure (cited "Loc. R. Crim. P.") as a local-rule
# layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a); Loc. R. Crim.
# P. 1(a): they "supplement the Federal Rules of Criminal Procedure"): it
# declares only the periods and limits the criminal rules themselves state
# and re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (one
# source of truth: lit/frcrimp). Each period is counted under FRCrimP
# 45(a), which governs "any local rule", so each deadline names `forum
# frcrimp`. The rules are the edition effective January 1, 2025, with the
# clerical corrections of order 26-4-7 (sources/wdny); the rules apply to
# actions commenced on or after January 1, 2025, so in_force is that date;
# earlier editions are not vendored, so a query before it is a hole in the
# corpus. The scheduling order the court issues at arraignment (Loc. R.
# Crim. P. 12(a)) and the Revised Plan for Prompt Disposition of Criminal
# Cases are not vendored. An appeal goes to the Second Circuit under
# lit/frcrimp's FRAP 4(b) period and lit/ca2.
