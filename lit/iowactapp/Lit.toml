# A civil appeal from the Iowa district court to the Supreme Court of
# Iowa, decided there or on transfer by the Iowa Court of Appeals, under
# the Iowa Rules of Appellate Procedure (Iowa Court Rules, chapter 6,
# running header December 2025, in the Iowa Legislature's compilation of
# September 30, 2026; sources/iowactapp). Time is computed under Iowa Code
# section 4.1(34), which is not vendored, and core has no Iowa holiday
# calendar, so the rules' periods are stated in notes, not encoded as
# counted deadlines. Chapter 232 child welfare appeals, interlocutory and
# discretionary review, certiorari and certified questions are not
# modeled. A civil action in the district court is lit/ia-district.
[package]
name = "ia-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "ia-appellate-civil"
forum = "iowactapp"
authority = "StateRule"
jurisdiction_id = "iowa"
title = "Supreme Court of Iowa and Iowa Court of Appeals, civil appeals"
description = "A civil appeal as of right from a final order or judgment of the Iowa district court under the Iowa Rules of Appellate Procedure, as far as the vendored text states: the notice of appeal and cross-appeal, the filing fee, the combined certificate and transcript, the briefing notice and briefs with their word limit, default and dismissal, retention or transfer to the Court of Appeals, rehearing, further review in the Supreme Court and procedendo."
in_force = "2026-09-30"
known_at = "2026-10-28"
unknown_before = "2026-09-30"
jurisdiction = "Supreme Court of Iowa; Iowa Court of Appeals"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: its trigger events (lg-u561.5).
ia-state-rules = { version = "^0.1.0", path = "../ia-rules" }

[sources.ia-r-app-p]
title = "Iowa Court Rules, Chapter 6, Rules of Appellate Procedure (Iowa Legislature compilation of September 30, 2026)"
