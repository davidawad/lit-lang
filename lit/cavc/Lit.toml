# The United States Court of Appeals for Veterans Claims, promoted from
# outlines/federal-circuit/court-of-veteran-appeals (lg-f3q8.16).
#
# authority: the CAVC Rules of Practice and Procedure are the court's rules
# of practice, the FederalRule level of lit/core's lattice (as the USCIT
# Rules are for lit/cit).
# in_force: the vendored edition, the PDF dated 2026-10-01 that
# incorporates Miscellaneous Order 08-26, effective October 1, 2026
# (sources/cavc/PROVENANCE.md). Earlier editions are not vendored, so a
# query before it is a hole (unknown_before), never a day with no rule.
# 38 U.S.C. (§§ 7252, 7261, 7266, 7291, 7292) is not vendored: the graph
# cites the CAVC Rules that restate the periods those sections set, and
# the standard of review of § 7261 is not encoded.
[package]
name = "cavc"
version = "0.1.0"
language = 1
pack_id = "cavc"
forum = "cavc"
authority = "FederalRule"
title = "United States Court of Appeals for Veterans Claims"
description = "An appeal from a Board of Veterans' Appeals decision to the U.S. Court of Appeals for Veterans Claims under its Rules of Practice and Procedure as of October 1, 2026: the Notice of Appeal and its 120-day period (Rule 4(a)), docketing and the copy of the Board decision (Rule 4), the record before the agency and its disputes (Rule 10), the staff conference (Rule 33), briefing (Rules 28 and 31) and the record of proceedings (Rule 28.1), motions (Rule 27), oral argument and initial panel review (Rules 34 and 27.1), joint motions for remand and voluntary termination (Rules 41(c) and 42), decision, motions for reconsideration, panel decision or full Court review (Rule 35), judgment (Rule 36), mandate (Rule 41), EAJA applications (Rule 39), and the 60-day period to appeal to the Federal Circuit (Rule 36(a))."
jurisdiction = "United States Court of Appeals for Veterans Claims"
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
counting = "cavc26"

[package.roles]
