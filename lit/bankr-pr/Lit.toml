# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the District
# of Puerto Rico over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods the rules themselves state and re-encodes no FRBP period.
# It is a base package, not a `kind = "local-rule"` layer: lit/core has no
# bankruptcy forum family (L2011 for `bankr-pr`), as for lit/bankr-dc. Each
# period is counted under FRBP 9006(a), the FRCP 6(a) method (core's frcp6).
#
# Layers, in date order: the rules' undated "complete list" (CURRENCY
# UNCONFIRMED: every period bound only to it has a hole cite), General
# Order 17-08 (December 1, 2017; LBR 3015-2 and Local Form G, superseded by
# LBR 3015-3), General Orders 18-01 and 18-02 (June 19, 2018; LBR 3015-3 and
# 9013-1, text vendored and bound), General Order 19-01 (June 28, 2019; not
# vendored, the court's link is dead) and General Order 26-01 (August 5,
# 2026; LBR 9019-1 and 9019-2, text vendored and bound). The package runs
# from June 19, 2018; a query before then is a hole in the corpus.
[package]
name = "bankr-pr-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-pr-local-rules"
forum = "bankr-pr"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the District of Puerto Rico: Local Bankruptcy Rules"
description = "The Bankr. D.P.R. Local Bankruptcy Rules, with General Orders 18-01, 18-02 and 26-01 as dated layers, as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): motion response times (LBR 9013-1), chapter 13 confirmation, denial, fees and discharge (LBR 3015-3), mediation (LBR 9019-1), and, as holes pending a current text, the petition documents, payment advices, chapter 11 notices, added creditors, consolidation, dismissal, the § 341 reports, Rule 2004 examinations, employment, chapter 13 fees, claims and objections, chapter 11 reports, confirmation and final decrees, stay relief and continuation, debtor representatives, lien avoidance, electronic service, reopening, continuances, sales, adversary pretrial practice and dismissal, local counsel, jury consent, removal, transcript redaction, exhibits and telephone hearings."
in_force = "2018-06-19"
known_at = "2026-10-28"
unknown_before = "2018-06-19"
jurisdiction = "U.S. Bankruptcy Court for the District of Puerto Rico"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

