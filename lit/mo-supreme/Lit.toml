# Review in the Supreme Court of Missouri of a Court of Appeals decision
# in a civil case (transfer, Mo. Sup. Ct. R. 83.04) under the Missouri
# Supreme Court Rules. The rules are not vendored: courts.mo.gov
# answered HTTP 403 to every fetch (sources/mo-criminal-trial-court/
# PROVENANCE.md), tracked as lg-3sut (#15). The package keeps the
# structure with every cite a hole naming that issue and no period,
# count, limit or probability. Direct appeals and original proceedings
# are not modelled.
[package]
name = "mo-supreme-court-civil"
version = "0.1.0"
language = 1
pack_id = "mo-supreme-court-civil"
forum = "mo-supreme-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "missouri"
title = "Supreme Court of Missouri, civil"
description = "Review in the Supreme Court of Missouri of a Court of Appeals civil decision, every cite a hole: the Missouri Supreme Court Rules are not vendored (lg-3sut, #15). The structure runs from the application for transfer through the grant or denial, briefing, argument, decision, rehearing and the mandate."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Supreme Court of Missouri"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: its trigger events (lg-u561.5).
mo-state-rules = { version = "^0.1.0", path = "../mo-rules" }

[sources.mo-sup-ct-r]
title = "Missouri Supreme Court Rules, NOT VENDORED: courts.mo.gov answered HTTP 403 to every fetch (lg-3sut, #15); every cite naming it is a hole"
url = "https://www.courts.mo.gov/"
cite_prefixes = ["Mo. Sup. Ct. R."]
