# The U.S. District Court for the District of Montana's Criminal Rules
# (Chapter II of its Local Rules of Procedure, L.R. CR) as a local-rule
# layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares
# only the periods and limits the local criminal rules themselves state
# and re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (one
# source of truth: lit/frcrimp). Each period is counted under FRCrimP
# 45(a), which governs "any local rule", so each deadline names `forum
# frcrimp`. The rules are the Local Rules effective December 1, 2025
# (sources/fed-dmont; the 2026 proposed amendments are not in force and
# not vendored); earlier editions are not vendored, so a query before that
# date is a hole in the corpus. The criminal chapter is bound through its
# own sectioned copy of the extract (the copy lit/mtd binds marks only the
# civil rules). The Civil Local Rules CR 1.1 lists apply in criminal
# proceedings and live in lit/mtd. An appeal goes to the Ninth Circuit
# under lit/frcrimp's FRAP 4(b) period.
[package]
name = "mtd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "mtd-criminal-local-rules"
forum = "mtd-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Montana: Criminal Rules"
description = "The District of Montana's Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the government's discovery and impeachment disclosures, defense discovery, expert disclosures, prisoner production and Marshal service requests, voir dire questions, juror interview requests, motion briefing and its word limits, supplemental authority, magistrate objection word limits, and the transcript and briefs on an appeal from a magistrate judge's judgment."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "U.S. District Court for the District of Montana (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "dmont-crlr"
issuer = "U.S. District Court for the District of Montana"
date = "2025-12-01"
designation = "Local Rules of Procedure, Chapter II, Criminal Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcrimp-criminal-procedure = { version = "^2024.12.0", path = "../frcrimp" }

