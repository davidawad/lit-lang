# Certiorari practice in the Supreme Court of the United States, from the
# judgment below through the petition, its disposition, briefing on the
# merits, decision and rehearing, under the Rules of the Supreme Court
# adopted February 17, 2026, effective March 16, 2026 (sources/scotus) and
# 28 U.S.C. §§ 1254 and 2101 (sources/usc-additional.txt). Periods are
# counted by Sup. Ct. R. 30.1 (`core.supct30`). The certiorari period from
# a court of appeals judgment is also encoded in lit/frap (frap.cert),
# which a court of appeals package uses; this package is the Court's own
# side of the case.
