# The Bankruptcy Local Rules of the U.S. Bankruptcy Court for the Southern
# District of Texas over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods the Bankruptcy Local Rules themselves state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frbp9006). The rules are those
# effective September 22, 2025; the pending proposals are not in force and
# earlier editions are not vendored (sources/bankr-txs), so the package
# runs from September 22, 2025.
[package]
name = "bankr-txs-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-txs-local-rules"
forum = "bankr-txs"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Southern District of Texas: Bankruptcy Local Rules"
description = "The Bankr. S.D. Tex. Bankruptcy Local Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): the social security statement, creditor amendments, chapter 13 trustee and tax dismissals, conversion schedules, Rule 2004 notices, trustee elections, retroactive employment, retainers and fixed fees, the chapter 11 and Subchapter V bar dates, claim objections, administrative expenses on dismissal, conditional disclosure statement approval, stay relief and FRBP 4001 motions, chapter 13 vehicle adequate protection, surrender of collateral, chapter 7 abandonment, motion practice (BLR 9013-1) and remote witnesses."
in_force = "2025-09-22"
known_at = "2026-10-28"
unknown_before = "2025-09-22"
jurisdiction = "U.S. Bankruptcy Court for the Southern District of Texas"
# FRBP 9006(a)(6)(C): the holidays of Texas close a forward-counted period, here and in
# the FRBP periods this package recounts (core's `frbp9006-texas`).
counting = "frbp9006-texas"
recounts = ["frbp-bankruptcy-procedure"]

[package.instrument]
source = "txsb-blr"
issuer = "United States Bankruptcy Court for the Southern District of Texas"
date = "2025-09-22"
designation = "Bankruptcy Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.txsb-blr]
title = "Bankruptcy Local Rules of the United States Bankruptcy Court for the Southern District of Texas (effective September 22, 2025)"
url = "https://www.txs.uscourts.gov/sites/txs/files/Local_Rules_September_22_2025.pdf"
path = "sources/bankr-txs/txs-bankruptcy-local-rules-2025-09-22-sectioned.txt"
path_sha256 = "ffbf381754336221d4f61b05c651da8d516913c10dbae9b4dd6836e43bea44b7"
sha256 = "bd61c3522e19172d161048029a94da06793479b0928c46dd069f9cb3b9844db1"
as_of = "2025-09-22"
cite_prefixes = ["Bankr. S.D. Tex. BLR"]
section_heading = "BLR {n}"
