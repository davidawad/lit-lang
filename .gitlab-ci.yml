workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
    - when: never

stages:
  - binaries
  - release

variables:
  CARGO_TERM_COLOR: always

# macOS builds require a GitLab macOS runner; none is configured for this project.
.linux-release:
  stage: binaries
  image: rust:1.97.1-bookworm
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends build-essential
    - rustup target add "$TARGET"
  script:
    - cargo build --release --locked -p litigate-cli -p litigate-lsp --target "$TARGET"
    - mkdir -p dist
    - tar -C "target/$TARGET/release" -czf "dist/litigate-${CI_COMMIT_TAG}-${TARGET}.tar.gz" litigate litigate-lsp
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: never

linux-gnu:
  extends: .linux-release
  variables:
    TARGET: x86_64-unknown-linux-gnu

linux-musl:
  extends: .linux-release
  image: rust:1.97.1-bookworm
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends docker.io
  variables:
    TARGET: x86_64-unknown-linux-musl
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - mkdir -p dist target/x86_64-unknown-linux-musl/release
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace rust:1.97.1-alpine3.22 sh -ec 'apk add --no-cache build-base cmake ninja python3; cargo build --release --locked -p litigate-cli -p litigate-lsp --target x86_64-unknown-linux-musl; target/x86_64-unknown-linux-musl/release/litigate --version; target/x86_64-unknown-linux-musl/release/litigate solve cases/frcp-civil-case.case'
    - tar -C "target/$TARGET/release" -czf "dist/litigate-${CI_COMMIT_TAG}-${TARGET}.tar.gz" litigate litigate-lsp
    - mkdir -p dist
    - tar -C "target/$TARGET/release" -czf "dist/litigate-${CI_COMMIT_TAG}-${TARGET}.tar.gz" litigate litigate-lsp

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.58.0
  needs:
    - job: linux-gnu
      artifacts: true
    - job: linux-musl
      artifacts: true
  script:
    - echo "Publishing ${CI_COMMIT_TAG}"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Litgraph $CI_COMMIT_TAG"
    description: "Linux binaries for $CI_COMMIT_TAG. Download an archive below and extract litigate and litigate-lsp."
    assets:
      links:
        - name: "x86_64-unknown-linux-gnu"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/litigate-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu.tar.gz?job=linux-gnu"
          link_type: package
        - name: "x86_64-unknown-linux-musl"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/litigate-$CI_COMMIT_TAG-x86_64-unknown-linux-musl.tar.gz?job=linux-musl"
          link_type: package
