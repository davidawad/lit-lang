# Criminal prosecutions in the Montana district courts, as far as the
# vendored text states. Montana has no separate court rules of criminal
# procedure: criminal procedure is Title 46 of the Montana Code Annotated.
# Only Title 46, chapter 13 (pretrial motions, including the 46-13-401
# dismissal), is vendored (sources/mt-criminal-trial-court), from the MCA
# 2025 section pages, and its PROVENANCE entry records a PARTIAL set. By
# the bead's rule a PARTIAL source stays a hole: this package cites the
# vendored chapter 13 sections for the structure of the steps they govern
# and states no period from them, and every other step of the case cites
# a hole for the Title 46 chapter that governs it (arrest, initial
# appearance, bail, charging, arraignment, discovery, trial, sentencing,
# post-conviction relief). The appeal hand-off cites Montana Rule of
# Appellate Procedure 4(5)(b), bound to the text lit/mt-supreme binds
# (date of last amendment October 12, 2021; sources/mt-supreme), whose
# periods are stated; lit/core has no counting rule for them, so they are
# stated in notes, not encoded. in_force is the retrieval date and an
# earlier query is a hole in the corpus.
[package]
name = "mt-district-court-criminal"
version = "0.1.0"
language = 1
pack_id = "mt-district-court-criminal"
forum = "mt-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "montana"
title = "Montana district courts, criminal"
description = "Criminal prosecutions in the Montana district courts under Title 46 of the Montana Code Annotated, as far as the partial vendored text states: the structure of the case, with the chapter 13 pretrial motions, omnibus hearing, continuance and dismissal provisions cited and every other step a hole; no period from the partial statute is stated. An appeal goes to the Montana Supreme Court under M. R. App. P. 4(5)(b)."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Montana district courts (criminal)"

