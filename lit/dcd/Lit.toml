# The U.S. District Court for the District of Columbia's local civil rules
# (LCvR) as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP
# 83(a)): it declares only the periods and limits the local civil rules
# themselves state and re-encodes no FRCP deadline (one source of truth:
# lit/frcp). Each period is counted under FRCP 6(a), which governs "any
# local rule", so each deadline names `forum frcp`. The rules are the
# edition the court serves as current (cover: "Effective as of September
# 2015, Updated: September 2026"; newest listed change: Local Rule 6.2,
# September 14, 2026; sources/ddc), so in_force is that date; earlier
# editions are not vendored, so a query before it is a hole in the corpus.
# The local criminal rules are lit/dcd-criminal. An appeal goes to the
# D.C. Circuit under lit/frap and lit/cadc.
[package]
name = "dcd-local-rules"
version = "0.1.0"
language = 1
pack_id = "dcd-local-rules"
forum = "dcd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Columbia: Local Civil Rules"
description = "The U.S. District Court for the District of Columbia's local civil rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): notice of a change of address, the class-certification motion, motion opposition and reply periods and page limits, the response after a default is vacated, the administrative record and appendix in agency-review cases, the amicus opposition, the pretrial statement, reasonable notice of a deposition, the preliminary-injunction opposition, the bill of costs and its opposition, and objections to magistrate judge rulings and recommendations."
in_force = "2026-09-14"
known_at = "2026-10-28"
unknown_before = "2026-09-14"
jurisdiction = "U.S. District Court for the District of Columbia"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "ddc-lcvr"
issuer = "U.S. District Court for the District of Columbia"
date = "2026-09-14"
designation = "Local Civil Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

