# Criminal cases in the South Carolina court of general sessions under
# Title 17 of the South Carolina Code (sources/sc-criminal-trial-court),
# with the criminal notice of appeal of SCACR Rule 203(b)(2)
# (sources/sc-appellate-civil). The Title 17 pages state no edition date
# and their PROVENANCE records CURRENCY UNCONFIRMED, so every Title 17
# cite is a hole, `?("..., CURRENCY UNCONFIRMED")`, and its periods are
# stated in notes as the vendored text states them, unverified; the SCACR
# cites bind. The South Carolina Rules of Criminal Procedure are not
# vendored (the source is PARTIAL), so their periods are holes. lit/core
# has no South Carolina counting rule, so no period is a counted
# deadline. Federal habeas is lit/habeas's.
[package]
name = "sc-criminal-trial-court"
