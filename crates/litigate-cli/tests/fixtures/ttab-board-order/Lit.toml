# A Board order in one TTAB proceeding, as a `CaseOrder` layer over
# `lit/ttab` (lg-flu.27): it resets the time to answer to the date the
# order sets, which § 2.106(a) allows ("the time initially set, or as may
# later be reset by the Board"), and the time to answer a counterclaim,
# which § 2.106(b)(3)(iv) allows ("may be reset or extended ... to enable
# a party fully to present or meet a counterclaim"). `answer-period` and
# `counterclaim-answer-period` delegate to `CaseOrder`, so the overrides
# are licensed. Copy it beside a matter's packages, set
# `in_force` to the order's date, and record the order as an
# `AnswerTimeReset(<due>)` or `CounterclaimAnswerTimeReset(<due>)` event.
[package]
name = "ttab-board-order"
version = "0.1.0"
language = 1
pack_id = "ttab-board-order"
forum = "ttab"
authority = "CaseOrder"
title = "TTAB Board order resetting the answer time"
in_force = "2026-08-03"
known_at = "2026-08-03"
counting = "ttab-2-196"

[package.roles]
board = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
ttab-trademark-trial-and-appeal-board = { version = "^0.1.0", path = "../ttab" }

[sources.cfr2]
title = "37 CFR Part 2 - Rules of Practice in Trademark Cases (eCFR)"
url = "https://www.ecfr.gov/current/title-37/chapter-I/subchapter-B/part-2"
path = "sources/cfr-37-part2.txt"
cite_prefixes = ["37 CFR", "37 C.F.R."]
section_heading = "37 C.F.R. § {n}"
path_sha256 = "66402ce5e48bf2a9aa039058b3bfc181d3511b9e94137fac8b6a3d84a26b33a7"
as_of = "2026-10-19"
