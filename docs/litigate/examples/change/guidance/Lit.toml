# Change example (docs/litigate/CHANGE.md §4): guidance. The Federal
# Circuit's Practice Note to Rule 26 states its own practice: "The court
# cannot waive the deadlines for filing a notice of appeal or petition for
# review". Guidance binds only the actors it names (`binds`); here the court,
# whose draw it fixes. It prescribes nothing and imposes no duty.
