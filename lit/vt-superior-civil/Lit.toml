# Civil actions in the Civil Division of the Vermont Superior Court under
# the Vermont Rules of Civil Procedure, current with rule changes received
# through March 16, 2026 (sources/vt-superior-civil). Computation of time
# is V.R.C.P. 6(a), which counts every day but carries a last day that
# falls on a Saturday, Sunday or legal holiday to the next day that is
# not one, and a legal holiday includes any day the State of Vermont
# declares; core has no Vermont holiday calendar, so the rules' periods
# are stated in notes, not encoded as counted deadlines. The promulgation
# order of October 6, 2026 amending V.R.C.P. 55(a) takes effect January
# 1, 2027, after this package's dates, and changes no period; it is noted
# on the default, not applied. An appeal hands off to lit/vt-supreme.
[package]
name = "vt-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "vt-superior-court-civil"
forum = "vt-superior-civil"
authority = "StateRule"
jurisdiction_id = "vermont"
title = "Vermont Superior Court, Civil Division"
description = "Civil actions in the Civil Division of the Vermont Superior Court under the Vermont Rules of Civil Procedure, as far as the vendored text states: commencement and service, the time to answer, Rule 12(b) motions, default, discovery, summary judgment, trial and jury demand, post-trial motions, entry of judgment, voluntary dismissal, and the appeal (lit/vt-supreme)."
in_force = "2026-03-16"
known_at = "2026-10-28"
unknown_before = "2026-03-16"
jurisdiction = "Vermont Superior Court, Civil Division"

[package.roles]
