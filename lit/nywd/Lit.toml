# The Western District of New York's Local Rules of Civil Procedure
# (effective January 15, 2026) as a local-rule layer over lit/frcp (28
# U.S.C. § 2071; FRCP 83(a)): it declares only the periods and limits the
# Local Rules themselves state and re-encodes no FRCP deadline. Each
# period is counted under FRCP 6, which governs "any local rule". The
# rules are the edition effective January 15, 2026 (sources/wdny);
# earlier editions are not vendored, so a query before that date is a
# hole in the corpus. The Local Rules of Criminal Procedure and the Local
# Patent Rules are not vendored. An appeal goes to the Second Circuit
# under lit/frap.
