# The Local Bankruptcy Rules of the District Court for the Northern
# Mariana Islands, Bankruptcy Division, over lit/frbp (FRBP 9029(a); 28
# U.S.C. § 2075): it declares only the periods the Local Bankruptcy Rules
# themselves state and re-encodes no FRBP period. Each period is counted
# under FRCP 6(a), which LBR 9006-1(a) makes govern the Local Bankruptcy
# Rules (core's frcp6). The rules are those "Effective April 15, 2019"
# (sources/bankr-mp). Motion practice follows the District Court's LR 7.1
# (LBR 9013-1(a); lit/nmid). Appeals go under FRBP Part VIII (lit/frbp).
[package]
name = "bankr-mp-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-mp-local-rules"
forum = "bankr-mp"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "District Court for the Northern Mariana Islands, Bankruptcy Division: Local Bankruptcy Rules"
description = "The D.N.M.I. Local Bankruptcy Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): payment advices, amendments, conversion, responsible individuals, Rule 2004 examinations, trustee administrative expenses, chapter 13 trustee dismissal motions and business reports, attorney address changes, administrative expense requests, the chapter 11 claims bar date, substitute claims, claim objections, chapter 13 plan filing, service, modification and confirmation objections, chapter 11 disclosure statements, ballots and confirmation, final decrees, chapter 13 distributions and attorney fee reserves, stay relief, eviction certifications and stay extensions, discharge certifications, rejected filings, transcript redaction, small and leased-premises sales, dismissal of discharge objections, costs, default judgment, motion hearing notice, countermotions and reconsideration of interlocutory orders."
in_force = "2019-04-15"
known_at = "2026-10-28"
unknown_before = "2019-04-15"
jurisdiction = "District Court for the Northern Mariana Islands, Bankruptcy Division"
counting = "frcp6"

[package.instrument]
source = "nmib-lbr"
issuer = "District Court for the Northern Mariana Islands, Bankruptcy Division"
date = "2019-04-15"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
