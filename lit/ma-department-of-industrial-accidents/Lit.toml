title = "Massachusetts Department of Industrial Accidents"
description = "Workers' compensation claims before the Massachusetts Department of Industrial Accidents through the reviewing board's decision, and the notice of appeal from the reviewing board under Mass. R. A. P. 3(a) and 4(a), as far as the vendored text states. The Department's procedure and the statutory appeal period (G.L. c. 152) are not vendored and stay holes; the appeal itself is lit/ma-appeals-court."
in_force = "2026-09-01"
