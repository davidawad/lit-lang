# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Northern
# District of Oklahoma over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods and limits the Local Bankruptcy Rules
# themselves state and re-encodes no FRBP period. Each period is counted
# under FRBP 9006(a), the FRCP 6(a) method (core's frcp6). The vendored
# text is the court's consolidation 'as amended' (effective December 1,
# 2009 under General Order 09-GO-06), updated December 1, 2017 to include
# 10-GO-01, 12-GO-01, 15-GO-01 and 17-GO-04, and updated March 21, 2025
# only to correct judge and clerk information and the CM/ECF guide
# (sources/bankr-okn). The last amending order, 17-GO-04, took effect
# December 1, 2017 and no later order amends the rules, so the
# consolidated text runs from that date with no dated layers; the earlier
# states the orders amended are not vendored separately, so a query before
# December 1, 2017 is a hole in the corpus.
[package]
name = "bankr-okn-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-okn-local-rules"
forum = "bankr-okn"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Northern District of Oklahoma: Local Bankruptcy Rules"
description = "The Bankr. N.D. Okla. Local Bankruptcy Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): domestic support information after conversion, committee ownership statements, chapter 12 and 13 business reports, claim objection responses, unclaimed funds, ballot tabulations, codebtor stay relief, stay relief discovery, stay continuation motions, tax returns on request, § 522(q) discharge objections, sales and sales free and clear, abandonment, redemption, adversary brief deadlines and page limits, pretrial continuances, dismissal responses, summary judgment, motion practice (LBR 9013-1) and service, jury trial consent and settlement conferences."
in_force = "2017-12-01"
known_at = "2026-10-28"
unknown_before = "2017-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Northern District of Oklahoma"
counting = "frcp6"

[package.instrument]
source = "oknb-lbr"
issuer = "United States Bankruptcy Court for the Northern District of Oklahoma"
date = "2017-12-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

