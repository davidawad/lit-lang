family = "state-civil"
authority = "StateRule"
jurisdiction_id = "new-york"
title = "Appellate Terms of the Supreme Court of New York: civil appeals"
description = "A civil appeal to an Appellate Term of the Supreme Court as far as the vendored text states: the time to take the appeal under CPLR 5513. The record, briefing, argument, decision and further review are holes: the Appellate Terms' rules and the lower-court acts are not vendored."
in_force = "2026-10-27"
