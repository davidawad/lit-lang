# The Wisconsin base library (lg-u561.5): what the Wisconsin court packages
# share. The Rules of Appellate Procedure, Wis. Stat. ch. 809 (sources/wisctapp),
# govern the Court of Appeals (lit/wi-court-of-appeals) and the Supreme Court
# (lit/wi-supreme-court), so their brief, motion and petition limits and the
# papers they govern are declared once here; the court packages also route
# their graphs on its trigger events. No procedure of its own.
[package]
name = "wi-state-rules"
version = "0.1.0"
language = 1
pack_id = "wi-state-rules"
forum = "wi-state-rules"
authority = "StateRule"
jurisdiction_id = "wisconsin"
title = "Wisconsin state court rules (base library)"
description = "The rule layer Wisconsin's court packages share: the brief, reconsideration-motion and review-petition limits of Wis. Stat. ch. 809 and the papers they govern, and the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Wisconsin state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

