# Review in the United States Court of Military Commission Review under
# its vendored Rules of Practice, effective February 3, 2016 (sources/cmcr):
# referral of the record after the convening authority's action or its
# waiver (CMCR R. 2(b), 14), the defense brief, answer and reply (CMCR R.
# 15(c)(2)), the Court's standard of review (CMCR R. 3(c)), reconsideration
# (CMCR R. 20), interlocutory appeals by the United States (CMCR R. 15(c)(1),
# 23) and petitions for extraordinary relief (CMCR R. 22). The Military
# Commissions Act (10 U.S.C. §§ 948a et seq.), the Manual for Military
# Commissions and the Regulation for Trial by Military Commissions are
# vendored nowhere in sources/, so they are named in notes. CMCR R. 8 has no
# counting rule in lit/core, so periods are stated in notes, not encoded as
# counted deadlines.
