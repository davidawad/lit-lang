# Criminal cases in the Commonwealth Superior Court of the Northern
# Mariana Islands under the Commonwealth Rules of Criminal Procedure (Com.
# R. Crim. P.), the compilation the CNMI Law Revision Commission lists as
# effective May 3, 2017 (sources/mp-criminal-trial-court): the rules
# adopted January 22, 1995, the March 2015 amendments to Rules 4 and 9
# filed with them, and Rule 11-1 (plea in abeyance) made permanent by
# Administrative Order 2017-ADM-0010-RUL of May 3, 2017. Later amendments
# were not checked; in_force is May 3, 2017 and an earlier query is a hole
# in the corpus. The extract carries OCR errors (for instance "coun" for
# "court"), so a period is stated only where its words and figures agree
# or the figure repeats, and a sentence the OCR may have garbled is not
# relied on. Criminal appeals go under NMI Supreme Court Rule 4(b), bound
# to the text lit/mp-supreme binds (Administrative Order 2024-ADM-0006-RUL
# of March 15, 2024; sources/mp-supreme). Time is computed under Com. R.
# Crim. P. 45, which excludes intermediate Saturdays, Sundays and legal
# holidays from periods under 11 days; lit/core has no counting rule for
# it, so the periods are stated in notes, not encoded as counted
# deadlines. The Commonwealth Code (6 CMC) the rules cite is not vendored.
[package]
name = "mp-superior-court-criminal"
version = "0.1.0"
language = 1
pack_id = "mp-superior-court-criminal"
forum = "mp-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "northern-mariana-islands"
title = "Commonwealth Superior Court of the Northern Mariana Islands, criminal"
description = "Criminal cases in the CNMI Commonwealth Superior Court under the Commonwealth Rules of Criminal Procedure: arrest and initial appearance, release, the preliminary examination, the information, arraignment, discovery and pretrial motions, dismissal for unnecessary delay, plea or trial, post-verdict motions, sentencing, and the NMI Supreme Court Rule 4(b) notice of appeal, with the periods stated in notes from the vendored rules."
in_force = "2017-05-03"
known_at = "2026-10-28"
unknown_before = "2017-05-03"
jurisdiction = "Commonwealth Superior Court of the Northern Mariana Islands (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

