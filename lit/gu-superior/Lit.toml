# Civil actions in the Superior Court of Guam under the Guam Rules of
# Civil Procedure as amended pursuant to PRM 06-006-24, effective October
# 19, 2023 (sources/gu-superior). Computation of time is GRCP 6(a), which
# counts every day but extends a period ending on a Guam legal holiday (1
# GCA § 1000(a), (b), and holidays appointed by the President, Congress,
# the laws of Guam or the Governor) and has no counting rule in lit/core,
# so the rules' periods are stated in notes, not encoded as counted
# deadlines; GRCP 6(d) adds 3 days after service under Rule 5(b)(2)(B),
# (C) or (D). An appeal hands off to lit/gu-supreme.
