# Criminal cases in the Alaska Superior Court under the Alaska Rules of
# Criminal Procedure (Alaska R. Crim. P.), as far as the vendored text
# states. The base text is the "Criminal Procedure" PDF the court system
# serves (sources/ak-criminal-trial-court), which carries no edition
# date; its PROVENANCE entry records CURRENCY UNCONFIRMED, so in_force is
# the retrieval date and an earlier query is a hole in the corpus. By the
# PM's standing ruling of 2026-10-27 such a source yields holes, not
# values: this package cites the rules only for the structure of the case
# (which rule governs which step) and states no period, limit or amount
# from them, including the Rule 45 speedy-trial period. The Alaska
# Statutes the rules invoke (bail under AS 12.30) are not vendored. The
# appeal hand-off cites Alaska Rule of Appellate Procedure 204, bound to
# the text lit/ak-supreme binds (amended through SCO 2035, effective April
# 15, 2025; sources/ak-supreme), whose periods are stated; lit/core has no
# counting rule for them, so they are stated in notes, not encoded.
[package]
name = "ak-superior-court-criminal"
version = "0.1.0"
language = 1
pack_id = "ak-superior-court-criminal"
forum = "ak-criminal-trial-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "alaska"
title = "Alaska Superior Court, criminal"
description = "Criminal cases in the Alaska Superior Court under the Alaska Rules of Criminal Procedure, as far as the vendored text states: the structure of the case from arrest and first appearance through preliminary examination, indictment, arraignment, discovery, pretrial motions, the Rule 45 speedy-trial dismissal, plea or trial, post-trial motions, sentencing and post-conviction relief; no period from the currency-unconfirmed rules is stated. An appeal goes to the Alaska Court of Appeals under Alaska R. App. P. 204."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Alaska Superior Court (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

