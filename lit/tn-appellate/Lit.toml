# A civil appeal from a Tennessee circuit or chancery court to the
# Tennessee Court of Appeals, and review by permission in the Tennessee
# Supreme Court, under the Tennessee Rules of Appellate Procedure, each
# cited rule as in force on the Tennessee courts' pages on October 27,
# 2026 (sources/tn-appellate), with its own amendment history. Only the
# cited rules are vendored (3, 4, 9, 11, 13, 24, 27, 39): the briefing
# times (Rule 29), the word limits of Rule 30(e) and the computation of
# time (Rule 21) are not, so brief periods and brief word limits stay out
# and the rules' periods are stated in notes, not counted. Certiorari is
# a federal hand-off under Sup. Ct. R. 13.
[package]
name = "tn-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "tn-appellate-civil"
forum = "tn-appellate"
family = "state-civil"
authority = "StateRule"
title = "Tennessee Court of Appeals and Supreme Court, civil appeals"
description = "Civil appeals from the Tennessee circuit and chancery courts under the Tennessee Rules of Appellate Procedure, as far as the vendored text states: the appeal as of right and its time, tolling motions, the record and transcript, briefs, the scope and standard of review, rehearing and its page limit, and the application for permission to appeal to the Tennessee Supreme Court and its word limits. Certiorari is a federal hand-off under Sup. Ct. R. 13."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Tennessee Court of Appeals; Tennessee Supreme Court (civil)"
jurisdiction_id = "tennessee"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
tn-state-rules = { version = "^0.1.0", path = "../tn-rules" }

[sources.tn-r-app-p]
title = "Tennessee Rules of Appellate Procedure, cited rules, each as in force on October 27, 2026"
url = "https://www.tncourts.gov/courts/court-rules/rules-appellate-procedure"
path = "sources/tn-appellate/tn-rap-cited.txt"
path_sha256 = "e200af46ea7e877b2e4f782d147c7534334b175009b4860470189b36b7a3895d"
as_of = "2026-10-27"
cite_prefixes = ["Tenn. R. App. P."]
section_heading = "Tenn. R. App. P. {n}"

[sources.scotus]
