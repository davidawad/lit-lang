# PTAB AIA trials (inter partes review and post-grant review) under 35
# U.S.C. ch. 31-32 and 37 C.F.R. Part 42, ported from
# packs/ptab-patent-trial-appeal-board.json (`litigate import`, then typed
# deadlines, sources and tests by hand).
#
# in_force: the AIA trial provisions and the Part 42 trial rules took effect
# September 16, 2012 (AIA, Pub. L. 112-29, § 6(c)(2)(A), 125 Stat. 284;
# the trial rules, 77 Fed. Reg. 48612 and 48680 (Aug. 14, 2012), which the
# vendored 37 C.F.R. § 90.3 history line dates "effective Sept. 16, 2012").
# authority: 37 C.F.R. Part 42 is agency regulation (lit/core's `Regulation`,
# between `Statute` and `CaseOrder`).
[package]
name = "ptab-patent-trial-appeal-board"
version = "0.1.0"
language = 1
pack_id = "ptab-patent-trial-appeal-board"
forum = "ptab"
family = "ptab"
authority = "Regulation"
title = "PTAB Patent Trial and Appeal Board Proceedings"
description = "Post-grant adversarial challenges to issued patents before the USPTO Patent Trial and Appeal Board — inter partes review (IPR) and post-grant review (PGR), from petition filing through institution, trial on the merits, final written decision, rehearing/Director review, and Federal Circuit appeal."
jurisdiction = "35 U.S.C. Chapter 31 (AIA Trials) / 37 C.F.R. Part 42 / USPTO PTAB"
in_force = "2012-09-16"
known_at = "2026-08-26"
counting = "uspto-1-7"

[package.roles]
applicant = "self"
director = "nature"
either = "nature"
examiner = "nature"
office = "nature"

