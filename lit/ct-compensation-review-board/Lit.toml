# Proceedings before the Connecticut Compensation Review Board, and the
# appeal from its decision to the Appellate Court, under Chapter 76 of the
# Rules of Appellate Procedure (Appeals in Workers' Compensation Cases) in
# the official 2026 Connecticut Practice Book (Revision of 1998)
# (sources/ct-superior-civil, the text lit/ct-appellate-supreme cites).
# The board's own procedure, the petition for review of an administrative
# law judge's decision and its period, is the Workers' Compensation Act's
# (General Statutes §§ 31-301, 31-301b), which is not vendored: those cites
# stay holes. The dated appellate amendments approved June 30, 2026
# (effective January 1, 2027) amend no section of Chapter 76. The appeal
# itself is lit/ct-appellate-supreme.
[package]
name = "ct-compensation-review-board"
version = "0.1.0"
language = 1
pack_id = "ct-compensation-review-board"
forum = "ct-compensation-review-board"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "connecticut"
title = "Connecticut Compensation Review Board"
description = "Review by the Connecticut Compensation Review Board of an administrative law judge's workers' compensation decision, and the appeal from the board to the Appellate Court under Practice Book Chapter 76, as far as the vendored text states: the reservation of a question of law to the Appellate Court and the twenty-day appeal on its preliminary acceptance, filing the appeal with the appellate clerk, the case file due within ten days, and no entry fee or costs. The board's own petition period and procedure (General Statutes §§ 31-301, 31-301b) are not vendored and stay holes."
in_force = "2026-01-01"
known_at = "2026-10-28"
unknown_before = "2026-01-01"
jurisdiction = "Connecticut Compensation Review Board"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

