# The Eastern District of Virginia's Local Criminal Rules as a local-rule
# layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares
# only the periods the Local Criminal Rules themselves state and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (those are
# lit/frcrimp's). Each period is counted under FRCrimP 45(a), which
# governs "any local rule". The rules are the Local Rules effective
# December 1, 2024 (sources/vaed). Federal habeas is lit/habeas's; an
# appeal to the Fourth Circuit is lit/frcrimp's and lit/ca4's.
