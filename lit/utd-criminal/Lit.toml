# The U.S. District Court for the District of Utah's Local Rules of
# Criminal Practice (DUCrimR) as a local-rule layer over lit/frcrimp (28
# U.S.C. § 2071; FRCrimP 57(a)): it declares only the periods and limits
# the local criminal rules themselves state and re-encodes no FRCrimP,
# Speedy Trial Act or FRAP 4(b) period (one source of truth: lit/frcrimp).
# Each period is counted under FRCrimP 45(a), which governs "any local
# rule", so each deadline names `forum frcrimp`. The rules are the edition
# effective December 1, 2025 (DUCrimR 1-1; sources/d-utah), the edition
# the court serves as current, so in_force is that date; earlier editions
# are not vendored, so a query before it is a hole in the corpus. An
# appeal goes to the Tenth Circuit under lit/frcrimp's FRAP 4(b) period
# and lit/ca10.
[package]
name = "utd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "utd-criminal-local-rules"
forum = "utd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Utah: Local Rules of Criminal Practice"
description = "The U.S. District Court for the District of Utah's Local Rules of Criminal Practice as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the return of a probation report, the motion response and reply periods, supplemental authority, the expert disclosure deadline, a victim's objection to a subpoena, presentence objection resolution and sentencing filings, seal extension and redacted copies, transcript redaction, and appeals from a magistrate judge's misdemeanor or petty-offense order."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "U.S. District Court for the District of Utah (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "utd-crimr"
issuer = "U.S. District Court for the District of Utah"
date = "2025-12-01"
designation = "Local Rules of Criminal Practice"

