# The U.S. District Court for the Southern District of California's
# Criminal Local Rules (CrimLR) as a local-rule layer over lit/frcrimp (28
# U.S.C. § 2071; FRCrimP 57(a)): it declares only the periods and limits
# the local criminal rules themselves state and re-encodes no FRCrimP,
# Speedy Trial Act or FRAP 4(b) period (one source of truth: lit/frcrimp).
# Each period is counted under FRCrimP 45(a), which governs "any local
# rule", so each deadline names `forum frcrimp`. The rules are the Local
# Rules revised as of June 1, 2026 (sources/fed-sdcal; CrimLR 1.1(b)
# states the criminal rules' own effective date, January 2, 2025); earlier
# editions are not vendored, so a query before June 1, 2026 is a hole in
# the corpus. The criminal part is bound through its own sectioned copy of
# the extract (the civil copy lit/casd binds marks only the civil rules).
# The Civil Local Rules CrimLR 1.1(e) lists apply in criminal cases and
# live in lit/casd. An appeal goes to the Ninth Circuit under lit/frcrimp's
# FRAP 4(b) period.
[package]
name = "casd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "casd-criminal-local-rules"
forum = "casd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Southern District of California: Criminal Local Rules"
description = "The Southern District of California's Criminal Local Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): objections to a magistrate judge's plea findings, the Rule 16 discovery timetable report, the sentencing objection, departure, memorandum, chart and addendum schedule, motion filing, opposition and the brief page limit, related-case objections, and the transcript and briefs on an appeal from a magistrate judge's conviction."
in_force = "2026-06-01"
known_at = "2026-10-28"
unknown_before = "2026-06-01"
jurisdiction = "U.S. District Court for the Southern District of California (criminal)"
counting = "frcrimp45"

