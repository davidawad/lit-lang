# Criminal cases in the Mississippi trial courts under the Mississippi
# Rules of Criminal Procedure (MRCrP), as far as the vendored text states,
# with the appeal under the Mississippi Rules of Appellate Procedure. The
# MRCrP text is the "Post-070123" PDF the Supreme Court serves
# (sources/ms-criminal-trial-court), which states no edition date; its
# PROVENANCE entry records CURRENCY UNCONFIRMED (later amendment orders
# were not checked), so in_force is the retrieval date and an earlier
# query is a hole in the corpus. By the PM's standing ruling of 2026-10-27
# such a source yields holes, not values: this package cites the MRCrP
# only for the structure of the case and states no period, limit or
# amount from it; where a step has one, the note names the rule that sets
# it. The statutory speedy-trial rule (Miss. Code Ann. § 99-17-1) and the
# post-conviction statute are not vendored; those cites are holes. The
# appeal hand-off cites the M.R.A.P. ("Current" file; latest amendment in
# the text June 23, 2025; sources/ms-appellate), whose periods are stated
# in notes because lit/core has no counting rule for Mississippi's legal
# holidays. The appeal continues under lit/ms-appellate's rules; federal
# habeas belongs to lit/habeas.
[package]
name = "ms-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "ms-criminal-trial-court"
forum = "ms-criminal-trial-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "mississippi"
title = "Mississippi trial courts, criminal"
description = "Criminal cases in the Mississippi circuit and county courts under the Mississippi Rules of Criminal Procedure, as far as the vendored text states: the structure of the case from arrest and initial appearance through preliminary hearing, release, indictment, arraignment, trial setting, discovery, plea or trial, post-trial motions and sentencing; no period from the currency-unconfirmed rules is stated. The appeal is taken under M.R.A.P. 4."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Mississippi trial courts of general criminal jurisdiction"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

