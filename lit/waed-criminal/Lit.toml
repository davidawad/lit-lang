# The U.S. District Court for the Eastern District of Washington's Local
# Criminal Rules (LCrR) as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods and limits the
# local criminal rules themselves state and re-encodes no FRCrimP, Speedy
# Trial Act or FRAP 4(b) period (one source of truth: lit/frcrimp). Each
# period is counted under FRCrimP 45(a), which governs "any local rule",
# so each deadline names `forum frcrimp`. The rules are the edition
# effective February 20, 2015 (LCrR 57(b)), which the court still presents
# as current (sources/fed-edwash); earlier editions are not vendored, so a
# query before that date is a hole in the corpus. Motion response and
# reply periods follow LCivR 7.1 (LCrR 45, 47) and live in lit/waed. An
# appeal goes to the Ninth Circuit under lit/frcrimp's FRAP 4(b) period.
[package]
name = "waed-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "waed-criminal-local-rules"
forum = "waed-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Eastern District of Washington: Local Criminal Rules"
description = "The Eastern District of Washington's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): responses to objections to a magistrate judge's plea recommendation, the reconsideration page limit, the government's and defense's discovery and defense-notice schedule, the trial brief, voir dire and jury instruction filings, and the briefs on an appeal from a magistrate judge's judgment."
in_force = "2015-02-20"
known_at = "2026-10-28"
unknown_before = "2015-02-20"
jurisdiction = "U.S. District Court for the Eastern District of Washington (criminal)"
counting = "frcrimp45"

[package.roles]
