# The Western District of Missouri's Local Civil Rules as a local-rule
# layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the
# periods and limits the Local Rules themselves state and re-encodes no
# FRCP deadline. Each period is counted under FRCP 6(a), which governs
# "any local rule". The rules are those "Adopted by the Court, Effective
# July 9, 2026" (sources/mowd); earlier editions are not vendored, so a
# query before that date is a hole in the corpus. The Local Criminal
# Rules (L.R. 99.0-99.10) are lit/mowd-criminal's. Habeas (28 U.S.C.
# §§ 2254, 2255) is lit/habeas's beyond the L.R. 9.2 reply period
# declared here; an appeal goes to the Eighth Circuit under lit/frap and
# lit/ca8.
[package]
