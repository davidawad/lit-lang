# The United States District Court for the Western District of Tennessee's
# Local Criminal Rules (LCrR) as a local-rule layer over lit/frcrimp (28
# U.S.C. § 2071; FRCrimP 57(a)): it declares only the periods and limits the
# Local Criminal Rules themselves state and re-encodes no FRCrimP, Speedy
# Trial Act or FRAP 4(b) period. FRCrimP 45(a) computes a period stated in
# a local rule. The rules are the criminal part of the Local Rules "Revised
# November 17, 2025" (sources/tnwd). An appeal goes to the Sixth Circuit
# under lit/frap and lit/ca6; federal habeas is lit/habeas.
