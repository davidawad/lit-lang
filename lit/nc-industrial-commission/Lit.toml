# Workers' compensation claims before the North Carolina Industrial
# Commission and the direct appeal to the Court of Appeals. The Workers'
# Compensation Act (N.C. Gen. Stat. Chapter 97), which governs the claim,
# the deputy commissioner's hearing, review by the Full Commission and the
# time to appeal, is not vendored, so its cites are holes and the package
# states none of its periods. The appeal binds to Article IV of the North
# Carolina Rules of Appellate Procedure, Codified 2 September 2025
# (sources/nc-appellate-civil): N.C. R. App. P. 18(b)(1) lets the General
# Statutes control the time and method of an administrative appeal, so
# Rule 18(b)(2)'s thirty days is stated as the default, not counted. The
# appeal itself is lit/nc-appellate-civil's; the graph routes on
# lit/nc-rules' trigger events (lg-u561.5).
[package]
name = "nc-industrial-commission"
version = "0.1.0"
language = 1
pack_id = "nc-industrial-commission"
forum = "nc-industrial-commission"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "north-carolina"
title = "North Carolina Industrial Commission"
description = "Workers' compensation claims before the North Carolina Industrial Commission, as far as the vendored text states: the claim, hearing and award rest on N.C. Gen. Stat. Chapter 97, which is not vendored (holes); the appeal to the Court of Appeals follows N.C. R. App. P. 18 and is decided in lit/nc-appellate-civil."
in_force = "2025-09-02"
known_at = "2026-10-28"
unknown_before = "2025-09-02"
jurisdiction = "North Carolina Industrial Commission"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the trigger events the graph routes on.
nc-state-rules = { version = "^0.1.0", path = "../nc-rules" }

