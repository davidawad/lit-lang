# Change example (docs/litigate/CHANGE.md §4): an amendment. The Supreme
# Court's order of March 26, 2009 amended FRCP 59(e) from 10 days to 28,
# effective December 1, 2009, "and shall govern in all proceedings thereafter
# commenced and, insofar as just and practicable, all proceedings then
# pending". It produces the next version of the base declaration, never a
# parallel world.
