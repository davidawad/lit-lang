# Criminal cases in the Connecticut Superior Court under the Superior Court
# criminal rules (Practice Book Chapters 36 to 44) and the Rules of
# Appellate Procedure of the official 2026 Connecticut Practice Book
# (Revision of 1998), whose own amendments take effect January 1, 2026
# (sources/ct-superior-civil; its PROVENANCE entry names those chapters,
# the speedy-trial rules Sections 43-39 to 43-43 included, as the
# Connecticut criminal source). The Practice Book counts its periods from
# events and Connecticut's court holidays, not the federal ones, govern;
# lit/core has no counting rule for them, so the periods are stated in
# notes, not encoded as counted deadlines. The dated layers vendored beside
# the 2026 edition amend no section of Chapters 36 to 44 or Section 63-1:
# the Superior Court amendments of June 11, 2026 touch none of them, and the
# appellate amendments approved June 30, 2026 (effective January 1, 2027)
# amend Section 63-7 among others, which this package does not cite. The
# General Statutes (the speedy-trial statute § 54-82m, bail, the petition
# for a new trial under § 52-270 and habeas corpus under § 52-466) are not
# vendored; those cites stay holes. An appeal hands off to the Appellate
# Court under Practice Book § 63-1.
