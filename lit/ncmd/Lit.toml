# The Middle District of North Carolina's Local Civil Rules as a
# local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods and limits the Local Civil Rules themselves
# state and re-encodes no FRCP deadline, except where LR 54.2 itself
# modifies one (FRCP 54(d)(2)(B) permits it). FRCP 6(a) computes a period
# stated in a local rule. The rules are the Rules of Practice and
# Procedure (Local Civil Rules) effective June 1, 2026 (sources/ncmd). The
# Local Criminal Rules are out of scope. An appeal goes to the Fourth
# Circuit under lit/frap and lit/ca4.
[package]
name = "ncmd-local-rules"
version = "0.1.0"
language = 1
pack_id = "ncmd-local-rules"
forum = "ncmd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Middle District of North Carolina: Local Civil Rules"
description = "The Middle District of North Carolina's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the sealing report, response and objections, motion responses and replies with the brief word and page limits, the PSLRA lead-plaintiff response, the pro se address notice, the Rule 26(f) meeting, report and medical release, the class action determination motion, protective-order briefing, the trial brief and sealing at trial, the bill of costs, objections and review, the statutory attorneys' fee motion, and the dispositive-motion notice, filing and summary judgment briefing."
in_force = "2026-06-01"
known_at = "2026-10-28"
unknown_before = "2026-06-01"
jurisdiction = "United States District Court, M.D. North Carolina"
counting = "frcp6"

[package.roles]
applicant = "self"
