# Criminal court cases in the Pennsylvania courts of common pleas under the
# Pennsylvania Rules of Criminal Procedure (Pa.R.Crim.P.) as published in
# Pa. Code Title 234, effective through 56 Pa.B. 5370 (August 8, 2026)
# (sources/pa-criminal-trial-court), so in_force is that date and an
# earlier query is a hole in the corpus. The prompt-trial rule is
# Pa.R.Crim.P. 600 and the post-sentence and appeal periods are
# Pa.R.Crim.P. 720 with Pa.R.A.P. 903 (Pa. Code Title 210, same Bulletin
# date; sources/pa-appellate-civil). Computation of time is governed by
# 1 Pa.C.S. § 1908 and Pa.R.J.A. 107, which are not vendored, and the
# Commonwealth's legal holidays differ from the federal ones; lit/core has
# no counting rule for them, so the periods are stated in notes, not
# encoded as counted deadlines. The Post Conviction Relief Act (42 Pa.C.S.
# § 9541 et seq.) and the Constitution's bail clause (Pa. Const. art. I,
# § 14) are not vendored. An appeal goes to the Superior Court
# (lit/pa-superior-court).
