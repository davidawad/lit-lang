# Ashcroft v. Iqbal, 556 U.S. 662 (2009) (lg-wvlf.3, ported from
# tests/cases/iqbal.json; public record). Reversed and remanded, 556 U.S.
# 662 (May 18, 2009).
#
# Sources: Iqbal v. Hasty, 490 F.3d 143 (2d Cir. 2007)
# <https://caselaw.findlaw.com/court/us-2nd-circuit/1426475.html>;
# Ashcroft v. Iqbal, 556 U.S. 662 (2009) (opinion)
# <https://www.law.cornell.edu/supct/html/07-1015.ZO.html>; Supreme Court
# docket No. 07-1015
# <https://www.supremecourt.gov/search.aspx?filename=/docketfiles/07-1015.htm>.
#
# From 2005-09-27 (the order denying the motion to dismiss): FRAP
# 4(a)(1)(B): 60 days when a U.S. officer is a party. Sep 27 + 3 = Sep 30;
# + 31 = Oct 31 (34); + 26 = Nov 26 (60), a Saturday; FRAP 26(a)(1)(C)
# rolls to Monday Nov 28. Due 2005-11-28. Notice-of-appeal dates were not
# found; the lead appeal is No. 05-5768, i.e. docketed in 2005.
#
# From 2007-09-18 (denial of rehearing (Sup. Ct. R. 13.3)): Sup. Ct. R.
# 13.1: 90 days. Sep 18 + 12 = Sep 30; + 31 = Oct 31 (43); + 30 = Nov 30
# (73); + 17 = Dec 17 (90), a Monday. Due 2007-12-17. Petition filed
# 2008-02-06, about seven weeks after the unextended date. An extension
# under Sup. Ct. R. 13.5 is the usual explanation, but none was found in
# the sources read. Recorded as due unknown: lit/core declares Sup. Ct. R.
# 30.1 only from its 2023 edition, and the earlier editions are not
# vendored, so no counting rule is in force on the trigger date.
#
# Re-record with `litigate test tests/expect --bless`, and say why in the
# commit.

paths = ["docs/litigate/famous"]

[[run]]
world = "ca2.world"

[run.expect.w1]
verdict = "clean"
in_force = ["famous-cases"]

[run.expect.w1.outcome]

[[run.expect.w1.deadlines]]
deadline = "famous-cases::notice-of-appeal-us-party"
trigger = "2005-09-27"
due = "2005-11-28"
status = "lapsed"
cite = "FRAP (2008 ed.) 4(a)(1)(B)"
counted_by = "FRAP (2002 ed.) 26(a)(2)"

[[run.expect.w1.deadlines]]
deadline = "famous-cases::cert-petition"
trigger = "2007-09-18"
due = "unknown"
status = "open"
cite = "28 U.S.C. § 2101(c)"
counted_by = "-"
