# Civil actions in the Utah district courts under the Utah Rules of Civil
# Procedure, each rule as in force on October 26, 2026 with its own
# effective date (sources/ut-state-civil; the latest shown, URCP 1,
# effective February 13, 2026, and URCP 62, effective May 1, 2026).
# Computation of time is URCP 6(a), which carries a last day that falls on
# a Saturday, Sunday or legal holiday to the next day that is not one; a
# legal holiday includes Pioneer Day and any day the Governor or
# Legislature designates (URCP 6(a)(6)), and core has no Utah holiday
# calendar, so the rules' periods are stated in notes, not encoded as
# counted deadlines. An appeal hands off to lit/ut-state-appellate. The
# trigger events are lit/ut-rules' (lg-u561.5).
[package]
name = "ut-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "ut-district-court-civil"
forum = "ut-state-civil"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "utah"
title = "Utah district court, civil"
description = "Civil actions in the Utah district courts under the Utah Rules of Civil Procedure, as far as the vendored text states: commencement and service, the time to answer, Rule 12(b) motions, motion practice and its length limits, default, initial disclosures and discovery, summary judgment, jury demand, post-trial motions, entry of judgment, costs, dismissal, and the appeal (lit/ut-state-appellate)."
in_force = "2026-10-26"
known_at = "2026-10-28"
unknown_before = "2026-10-26"
jurisdiction = "Utah district court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the trigger events.
ut-state-rules = { version = "^0.1.0", path = "../ut-rules" }

