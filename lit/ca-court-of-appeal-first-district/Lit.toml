# California Court of Appeal, First Appellate District (lg-u561.5): the statewide package lit/ca-court-of-appeal for this
# district. Its graph is the statewide one: the district's local rules
# are not vendored, so nothing here departs from Title 8 yet.
#
# A civil appeal from a California superior court to the Court of Appeal
# under the California Rules of Court, Title 8, as far as the vendored
# rules state (sources/ca-court-of-appeal: the Judicial Council's per-rule
# pages, each as in force on 2026-10-27), with appealability under CCP
# § 904.1 (sources/ca-superior). Computation of time (Cal. Rules of Court,
# rule 1.10, and CCP §§ 12-12a) is not vendored and lit/core has no
# California counting rule, so the periods are stated in notes, not encoded
# as counted deadlines. The trial-court side is lit/ca-superior; the
# petition for review is decided in lit/ca-supreme-court; each appellate
# district is its own package over the same rules
# (lit/ca-court-of-appeal-*-district), and all route on lit/ca-rules'
# trigger events (lg-u561.5).
[package]
name = "ca-court-of-appeal-first-district"
version = "0.1.0"
language = 1
pack_id = "ca-court-of-appeal-first-district"
forum = "ca-court-of-appeal-first-district"
authority = "StateRule"
jurisdiction_id = "california"
title = "California Court of Appeal, First Appellate District, civil appeals"
description = "California Court of Appeal, First Appellate District: the district's local rules (Ct. App. local rules under Cal. Rules of Court, rule 10.1030) supplement Title 8; they are not vendored and not modeled. A civil appeal from a California superior court to the Court of Appeal under the California Rules of Court, Title 8, and CCP § 904.1: notice, appealability, record, briefing, argument, decision, rehearing, the petition for review (decided in lit/ca-supreme-court) and the remittitur. The six appellate districts are lit/ca-court-of-appeal-*-district."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "California Court of Appeal, First Appellate District (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the trigger events of the California Rules of Court, Title 8 and trigger events.
ca-state-rules = { version = "^0.1.0", path = "../ca-rules" }

[sources.crc-title8]
title = "California Rules of Court, Title 8, cited rules (as in force 2026-10-27)"
url = "https://courts.ca.gov/cms/rules/index/eight/rule8_104"
path = "sources/ca-court-of-appeal/cal-rules-of-court-title8-cited.txt"
path_sha256 = "616d23ce45fc69c4d0c6c6b2e5684681c36f8bfe5954e99ce40a766d0ed5e010"
as_of = "2026-10-27"

[sources.ccp]
title = "California Code of Civil Procedure, cited chapters, as published on leginfo.legislature.ca.gov (in effect 2026-10-27)"
url = "https://leginfo.legislature.ca.gov/faces/codesTOCSelected.xhtml?tocCode=CCP"
path = "sources/ca-superior/ccp-cited-chapters-sectioned.txt"
path_sha256 = "494bdb61129d96d2eee0776501204acb3bd5f1fd32641098efacd3558124e336"
as_of = "2026-10-27"

[[cite_syntax.rules]]
prefixes = ["Cal. Rules of Court, rule"]
