# The Utah base library (lg-u561.5): the trigger events the Utah civil
# court packages route their graphs on: lit/ut-state-civil (the district
# courts), lit/ut-state-appellate (the appeal, in the Supreme Court or on
# transfer the Court of Appeals) and lit/ut-supreme-court (certiorari
# review of a Court of Appeals decision). It declares no period: the
# rules' periods are stated in the court packages' notes, as URCP 6(a) and
# URAP 22(a) count Utah legal holidays and core has no Utah calendar. No
# procedure of its own.
[package]
name = "ut-state-rules"
version = "0.1.0"
language = 1
pack_id = "ut-state-rules"
forum = "ut-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "utah"
title = "Utah state court rules (base library)"
description = "The rule layer Utah's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-26"
known_at = "2026-10-28"
unknown_before = "2026-10-26"
jurisdiction = "Utah state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
