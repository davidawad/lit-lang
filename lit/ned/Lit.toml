# The District of Nebraska's Civil Rules (NECivR) as a local-rule layer
# over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the
# periods and limits the Nebraska Civil Rules themselves state and
# re-encodes no FRCP deadline. Each period is computed under FRCP 6
# (NECivR 6.1(a): "Federal Rule of Civil Procedure 6 applies when
# computing any period of time stated in these rules"). The rules are the
# edition effective December 1, 2025 (sources/d-neb); earlier editions
# are not vendored, so a query before that date is a hole in the corpus.
# The General Rules (NEGenR) and the criminal rules are not encoded. An
# appeal goes to the Eighth Circuit under lit/frap and lit/ca8.
[package]
name = "ned-local-rules"
version = "0.1.0"
language = 1
pack_id = "ned-local-rules"
forum = "ned"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, District of Nebraska: Civil Rules"
description = "The District of Nebraska's Civil Rules (NECivR) as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion briefing and its word limits, the answer after a motion to dismiss, challenges to electronic signatures, video depositions, trial briefs, jury instructions and proposed findings, place of trial, settlement and dismissal papers, nonparty subpoena objections, the bill of costs, summary judgment statements, objections to a magistrate judge's order, and the withdrawal of trial exhibits."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "United States District Court, D. Nebraska"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "necivr"
issuer = "United States District Court for the District of Nebraska"
date = "2025-12-01"
designation = "Nebraska Civil Rules (NECivR)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.necivr]
title = "Civil Rules of the United States District Court for the District of Nebraska (NECivR), effective December 1, 2025"
