# The U.S. District Court for the Northern District of Illinois's local
# criminal rules (LCR) as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods the local criminal
# rules themselves state and re-encodes no FRCrimP, Speedy Trial Act or
# FRAP 4(b) period (one source of truth: lit/frcrimp). Each period is
# counted under FRCrimP 45(a), which governs "any local rule", so each
# deadline names `forum frcrimp`. The rules are the edition the court
# serves as current ("effective September 1, 1999 with amendments through
# May 4, 2026"; sources/ilnd), so in_force is that date; earlier editions
# are not vendored, so a query before it is a hole in the corpus. The
# court's Speedy Trial Act plan (18 U.S.C. § 3165) and its CJA plan are
# not vendored. An appeal goes to the Seventh Circuit under lit/frcrimp's
# FRAP 4(b) period and lit/ca7.
[package]
name = "ilnd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "ilnd-criminal-local-rules"
forum = "ilnd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Northern District of Illinois: Local Criminal Rules"
description = "The U.S. District Court for the Northern District of Illinois's local criminal rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the pretrial-motion and additional-discovery motion periods, the discovery conference and declination of disclosure, the presentence interview, offense-conduct versions and sentencing position papers, the extension of a warrant sealing order and the filing of a search warrant return, the final CJA interim-payment voucher, and the answering and reply briefs on a motion."
in_force = "2026-05-04"
known_at = "2026-10-28"
unknown_before = "2026-05-04"
jurisdiction = "U.S. District Court for the Northern District of Illinois (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "ilnd-lcr"
issuer = "U.S. District Court for the Northern District of Illinois"
date = "2026-05-04"
designation = "Local Criminal Rules"

