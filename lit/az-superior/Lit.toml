# Civil actions in the Arizona Superior Court under the Rules of Civil
# Procedure for the Superior Courts of Arizona, as the Westlaw public-access
# site served them on 2026-10-28, current with amendments effective through
# October 1, 2026 (sources/az-superior). Computation of time is Civil Rule
# 6(a), which excludes intermediate Saturdays, Sundays and legal holidays
# from periods under 11 days and has no counting rule in lit/core, so the
# rules' periods are stated in notes, not encoded as counted deadlines;
# Civil Rule 6(c) adds 5 calendar days after service under Rule
# 5(c)(2)(C), (D) or (E). An appeal hands off to lit/az-court-of-appeals.
