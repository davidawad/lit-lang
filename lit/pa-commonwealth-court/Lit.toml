title = "Commonwealth Court of Pennsylvania, petitions for review and appeals (civil)"
description = "Appellate-jurisdiction review in the Commonwealth Court of Pennsylvania under the Pa.R.A.P. as far as the vendored text states: the petition for review of a government unit's quasijudicial order and the appeal from a court of common pleas, the certified record, briefing, listing and argument, disposition, reargument and the petition for allowance of appeal. Original jurisdiction is not modeled."
in_force = "2026-08-08"
