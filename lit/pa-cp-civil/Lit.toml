# Civil actions in the Pennsylvania courts of common pleas under the
# Pennsylvania Rules of Civil Procedure as published in Pa. Code Title 231
# Part I, effective through 56 Pa.B. 5370 (August 8, 2026)
# (sources/pa-cp-civil). Computation of time is governed by Pa.R.J.A. 107
# (Pa.R.C.P. 237.1(a)(2) points to it), which is not vendored, and the
# Commonwealth's legal holidays differ from the federal ones; lit/core has
# no counting rule for it, so the periods are stated in notes, not encoded
# as counted deadlines. An appeal hands off to the Pennsylvania appellate
# package (lit/pa-appellate-civil).
[package]
name = "pa-common-pleas-civil"
version = "0.1.0"
language = 1
pack_id = "pa-common-pleas-civil"
forum = "pa-cp-civil"
authority = "StateRule"
title = "Pennsylvania courts of common pleas, civil"
description = "Civil actions in the Pennsylvania courts of common pleas under the Pennsylvania Rules of Civil Procedure, as far as the vendored text states: commencement and service of original process, the time to plead, preliminary objections and amendment, the ten-day notice and judgment by default, relief from a default judgment, discovery and its sanctions, summary judgment, trial and nonsuit, post-trial relief, entry of judgment, discontinuance, and the appeal (lit/pa-appellate-civil)."
in_force = "2026-08-08"
known_at = "2026-10-28"
unknown_before = "2026-08-08"
jurisdiction = "Pennsylvania courts of common pleas (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

