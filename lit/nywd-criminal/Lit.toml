description = "The Western District of New York's Local Rules of Criminal Procedure as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the motion opposition and reply periods absent a court order and the memorandum page limits, objections to a video deposition before trial, the removal of exhibits after the Clerk's notice, the return of a search warrant, and a motion to extend the time to object to a magistrate judge's recommended disposition."
