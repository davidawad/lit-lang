# The United States District Court for the Eastern District of Tennessee's
# Local Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP
# 83(a)): it declares only the periods and limits the civil Local Rules
# themselves state and re-encodes no FRCP deadline. FRCP 6(a) computes a
# period stated in a local rule. The rules are the edition "Effective:
# December 1, 2009; Revised: April 8, 2026" (sources/tned); earlier
# editions are not vendored, so a query before that date is a hole in the
# corpus. The criminal provisions (forum tned-criminal) are not encoded.
# An appeal goes to the Sixth Circuit under lit/frap and lit/ca6.
[package]
name = "tned-local-rules"
version = "0.1.0"
language = 1
pack_id = "tned-local-rules"
forum = "tned"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Eastern District of Tennessee: Local Rules (civil)"
description = "The Eastern District of Tennessee's civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion briefing periods and the brief page limit, supplemental briefs, proposed findings in non-jury cases, the bill of costs and its objections, the attorney's fee motion, and consent to a magistrate judge."
in_force = "2026-04-08"
known_at = "2026-10-28"
unknown_before = "2026-04-08"
jurisdiction = "United States District Court, E.D. Tennessee"
counting = "frcp6"

