# Felony and gross misdemeanor prosecutions in the Minnesota district
# courts under the Minnesota Rules of Criminal Procedure ("Revised
# effective January 1, 2010, with amendments effective through July 1,
# 2026", the Revisor of Statutes' rule pages; sources/mn-criminal-trial-court),
# with the trial-date demand (Minn. R. Crim. P. 11.09) as the speedy-trial
# rule and the defendant's appeal to the Court of Appeals under Rule 28 of
# the same set. Computation of time is Minn. R. Crim. P. 34.01 with
# Minnesota's legal holidays, for which lit/core has no counting rule, so
# the periods are stated in notes, not encoded as counted deadlines. The
# package runs from the set's latest amendments, July 1, 2026. Misdemeanor
# procedure, first-degree murder appeals to the Supreme Court (Rule 29),
# prosecution appeals (Rule 28.04) and postconviction relief (Minn. Stat.
# ch. 590, not vendored) are not modelled; an appeal continues before the
# Court of Appeals (lit/minnctapp, whose civil appellate rules Rule 28.01,
# subd. 2 applies where Rule 28 is silent).
