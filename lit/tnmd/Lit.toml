# The United States District Court for the Middle District of Tennessee's
# Local Rules of Court as a local-rule layer over lit/frcp (28 U.S.C.
# § 2071; FRCP 83(a)): it declares only the periods and limits the civil
# Local Rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule. The rules are the edition
# dated May 15, 2025 (2025 amendments; sources/tnmd); earlier editions are
# not vendored, so a query before that date is a hole in the corpus. The
# Local Criminal Rules (LCrR, forum tnmd-criminal) are not encoded. An
# appeal goes to the Sixth Circuit under lit/frap and lit/ca6.
[package]
name = "tnmd-local-rules"
version = "0.1.0"
language = 1
pack_id = "tnmd-local-rules"
forum = "tnmd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Middle District of Tennessee: Local Rules of Court (civil)"
description = "The Middle District of Tennessee's civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion response and reply periods and memorandum page limits, relief from a ruling made before the response time, summary judgment briefing, trial deadlines for deposition designations, supplementation and subpoenas, costs and attorney's fees, review of magistrate judges' orders, and consent forms after an added party."
in_force = "2025-05-15"
known_at = "2026-10-28"
unknown_before = "2025-05-15"
jurisdiction = "United States District Court, M.D. Tennessee"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "tnmd-lr"
issuer = "United States District Court for the Middle District of Tennessee"
date = "2025-05-15"
designation = "Local Rules of Court"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

