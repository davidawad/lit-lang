description = "The U.S. District Court for the Northern District of Oklahoma's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the filing fee after a denied pauper motion, motion briefing and its page limits, expedited discovery briefing, the pretrial order, settlement conferences, pro se contact information, notice of bankruptcy, deposition notice, pauper subpoenas, costs, the removal status report, and withdrawal of the reference."
