# The petition for review in the California Supreme Court (lg-u561.5)
# under Cal. Rules of Court, rule 8.500 (sources/ca-court-of-appeal), from
# lit/ca-court-of-appeal and its districts. Periods are stated in notes
# (rule 1.10 and CCP §§ 12-12a are not vendored). The proceedings after a
# grant of review (rules 8.512-8.552) are not vendored and not modeled.
[package]
name = "ca-supreme-court"
version = "0.1.0"
language = 1
pack_id = "ca-supreme-court"
forum = "ca-supreme-court"
authority = "StateRule"
jurisdiction_id = "california"
title = "California Supreme Court, petitions for review (civil)"
description = "The petition for review in the California Supreme Court of a Court of Appeal civil decision under Cal. Rules of Court, rule 8.500, and the grant or denial of review. The Supreme Court's proceedings after a grant (rules 8.512-8.552) are not vendored and not modeled."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "California Supreme Court (petitions for review, civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the trigger events of the California Rules of Court, Title 8 and trigger events.
ca-state-rules = { version = "^0.1.0", path = "../ca-rules" }

