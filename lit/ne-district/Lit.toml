# Civil actions in the Nebraska district courts under the Nebraska Court
# Rules of Pleading and of Discovery in Civil Cases (effective January 1,
# 2025, as amended through September 3, 2025) and chapter 25 of the
# Nebraska Revised Statutes, as far as the vendored sections state
# (sources/ne-district: the cited rule pages of the Nebraska Supreme Court
# and the Nebraska Legislature's statute pages, retrieved 2026-10-27).
# Computation of time (Neb. Rev. Stat. § 25-2221) is not vendored, and
# lit/core has no Nebraska counting rule, so the periods are stated in
# notes, not encoded as counted deadlines. An appeal hands off to the
# Nebraska appellate package (lit/nebctapp).
[package]
name = "ne-district-civil"
version = "0.1.0"
language = 1
pack_id = "ne-district-civil"
forum = "ne-district"
family = "state-civil"
authority = "StateRule"
title = "Nebraska district courts, civil"
description = "Civil actions in the Nebraska district courts, as far as the vendored rules and statutes state: service of summons, the answer and Neb. Ct. R. Pldg. § 6-1112 motions, amendment, expert disclosure, interrogatories and discovery sanctions, summary judgment, new trial and motions to alter or amend, entry of judgment, vacating a judgment, dismissal without prejudice, and the notice of appeal (lit/nebctapp)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction_id = "nebraska"
jurisdiction = "Nebraska district courts (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

