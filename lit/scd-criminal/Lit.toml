title = "United States District Court, District of South Carolina: Local Criminal Rules"
description = "The District of South Carolina's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): responses to motions, delivery of trial subpoenas, voir dire questions and jury instructions, and the parties' consent or objection to a state's request for custody of a defendant."
