description = "The Western District of North Carolina's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): requests for subpoenas at government expense, applications for writs of habeas corpus ad prosequendum and ad testificandum, the defendant's response to the government's statement of relevant conduct, sentencing memoranda, and responses to motions."
