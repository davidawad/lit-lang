# The United States District Court for the Eastern District of Wisconsin's
# General and Civil Local Rules as a local-rule layer over lit/frcp (28
# U.S.C. § 2071; FRCP 83(a)): it declares only the periods and limits the
# Local Rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule. The rules are those effective
# February 1, 2010 as amended July 29, 2026 (sources/wied), the court's
# current edition; the Criminal Local Rules are out of scope. An appeal
# goes to the Seventh Circuit under lit/frap.
[package]
name = "wied-local-rules"
version = "0.1.0"
language = 1
pack_id = "wied-local-rules"
forum = "wied"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Eastern District of Wisconsin: General and Civil Local Rules"
description = "The Eastern District of Wisconsin's General and Civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): magistrate judge consent forms and objection briefing, sealing motions, exhibit removal, related-case objections, motion response and reply periods and brief page limits, expedited non-dispositive motions, disclosure statements after removal, pseudonym motions, pretrial reports, discovery completion, bills of costs and their review, and summary judgment briefing and limits."
in_force = "2026-07-29"
known_at = "2026-10-28"
unknown_before = "2026-07-29"
jurisdiction = "United States District Court, E.D. Wisconsin"
counting = "frcp6"

