# The Massachusetts Local Bankruptcy Rules (MLBR) of the U.S. Bankruptcy
# Court for the District of Massachusetts over lit/frbp (FRBP 9029(a); 28
# U.S.C. § 2075): it declares only the periods and page limits the MLBR and
# their Appendix 1 (the Chapter 13 Rules, adopted by MLBR 3015-1) state and
# re-encodes no FRBP period. It is a base package, not a
# `kind = "local-rule"` layer: lit/core has no bankruptcy forum family
# (L2011 for `bankr-ma`), as for lit/bankr-dc. Each period is counted under
# FRBP 9006(a), the FRCP 6(a) method (core's frcp6).
#
# Layers, in date order: the MLBR effective May 1, 2025 with Appendix 1 of
# the same date (the consolidation), then Standing Order 2025-01 (September
# 12, 2025), which adds MLBR 7016-1(d) pending final adoption. That
# subsection lets the court's judges act as settlement judges, mediators or
# other neutrals in cases they do not preside over; it states no period,
# page limit, filing or service rule, so it changes no declaration here and
# needs no dated version. The earlier editions are not vendored, so a query
# before May 1, 2025 is a hole in the corpus.
[package]
name = "bankr-ma-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-ma-local-rules"
forum = "bankr-ma"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the District of Massachusetts: Local Bankruptcy Rules"
description = "The Bankr. D. Mass. Local Bankruptcy Rules (MLBR) and Chapter 13 Rules (Appendix 1) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): fee waivers, payment advices, defective petitions, a debtor's death, chapter 11 dismissal and conversion, address changes, patient care ombudsmen, professional employment, § 503(b)(9) claims, claim objections, unclaimed funds, chapter 11 final decrees, stay relief and continuation, tax-return requests, sales, abandonment, utilities, adversary discovery, inactivity and summary judgment, extended discharge deadlines, withdrawal, motion practice (MLBR 9013-1), jury consent, settlements and exhibits, and the chapter 13 documents, confirmation and plan amendments, surrogate claims, claim objections, sales, loan modifications, stay relief, dismissal, conversion and discharge."
in_force = "2025-05-01"
known_at = "2026-10-28"
unknown_before = "2025-05-01"
jurisdiction = "U.S. Bankruptcy Court for the District of Massachusetts"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

