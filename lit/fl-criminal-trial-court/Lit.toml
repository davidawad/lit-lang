# Criminal cases in the Florida trial courts under the Florida Rules of
# Criminal Procedure (the Florida Bar's October 1, 2026 edition,
# sources/fl-criminal-trial-court), with the criminal appeal's notice under
# the Florida Rules of Appellate Procedure (sources/fl-state-appellate).
# Computation of time is governed by Florida Rule of General Practice and
# Judicial Administration 2.514, which is not vendored, so the rules'
# periods are stated in notes, not counted. The appeal hands off to
# lit/fl-state-appellate.
[package]
name = "fl-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "fl-criminal-trial-court"
forum = "fl-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "florida"
title = "Florida trial courts, criminal"
description = "Criminal cases in the Florida circuit and county courts under the Florida Rules of Criminal Procedure: first appearance, the time for formal charges, arraignment, discovery, pretrial motions, speedy trial (Rule 3.191), plea or trial, motions for new trial and in arrest of judgment, sentencing and the criminal notice of appeal (Fla. R. App. P. 9.140(b)(3))."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Florida trial courts of general criminal jurisdiction"

[package.roles]
