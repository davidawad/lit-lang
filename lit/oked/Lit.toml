# The U.S. District Court for the Eastern District of Oklahoma's Local
# Civil Rules (LCvR) as a local-rule layer over lit/frcp (28 U.S.C.
# § 2071; FRCP 83(a); LCvR 1.1: the rules "supplement the Federal Rules of
# Civil Procedure with local Court procedure"): it declares only the
# periods and limits the civil rules themselves state and re-encodes no
# FRCP deadline. The rules "become effective on July 5, 2016" (LCvR 1.1),
# the edition the court still serves as current (sources/ed-okla), so
# in_force is that date. The criminal rules are lit/oked-criminal and
# bankruptcy matters lit/bankr-oke. An appeal goes to the Tenth Circuit
# under lit/frap.
