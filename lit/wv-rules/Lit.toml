# The West Virginia base library (lg-u561.5): what the West Virginia court
# packages share. The West Virginia Rules of Civil Procedure
# (sources/wv-circuit-civil) govern the circuit courts (lit/wv-circuit-civil);
# the West Virginia Rules of Appellate Procedure (sources/wv-appellate-civil)
# govern the Intermediate Court of Appeals (lit/wv-appellate-civil) and the
# Supreme Court of Appeals (lit/wv-supreme-court). The court packages route
# their graphs on this library's trigger events. It declares no period and
# cites no rule: the rules' periods are stated in the court packages' notes.
# The outline cited the West Virginia Code, which is not vendored; it is not
# cited. No procedure of its own.
[package]
name = "wv-state-rules"
version = "0.1.0"
language = 1
pack_id = "wv-state-rules"
forum = "wv-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "west-virginia"
title = "West Virginia state court rules (base library)"
description = "The rule layer West Virginia's court packages share: the trigger events of the West Virginia Rules of Civil Procedure and Rules of Appellate Procedure their graphs route on. No procedure of its own."
in_force = "2022-07-01"
known_at = "2026-10-28"
unknown_before = "2022-07-01"
jurisdiction = "West Virginia state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.wv-rcp]
title = "West Virginia Rules of Civil Procedure, as posted by the Supreme Court of Appeals of West Virginia (printed 2026-10-27)"
url = "https://www.courtswv.gov/legal-community/court-rules/rules-civil-procedure-contents"
