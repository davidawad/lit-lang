[package]
name = "litigate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "litigate_cli"
path = "src/lib.rs"

[[bin]]
name = "litigate"
path = "src/main.rs"

[dependencies]
ariadne.workspace = true
clap.workspace = true
litgraph = { path = "../litgraph" }
litigate-base = { path = "../litigate-base" }
litigate-import = { path = "../litigate-import" }
litigate-lsp = { path = "../litigate-lsp" }
litigate-lower = { path = "../litigate-lower" }
litigate-sema = { path = "../litigate-sema" }
litigate-syntax = { path = "../litigate-syntax" }
litigate-verify = { path = "../litigate-verify" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta = { workspace = true, features = ["json"] }
proptest.workspace = true

[lints]
workspace = true
