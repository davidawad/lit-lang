# Civil actions in the Montana District Courts under the Montana Rules of
# Civil Procedure as the State Law Library served them on 2026-10-27
# (date of last amendment June 28, 2022; sources/mt-district). Computation
# of time is M. R. Civ. P. 6(a), the FRCP 6(a) method but with Montana's
# own legal holidays (state general election day and days the Governor
# declares, and no Juneteenth), which lit/core has no counting rule for,
# so the rules' periods are stated in notes, not encoded as counted
# deadlines; Rule 6(d) adds 3 days after service by the listed means. An
# appeal hands off to lit/mt-supreme.
[package]
name = "mt-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "mt-district-court-civil"
forum = "mt-district"
authority = "StateRule"
title = "Montana District Court, civil"
description = "Civil actions in the Montana District Courts under the Montana Rules of Civil Procedure, as far as the vendored text states. An appeal hands off to the Montana appellate package (lit/mt-supreme)."
in_force = "2022-06-28"
known_at = "2026-10-28"
unknown_before = "2022-06-28"
jurisdiction = "Montana District Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

