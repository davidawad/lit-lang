# The Northern District of Florida's criminal local rules as a local-rule
# layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares
# only the periods the Local Rules themselves state for a criminal case and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP period. Each period is
# counted under FRCrimP 45(a), which governs "any local rule". The rules
# are the edition effective November 24, 2015 (sources/nd-fla); the court
# has no separate criminal part, so the criminal provisions are the
# criminal-case rules within the one set. Federal habeas is lit/habeas.
