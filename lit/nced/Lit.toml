# The Eastern District of North Carolina's Local Civil Rules as a
# local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods and limits the Local Civil Rules themselves
# state and re-encodes no FRCP deadline. FRCP 6(a) computes a period stated
# in a local rule. The rules are the Local Civil Rules of Practice and
# Procedure, May 2023 (amendments effective May 31, 2023; sources/nced),
# the latest the court's rules page lists. The Local Criminal Rules are out
# of scope. An appeal goes to the Fourth Circuit under lit/frap and lit/ca4.
[package]
name = "nced-local-rules"
version = "0.1.0"
language = 1
pack_id = "nced-local-rules"
forum = "nced"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Eastern District of North Carolina: Local Civil Rules"
description = "The Eastern District of North Carolina's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the filing fee after denial of in forma pauperis status, appearances after withdrawal, removal filings, appearances, pending motions and disclosures, the time to file motions after discovery, the Social Security fee motion, responses and replies to motions with the memorandum page and word limits, objections to a translation, the final pretrial conference sequence, trial memoranda and voir dire requests, the bill of costs, objections and review, review of a magistrate judge's orders and recommendations, and the change of address."
in_force = "2023-05-31"
known_at = "2026-10-28"
unknown_before = "2023-05-31"
jurisdiction = "United States District Court, E.D. North Carolina"
# FRCP 6(a)(6)(C): the holidays of North Carolina close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-north-carolina`).
counting = "frcp6-north-carolina"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "nced-lr"
issuer = "United States District Court for the Eastern District of North Carolina"
date = "2023-05-31"
designation = "Local Civil Rules of Practice and Procedure (May 2023)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.nced-lr]
title = "Local Civil Rules of Practice and Procedure of the United States District Court for the Eastern District of North Carolina (May 2023)"
url = "https://www.nced.uscourts.gov/pdfs/Local%20Civil%20Rules%202023.pdf"
path = "sources/nced/nced-local-civil-rules-sectioned.txt"
path_sha256 = "7ea7072dbbf52629c8a7f15c0692de2e9d002d8eb6530d783acdb0b20506ef98"
sha256 = "fdfd8a2f25ad587e6cdf99c4bcd4f4a238b72f6827ca7251b480c2fb3792e7ea"
as_of = "2023-05-31"
cite_prefixes = ["E.D.N.C. Loc. Civ. R."]
section_heading = "Rule {n}"
