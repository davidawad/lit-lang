# The U.S. District Court for the District of Massachusetts's criminal
# local rules (L.R. 106.1 to 118.1) as a local-rule layer over
# lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares only the
# periods the local criminal rules themselves state and re-encodes no
# FRCrimP, Speedy Trial Act or FRAP 4(b) period (one source of truth:
# lit/frcrimp). Each period is counted under FRCrimP 45(a), which governs
# "any local rule", so each deadline names `forum frcrimp`. The rules are
# the combined Local Rules including amendments through September 8, 2026
# (sources/dmass), the edition lit/mad also binds; L.R. 106.1(c) and
# 116.2 were amended effective that day and earlier editions are not
# vendored, so a query before it is a hole in the corpus. An appeal goes
# to the First Circuit under lit/frcrimp's FRAP 4(b) period.
[package]
name = "mad-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "mad-criminal-local-rules"
forum = "mad-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Massachusetts: Local Rules (criminal)"
description = "The District of Massachusetts's criminal local rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): automatic discovery and the discovery-waiver, exculpatory-evidence disclosure, discovery letters, replies, motions and responses, status-conference joint memoranda, the initial pretrial conference, and the pretrial witness and exhibit disclosures."
in_force = "2026-09-08"
known_at = "2026-10-28"
unknown_before = "2026-09-08"
jurisdiction = "U.S. District Court for the District of Massachusetts (criminal)"
counting = "frcrimp45"

