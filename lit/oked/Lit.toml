description = "The U.S. District Court for the Eastern District of Oklahoma's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the filing fee, motion briefing and its page limits, unopposed dispositive motions, the joint status report conference, settlement conferences, notice of bankruptcy, deposition notice and trial depositions, costs and attorney's fees, pro hac vice appearance, and withdrawal of the reference."
in_force = "2016-07-05"
