# The forum-family class matrix (docs/litigate/CHANGE.md §3; design review
# 2026-10-23 §2.5 item 4): data, not compiler code. A family lists the
# package forums in it, the courts whose precedential decisions bind there
# (`@circuit`: the regional circuit of a world's location), and one cell per
# instrument class that exists there. A class with no cell does not exist
# in the family (L2011); a cell's `row` narrows the class's effect row
# (SPEC §5.7) and can never widen it. Every `cite` and `example` is from
# the lg-fq2.1 research register (fetched 2026-10-23).

[family.district-civil]
# `frcp` and each of the 94 district courts by its PACER court id (28
# U.S.C. §§ 81-131; Guam, the Northern Mariana Islands and the Virgin
# Islands: 48 U.S.C. §§ 1424, 1821, 1611): a district's local rules (28
# U.S.C. § 2071; FRCP 83(a)) and its orders are packages at its forum.
title = "Federal district court, civil (FRCP)"
forums = ["frcp", "almd", "alnd", "alsd", "akd", "azd", "ared", "arwd",
  "cacd", "caed", "cand", "casd", "cod", "ctd", "ded", "dcd", "flmd",
  "flnd", "flsd", "gamd", "gand", "gasd", "gud", "hid", "idd", "ilcd",
  "ilnd", "ilsd", "innd", "insd", "iand", "iasd", "ksd", "kyed", "kywd",
  "laed", "lamd", "lawd", "med", "mdd", "mad", "mied", "miwd", "mnd",
  "msnd", "mssd", "moed", "mowd", "mtd", "ned", "nvd", "nhd", "njd", "nmd",
  "nyed", "nynd", "nysd", "nywd", "nced", "ncmd", "ncwd", "ndd", "nmid",
  "ohnd", "ohsd", "oked", "oknd", "okwd", "ord", "paed", "pamd", "pawd",
  "prd", "rid", "scd", "sdd", "tned", "tnmd", "tnwd", "txed", "txnd",
  "txsd", "txwd", "utd", "vtd", "vid", "vaed", "vawd", "waed", "wawd",
  "wvnd", "wvsd", "wied", "wiwd", "wyd"]
precedent = ["scotus", "@circuit"]
circuits = ["ca1", "ca2", "ca3", "ca4", "ca5", "ca6", "ca7", "ca8", "ca9", "ca10", "ca11", "cadc"]
# A circuit panel is bound by the circuit's prior panels until the court en
# banc or the Supreme Court overrules them, or a higher decision is "clearly
# irreconcilable" with them (Miller v. Gammie, 335 F.3d 889, 899-900 (9th
# Cir. 2003) (en banc); 28 U.S.C. § 46(c)).
panels = ["ca1", "ca2", "ca3", "ca4", "ca5", "ca6", "ca7", "ca8", "ca9", "ca10", "ca11", "cadc"]

