# Civil actions in the Maine Superior Court under the Maine Rules of Civil
# Procedure (rules only, including amendments effective June 1, 2026,
# sources/me-superior-civil). Computation of time is M.R. Civ. P. 6(a):
# intermediate weekends and Maine legal holidays are excluded from periods
# under 7 days, and core has no Maine counting rule or holiday calendar,
# so the rules' periods are stated in notes, not encoded as counted
# deadlines. An appeal hands off to lit/me-law-court.
