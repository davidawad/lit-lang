# A civil appeal from an Arkansas circuit court to the Arkansas Court of
# Appeals (or, for the cases Ark. Sup. Ct. R. 1-2(a) lists, the Supreme
# Court) under the Arkansas Rules of Appellate Procedure--Civil, current
# through October 1, 2026, and the Rules of the Supreme Court and Court of
# Appeals, current through December 15, 2025 (sources/arkctapp). The
# appellate rules state their periods in calendar days and the circuit
# court's Ark. R. Civ. P. 6(a) computation has no core method, so periods
# are stated in notes, not encoded as counted deadlines; the brief
# word-count and petition page limits are encoded as filing limits. The
# appeal arrives from lit/ar-circuit.
[package]
name = "ar-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "ar-appellate-civil"
forum = "arkctapp"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "arkansas"
title = "Arkansas Court of Appeals and Supreme Court, civil appeals"
description = "A civil appeal from an Arkansas circuit court under the Arkansas Rules of Appellate Procedure--Civil and the Rules of the Supreme Court and Court of Appeals, as far as the vendored text states: notice and appealable orders, lodging the record, briefing and its word limits, oral argument or submission, decision, rehearing, petition for review, and mandate."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Arkansas Court of Appeals and Supreme Court (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

