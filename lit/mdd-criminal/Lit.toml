# The District of Maryland's Local Rules, Part II (Criminal), as a
# local-rule layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it
# declares only the periods the criminal Local Rules themselves state, or
# adopt from the civil Local Rules, and re-encodes no FRCrimP, Speedy Trial
# Act or FRAP 4(b) period (those are lit/frcrimp's). Each period is counted
# under FRCrimP 45(a), which governs "any local rule". The rules are the
# edition dated December 1, 2025 (sources/mdd). Federal habeas is
# lit/habeas's; an appeal to the Fourth Circuit is lit/frcrimp's and
# lit/ca4's.
