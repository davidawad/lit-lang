# The Southern District of Iowa's Local Rules (civil rules) as a local-rule
# layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the
# periods and limits the Local Rules themselves state and re-encodes no
# FRCP deadline. Each period is counted under FRCP 6(a), which LR 1(j)
# adopts for "a period of time ... prescribed in or allowed by a Local
# Rule". The rules are the Joint Local Rules of the Northern and Southern
# Districts of Iowa, effective December 7, 2020 (LR 1(b); S.D. Iowa
# Administrative Order 20-AO-0023-P), as served by this court
# (sources/iasd); the amendments the court has proposed are not in force
# and are not encoded. Earlier editions are not vendored, so a query
# before that date is a hole in the corpus. The criminal rules (LCrR) are
# not encoded. An appeal goes to the Eighth Circuit under lit/frap and
# lit/ca8.
[package]
name = "iasd-local-rules"
version = "0.1.0"
language = 1
pack_id = "iasd-local-rules"
forum = "iasd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Southern District of Iowa: Local Rules (civil)"
description = "The Southern District of Iowa's civil Local Rules (the joint N.D. and S.D. Iowa rules of December 7, 2020) as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion resistances and replies and their page limits, disclosure statements, the proposed scheduling order and discovery plan, final pretrial filings, class and derivative certification, motions to compel, clerk's dismissals and settled cases, costs and fees, summary judgment, objections to magistrate judges' rulings, removed actions, jury costs, and bankruptcy appeal briefs."
in_force = "2020-12-07"
known_at = "2026-10-28"
unknown_before = "2020-12-07"
jurisdiction = "United States District Court, S.D. Iowa"
counting = "frcp6"

