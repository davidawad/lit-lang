# Civil actions in the Law Division of the New Jersey Superior Court under
# the New Jersey Rules of Court, as far as the vendored text states: the
# rules the earlier outline cited, as published with amendments effective
# on or before September 1, 2026 (sources/nj-superior-law). Computation of
# time is governed by R. 1:3-1, which is not vendored, and New Jersey's
# legal holidays differ from the federal ones; lit/core has no counting
# rule for it, so the periods are stated in notes, not encoded as counted
# deadlines. An appeal hands off to the New Jersey appellate package
# (lit/nj-appellate-civil).
