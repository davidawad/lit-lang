[family.state-civil]
# State courts, civil. A state's own courts bind only in that state; the
# Supreme Court binds every state court on a federal question; whether a
# lower federal court's decision on a federal question binds a state's
# courts is that state's own rule (`federal`; none where they are
# persuasive only). A world here names its `state`. Only the states whose
# rule the cited decisions settle are listed; a state's intermediate
# appellate courts, binding its trial courts (Auto Equity Sales, Inc. v.
# Superior Court, 57 Cal. 2d 450, 455 (1962); Pardo v. State, 596 So. 2d
# 665, 666 (Fla. 1992)), are not yet located by court.
