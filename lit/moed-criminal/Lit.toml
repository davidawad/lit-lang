# The Eastern District of Missouri's Local Rules, as applied in its
# criminal cases, as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods the Local Rules
# themselves state for a criminal case and re-encodes no FRCrimP, Speedy
# Trial Act or FRAP 4(b) period. The rules apply to the cases and
# proceedings in the District Court (E.D. Mo. L.R. 1.02(A)) and have no
# separate criminal part; the criminal provisions are L.R. 2.09(B), 3.05,
# 9.03, 12.07(A), 13.01, 13.03 and 13.05(C), beside the general motion,
# exhibit and sealing rules. The cover states no edition date; the
# document's own revision table lists its latest revisions as effective
# December 15, 2025 (L.R. 2.09, 3.01, 6.03, 12.01 and the Patent Rules;
# sources/moed), so the package runs from that date and a query before it
# is a hole in the corpus. The district's civil layer is lit/moed.
# Habeas (28 U.S.C. §§ 2254, 2255) is lit/habeas's; an appeal goes
# to the Eighth Circuit under FRAP 4(b) (lit/frcrimp) and lit/ca8.
