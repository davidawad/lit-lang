# Change example (docs/litigate/CHANGE.md §4): a case order. The scheduling
# order in Cancino-Perez v. McCoy Global, Inc., No. 1:25-cv-00090 (D. Colo.),
# ECF No. 42 § 9.a, set June 20, 2025 as the deadline to join parties and
# amend pleadings (as ECF No. 45 recites). FRCP 16(b)(3)(A) requires the
# order to limit that time; the date is the order's, never counted.
