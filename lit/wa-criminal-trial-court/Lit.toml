# Criminal cases in the Washington superior courts under the Superior
# Court Criminal Rules (CrR), as far as the vendored text states. The base
# text is the rules as posted rule by rule on the Washington Courts site
# (sources/wa-criminal-trial-court); each rule PDF carries its own dates
# but the set states no consolidated edition date, and its PROVENANCE
# entry records CURRENCY UNCONFIRMED, so in_force is the retrieval date
# and an earlier query is a hole in the corpus. By the PM's standing
# ruling of 2026-10-27 such a source yields holes, not values: this
# package cites the rules only for the structure of the case and states
# no period, limit or amount from them, including the CrR 3.3 time for
# trial. The Revised Code of Washington the rules invoke is not vendored.
# The appeal hand-off cites Washington Rule of Appellate Procedure 5.2,
# bound to the RAP text lit/wa-court-of-appeals binds (latest amendment
# effective September 1, 2026; sources/wa-court-of-appeals), whose period
# is stated; lit/core has no counting rule for it, so it is stated in a
# note, not encoded.
[package]
name = "wa-superior-court-criminal"
version = "0.1.0"
language = 1
pack_id = "wa-superior-court-criminal"
forum = "wa-criminal-trial-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "washington"
title = "Washington superior courts, criminal"
description = "Criminal cases in the Washington superior courts under the Superior Court Criminal Rules, as far as the vendored text states: the structure of the case from arrest and the preliminary appearance through release, the information, arraignment, discovery and the omnibus hearing, the CrR 3.3 time-for-trial dismissal, plea or trial, post-trial motions, sentencing and relief from judgment; no period from the currency-unconfirmed rules is stated. An appeal goes to the Court of Appeals under RAP 5.2."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Washington superior courts (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.wa-crr]
title = "Washington Superior Court Criminal Rules (CrR), per-rule PDFs as posted (no consolidated edition date; retrieved 2026-10-28); CURRENCY UNCONFIRMED"
url = "https://www.courts.wa.gov/court_rules/?fa=court_rules.list&group=sup&set=CrR"
path = "sources/wa-criminal-trial-court/wa-superior-court-criminal-rules-crr-sectioned.txt"
path_sha256 = "a3c134dd9005e97e4c86f65bf0a11457c0bf4323a27e4365384d64657ba464d9"
as_of = "2026-10-28"
cite_prefixes = ["CrR"]
section_heading = "CrR {n}"

