name = "prd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "prd-criminal-local-rules"
forum = "prd-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Puerto Rico: Local Criminal Rules"
description = "The District of Puerto Rico's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): discovery motions and responses, the gathering of law enforcement notes, special voir dire and jury instruction requests, exhibit removal, the government's version of the facts, the presentence interview and departure motions, revocation disclosures, CJA vouchers, the capital-case mitigation and notice timetable, and motion oppositions, replies and page limits."
in_force = "2024-10-16"
known_at = "2026-10-28"
unknown_before = "2024-10-16"
jurisdiction = "U.S. District Court for the District of Puerto Rico (criminal)"
counting = "frcrimp45"

