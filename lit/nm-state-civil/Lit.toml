# Civil actions in the New Mexico district courts under the Rules of
# Civil Procedure for the District Courts (NMRA Rule Set 1), as published
# in the NMRA "Unannotated" collection on NMOneSource and retrieved on
# October 27, 2026 (sources/nm-state-civil; its latest amendment notes
# are effective December 31, 2025). Computation of time is NMRA 1-006(A),
# which counts a period of ten days or less in court days, excluding
# intermediate Saturdays, Sundays and legal holidays (1-006(A)(2)), and
# defines legal holidays as the days the New Mexico judiciary observes
# (1-006(A)(7)); core has no New Mexico judiciary calendar, so the rules'
# periods are stated in notes, not encoded as counted deadlines. An
# appeal hands off to lit/nm-state-appellate (NMRA 12-201).
[package]
name = "nm-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "nm-district-court-civil"
forum = "nm-state-civil"
authority = "StateRule"
jurisdiction_id = "new-mexico"
title = "New Mexico district courts, civil"
description = "Civil actions in the New Mexico district courts under the Rules of Civil Procedure for the District Courts (NMRA Rule Set 1), as far as the vendored text states: commencement and service, the time to answer, Rule 1-012(B) motions, amendment, default, scheduling and discovery, summary judgment, jury demand and trial, findings, post-trial motions, entry of judgment, costs and fees, dismissal for inactivity, and the notice of appeal (lit/nm-state-appellate)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "New Mexico district courts (civil)"

