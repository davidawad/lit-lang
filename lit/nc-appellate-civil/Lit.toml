# Civil appeals to the North Carolina Court of Appeals and review in the
# Supreme Court of North Carolina under the North Carolina Rules of
# Appellate Procedure, codified 2 September 2025 (sources/nc-appellate-civil),
# the current codification the Supreme Court's rules page lists. Rule 27(a)
# computes time; North Carolina's legal holidays and the courthouse-closed
# rule differ from the federal ones and no lit/core counting rule encodes
# them, so the rules' periods are stated in notes, not counted deadlines.
# The trial-court side is lit/nc-superior-civil.
[package]
name = "nc-appellate-court-civil"
version = "0.1.0"
language = 1
pack_id = "nc-appellate-court-civil"
forum = "nc-appellate-civil"
authority = "StateRule"
jurisdiction_id = "north-carolina"
title = "North Carolina Court of Appeals and Supreme Court, civil appeals"
description = "Civil appeals in North Carolina under the North Carolina Rules of Appellate Procedure, as far as the vendored text states: the notice of appeal and cross-appeal, the transcript contract, settling and filing the record, docketing, briefs and their word limits, calendaring and argument, publication motions, the mandate, rehearing, and appeal of right or discretionary review in the Supreme Court."
in_force = "2025-09-02"
known_at = "2026-10-28"
unknown_before = "2025-09-02"
jurisdiction = "North Carolina Court of Appeals and Supreme Court (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

