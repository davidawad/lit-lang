# Proceedings in the Foreign Intelligence Surveillance Court under its
# Rules of Procedure, effective November 1, 2010 (sources/fisc, the
# sectioned extract). FISC R. 10 computes periods in calendar days,
# excluding the trigger day and carrying a last day on a Saturday, Sunday
# or legal holiday to the next day; no counting rule in lit/core encodes
# FISC R. 10, so the rules' periods are stated in notes, not encoded as
# counted deadlines. The Foreign Intelligence Surveillance Act (50 U.S.C.
# ch. 36) is vendored nowhere in sources/, so its sections are named in
# notes and every cite binds to the FISC Rules. An appeal hands off to
# lit/fiscr.
[package]
name = "fisc"
version = "0.1.0"
language = 1
pack_id = "fisc"
forum = "fisc"
authority = "FederalRule"
title = "Foreign Intelligence Surveillance Court"
description = "Matters before the Foreign Intelligence Surveillance Court under its Rules of Procedure, as far as the vendored text states: government applications and certifications, petitions on directives under 50 U.S.C. § 1881a(h) and on production or nondisclosure orders under 50 U.S.C. § 1861(f), en banc review, and the petition for review to the Court of Review."
in_force = "2010-11-01"
known_at = "2026-10-27"
unknown_before = "2010-11-01"
jurisdiction = "Foreign Intelligence Surveillance Court"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.fisc-rules]
title = "Foreign Intelligence Surveillance Court Rules of Procedure, effective November 1, 2010"
url = "https://www.fisc.uscourts.gov/sites/default/files/FISC%20Rules%20of%20Procedure.pdf"
path = "sources/fisc/fisc-rules-of-procedure-sectioned.txt"
path_sha256 = "52659378ae78d618d899e20d75b920fe1b503d69f6bab03f2c5588c3aa7e950e"
sha256 = "f6cccb36e8711d7d5de9989ae1e3757f68c139d525117b9c18bac716c9abec15"
as_of = "2010-11-01"
cite_prefixes = ["FISC R."]
section_heading = "Rule {n}"
