# Criminal cases in the New Mexico district courts under the Rules of
# Criminal Procedure for the District Courts (NMRA Rule Set 5), as far as
# the vendored text states. The text is the NMRA Unannotated Rule Set 5,
# 2025 edition as of December 31, 2025 (sources/nm-criminal-trial-court),
# so in_force is that date; earlier editions are not vendored. New Mexico
# has no rule-based six-month trial deadline for cases filed in the
# district court: Rule 5-604 governs only cases refiled from a lower court
# and otherwise leaves speedy trial to the constitutional factors. Rule
# 5-104 counts time, for which lit/core has no counting rule, so the
# periods are stated in notes, not encoded as counted deadlines. An appeal
# hands off to the Court of Appeals or Supreme Court under NMRA 12-201
# (sources/nm-state-appellate) and lit/nm-state-appellate.
[package]
name = "nm-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "nm-criminal-trial-court"
forum = "nm-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "new-mexico"
title = "New Mexico district courts, criminal"
description = "Felony cases in the New Mexico district courts under NMRA Rule Set 5, as far as the vendored text states: arrest and the 48-hour probable cause determination, release or expedited detention, the preliminary examination or grand jury, arraignment, pretrial motions, plea or trial, post-verdict motions, sentencing and judgment. An appeal goes up under NMRA 12-201."
in_force = "2025-12-31"
known_at = "2026-10-28"
unknown_before = "2025-12-31"
jurisdiction = "New Mexico trial courts of general criminal jurisdiction (district courts)"

