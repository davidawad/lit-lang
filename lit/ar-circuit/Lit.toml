# Civil actions in the Arkansas circuit courts under the Arkansas Rules of
# Civil Procedure, current through October 1, 2026 (sources/ar-circuit).
# Computation of time is Ark. R. Civ. P. 6(a), which excludes the day of
# the event, carries a last day that falls on a Saturday, Sunday, legal
# holiday or other day the clerk's office is closed to the next day it is
# open, and, for a period of less than 14 days, excludes intermediate
# Saturdays, Sundays and legal holidays, a legal holiday including a day
# the laws of Arkansas designate; core has neither that method nor an
# Arkansas holiday calendar, so the rules' periods are stated in notes,
# not encoded as counted deadlines. An appeal hands off to lit/arkctapp
# under the Arkansas Rules of Appellate Procedure--Civil, current through
# October 1, 2026 (sources/arkctapp).
[package]
name = "ar-circuit-court-civil"
version = "0.1.0"
language = 1
pack_id = "ar-circuit-court-civil"
forum = "ar-circuit"
authority = "StateRule"
jurisdiction_id = "arkansas"
title = "Arkansas circuit court, civil"
description = "Civil actions in the Arkansas circuit courts under the Arkansas Rules of Civil Procedure, as far as the vendored text states: commencement and the time limit for service, the time to answer, Rule 12(b) motions and motion practice, default, discovery and the jury demand, summary judgment, trial, post-trial motions, entry of judgment, voluntary nonsuit, and the notice of appeal (lit/arkctapp)."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Arkansas circuit court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

