# Felony prosecutions in the California superior courts, as far as the
# vendored text states: California Rules of Court, Title 4 (Criminal
# Rules), and the Penal Code sections vendored beside them (1050, 1381,
# 1381.5, 1382 and 1473; sources/ca-criminal-trial-court). Both are
# CURRENCY UNCONFIRMED in their PROVENANCE entries (the Title 4 PDF has
# no edition date; the Penal Code pages carry only each section's own
# history), and the rest of Penal Code Part 2 is not vendored. By the PM's
# standing ruling of 2026-10-27 such sources yield holes, not values: this
# package cites them only for the structure of the case and states no
# period, limit or amount from them, including the Penal Code § 1382
# speedy-trial periods. The criminal notice of appeal is governed by
# California Rules of Court, rule 8.308, which is not vendored (the Title 8
# subset lit/ca-court-of-appeal binds holds rule 8.104 and others, not
# 8.308), so the appeal period is a hole. in_force is the retrieval date
# and an earlier query is a hole in the corpus.
