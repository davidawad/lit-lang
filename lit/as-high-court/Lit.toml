# Civil actions in the Trial Division of the High Court of American Samoa
# under the Trial Court Rules of Civil Procedure (TCRCP), as the American
# Samoa Bar Association's posting served them on 2026-10-28
# (sources/as-high-court). That posting is UNOFFICIAL (the court publishes
# no rules) and CURRENCY UNCONFIRMED: it states no edition, and the latest
# effective date it states is March 1, 1996 (Rule 11). Values are bound to
# it with that caveat (David's ruling 2026-10-28, lg-f3q8.77). TCRCP 6(a)
# excludes intermediate weekends and holidays from periods under 7 days and
# has no lit/core counting rule, so the rules' periods are stated in notes,
# not counted deadlines. An appeal hands off to lit/as-high-court-appellate.
# The packages route on lit/as-rules' trigger events (lg-u561.5).
[package]
name = "as-high-court-civil"
version = "0.1.0"
language = 1
pack_id = "as-high-court-civil"
forum = "as-high-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "american-samoa"
title = "High Court of American Samoa, Trial Division, civil"
description = "Civil actions in the Trial Division of the High Court of American Samoa under the Trial Court Rules of Civil Procedure, as far as the vendored (unofficial, currency unconfirmed) text states. An appeal hands off to the Appellate Division package (lit/as-high-court-appellate)."
in_force = "1996-03-01"
known_at = "2026-10-28"
unknown_before = "1996-03-01"
jurisdiction = "High Court of American Samoa, Trial Division (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
as-state-rules = { version = "^0.1.0", path = "../as-rules" }

