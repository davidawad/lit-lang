# The United States District Court for the Northern District of West
# Virginia's Local Rules of Civil Procedure as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods and
# limits the Local Rules of Civil Procedure themselves state and re-encodes
# no FRCP deadline. LR Gen P 5.09 computes every period under FRCP 6. The
# rules are the single master Local Rules file, "EFFECTIVE: MARCH, 2018"
# (title page; no day stated, so in_force is the first of the month), which
# the court's home page links as its Local Rules (sources/wvnd). The
# General, Criminal and Prisoner Litigation rules are out of scope. An
# appeal goes to the Fourth Circuit under lit/frap and lit/ca4.
[package]
name = "wvnd-local-rules"
version = "0.1.0"
language = 1
pack_id = "wvnd-local-rules"
forum = "wvnd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Northern District of West Virginia: Local Rules of Civil Procedure"
description = "The Northern District of West Virginia's Local Rules of Civil Procedure as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the waiver-of-service request, response and reply memoranda and their page limits, Social Security review, the Rule 26(f) meeting and report, initial and expert disclosures, case management and final pretrial conference filings, discovery answers after objections, the motion-to-compel waiver, juror questionnaires and the bill of costs."
in_force = "2018-03-01"
known_at = "2026-10-28"
unknown_before = "2018-03-01"
jurisdiction = "United States District Court, N.D. W. Va."
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "wvnd-lr"
issuer = "United States District Court for the Northern District of West Virginia"
date = "2018-03-01"
designation = "Local Rules (effective March 2018): Local Rules of Civil Procedure"

