title = "United States District Court, Middle District of Florida: Local Rules (criminal)"
description = "The Middle District of Florida's criminal-case Local Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the division in which a criminal action begins and the limits on extrajudicial disclosure before judgment or dismissal. They state no period of their own."
in_force = "2025-11-01"
