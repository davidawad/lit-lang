# The Alabama base library (lg-u561.5 pattern): the trigger events the
# Alabama civil court packages route their graphs on: lit/al-state-civil,
# lit/al-state-appellate and lit/al-supreme-court.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "al-state-rules"
version = "0.1.0"
language = 1
pack_id = "al-state-rules"
forum = "al-state-rules"
authority = "StateRule"
jurisdiction_id = "alabama"
title = "Alabama state court rules (base library)"
description = "The rule layer Alabama's civil court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2025-10-01"
known_at = "2026-10-28"
unknown_before = "2025-10-01"
jurisdiction = "Alabama state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
