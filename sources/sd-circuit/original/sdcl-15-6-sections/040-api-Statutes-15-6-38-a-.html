</style></head><body><div><p dir="ltr" class="s2043587Normal"><span xml:space="preserve" class="s2043587SENU">15-6-38(a). </span><span class="s2043587CL">Right to jury trial preserved.</span></p><p dir="ltr" class="s2043587Normal-000000"><span class="s2043587DefaultParagraphFont">The right of trial by jury as declared by S.D. Const., Art. VI, § 6 or as given by a statute of South Dakota shall be preserved to the parties inviolate.</span></p><p dir="ltr" class="s2043587Normal"><span xml:space="preserve" class="s2043587000001"> </span></p><p dir="ltr" class="s2043587Normal"><span class="s2043587SCL">Source:</span><span xml:space="preserve" class="s2043587SCL-000002">  SD RCP, Rule 38 (a), as adopted by Sup. Ct. Order March 29, 1966, effective July 1, 1966.</span></p></div></body></html>
