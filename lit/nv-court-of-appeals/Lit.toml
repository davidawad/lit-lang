# Civil appeals the Supreme Court of Nevada assigns to the Nevada Court of
# Appeals under NRAP 17(b), under the Nevada Rules of Appellate Procedure
# (amendments through May 21, 2025, sources/nv-supreme), as far as the
# vendored text states, from the assignment through the petition for
# Supreme Court review under NRAP 40B and the remittitur. Periods are
# stated in notes, not counted, as in lit/nv-supreme (NRAP 26(a) counts
# Nevada's legal holidays, which lit/core has no rule for). The appeal is
# filed in and assigned by the Supreme Court (lit/nv-supreme); the brief
# and petition limits both courts share are lit/nv-rules'.
[package]
name = "nv-court-of-appeals-civil"
version = "0.1.0"
language = 1
pack_id = "nv-court-of-appeals-civil"
forum = "nv-court-of-appeals"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "nevada"
title = "Nevada Court of Appeals, civil appeals"
description = "Civil appeals the Supreme Court of Nevada assigns to the Court of Appeals under NRAP 17(b): the transfer notice, oral argument and submission on the briefs, entry of judgment, rehearing, the petition for review by the Supreme Court under NRAP 40B and its grant or denial, costs, and the remittitur. The brief and petition limits are lit/nv-rules'."
in_force = "2025-05-21"
known_at = "2026-10-28"
unknown_before = "2025-05-21"
jurisdiction = "Nevada Court of Appeals (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the NRAP brief and petition limits and trigger events.
nv-state-rules = { version = "^0.1.0", path = "../nv-rules" }

[sources.nv-nrap]
title = "Nevada Rules of Appellate Procedure, effective July 1, 1973, including amendments through May 21, 2025 (Supreme Court of Nevada)"
url = "https://nvcourts.gov/nevada_court_rules/nevada_appellate_court_rules2/nevada_rules_of_appellate_procedure"
path = "sources/nv-supreme/nrap-sectioned.txt"
path_sha256 = "da5766edaa2c73cdcc84090d1ffb4b9c8ed94bf19d19983a8d5fcc647a0b4ee5"
sha256 = "7fae8b53b741809dbea22d8af492bc8571c51ea4c63280f488713086b358c020"
as_of = "2025-05-21"
cite_prefixes = ["NRAP"]
section_heading = "NRAP {n}"
