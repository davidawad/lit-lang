# A civil appeal from the court of common pleas to the South Carolina Court
# of Appeals (or, in the cases Rule 203(d)(1)(A) lists, the Supreme Court)
# under Part II of the South Carolina Appellate Court Rules, as the rule
# pages on sccourts.org served them on 2026-10-28 (sources/sc-appellate-civil).
# Certiorari under Rule 242 is the Supreme Court's (lit/sc-supreme-court);
# both route on lit/sc-rules' trigger events (lg-u561.5). Parts I and II
# last state an amendment by order of April 30, 2024; none of the 2026
# orders vendored beside them touches Parts I or II, and the package shares
# lit/sc-circuit-civil's in-force date. Rule 263(a) computes time like
# SCRCP 6(a) and allows no added days for mail; no lit/core counting rule
# encodes it, so the rules' periods are stated in notes, not counted
# deadlines. The decision statute the outline cited (S.C. Code § 14-3-330)
# is not vendored and is not cited. A circuit court appeal arrives from
# lit/sc-circuit-civil.
[package]
name = "sc-court-of-appeals-civil"
version = "0.1.0"
language = 1
pack_id = "sc-court-of-appeals-civil"
forum = "sc-court-of-appeals"
authority = "StateRule"
jurisdiction_id = "south-carolina"
title = "South Carolina Court of Appeals, civil"
description = "A civil appeal from the court of common pleas to the South Carolina Court of Appeals under Part II of the South Carolina Appellate Court Rules: notice, transcript, briefs and the Record on Appeal, argument, decision, rehearing, the petition for certiorari (decided in lit/sc-supreme-court) and the remittitur."
in_force = "2026-04-30"
known_at = "2026-10-28"
unknown_before = "2026-04-30"
jurisdiction = "South Carolina Court of Appeals (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the trigger events of the South Carolina Appellate Court Rules and trigger events.
sc-state-rules = { version = "^0.1.0", path = "../sc-rules" }

