title = "United States District Court for the Eastern District of Missouri: Local Rules (criminal)"
description = "The Eastern District of Missouri's Local Rules, as applied in its criminal cases, as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the criminal disclosure statement and its supplement, motion oppositions, replies and page limit, removal of exhibits after a bench trial, the sealing motion opposition, reply and stay of a denial, and the ex parte motion to seal warrant materials."
in_force = "2025-12-15"
