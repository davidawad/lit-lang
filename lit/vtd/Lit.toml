# The District of Vermont's Local Rules of Procedure (civil rules, Part I)
# as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a); L.R.
# 1(a): the rules "supplement the Federal Rules of Civil Procedure"): it
# declares only the periods and limits the Local Rules themselves state
# and re-encodes no FRCP deadline. Each period is counted under FRCP 6(a),
# which governs "any local rule". The rules are the edition dated April
# 20, 2026 (sources/dvt); earlier editions are not vendored, so a query
# before that date is a hole in the corpus. The criminal rules (Part II)
# are not encoded. An appeal goes to the Second Circuit under lit/frap.
