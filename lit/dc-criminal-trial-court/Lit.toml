# Criminal cases in the Superior Court of the District of Columbia under
# its Rules of Criminal Procedure (D.C. Super. Ct. R. Crim. P.), as far as
# the vendored text states. The base text is the "Download All Rules" PDF
# the court serves (sources/dc-criminal-trial-court/), which states no
# edition date; its PROVENANCE entry records CURRENCY UNCONFIRMED (its
# newest comment is to 2026 amendments of Rule 4, effective date not
# stated), so in_force is the retrieval date and an earlier query is a
# hole in the corpus. By the PM's standing ruling of 2026-10-27 such a
# source yields holes, not values: this package cites the rules only for
# the structure of the case (which rule governs which step) and states no
# period, limit or amount from them. Of the D.C. Code's Title 23
# (criminal procedure) only § 23-110 (collateral attack) and § 23-1322
# (pretrial detention) are vendored, also CURRENCY UNCONFIRMED and cited
# for structure only; the rest of Title 23 (the speedy-trial provision
# § 23-102 and the other release provisions §§ 23-1321 to -1331 that
# Rule 46 adopts) is not vendored. The appeal hand-off cites D.C. App. R. 4(b), whose
# vendored text has a stated edition (amendments in effect as of May 11,
# 2026; sources/dc-state-appellate/); lit/core has no counting rule for
# the D.C. Court of Appeals rules, so its period is stated in a note, not
# encoded as a counted deadline.
[package]
name = "dc-superior-court-criminal"
version = "0.1.0"
language = 1
pack_id = "dc-superior-court-criminal"
forum = "dc-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "district-of-columbia"
title = "Superior Court of the District of Columbia, criminal"
description = "Criminal cases in the Superior Court of the District of Columbia under its Rules of Criminal Procedure, as far as the vendored text states: the structure of the case from arrest and initial appearance through preliminary hearing, charge, arraignment, pretrial motions, plea or trial, post-trial motions, sentencing and judgment; no period from the currency-unconfirmed rules is stated. An appeal goes to the District of Columbia Court of Appeals under D.C. App. R. 4(b)."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Superior Court of the District of Columbia (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

