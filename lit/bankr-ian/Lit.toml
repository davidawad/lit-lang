# The Local Rules of Bankruptcy Practice and Procedure of the U.S.
# Bankruptcy Court for the Northern District of Iowa over lit/frbp (FRBP
# 9029(a); 28 U.S.C. § 2075): it declares only the periods the rules state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frbp9006).
#
# Layers, in date order: the rules as revised effective January 1, 2024
# (the consolidation), then Standing Order 26-03 (Chapter 13 Attorney Fee
# Requests), effective July 1, 2026, which vacates and replaces Standing
# Order 25-01 and sets the base ("no-look") and à la carte amounts LR
# 2016-1(b) refers to. The order states amounts and the trustee's
# seven-business-day reserve, not a period, page limit or filing deadline
# (its three months for an à la carte request is a "best practice"), so it
# changes no declaration here and needs no dated version; its vendored text
# is an OCR extract (verify numbers), so its amounts stay unencoded holes
# (sources/bankr-ian/PROVENANCE.md). No earlier edition is vendored, so a
# query before January 1, 2024 is a hole in the corpus.
[package]
name = "bankr-ian-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-ian-local-rules"
forum = "bankr-ian"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Northern District of Iowa: Local Rules of Bankruptcy Practice and Procedure"
description = "The Bankr. N.D. Iowa Local Rules of Bankruptcy Practice and Procedure as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): filing fee installments and waiver denials, motions for exception from dismissal for missing tax returns, corporate disclosure deficiencies, Rule 2004 objections, pro hac vice certificates, unclaimed funds under liquidating plans, valuation appraisals, oral confirmation objections, ballot reports, chapter 12 deposits, stay relief answers, delinquent tax returns, exemption and lien avoidance objections, reaffirmation cures, electronic filing sanctions, transcript redaction, chapter 7 limited-notice dispositions, bills of costs, settled adversary proceedings and exhibits."
in_force = "2024-01-01"
known_at = "2026-10-28"
unknown_before = "2024-01-01"
jurisdiction = "U.S. Bankruptcy Court for the Northern District of Iowa"
counting = "frbp9006"

[package.instrument]
source = "ianb-lbr"
issuer = "United States Bankruptcy Court for the Northern District of Iowa"
date = "2024-01-01"
designation = "Local Rules of Bankruptcy Practice and Procedure"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
