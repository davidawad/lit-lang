# The Middle District of Georgia's Local Criminal Rules as a local-rule
# layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares
# only the periods those rules themselves state and re-encodes no FRCrimP,
# Speedy Trial Act or FRAP period. Each period is counted under FRCrimP
# 45(a), which governs "any local rule". The rules are the Local Rules as
# amended March 7, 2022 (sources/md-ga). The Local Criminal Rules are
# supplemental and construed with the generally applicable Local Rules
# (Introduction); those are not restated here.
