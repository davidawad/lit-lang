# Supreme Court opinions the graph cites for the doctrine a rule leaves to
# case law (finality's collateral-order exception, the jurisdictional
# appeal period, a notice's contents, the standards of review). A case
# citation is outside the cite grammar, so no prefix binds it and the
# check leaves it as written; these record the opinion each names. Not
# vendored: `url` is the Library of Congress scan of the United States
# Reports, `sha256` that PDF as retrieved 2026-10-29, `as_of` the
# decision date.
