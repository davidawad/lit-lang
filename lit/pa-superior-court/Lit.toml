# Civil appeals to the Superior Court of Pennsylvania under the
# Pennsylvania Rules of Appellate Procedure (Pa. Code Title 210, Part I,
# through 56 Pa.B. 5370, sources/pa-appellate-civil). Allowance of appeal in
# the Supreme Court of Pennsylvania is lit/pa-supreme-court; the brief limits
# are lit/pa-rules' (lg-u561.5). The appeal comes from the common pleas
# package (lit/pa-cp-civil).
[package]
name = "pa-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "pa-superior-court-civil"
forum = "pa-superior-court"
authority = "StateRule"
jurisdiction_id = "pennsylvania"
title = "Superior Court of Pennsylvania, civil appeals"
description = "Civil appeals to the Superior Court of Pennsylvania under the Pennsylvania Rules of Appellate Procedure: the notice, record, briefs, argument, decision, reargument, the petition for allowance of appeal (decided in lit/pa-supreme-court) and the outcome. The brief limits are lit/pa-rules'."
in_force = "2026-08-08"
known_at = "2026-10-28"
unknown_before = "2026-08-08"
jurisdiction = "Superior Court of Pennsylvania (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the brief word limits of Pa.R.A.P. 2135 and trigger events.
pa-state-rules = { version = "^0.1.0", path = "../pa-rules" }

