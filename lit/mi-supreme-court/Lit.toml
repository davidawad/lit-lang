# Civil appeals in the Michigan Supreme Court by application for leave to
# appeal from the Court of Appeals, under subchapter 7.300 of the Michigan
# Court Rules of 1985, as updated September 2, 2026 (sources/mi-circuit-court,
# the one vendored edition of Chapters 1-9, shared with lit/mi-circuit-court
# and lit/mi-appellate). Computation of time is MCR 1.108; lit/core has no
# counting rule or holiday calendar for Michigan, so the periods are stated
# in notes, not encoded as counted deadlines. Bypass applications before a
# Court of Appeals decision (MCR 7.305(C)(1)), original proceedings (MCR
# 7.306), certified questions and advisory opinions (MCR 7.308) are not
# modeled. The application comes from lit/mi-appellate.
[package]
name = "mi-supreme-court-civil"
version = "0.1.0"
language = 1
pack_id = "mi-supreme-court-civil"
forum = "mi-supreme-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "michigan"
title = "Michigan Supreme Court, civil appeals"
description = "A civil application for leave to appeal from the Court of Appeals under MCR 7.305 and, on a grant or an order for argument on the application, the appeal under subchapter 7.300, as far as the vendored text states: the time, grounds and contents of the application, its answer and reply, the Court's decision on it, merits briefing and its times, the calendar and oral argument, the opinion and judgment, and rehearing."
in_force = "2026-09-02"
known_at = "2026-10-28"
unknown_before = "2026-09-02"
jurisdiction = "Michigan Supreme Court"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
mi-state-rules = { version = "^0.1.0", path = "../mi-rules" }

[sources.mcr]
title = "Michigan Court Rules of 1985, Chapters 1-9 (updated September 2, 2026)"
url = "https://www.courts.michigan.gov/siteassets/rules-instructions-administrative-orders/michigan-court-rules/michigan-court-rules.pdf"
