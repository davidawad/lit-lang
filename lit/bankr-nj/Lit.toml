# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the District
# of New Jersey over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods and page limits the Local Bankruptcy Rules themselves
# state and re-encodes no FRBP period. Each period is counted under
# FRBP 9006(a), the FRCP 6(a) method (core's frcp6).
#
# Layers: the Local Bankruptcy Rules dated August 1, 2026, the effective
# date the 2026 Comment to LBR 2016-5 states, are the only vendored text
# (sources/bankr-nj/PROVENANCE.md), a consolidation whose Comments date each
# earlier amendment. The court's general orders table lists General Order
# 2025-05 (claims agents, pending a local rule), which precedes this
# edition and states no period the rules amend, so the consolidation is the
# only layer. No earlier edition is vendored, so a query before August 1,
# 2026 is a hole in the corpus.
[package]
name = "bankr-nj-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-nj-local-rules"
forum = "bankr-nj"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of New Jersey: Local Bankruptcy Rules"
description = "The Bankr. D.N.J. Local Bankruptcy Rules (effective August 1, 2026) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): the fee installment after a denied waiver, notice of a debtor's death, the subchapter V election, objections to late employment applications, auctioneer, monthly, final and chapter 13 hourly compensation, notices when the stay becomes applicable, the chapter 11 bar date, unclaimed funds, ballots and the balloting certification, chapter 11 distributions, subchapter V closing, chapter 13 stay and default opposition, stay-status motions, the discharge certification, adjournments, auction and liquidator reports, amended pleadings, pretrial conference submissions and initial disclosures, revised judgments, motion filing, opposition and reply (LBR 9013-2), proposed orders, mediation and its 15-page statement limit, consent orders, removal and transcript redaction."
in_force = "2026-08-01"
known_at = "2026-10-28"
unknown_before = "2026-08-01"
jurisdiction = "U.S. Bankruptcy Court for the District of New Jersey"
counting = "frcp6"

[package.instrument]
source = "bankr-nj-lbr"
issuer = "United States Bankruptcy Court for the District of New Jersey"
date = "2026-08-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

