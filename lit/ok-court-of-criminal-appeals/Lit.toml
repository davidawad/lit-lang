title = "Oklahoma Court of Criminal Appeals"
description = "Regular appeals to the Oklahoma Court of Criminal Appeals under its Rules, as far as the vendored text states: the direct appeal begun by a notice of intent to appeal and perfected within 90 days, the certiorari appeal from a guilty or nolo contendere plea, the record, briefing and page limits, submission or oral argument, decision, rehearing and mandate. Certiorari to the Supreme Court of the United States is a federal hand-off under Sup. Ct. R. 13."
in_force = "2026-10-28"
