  | (package(litigate-lower) & binary(engine_clock) & test(=a_counting_version_that_does_not_lower_is_an_error))
  | (package(litigate-lower) & binary(engine_clock) & test(=units_and_directions))
  | (package(litigate-lower) & binary(errors) & test(=an_instance_stake_lowers_to_the_value_its_transform_binds))
