# Criminal cases in the Superior Court of Guam under the Criminal
# Procedure Code (Title 8, Guam Code Annotated) and the Superior Court's
# Criminal Procedure Rules (sources/gu-criminal-trial-court). Title 8 is
# the Compiler of Laws' chapter files (table of contents dated October
# 26, 2026), whose PROVENANCE entry records CURRENCY UNCONFIRMED; by the
# PM's standing ruling of 2026-10-27 such a source yields holes, not
# values, so this package cites 8 GCA for the structure of each step and
# states no period from it, including the § 80.60 speedy-trial periods.
# The Superior Court's local Criminal Procedure Rules (one rule, CR 1.1)
# are updated through Promulgation Order PRM13-002-02 of April 9, 2014,
# effective April 1, 2014, and their periods are stated. Criminal appeals
# go under Guam Rule of Appellate Procedure 4(b), bound to the text
# lit/gu-supreme binds (as of February 24, 2014; sources/gu-supreme), and
# its period is stated. in_force is the retrieval date, because the
# Title 8 text has no confirmed edition, and an earlier query is a hole in
# the corpus. lit/core has no counting rule for these, so the periods are
# stated in notes, not encoded as counted deadlines.
[package]
name = "gu-superior-court-criminal"
version = "0.1.0"
language = 1
pack_id = "gu-superior-court-criminal"
forum = "gu-criminal-trial-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "guam"
title = "Superior Court of Guam, criminal"
description = "Criminal cases in the Superior Court of Guam under the Criminal Procedure Code (8 GCA) and the court's Criminal Procedure Rules: arrest and first appearance, release, the preliminary examination or grand jury, indictment, information or complaint, arraignment and pleas, pretrial motions and discovery, the § 80.60 dismissal for time, trial, post-verdict motions, sentencing and the Guam R. App. P. 4(b) notice of appeal; 8 GCA periods are holes (currency unconfirmed), the local rule and appellate periods are stated."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Superior Court of Guam (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

