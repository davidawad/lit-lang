# The Arkansas base library (lg-u561.5 pattern): the trigger events the
# Arkansas court packages route their graphs on: lit/ar-supreme-court and
# lit/ar-workers-compensation-commission. It declares no period: the
# rules' periods are stated in the court packages' notes. No procedure of
# its own.
[package]
name = "ar-state-rules"
version = "0.1.0"
language = 1
pack_id = "ar-state-rules"
forum = "ar-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "arkansas"
title = "Arkansas state court rules (base library)"
description = "The rule layer Arkansas's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2025-12-15"
known_at = "2026-10-28"
unknown_before = "2025-12-15"
jurisdiction = "Arkansas state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
