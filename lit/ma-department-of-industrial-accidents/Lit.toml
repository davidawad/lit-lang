# Workers' compensation proceedings before the Massachusetts Department of
# Industrial Accidents (an administrative judge, then the reviewing board),
# and the appeal from the reviewing board, from the claimant's side. The
# Department's procedure (G.L. c. 152) is not vendored, so its cites,
# periods and fees stay holes. The appeal from the reviewing board, a
# "lower court" under Mass. R. A. P. 1(c), is taken under Mass. R. A. P.
# 3(a) and 4(a) (sources/ma-appeals-sjc), whose period applies unless a
# statute provides otherwise; the statute (G.L. c. 152, § 12) is not
# vendored, so the period is a hole.
