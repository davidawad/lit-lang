# The United States District Court for the Northern District of
# California's Civil Local Rules as a local-rule layer over lit/frcp (28
# U.S.C. § 2071; FRCP 83(a)): it declares only the periods and limits the
# Civil Local Rules themselves state and re-encodes no FRCP deadline. FRCP
# 6(a) computes a period stated in a local rule. The rules are the Civil
# Local Rules effective October 2, 2026 (sources/fed-ndcal), linked from
# the court's local-rules page; the criminal, admiralty, patent and ADR
# local rules are not vendored and are out of scope. An appeal goes to the
# Ninth Circuit under lit/frap and lit/ca9.
