# Civil appeals from the Pennsylvania courts of common pleas under the
# Pennsylvania Rules of Appellate Procedure as published in Pa. Code Title
# 210 Part I, effective through 56 Pa.B. 5370 (August 8, 2026)
# (sources/pa-appellate-civil), then the petition for allowance of appeal
# to the Supreme Court of Pennsylvania. Computation of time is governed by
# Pa.R.A.P. 107 and Pa.R.J.A. 107 (Pa.R.A.P. 903, comment); Pa.R.J.A. 107
# is not vendored and lit/core has no counting rule for it, so the periods
# are stated in notes, not encoded as counted deadlines. The appeal comes
# from the common pleas package (lit/pa-cp-civil).
[package]
name = "pa-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "pa-appellate-civil"
forum = "pa-appellate-civil"
authority = "StateRule"
title = "Pennsylvania Superior Court and Supreme Court, civil appeals"
description = "Civil appeals under the Pennsylvania Rules of Appellate Procedure, as far as the vendored text states: the final order and the notice of appeal and its time, the statement of errors and the trial court's opinion, transmission of the record, briefing and its word limits, argument or submission, the appellate court's order, reargument, the petition for allowance of appeal, and remand of the record."
in_force = "2026-08-08"
known_at = "2026-10-28"
unknown_before = "2026-08-08"
jurisdiction = "Pennsylvania Superior Court; Supreme Court of Pennsylvania"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

