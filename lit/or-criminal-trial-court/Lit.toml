# Criminal prosecutions in the Oregon circuit courts under Title 14 of the
# Oregon Revised Statutes, Procedure in Criminal Matters (ORS chapters 131
# to 138), the "2025 EDITION" chapter pages as served by the Oregon
# Legislature (sources/or-criminal-trial-court). The edition states a
# year, not a day, so in_force is the retrieval date and an earlier query
# is a hole in the corpus. Oregon criminal procedure is statutory: ORS
# 135.746 to 135.752 are the speedy-trial provisions, and appeals and
# post-conviction relief are in ORS chapter 138 (in the same set). The
# Oregon Rules of Civil Procedure that ORS 136.535 applies to new-trial
# and arrest-of-judgment motions (ORCP 64) are not vendored. lit/core has
# no counting rule for these statutes, so the periods are stated in notes,
# not encoded as counted deadlines.
[package]
name = "or-circuit-court-criminal"
