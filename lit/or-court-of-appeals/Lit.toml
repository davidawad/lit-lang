# Civil appeals from the Oregon circuit courts to the Oregon Court of
# Appeals, and Supreme Court review of its decisions, under the Oregon
# Rules of Appellate Procedure, as far as the vendored text states: the
# court's consolidated edition with permanent amendments effective
# January 1, 2025 and the temporary amendments the court incorporated
# through October 16, 2026 (version date September 3, 2026;
# sources/or-court-of-appeals). Time is computed under ORAP 1.25, whose
# legal holidays are those of ORS 187.010 and 187.020; lit/core has no
# counting rule for them, so the periods are stated in notes, not encoded
# as counted deadlines. The appeal statutes (ORS 19.205, 19.255, 19.370)
# and the fee statute (ORS 21.010) are not vendored.
[package]
name = "or-appellate"
version = "0.1.0"
language = 1
pack_id = "or-appellate"
forum = "or-court-of-appeals"
authority = "StateRule"
jurisdiction_id = "oregon"
title = "Oregon Court of Appeals and Supreme Court, civil appeals"
description = "Civil appeals from the Oregon circuit courts under the Oregon Rules of Appellate Procedure, as far as the vendored text states: the notice of appeal and its contents, filing and appearance fees, summary determination of appealability, the record and transcript, the briefs with their 49- and 21-day times and their word limits, oral argument or submission on the briefs, reconsideration in the Court of Appeals, the 35-day petition for Supreme Court review, allowance of review, reconsideration in the Supreme Court, costs and disbursements, and the appellate judgment."
in_force = "2026-10-16"
known_at = "2026-10-28"
unknown_before = "2026-10-16"
jurisdiction = "Oregon Court of Appeals and Supreme Court (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

