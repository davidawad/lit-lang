# The Northern District of Georgia's Criminal Local Rules (LCrR) as a
# local-rule layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it
# declares only the periods those rules themselves state and re-encodes no
# FRCrimP, Speedy Trial Act or FRAP period. Each period is counted under
# FRCrimP 45(a), which governs "any local rule". The rules are the edition
# the court lists as "Criminal Rules, Updated 04/02/2024"; the PDF carries
# no edition date (sources/nd-ga), so 2024-04-02 is the listing date.
