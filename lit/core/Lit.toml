# The litigate standard library (DESIGN §4, SPEC §4.3): domain types, the
# role taxonomy, the authority lattice, the federal legal-holiday calendars,
# and the counting rules (FRCP 6, FRCrimP 45, RCFC 6, FRAP 26, Sup. Ct. R.
# 30, 19 C.F.R. 201.14 via 210.6(a)) with their earlier versions. Every
# package may import `core` without declaring it. It declares several
# counting rules and names none here, so it is a counting-rule library (SPEC
# §8.2): its pack names no rule and its clock fragment holds them all.
[package]
name = "core"
version = "1.0.0"
language = 1
pack_id = "litigate-core"
forum = "core"
authority = "FederalRule"
title = "litigate core library"
description = "Shared types, roles, authority lattice, holiday calendars and counting rules; no procedure of its own."
in_force = "1963-07-01"
known_at = "2026-10-22"

[package.roles]
Court = "nature"

