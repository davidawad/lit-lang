# Exxon Shipping Co. v. Baker, 554 U.S. 471 (2008) (lg-wvlf.5; public
# record). The petition for certiorari against the base layer of the
# 2005-2013 Rules of the Supreme Court (docs/litigate/change/scotus-base),
# from the Court's docket No. 07-219 (https://www.supremecourt.gov/search.
# aspx?filename=/docketfiles/07-219.htm, as served in sources/change-
# corpus/dockets/; the case's `docket N` is the row of its Proceedings and
# Orders). The Ninth Circuit decided the appeal December 22, 2006 and
# denied rehearing May 23, 2007 (docket header); the petition was filed
# August 20, 2007 (row 1). Rule 13.3 (2005 Rules) runs the 90 days from
# the denial of rehearing: due Tuesday, August 21, 2007. The Court granted
# the petition in part October 29, 2007 and decided the case June 25,
# 2008. The petition was docketed and granted, so the Court held it timely
# (Rule 13.2). The merits holding edits no period the library models, so
# no precedent layer is added. Re-record with `litigate test tests/expect
# --bless`, and say why in the commit.

paths = ["docs/litigate/change/scotus-base"]

[[run]]
world = "ca9.world"

[run.expect.w1]
verdict = "clean"
in_force = ["change-certiorari-base"]

[run.expect.w1.outcome]
petition = "timely"

[[run.expect.w1.deadlines]]
deadline = "change-certiorari-base::petition-period"
trigger = "2006-12-22"
due = "2007-03-22"
status = "superseded"
cite = "Sup. Ct. R. (2005) 13.1"
counted_by = "Sup. Ct. R. (2005) 30.1"

[[run.expect.w1.deadlines]]
deadline = "change-certiorari-base::petition-period"
trigger = "2007-05-23"
due = "2007-08-21"
status = "discharged"
cite = "Sup. Ct. R. (2005) 13.1"
counted_by = "Sup. Ct. R. (2005) 30.1"
