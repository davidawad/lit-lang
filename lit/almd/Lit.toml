# The Middle District of Alabama's Local Rules (Part 1, civil rules and
# general provisions) as a local-rule layer over lit/frcp (28 U.S.C. §
# 2071; FRCP 83; LR 1.1(c)): it declares only the periods the Local Rules
# themselves state and re-encodes no FRCP deadline. Each period is counted
# under FRCP 6(a), which governs "any local rule". The rules are the
# edition effective December 1, 2010, as amended October 1, 2011 (LR
# 83.4(g)) (sources/md-ala); only that amended text is vendored, so a
# query before October 1, 2011 is a hole in the corpus. The criminal rules (Part 2,
# M.D. Ala. LCrR) are not encoded. An appeal goes to the Eleventh Circuit
# under lit/frap.
