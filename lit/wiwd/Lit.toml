forum = "wiwd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Western District of Wisconsin: Local Rules"
description = "The Western District of Wisconsin's Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the period within which litigants consider alternative dispute resolution after the defendants appear."
in_force = "2018-05-01"
known_at = "2026-10-28"
unknown_before = "2018-05-01"
jurisdiction = "United States District Court, W.D. Wisconsin"
counting = "frcp6"

