title = "Minnesota District Court, criminal (felonies and gross misdemeanors)"
description = "Felony and gross misdemeanor prosecutions in the Minnesota district courts under the Minnesota Rules of Criminal Procedure, as far as the vendored text states: the appearance within 36 hours of a warrantless arrest and the 48-hour probable cause determination, the first (Rule 5) and second (Rule 8) appearances, the Omnibus Hearing and pretrial motions, the trial-date demand (trial within 60 days, release after 120), trial, motions for acquittal, new trial and to vacate, sentencing, and the defendant's 90-day appeal to the Court of Appeals."
