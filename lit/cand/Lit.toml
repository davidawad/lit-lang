kind = "local-rule"
title = "United States District Court for the Northern District of California: Civil Local Rules"
description = "The Northern District of California's Civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): changes of time, the 35-day motion notice, opposition and reply and their page limits, the bar on papers after the reply, the administrative or regular characterization of a motion, objections to reply evidence, sanctions motions, administrative motions, discovery motions after the cut-off, costs, attorney's fees, magistrate judge orders and consent, and sealing another party's material."
in_force = "2026-10-02"
