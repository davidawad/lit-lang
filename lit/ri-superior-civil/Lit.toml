# Civil actions in the Rhode Island Superior Court under the Superior Court
# Rules of Civil Procedure (the edition footed "February 2024", served as a
# PDF created April 10, 2024, sources/ri-superior-civil). Computation of
# time is Super. R. Civ. P. 6(a): the last day rolls forward past a
# Saturday, Sunday or legal holiday, and lit/core has no Rhode Island
# counting rule or holiday calendar, so the rules' periods are stated in
# notes, not encoded as counted deadlines. An appeal hands off to
# lit/ri-supreme (Article I of the Supreme Court Rules, revised February
# 17, 2026, sources/ri-supreme); the package is in force from that
# revision, when both vendored editions were current.
[package]
name = "ri-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "ri-superior-court-civil"
forum = "ri-superior-civil"
authority = "StateRule"
jurisdiction_id = "rhode-island"
title = "Rhode Island Superior Court, civil"
description = "Civil actions in the Rhode Island Superior Court under the Superior Court Rules of Civil Procedure, as far as the vendored text states: commencement and the time limit for service, the time to answer and its alteration by a Rule 12 motion, default, the jury demand, summary judgment, trial and post-trial motions, entry of judgment, costs, relief from judgment, and the notice of appeal, which hands off to the Rhode Island Supreme Court package (lit/ri-supreme)."
in_force = "2026-02-17"
known_at = "2026-10-28"
unknown_before = "2026-02-17"
jurisdiction = "Rhode Island Superior Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

