# United States v. Arthrex, Inc., 594 U.S. 1 (2021) (lg-wvlf.3, ported
# from tests/cases/arthrex.json; public record). Certiorari denied, No.
# 22-639 (May 22, 2023); the claims stay cancelled.
#
# Sources: Arthrex, Inc. v. Smith & Nephew, Inc., 35 F.4th 1328 (Fed. Cir.
# 2022) (history of the IPR, the first appeal, and the Director-review
# remand)
# <https://www.cafc.uscourts.gov/opinions-orders/18-2140.OPINION.5-27-2022_1957812.pdf>;
# Supreme Court docket No. 19-1434
# <https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/19-1434.html>;
# United States v. Arthrex, Inc., 594 U.S. 1 (2021) (opinion)
# <https://www.law.cornell.edu/supremecourt/text/19-1434>; Supreme Court
# docket No. 22-639 (Arthrex, Inc. v. Smith & Nephew, Inc.)
# <https://www.supremecourt.gov/docket/docketfiles/html/public/22-639.html>.
#
# From 2018-05-02 (the final written decision): 37 C.F.R. § 90.3(a): 63
# days. May 2 + 29 = May 31; + 30 = Jun 30 (59); + 4 = Jul 4 (63),
# Independence Day (a Wednesday), so it rolls to Thursday Jul 5. Due
# 2018-07-05. Notice-of-appeal date not found; the appeal is No.
# 2018-2140.
#
# From 2022-08-11 (denial of rehearing after the second appeal (Sup. Ct.
# R. 13.3)): Sup. Ct. R. 13.1: 90 days. Aug 11 + 20 = Aug 31; + 30 = Sep
# 30 (50); + 31 = Oct 31 (81); + 9 = Nov 9 (90), a Wednesday. Due
# 2022-11-09. Petition filed 2023-01-06, about two months after the
# unextended date. An extension under Sup. Ct. R. 13.5 is the usual
# explanation, but none was found in the sources read. Recorded as due
# unknown: lit/core declares Sup. Ct. R. 30.1 only from its 2023 edition,
# and the earlier editions are not vendored, so no counting rule is in
# force on the trigger date.
#
# Re-record with `litigate test tests/expect --bless`, and say why in the
# commit.

