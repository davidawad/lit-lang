# The Minnesota base library (lg-u561.5): what the Minnesota civil court
# packages share: the brief and petition length limits of Minn. R. Civ.
# App. P. 117 and 132.01 (sources/minnctapp), which bind in the Court of
# Appeals and the Supreme Court alike, the briefs' paper events, and the
# trigger events the graphs of lit/mn-district, lit/minnctapp and
# lit/mn-supreme-court route on. It declares no period: the rules' periods
# are stated in the court packages' notes. No procedure of its own.
[package]
name = "mn-state-rules"
version = "0.1.0"
language = 1
pack_id = "mn-state-rules"
forum = "mn-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "minnesota"
title = "Minnesota state court rules (base library)"
description = "The rule layer Minnesota's civil court packages share: the brief and petition length limits of Minn. R. Civ. App. P. 117 and 132.01, the briefs' paper events, and the trigger events their graphs route on. No procedure of its own."
in_force = "2025-04-01"
known_at = "2026-10-28"
unknown_before = "2025-04-01"
jurisdiction = "Minnesota state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

