# The U.S. District Court for the Western District of Louisiana's local
# criminal rules (LCrR) as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only what the local criminal rules
# themselves state, or adopt from the local civil rules (LCrR 47.1(a)
# applies the form requirements of LR 7.1, 7.4, 7.5, 7.9, 10.1 and 11.1 to
# criminal motions), and re-encodes no FRCrimP, Speedy Trial Act or FRAP
# 4(b) period (one source of truth: lit/frcrimp). The local criminal rules
# leave every filing period to the court (LCrR 32.2, 47.1(a), (b)), so this
# layer states no counted period. The rules are the edition the court
# serves as current ("Effective: May 7, 2024"; sources/lawd), so in_force
# is that date; earlier editions are not vendored, so a query before it is
# a hole in the corpus. The vendored text is sectioned by rule group
# (`## LCrR 47` holds LCrR 47.1), so cites name the group. The court's
# Speedy Trial Act plan (18 U.S.C. § 3165) is not vendored. An appeal goes
# to the Fifth Circuit under lit/frcrimp's FRAP 4(b) period and lit/ca5.
