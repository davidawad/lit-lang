# Civil actions in the Kansas district courts under the Kansas Code of
# Civil Procedure (K.S.A. chapter 60), as far as the vendored sections
# state (sources/ks-state-civil: the Kansas Revisor of Statutes' current
# pages, retrieved 2026-10-27). Computation of time is K.S.A. 60-206,
# which is not vendored, and lit/core has no Kansas counting rule, so the
# periods are stated in notes, not encoded as counted deadlines. An appeal
# hands off to the Kansas appellate package (lit/ks-appellate).
[package]
name = "ks-district-civil"
version = "0.1.0"
language = 1
pack_id = "ks-district-civil"
forum = "ks-district"
authority = "StateRule"
title = "Kansas district courts, civil"
description = "Civil actions in the Kansas district courts under the Kansas Code of Civil Procedure, as far as the vendored sections state: commencement and service, the answer, K.S.A. 60-212 motions and amendment, default judgment, the case management conference, discovery and expert disclosure, summary judgment, jury demand and trial, judgment as a matter of law and new trial, entry of judgment, dismissal, and the appeal (lit/ks-appellate)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Kansas district courts (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.ksa-60]
title = "Kansas Statutes Annotated, chapter 60 (Code of Civil Procedure) and K.S.A. 20-3018, cited sections, as published by the Kansas Revisor of Statutes"
url = "https://www.ksrevisor.gov/statutes/ksa_ch60.html"
path = "sources/ks-state-civil/ks-ksa-cited-sections.txt"
path_sha256 = "7674b42587ca255503d7b100fb801a1e910274fc5629fb0ea646354d6a613d87"
as_of = "2026-10-27"

[[cite_syntax.rules]]
prefixes = ["K.S.A. 60-"]
heading = "K.S.A. 60-{}"
source = "ksa-60"
