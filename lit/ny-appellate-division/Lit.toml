# A civil appeal to the Appellate Division of the New York Supreme Court
# under the CPLR sections vendored in
# sources/ny-appellate-division-court-of-appeals (CPLR 5513, 5517, 5522,
# 5523, 5525 and 5602, each the most recent revision the NY Senate Open
# Legislation site showed on 2026-10-27) and the Practice Rules of the
# Appellate Division, 22 NYCRR Part 1250, as amended November 25, 2019,
# the edition the Second Department links (sectioned in the pod). Later
# amendments to Part 1250, if any, are not vendored. Periods are stated in
# notes, not encoded as counted deadlines: their computation (General
# Construction Law §§ 20, 25-a; CPLR 2103) is not vendored and core has no
# New York holiday calendar. The Court of Appeals' own rules (22 NYCRR
# Part 500) are not vendored; further review ends at the leave decision
# (leave sought in the Court of Appeals itself: lit/ny-court-of-appeals).
# The trial-level procedure is lit/ny-supreme-civil.
[package]
name = "ny-appellate-division-civil-appeals"
version = "0.1.0"
language = 1
pack_id = "ny-appellate-division-civil-appeals"
forum = "ny-appellate-division"
authority = "StateRule"
jurisdiction_id = "new-york"
title = "New York Supreme Court, Appellate Division: civil appeals"
description = "A civil appeal to the Appellate Division under the CPLR and 22 NYCRR Part 1250, as far as the vendored text states: the time to appeal, the informational statement, the transcript, perfection and its six-month deadline, briefing and brief word limits, argument, decision and restitution, reargument, and leave to appeal to the Court of Appeals."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "New York Supreme Court, Appellate Division"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
ny-state-rules = { version = "^0.1.0", path = "../ny-rules" }

[sources.ny-cplr-appeals]
