# The District of Nebraska's Criminal Rules (NECrimR) as a local-rule
# layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares
# only the periods the Criminal Rules themselves state and re-encodes no
# FRCrimP, Speedy Trial Act or FRAP 4(b) period. FRCrimP 45 computes
# every period in them (NECrimR 45.1). The rules are the Nebraska
# Criminal Rules "Effective December 1, 2025" (sources/d-neb), listed by
# the court as in effect on and after that date; the 2026 proposed rules
# are not in force and are not encoded, and earlier editions are not
# vendored, so a query before that date is a hole in the corpus. lit/ned
# declares the civil layer. Habeas (28 U.S.C. §§ 2254, 2255) is
# lit/habeas's; an appeal goes to the Eighth Circuit under FRAP 4(b)
# (lit/frcrimp) and lit/ca8.
[package]
name = "ned-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "ned-criminal-local-rules"
forum = "ned-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the District of Nebraska: Criminal Rules (NECrimR)"
description = "The District of Nebraska's Criminal Rules (NECrimR, effective December 1, 2025) as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): grand jury subpoena challenges, change of plea interpreter requests and objections, motion responses, discovery notices and disclosures, Marshal delivery of subpoenas and writs, peremptory challenge and interpreter requests, the bill of costs, the presentence schedule, post-trial motion responses, intercepted communications at trial, counsel notices and CJA vouchers, joint representation responses, electronic signature disputes, file and exhibit returns, and opposing briefs on objections to a magistrate judge's ruling."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "United States District Court, D. Nebraska (criminal)"
counting = "frcrimp45"

