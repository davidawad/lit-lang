# The Local Rules of the U.S. Bankruptcy Court for the Eastern District of
# Tennessee over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods the rules themselves state and re-encodes no FRBP
# period. Each period is counted under FRBP 9006(a), the FRCP 6(a) method
# (core's frcp6).
#
# Layers, in date order: the Local Rules effective May 17, 2005 as amended
# December 1, 2024 (the consolidation), then General Order 2025-01
# (entered November 25, 2025), which amends LBR 9013-1(h) effective
# December 1, 2025 and adds the 28-day objection time of (h)(3)(x), a
# period dated from that day (local-rules.lit). General Order 2026-01 is a
# proposal out for comment, not in force, and is not vendored. The earlier
# editions are not vendored, so a query before December 1, 2024 is a hole
# in the corpus.
[package]
name = "bankr-tne-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-tne-local-rules"
forum = "bankr-tne"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Eastern District of Tennessee: Local Rules"
description = "The Bankr. E.D. Tenn. Local Rules (as amended December 1, 2024), with General Order 2025-01 as a dated layer, as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): the involuntary master address list, conversion from chapter 13 to chapter 7 (debtor filings, trustee duties, filing fee), chapter 13 attorney fees on dismissal or conversion, substitute counsel's disclosure, the trustee's perfection notice, chapter 13 rejection and surrender claims, chapter 11 and Subchapter V claim periods, the domestic support certification, transcript redaction, reports of sale, adversary motion responses and replies (LBR 7007-1), summary judgment additional facts, reconsideration of ex parte orders, the passive notice objection times (LBR 9013-1(h)(3)), post-hearing motion responses, and mediation reports and mediator selection."
in_force = "2024-12-01"
known_at = "2026-10-28"
unknown_before = "2024-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Eastern District of Tennessee"
counting = "frcp6"

[package.instrument]
source = "tneb-lbr"
issuer = "United States Bankruptcy Court for the Eastern District of Tennessee"
date = "2024-12-01"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

