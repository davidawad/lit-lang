# Civil appeals to the Wisconsin Court of Appeals under Wis. Stat. ch. 808
# and the Rules of Appellate Procedure, ch. 809, as published and certified
# October 1, 2026 (sources/wisctapp). A petition for review is the Supreme
# Court's (lit/wi-supreme-court); the brief and motion limits are
# lit/wi-rules' (lg-u561.5). Computation of time is Wis. Stat. § 801.15(1)
# and (5), which § 809.82(1) applies; lit/core has no counting rule for it,
# so the periods are stated in notes, not encoded as counted deadlines. The
# appeal comes from the circuit court package (lit/wi-circuit).
[package]
name = "wi-court-of-appeals-civil"
version = "0.1.0"
language = 1
pack_id = "wi-court-of-appeals-civil"
forum = "wi-court-of-appeals"
authority = "StateRule"
jurisdiction_id = "wisconsin"
title = "Wisconsin Court of Appeals, civil appeals"
description = "Civil appeals to the Wisconsin Court of Appeals under Wis. Stat. ch. 808 and the Rules of Appellate Procedure, ch. 809 (October 1, 2026): notice, appellate jurisdiction, record, briefing, argument, decision, reconsideration, the petition for review (decided in lit/wi-supreme-court) and remittitur. The brief and motion limits are lit/wi-rules'."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Wisconsin Court of Appeals (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the brief, reconsideration-motion and review-petition limits of Wis. Stat. ch. 809 and the papers they govern and trigger events.
wi-state-rules = { version = "^0.1.0", path = "../wi-rules" }

