kind = "local-rule"
title = "United States District Court for the Southern District of California: Civil Local Rules"
description = "The Southern District of California's Civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion filing, opposition and reply before the hearing and their page limits, Social Security briefing, reconsideration, the early neutral evaluation conference, pretrial papers and meetings, and costs and their review."
in_force = "2026-06-01"
known_at = "2026-10-28"
