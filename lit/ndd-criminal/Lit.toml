title = "United States District Court for the District of North Dakota: Criminal Rules"
description = "The District of North Dakota's Criminal Rules (effective October 6, 2025) as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): grand jury subpoena challenges, requested jury instructions, sentencing memoranda and responses, motion responses, replies and page limits, motions to reduce sentence, the sealing period of search warrant documents, and responses to objections to a magistrate judge's ruling."
in_force = "2025-10-06"
known_at = "2026-10-28"
