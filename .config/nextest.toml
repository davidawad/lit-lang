  | (package(litigate-import) & binary(roundtrip) & test(=import_is_deterministic_and_independent_of_input_order))
  | (package(litigate-import) & binary(roundtrip) & test(=links_round_trip))
  | (package(litigate-import) & binary(roundtrip) & test(=outputs_carry_no_absolute_paths))
  | (package(litigate-import) & binary(roundtrip) & test(=the_editor_grammar_parses_every_output))
  | (package(litigate-import) & binary(sema) & test(=every_imported_package_passes_core_checks_and_lowers_to_hir))
  | (package(litigate-lower) & binary(basis) & test(=a_cost_or_a_duration_alone_is_a_number_the_scenario_rests_on))
