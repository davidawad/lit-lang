# Civil actions in the Minnesota district courts under the Minnesota Rules
# of Civil Procedure, with amendments effective July 1, 2025
# (sources/mn-district). Computation of time is Minn. R. Civ. P. 6.01,
# which counts like FRCP 6(a) but takes its legal holidays from Minn.
# Stat. § 645.44, subd. 5, and any day the United States Mail does not
# operate, and adds 3 days after service by mail and 1 day after service
# completed after 5:00 p.m. (Rule 6.01(d), (e)); lit/core has no counting
# rule for it, so the periods are stated in notes, not encoded as counted
# deadlines. Motion deadlines are governed by the General Rules of Practice
# (Rule 6.04), which are not vendored. An appeal hands off to the
# Minnesota Court of Appeals package (lit/minnctapp).
[package]
name = "mn-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "mn-district-court-civil"
forum = "mn-district"
