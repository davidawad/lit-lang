# The Middle District of Florida's Local Rules as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods
# the Local Rules themselves state and re-encodes no FRCP deadline. Each
# period is counted under FRCP 6(a), which governs "any local rule". The
# rules are the edition dated November 1, 2025 (sources/md-fla).
[package]
name = "flmd-local-rules"
version = "0.1.0"
language = 1
pack_id = "flmd-local-rules"
forum = "flmd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Middle District of Florida: Local Rules (civil)"
description = "The Middle District of Florida's Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): proof of service and default, motion briefing, case management reports, mediation reports and attorney's fees."
in_force = "2025-11-01"
known_at = "2026-10-27"
unknown_before = "2025-11-01"
jurisdiction = "United States District Court, M.D. Florida"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "flmd-lr"
issuer = "United States District Court for the Middle District of Florida"
date = "2025-11-01"
designation = "Local Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

