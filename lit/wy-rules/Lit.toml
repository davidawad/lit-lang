# The Wyoming base library (lg-u561.5): the trigger events the Wyoming
# court packages route their graphs on: lit/wy-district and lit/wy-supreme.
# It declares no period: the rules' periods are stated in the court
# packages' notes (W.R.C.P. 6(a) and W.R.A.P. 14.02 count Wyoming legal
# holidays, for which core has no calendar). No procedure of its own.
[package]
name = "wy-state-rules"
version = "0.1.0"
language = 1
pack_id = "wy-state-rules"
forum = "wy-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "wyoming"
title = "Wyoming state court rules (base library)"
description = "The rule layer Wyoming's court packages share (W.R.C.P., W.R.A.P.): the trigger events their graphs route on. No procedure of its own."
in_force = "2026-09-21"
known_at = "2026-10-28"
unknown_before = "2026-09-21"
jurisdiction = "Wyoming state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

