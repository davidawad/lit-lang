# The Southern District of Florida's criminal Local Rules (Rules 88.1
# through 88.11) as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a)): it declares only the periods those rules themselves
# state and re-encodes no FRCrimP, Speedy Trial Act or FRAP period. Each
# period is counted under FRCrimP 45(a), which governs "any local rule".
# The rules are the 2025 Local Rules effective December 1, 2025
# (sources/sd-fla). Federal habeas (Rule 88.2) is lit/habeas.
