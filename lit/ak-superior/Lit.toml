title = "Alaska Superior Court, civil"
description = "Civil actions in the Alaska Superior Court under the Alaska Rules of Civil Procedure, as far as the vendored text states. An appeal hands off to the Alaska appellate package (lit/ak-supreme)."
in_force = "2026-04-23"
known_at = "2026-10-27"
unknown_before = "2026-04-23"
jurisdiction = "Alaska Superior Court (civil)"

[package.roles]
