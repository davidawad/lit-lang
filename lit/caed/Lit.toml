# The United States District Court for the Eastern District of
# California's Local Rules, civil part, as a local-rule layer over lit/frcp
# (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods the Local
# Rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule. The rules are the Local Rules
# effective February 23, 2026 (sources/fed-edcal), which the court's
# local-rules page lists as current; the criminal and bankruptcy rules are
# out of scope. An appeal goes to the Ninth Circuit under lit/frap and
# lit/ca9.
