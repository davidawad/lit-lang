# Civil actions in the Georgia superior courts, as far as the Uniform
# Superior Court Rules (file dated April 9, 2026, sources/ga-state-civil)
# state. The Civil Practice Act (O.C.G.A. Title 9, Chapter 11: service,
# the answer period, pleading motions, amendment, default, summary
# judgment, entry of judgment) is not vendored (LexisNexis public access is
# behind a reCAPTCHA, lg-f3q8.77), so its periods are left unstated, not
# encoded; nor are the counting statute (O.C.G.A. § 1-3-1), the new-trial
# period (O.C.G.A. § 5-5-40) or the notice-of-appeal period (O.C.G.A.
# § 5-6-38). The periods the Uniform Rules set are in notes, not counted
# deadlines, for the same reason. The Supreme Court of Georgia's order of
# October 5, 2026 (effective November 5, 2026) amends Rules 4.3, 10.2 and
# 21 only, none of which this package cites. An appeal hands off to
# lit/gactapp.
[package]
name = "ga-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "ga-superior-court-civil"
forum = "ga-state-civil"
authority = "StateRule"
title = "Georgia superior courts, civil"
description = "Civil actions in the Georgia superior courts under the Uniform Superior Court Rules (April 9, 2026 file): filing, return of service, default certificates, motion practice and summary judgment statements, discovery, pretrial, the trial calendar, dismissal at call, new trial and settlement. The Civil Practice Act is not vendored, so its periods are not stated. An appeal hands off to the Court of Appeals package (lit/gactapp)."
in_force = "2026-04-09"
known_at = "2026-10-28"
unknown_before = "2026-04-09"
jurisdiction = "Georgia superior courts (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

