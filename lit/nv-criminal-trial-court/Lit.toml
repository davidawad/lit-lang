# Felony and gross misdemeanor prosecutions in the Nevada district courts
# (with their justice court preliminary stages) under Title 14 of the
# Nevada Revised Statutes, Procedure in Criminal Cases (NRS chapters 169
# to 179), the 2025 edition revised April 15, 2026, as served by the
# Nevada Legislature (sources/nv-criminal-trial-court); in_force is that
# revision date and an earlier query is a hole in the corpus. Nevada has
# no separate statewide rules of criminal procedure; NRS 178.556 is the
# dismissal-for-delay (speedy trial) provision. Criminal appeals go under
# Nevada Rule of Appellate Procedure (NRAP) 4(b), bound to the NRAP text
# lit/nv-supreme binds (amendments through May 21, 2025; sources/nv-supreme).
# Time is computed under NRS 178.472, which excludes intermediate
# Saturdays, Sundays and nonjudicial days from periods under 7 days;
# lit/core has no counting rule for it, so the periods are stated in
# notes, not encoded as counted deadlines. Post-conviction habeas (NRS
# chapter 34) is not vendored.
