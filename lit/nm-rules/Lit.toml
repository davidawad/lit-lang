# The New Mexico base library (lg-u561.5): the trigger events the New Mexico court
# packages route their graphs on: lit/nm-state-civil, lit/nm-state-appellate and
# lit/nm-supreme-court.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "nm-state-rules"
version = "0.1.0"
language = 1
pack_id = "nm-state-rules"
forum = "nm-state-rules"
authority = "StateRule"
jurisdiction_id = "new-mexico"
title = "New Mexico state court rules (base library)"
description = "The rule layer New Mexico's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "New Mexico state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
