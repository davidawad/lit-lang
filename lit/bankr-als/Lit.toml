# The Local Rules of the U.S. Bankruptcy Court for the Southern District of
# Alabama over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only
# the periods the rules themselves state and re-encodes no FRBP period. It
# is a base package, not a `kind = "local-rule"` layer: lit/core has no
# bankruptcy forum family (L2011 for `bankr-als`), as for lit/bankr-dc.
# Each period is counted under FRBP 9006(a), the FRCP 6(a) method (core's
# frcp6).
#
# The only vendored text is the Local Rules effective July 1, 2026, an OCR
# extract of an image scan with no text layer: OCR, verify numbers
# (sources/bankr-als/PROVENANCE.md). Every period therefore has a hole cite
# naming its pinpoint, the value the OCR text's, unverified, as for
# lit/bankr-arw and lit/bankr-nyw; the source binds no cite prefix, so no
# cite resolves against unverified text. The rules supersede all earlier
# local rules (LBR 9029-3(d)) and no amending order is vendored, so the
# consolidation is the only layer; a query before July 1, 2026 is a hole in
# the corpus.
[package]
name = "bankr-als-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-als-local-rules"
forum = "bankr-als"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Southern District of Alabama: Local Rules"
description = "The Bankr. S.D. Ala. Local Rules (effective July 1, 2026) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp), every period a hole pending a verified text (the vendored extract is OCR, verify numbers): payment advices, the chapter 13 trustee's final report on conversion, Rule 2004 examinations, chapter 13 confirmation (LBR 3015-2), stay-relief affidavits and fact summaries, conditional denials, chapter 12 and 13 discharge motions and the negative notice procedure (LBR 9007-1)."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "U.S. Bankruptcy Court for the Southern District of Alabama"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.alsb-lbr]
title = "Local Rules of the United States Bankruptcy Court for the Southern District of Alabama (effective July 1, 2026; OCR extract, verify numbers)"
url = "https://www.alsb.uscourts.gov/sites/alsb/files/ALSB%20Local%20Rules%207-1-2026.pdf"
path = "sources/bankr-als/alsb-lbr-2026-07-01.txt"
path_sha256 = "d3ee7caffa42d3ffaec54fe0ef4def69bae4672899b20eebb434aefe6d4409c3"
sha256 = "0c1fe9260e1dbd668283abe2841f5a3e4d45b3977d1bda5ac19e326222f5d7f2"
as_of = "2026-07-01"
