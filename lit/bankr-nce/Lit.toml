# The Local Rules of Practice and Procedure of the U.S. Bankruptcy Court for
# the Eastern District of North Carolina over lit/frbp (FRBP 9029(a); 28
# U.S.C. § 2075): it declares only the periods the Local Rules themselves
# state and re-encodes no FRBP period. It is a base package, not a `kind =
# "local-rule"` layer: lit/core has no bankruptcy forum family (L2011 for
# `bankr-nce`), as for lit/bankr-md. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective October 15, 2026; no later amending order is vendored
# (sources/bankr-nce/PROVENANCE.md), so the consolidation is the only
# layer. The earlier editions are not vendored, so a query before October
# 15, 2026 is a hole in the corpus. The Rules for Complex Chapter 11 Cases
# (vendored beside them) apply only in a case the court designates complex
# and are not encoded.
[package]
name = "bankr-nce-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-nce-local-rules"
forum = "bankr-nce"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Eastern District of North Carolina: Local Rules of Practice and Procedure"
description = "The Bankr. E.D.N.C. Local Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): next-friend appointments, installment fees, certificates of service, conversion forms and bankruptcy administrator abuse statements, chapter 11 notices of disputed claims and proofs of claim, attorney disclosures and discipline, chapter 13 amended plans and dismissed-case fees, servicer changes, stay continuation, debtor duties to the trustee and bankruptcy administrator in chapters 7, 11 and 12, adversary motions, pretrial procedure, prosecution and summary judgment, contested-matter responses (LBR 9014-1), settlements, mediated settlement conferences, service of orders and removal."
in_force = "2026-10-15"
known_at = "2026-10-28"
unknown_before = "2026-10-15"
jurisdiction = "U.S. Bankruptcy Court for the Eastern District of North Carolina"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.nceb-lbr]
title = "Local Rules of Practice and Procedure of the United States Bankruptcy Court for the Eastern District of North Carolina (effective October 15, 2026)"
url = "https://www.nceb.uscourts.gov/sites/nceb/files/NCEB%20Local%20Rules%20-%20Most%20Recent.pdf"
path = "sources/bankr-nce/nce-local-rules-2026-10-15-sectioned.txt"
path_sha256 = "e63b0c4082551ea265e76a968c4f461f5f9988affea162220be0a0c716d7519d"
sha256 = "617e3a29987aa583f0eca46cf2eb574806dbe4382c2d8fb3bf97b20a2763f149"
as_of = "2026-10-15"
cite_prefixes = ["E.D.N.C. LBR"]
section_heading = "Rule {n}"
