# The United States District Court for the District of New Jersey's Local
# Civil Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP
# 83(a)): it declares only the periods and limits the Local Civil Rules
# themselves state and re-encodes no FRCP deadline. FRCP 6(a) computes a
# period stated in a local rule. The rules are the consolidated Local Civil
# and Criminal Rules with revisions as of October 21, 2026 (sources/njd);
# the court's page lists two October 2026 orders amending L.Civ.R. 5.2 and
# 5.3 with no linked file, which state no period this layer declares. The
# Local Criminal Rules are out of scope. An appeal goes to the Third
# Circuit under lit/frap.
[package]
name = "njd-local-rules"
version = "0.1.0"
language = 1
pack_id = "njd-local-rules"
forum = "njd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the District of New Jersey: Local Civil Rules"
description = "The District of New Jersey's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion papers, opposition and reply before the motion day, reconsideration, the brief page limits, the litigation-funding disclosure, the damages statement, the answer to claims surviving a partial motion to dismiss, the Rule 26(f) meeting, discovery plan and initial disclosures, dismissal after settlement, costs and fees, the proposed judgment, review of a magistrate judge's orders and reports, consent to a magistrate judge, and the demand for trial de novo after court-annexed arbitration."
in_force = "2026-10-21"
known_at = "2026-10-28"
unknown_before = "2026-10-21"
jurisdiction = "United States District Court, D.N.J."
# FRCP 6(a)(6)(C): New Jersey's holidays close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-new-jersey`).
counting = "frcp6-new-jersey"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "njd-lr"
issuer = "United States District Court for the District of New Jersey"
date = "2026-10-21"
designation = "Local Civil and Criminal Rules (with revisions as of October 21, 2026)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.njd-lr]
title = "Local Civil and Criminal Rules of the United States District Court for the District of New Jersey (with revisions as of October 21, 2026)"
url = "https://www.njd.uscourts.gov/sites/njd/files/CompleteLocalRules.pdf"
path = "sources/njd/local-rules-2026-10-21-sectioned.txt"
path_sha256 = "009dd759ad0ef2daf6649cdb3fbe090876e95e62c0bed8a124cc166f21716a6f"
sha256 = "d77ecfd388077db5fa8ba0ff098751a9e4dd9ad146e7f0fa8dac46ee2597e22e"
as_of = "2026-10-21"
cite_prefixes = ["D.N.J. L. Civ. R."]
section_heading = "Rule {n}"
