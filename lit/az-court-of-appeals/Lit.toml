# A civil appeal from the Arizona Superior Court to the Arizona Court of
# Appeals, and a petition for review to the Arizona Supreme Court, under
# the Arizona Rules of Civil Appellate Procedure (ARCAP) as the Westlaw
# public-access site served them on 2026-10-28, current with amendments
# effective through October 1, 2026 (sources/az-court-of-appeals).
# Computation of time is Civil Rule 6(a) (ARCAP 5(a)), which excludes
# intermediate Saturdays, Sundays and legal holidays from periods under 11
# days and has no counting rule in lit/core, so the rules' periods are
# stated in notes, not encoded as counted deadlines. The appellate
# jurisdiction statute (A.R.S. § 12-2101) is not vendored and is not
# cited. A superior court appeal arrives from lit/az-superior.
[package]
name = "az-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "az-appellate-civil"
forum = "az-court-of-appeals"
authority = "StateRule"
jurisdiction_id = "arizona"
title = "Arizona Court of Appeals and Arizona Supreme Court, civil appeals"
description = "A civil appeal from the Arizona Superior Court to the Arizona Court of Appeals, through record, briefing, oral argument, decision, reconsideration, petition for review to the Arizona Supreme Court and the mandate, as far as the vendored ARCAP state, with the ARCAP word limits."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Arizona Court of Appeals and Arizona Supreme Court (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

