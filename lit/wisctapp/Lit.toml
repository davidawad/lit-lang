# Civil appeals to the Wisconsin Court of Appeals and petitions for review
# in the Wisconsin Supreme Court under Wis. Stat. ch. 808 and the Rules of
# Appellate Procedure, ch. 809, as published and certified October 1, 2026
# (sources/wisctapp). Computation of time is Wis. Stat. § 801.15(1) and
# (5), which § 809.82(1) applies; lit/core has no counting rule for it, so
# the periods are stated in notes, not encoded as counted deadlines. The
# appeal comes from the circuit court package (lit/wi-circuit).
[package]
name = "wi-court-of-appeals-civil"
version = "0.1.0"
language = 1
pack_id = "wi-court-of-appeals-civil"
forum = "wisctapp"
authority = "StateRule"
title = "Wisconsin Court of Appeals and Wisconsin Supreme Court, civil appeals"
description = "Civil appeals under Wis. Stat. chs. 808 and 809, as far as the vendored text states: the notice of appeal and its time, appealability, the record, briefing and its length limits, oral argument, decision, reconsideration, remittitur and the petition for review in the Supreme Court."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Wisconsin Court of Appeals; Wisconsin Supreme Court"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

