forum = "wvnd-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Northern District of West Virginia: Local Rules of Criminal Procedure"
description = "The Northern District of West Virginia's Local Rules of Criminal Procedure as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): waiver of presence at arraignment, standard and reciprocal discovery, the complex-case conference and schedule, the conference on additional discovery, 404(b), Giglio and Roviaro disclosure, witness and exhibit lists, refusal of government disclosures, motions in limine, jury instructions and voir dire, pretrial motions and responses, and responses to post-trial motions."
in_force = "2018-03-01"
known_at = "2026-10-28"
unknown_before = "2018-03-01"
jurisdiction = "United States District Court, N.D. W. Va. (criminal)"
