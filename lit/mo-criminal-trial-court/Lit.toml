# Criminal prosecutions in the Missouri circuit courts. The vendored text
# is a PARTIAL set (sources/mo-criminal-trial-court): only the speedy
# trial statute, RSMo 545.780, as the Revisor of Statutes serves it
# ("Effective - 28 Aug 1986"; the page states no edition date, CURRENCY
# UNCONFIRMED). The Missouri Supreme Court Rules of Criminal Procedure
# (Rules 19-37) and the criminal appeal rules are not vendored: the
# courts.mo.gov host refused every fetch (PROVENANCE). The package
# therefore keeps the procedure's structure with every cite a hole: those
# naming a rule topic carry no value, and the RSMo 545.780 cites carry the
# statute's words, unverified. The package runs from the statute's stated
# effective date. Postconviction relief and federal habeas (lit/habeas)
# are not modelled.
