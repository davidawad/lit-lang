# Change example (docs/litigate/CHANGE.md §4): an overruling. Bowles v.
# Russell, 551 U.S. 205 (2007): "we overrule Harris Truck Lines and Thompson
# to the extent they purport to authorize an exception to a jurisdictional
# rule". The same court withdraws its own precedent from June 14, 2007; under
# Harper v. Virginia Dep't of Taxation, 509 U.S. 86 (1993), the rule it
# announces governs every case still open on direct review.
