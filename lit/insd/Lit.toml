# The United States District Court for the Southern District of Indiana's
# Local Civil Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071;
# FRCP 83(a)): it declares only the periods and limits the Local Rules
# themselves state and re-encodes no FRCP deadline. FRCP 6(a) computes a
# period stated in a local rule. The rules are those with amendments
# through July 1, 2026, the court's current edition (sources/insd); the
# amendments the court noticed on October 16, 2026 to take effect December
# 1, 2026 (e.g. L.R. 83-6) are not vendored and not yet in force. The Local
# Criminal Rules (forum insd-criminal) are out of scope. An appeal goes to
# the Seventh Circuit under lit/frap and lit/ca7.
[package]
name = "insd-local-rules"
version = "0.1.0"
language = 1
pack_id = "insd-local-rules"
forum = "insd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Southern District of Indiana: Local Civil Rules"
description = "The Southern District of Indiana's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): fax replacement copies, sealed-document statements, briefs and oppositions and their page limits, Social Security briefing, notices of constitutional challenge, motion response and reply periods and brief page limits, pseudonym notices and objections, the case management plan, statements of position after remand or transfer, deposition and nonparty subpoena notice, retrial-judge requests, jury-cost notice, bills of costs and fee motions, summary judgment response, reply and surreply, receivers' inventories and reports, claiming exhibits, transcript redaction, removal responses and state court record objections, appearances after removal, notice before withdrawal, and recruited counsel's fee-agreement notices."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "United States District Court, S.D. Indiana"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
