# Change example (docs/litigate/CHANGE.md §4): the base layer. Three FRCP
# periods the other example layers act on, each from the vendored rule text:
# Rule 12(a)(1)(A)(i) (delegated to a case order by Rule 6(b)), Rule 56(b)
# ("Unless a different time is set by local rule or the court orders
# otherwise"), and Rule 59(e) as restyled in 2007 (10 days, locked by Rule
# 6(b)(2)), which the 2009 amendment replaces.
