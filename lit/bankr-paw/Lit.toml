# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Western
# District of Pennsylvania over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075):
# it declares only the periods and page limits the Local Bankruptcy Rules
# themselves state and re-encodes no FRBP period. Each period is counted
# under FRBP 9006(a), the FRCP 6(a) method (core's frbp9006); the rules' days
# are calendar days (W.PA.LBR 9006-1(c)).
#
# Layers: the 2026 'Complete Set of All Local Bankruptcy Rules', effective
# July 1, 2026 by W.PA.LBR 1001-3, is the only vendored text
# (sources/bankr-paw/PROVENANCE.md). The court's standing orders and index
# of revisions were not read, so no amending order is vendored and the
# consolidation is the only layer. No earlier edition is vendored, so a
# query before July 1, 2026 is a hole in the corpus.
[package]
name = "bankr-paw-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-paw-local-rules"
forum = "bankr-paw"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Western District of Pennsylvania: Local Bankruptcy Rules"
description = "The Bankr. W.D. Pa. Local Bankruptcy Rules (effective July 1, 2026) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): complex chapter 11 pre-filing notice, claims agents, fees after dismissal, income reports and the business questionnaire, certificates of service, Rule 2004 examinations, unfiled tax returns, added-creditor and chapter 11 bar dates, amended claims, funds on reserve, mortgage payment changes and postpetition fees, unclaimed funds, chapter 13 plan and hearing objections, ballots, post-confirmation accountings and claim objections, final decrees, rent deposits, proof of insurance, individual chapter 11 discharge, signature declarations, CM/ECF fees, sealed documents, custodians, sales, adversary motions, the 2-page plan summary and 20-page adversary brief limits, transcripts of proposed findings, third-party defendants, e-discovery, discovery orders, summary judgment, appeal transcripts, certificates of no objection, contested matter responses (W.PA.LBR 9014-1), jury demands, subpoenas, mediation, the loss mitigation program, transcript redaction and exhibits."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "U.S. Bankruptcy Court for the Western District of Pennsylvania"
# FRBP 9006(a)(6)(C): Pennsylvania's holidays close a forward-counted period, here and in
# the FRBP periods this package recounts (core's `frbp9006-pennsylvania`).
counting = "frbp9006-pennsylvania"
recounts = ["frbp-bankruptcy-procedure"]

[package.instrument]
source = "bankr-paw-lbr"
issuer = "United States Bankruptcy Court for the Western District of Pennsylvania"
date = "2026-07-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.bankr-paw-lbr]
title = "Local Bankruptcy Rules of the United States Bankruptcy Court for the Western District of Pennsylvania (2026, effective July 1, 2026)"
url = "https://www.pawb.uscourts.gov/sites/default/files/lrules2026/Localrules2026.pdf"
path = "sources/bankr-paw/paw-local-rules-2026-sectioned.txt"
path_sha256 = "3670377d95731bfe7dba696e98b112a089bc6cebfa4be1acab9ddbdda833ef77"
sha256 = "2d62f1f887bc79794f279adeb7f5507d51f05e8402ab66a0a75aafa49dfd1783"
as_of = "2026-07-01"
cite_prefixes = ["W.PA.LBR"]
section_heading = "Rule {n}"
