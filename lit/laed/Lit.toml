# The Eastern District of Louisiana's Local Civil Rules as a local-rule
# layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the
# periods and limits the local civil rules themselves state and re-encodes
# no FRCP deadline. Each period is counted under FRCP 6(a), which governs
# "any local rule", so each deadline names `forum frcp` (lit/core's frcp6
# computes frcp periods only). The rules are the edition effective March
# 1, 2022, revised February 4, 2025 (sources/laed); earlier editions are
# not vendored, so a query before the revision is a hole in the corpus.
# The Local Admiralty Rules and the Local Criminal Rules (forum
# laed-criminal) are not encoded. An appeal goes to the Fifth Circuit
# under lit/frap and lit/ca5.
[package]
name = "laed-local-rules"
version = "0.1.0"
language = 1
pack_id = "laed-local-rules"
forum = "laed"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Eastern District of Louisiana: Local Civil Rules"
description = "The Eastern District of Louisiana's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the state-court record in removed actions, sealed filings, motion submission, opposition and reply periods and memorandum page limits, deconsolidation, the Rule 26(f) conference and written discovery plan, costs motions, oral argument requests, exhibit removal and the stay of transfers outside the Fifth Circuit."
in_force = "2025-02-04"
known_at = "2026-10-28"
unknown_before = "2025-02-04"
jurisdiction = "United States District Court, E.D. Louisiana"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "laed-lr"
issuer = "United States District Court for the Eastern District of Louisiana"
date = "2025-02-04"
designation = "Local Civil Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

