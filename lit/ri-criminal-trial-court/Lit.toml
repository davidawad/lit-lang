# Criminal cases in the Rhode Island Superior Court under its Rules of
# Criminal Procedure (Super. R. Crim. P.), as far as the vendored text
# states. The base text is the PDF the court serves
# (sources/ri-criminal-trial-court/), which states no edition date; its
# PROVENANCE entry records CURRENCY UNCONFIRMED, so in_force is the
# retrieval date and an earlier query is a hole in the corpus. By the
# PM's standing ruling of 2026-10-27 such a source yields holes, not
# values: this package cites the rules only for the structure of the case
# and states no period, limit or amount from them. The speedy-trial
# statute (R.I. Gen. Laws § 12-13-7) and the bail and post-conviction
# statutes (chapters 12-13 and 10-9.1) are not vendored and stay holes.
# The appeal hand-off cites Article I, Rule 4(b) of the Supreme Court
# Rules (sources/ri-supreme/, revised February 17, 2026, the text
# lit/ri-supreme binds); core has no Rhode Island counting rule, so its
# 20-day period is stated in a note.
[package]
name = "ri-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "ri-criminal-trial-court"
forum = "ri-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "rhode-island"
title = "Rhode Island Superior Court, criminal"
description = "Criminal cases in the Rhode Island Superior Court under its Rules of Criminal Procedure, as far as the vendored text states: the structure of the case from complaint and arrest through District Court proceedings, bail, indictment or information, arraignment, discovery, pretrial and speedy-trial motions, plea or trial, acquittal, verdict, new trial, sentencing and judgment; no period from the currency-unconfirmed rules is stated. An appeal goes to the Rhode Island Supreme Court within 20 days under Article I, Rule 4(b) of its rules."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Rhode Island Superior Court (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

