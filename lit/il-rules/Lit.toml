# The Illinois base library (lg-u561.5 pattern): the trigger events the
# Illinois civil court packages route their graphs on: lit/il-circuit,
# lit/illappct and lit/il-supreme-court.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "il-state-rules"
version = "0.1.0"
language = 1
pack_id = "il-state-rules"
forum = "il-state-rules"
authority = "StateRule"
jurisdiction_id = "illinois"
title = "Illinois state court rules (base library)"
description = "The rule layer Illinois's civil court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Illinois state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
