# The U.S. District Court for the Northern District of Texas's local
# criminal rules (LCrR) as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods and limits the
# local criminal rules themselves state and re-encodes no FRCrimP, Speedy
# Trial Act or FRAP 4(b) period (one source of truth: lit/frcrimp). Each
# period is counted under FRCrimP 45(a), which governs "any local rule",
# so each deadline names `forum frcrimp`. The rules are the edition the
# court serves as current ("Effective September 1, 2026"; sources/txnd),
# so in_force is that date; earlier editions are not vendored, so a query
# before it is a hole in the corpus. The court's Speedy Trial Act plan (18
# U.S.C. § 3165) and the miscellaneous order for minor offenses (LCrR
# 58.1) are not vendored. An appeal goes to the Fifth Circuit under
# lit/frcrimp's FRAP 4(b) period and lit/ca5.
[package]
name = "txnd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "txnd-criminal-local-rules"
forum = "txnd-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Northern District of Texas: Local Criminal Rules"
description = "The U.S. District Court for the Northern District of Texas's local criminal rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the pretrial exchange of exhibits and lists, proposed findings and the requested jury charge, the motion response and brief limits, ECF registration and paper originals, exhibits and sealed documents after final disposition, and responses to objections to magistrate judge rulings."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
