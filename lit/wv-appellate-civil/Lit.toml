# Civil appeals to the West Virginia Intermediate Court of Appeals under
# the West Virginia Rules of Appellate Procedure, as far as the vendored text states: the rules as posted on the
# Supreme Court of Appeals' rules page, retrieved 2026-10-28
# (sources/wv-appellate-civil). The page states no edition date; by the PM
# ruling of 2026-10-28 it is taken as the current base text, dated by Rule
# 1(e) (appeals from orders entered after June 30, 2022), so in_force is
# July 1, 2022. The order of August 21, 2026 (No. 25-57) amending Rule 5(a)
# and (b) is a separate dated layer, never merged into the base text: its
# own source binding (wv-rap-2026-rule5), cited by a version of the
# notice-of-appeal step that supersedes the base's from the day the order
# was entered (the order states no other effective date). Time is computed
# under W. Va. R. App. P. 39(a), whose legal holidays (West Virginia Day,
# Lincoln's Day, days the Governor or Legislature appoints) differ from
# the federal ones; lit/core has no counting rule for it, so the periods
# are stated in notes, not encoded as counted deadlines. The trial-court
# side is lit/wv-circuit-civil; the appeal from the Intermediate Court to
# the Supreme Court of Appeals is lit/wv-supreme-court (lg-u561.5, one
# package per court), and all three route on lit/wv-rules' trigger events.
[package]
name = "wv-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "wv-appellate-civil"
forum = "wv-appellate-civil"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "west-virginia"
title = "Intermediate Court of Appeals of West Virginia, civil appeals"
description = "Civil appeals under the West Virginia Rules of Appellate Procedure, as far as the vendored text states: the notice of appeal and its fee, the scheduling order, the appendix record and transcripts, perfecting the appeal and its extension, the briefs and their page limits, the argument calendar and Rule 19 and Rule 20 argument, memorandum decisions and opinions, rehearing, the mandate and costs, and the hand-off of an appeal from the Intermediate Court to the Supreme Court of Appeals (lit/wv-supreme-court)."
in_force = "2022-07-01"
known_at = "2026-10-28"
unknown_before = "2022-07-01"
jurisdiction = "Intermediate Court of Appeals of West Virginia"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the trigger events of the West Virginia court packages.
wv-state-rules = { version = "^0.1.0", path = "../wv-rules" }

