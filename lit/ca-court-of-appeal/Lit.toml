# A civil appeal from a California superior court to the Court of Appeal
# under the California Rules of Court, Title 8, as far as the vendored
# rules state (sources/ca-court-of-appeal: the Judicial Council's per-rule
# pages, each as in force on 2026-10-27), with appealability under CCP
# § 904.1 (sources/ca-superior). Computation of time (Cal. Rules of Court,
# rule 1.10, and CCP §§ 12-12a) is not vendored and lit/core has no
# California counting rule, so the periods are stated in notes, not encoded
# as counted deadlines. The trial-court side is lit/ca-superior.
[package]
name = "ca-court-of-appeal"
version = "0.1.0"
language = 1
pack_id = "ca-court-of-appeal"
forum = "ca-court-of-appeal"
authority = "StateRule"
jurisdiction_id = "california"
title = "California Courts of Appeal, civil appeals"
description = "A civil appeal to a California Court of Appeal, as far as the vendored California Rules of Court state: the time to appeal and its bar on extension, appealability, the record, briefs, oral argument and submission, publication, rehearing, the petition for review in the Supreme Court, and the remittitur."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "California Courts of Appeal (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

