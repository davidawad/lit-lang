# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Northern
# District of New York over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods the Local Bankruptcy Rules themselves state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective December 1, 2024 (sources/bankr-nyn/PROVENANCE.md); the
# court's page lists no later amendment and no amending order is vendored,
# so the consolidation is the only layer. No earlier edition is vendored,
# so a query before December 1, 2024 is a hole in the corpus.
[package]
name = "bankr-nyn-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-nyn-local-rules"
forum = "bankr-nyn"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Northern District of New York: Local Bankruptcy Rules"
description = "The Bankr. N.D.N.Y. Local Bankruptcy Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): joint-administration matrices, conversion to chapter 11, certificates of service, the United States trustee's response to employment applications, debtor-in-possession tax deposits and the chapter 11 affidavit, claim objections, appraisal of collateral, chapter 12 and 13 plan service, certification, tax returns, adequate protection payments, objections, confirmation orders and modifications, chapter 11 ballots, objections, cram-down notices and substantial consummation, final decree and discharge objections, cure of residential judgments of possession, discharge certifications and hardship discharge, withdrawal of the reference, sales and auctions, trial exhibits, default judgments, motion practice (LBR 9013-1), default motions, orders and judgments, jury consent and transcript redaction."
in_force = "2024-12-01"
known_at = "2026-10-28"
unknown_before = "2024-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Northern District of New York"
counting = "frcp6"

[package.instrument]
source = "nynb-lbr"
issuer = "United States Bankruptcy Court for the Northern District of New York"
date = "2024-12-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

