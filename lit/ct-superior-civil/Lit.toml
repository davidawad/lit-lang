# Civil actions in the Connecticut Superior Court under the Superior Court
# rules of the official 2026 Connecticut Practice Book (Revision of 1998),
# whose own amendments take effect January 1, 2026
# (sources/ct-superior-civil). The Practice Book counts its periods from
# events (the return day, the filing of a motion, notice of a decision) and
# Connecticut's court holidays, not the federal ones, govern; lit/core has
# no counting rule for them, so the periods are stated in notes, not
# encoded as counted deadlines. The Superior Court judges' amendments of
# June 11, 2026 (Connecticut Law Journal, June 23, 2026) take effect
# January 1, 2027, after this package's dates, except Sections 4-2, 4-9 and
# 31a-18A, which this package does not cite; of the sections cited here
# they change only Sections 13-7 and 13-10, adding a fifteen-day period for
# residential summary process and leaving the sixty days unchanged, so they
# are noted, not applied. An appeal hands off to lit/ct-appellate-supreme.
[package]
name = "ct-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "ct-superior-court-civil"
forum = "ct-superior-civil"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "connecticut"
title = "Connecticut Superior Court, civil"
description = "Civil actions in the Connecticut Superior Court under the 2026 Connecticut Practice Book, as far as the vendored text states: process, the time to plead from the return day, the motion to dismiss and the motion to strike with their opposition periods, amendment, default for failure to appear or plead, discovery and its sanctions, summary judgment and its response period, the jury claim, motions after verdict, reargument, opening a judgment, and the appeal under the Rules of Appellate Procedure."
in_force = "2026-01-01"
known_at = "2026-10-28"
unknown_before = "2026-01-01"
jurisdiction = "Connecticut Superior Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
ct-state-rules = { version = "^0.1.0", path = "../ct-rules" }

[sources.ct-pb]
title = "Official 2026 Connecticut Practice Book (Revision of 1998): Rules for the Superior Court and Rules of Appellate Procedure"
url = "https://www.jud.ct.gov/Publications/PracticeBook/PB.pdf"
path = "sources/ct-superior-civil/ct-practice-book-2026-sectioned.txt"
path_sha256 = "7a33d1bb397e575e0a7b5f010aab0cfc4d9afd70228a83544d187e51d0c1efac"
sha256 = "bb406ab49314de7f6b49f5de43e1b2e354465bb70ce52ecc37412ec058db69d6"
as_of = "2026-01-01"
cite_prefixes = ["Practice Book §"]
section_heading = "Practice Book § {n}"
