# The Local Rules for Bankruptcy and the Administration of the Court of
# the U.S. Bankruptcy Court for the Southern District of Georgia over
# lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only the periods
# the rules themselves state and re-encodes no FRBP period. Each period is
# counted under FRBP 9006(a), the FRCP 6(a) method (core's frbp9006).
#
# The only vendored text is the court's printable Local Bankruptcy Rules,
# with no edition or effective date (its footer: "current as of May 2017";
# PDF created May 23, 2017): CURRENCY UNCONFIRMED, the court having posted
# that revised Local Rules took effect October 7, 2026 without a new
# bankruptcy text (sources/bankr-gas/PROVENANCE.md). Every period therefore
# has a hole cite naming its pinpoint, the value the vendored text's,
# unverified, as for lit/bankr-arw and lit/bankr-nyw. The package runs from
# May 23, 2017, the date the text was certainly current; a query before it
# is a hole in the corpus. No amending order is vendored, so the text is
# the only layer.
[package]
name = "bankr-gas-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-gas-local-rules"
forum = "bankr-gas"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Southern District of Georgia: Local Rules"
description = "The Bankr. S.D. Ga. Local Rules for Bankruptcy as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp), every period a hole pending a dated text (the vendored May 2017 text is CURRENCY UNCONFIRMED): the chapter 11 post-confirmation report and the application for a final decree (LBR 2015-1)."
in_force = "2017-05-23"
known_at = "2026-10-28"
unknown_before = "2017-05-23"
jurisdiction = "U.S. Bankruptcy Court for the Southern District of Georgia"
counting = "frbp9006"

[package.instrument]
source = "gasb-lbr"
issuer = "United States Bankruptcy Court for the Southern District of Georgia"
date = "2017-05-23"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.gasb-lbr]
title = "Local Rules for Bankruptcy and the Administration of the Court, U.S. Bankruptcy Court for the Southern District of Georgia (current as of May 2017; CURRENCY UNCONFIRMED)"
url = "https://www.gasb.uscourts.gov/sites/gasb/files/GASB-localRules.pdf"
path = "sources/bankr-gas/gasb-lbr.txt"
path_sha256 = "fe7ad8b2db5b12ef93968796268d9af554b0b0731794b834209920e635ab5241"
sha256 = "316a167cba10e6ecea2165ed3c3f6571ddedbc1fb0c2d2f4bc309c977a9f69c5"
as_of = "2017-05-23"
