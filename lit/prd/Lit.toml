# The United States District Court for the District of Puerto Rico's Local
# Civil Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP
# 83(a)): it declares only the periods and limits the Local Civil Rules
# themselves state and re-encodes no FRCP deadline. FRCP 6(a) computes a
# period stated in a local rule. The rules are the consolidated Local Rules
# with amendments through October 16, 2024 (sources/dpr). The October 17,
# 2025 order amending L.Civ.R. 83A(a)(2) (attorney eligibility for
# admission) changes no period this layer declares, so it is not bound.
# The Admiralty and Criminal Rules are out of scope. An appeal goes to the
# First Circuit under lit/frap.
[package]
name = "prd-local-rules"
version = "0.1.0"
language = 1
pack_id = "prd-local-rules"
forum = "prd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the District of Puerto Rico: Local Civil Rules"
description = "The District of Puerto Rico's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): correcting a complaint not filed on the required form, notice of a calendar conflict, opposition and reply to a motion with the motion page limits, Social Security attorney-fee requests, the proposed pretrial order and objections to the final pretrial order, proposed jury instructions, costs and attorney's fees, review of a magistrate judge's orders and reports, notice of a judgment concluding a bankruptcy appeal, and court-annexed mediation."
in_force = "2024-10-16"
known_at = "2026-10-28"
unknown_before = "2024-10-16"
jurisdiction = "United States District Court, D.P.R."
counting = "frcp6"

