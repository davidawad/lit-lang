# The Middle District of Louisiana's Local Civil Rules as a local-rule
# layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the
# periods and limits the local civil rules themselves state and re-encodes
# no FRCP deadline. Each period is counted under FRCP 6(a), which governs
# "any local rule", so each deadline names `forum frcp` (lit/core's frcp6
# computes frcp periods only). The rules are the edition effective August
# 18, 2022 (sources/lamd); earlier editions are not vendored, so a query
# before that date is a hole in the corpus, and the amendments the court
# has published for comment are not in force and not encoded. The Local
# Admiralty Rules and the Local Criminal Rules (forum lamd-criminal) are
# not encoded. An appeal goes to the Fifth Circuit under lit/frap and
# lit/ca5.
[package]
name = "lamd-local-rules"
version = "0.1.0"
language = 1
pack_id = "lamd-local-rules"
forum = "lamd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Middle District of Louisiana: Local Civil Rules"
description = "The Middle District of Louisiana's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion response and reply periods and memorandum page limits, the Rule 26(f) report and initial disclosures, late discovery motions, dismissal for failure to prosecute and reinstatement, costs, default judgment, requests to strike statements of fact, and exhibit removal."
in_force = "2022-08-18"
known_at = "2026-10-28"
unknown_before = "2022-08-18"
jurisdiction = "United States District Court, M.D. Louisiana"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "lamd-lr"
issuer = "United States District Court for the Middle District of Louisiana"
date = "2022-08-18"
designation = "Local Rules"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.lamd-lr]
title = "Local Rules of the United States District Court for the Middle District of Louisiana (effective August 18, 2022)"
