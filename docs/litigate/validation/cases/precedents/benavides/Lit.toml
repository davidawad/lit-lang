designation = "79 F.3d 1211"
court = "cadc"
designated = "1996-04-02"
reach = ["circuit-appellate", "district-civil", "district-criminal"]

[[package.instrument.holdings]]
holding = "The seven-day filing period of Rule 4(a)(6) was not triggered when an attorney not involved in the case told the appellant of the order; it opens on written notice from the clerk or any party."
pin = "79 F.3d at 1215"
edits = "change-validation::reopen-window"

