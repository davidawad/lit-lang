# The Southern District of Iowa's Local Criminal Rules (LCrR) as a
# local-rule layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it
# declares only the periods the criminal rules themselves state and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period. The rules
# are the criminal part of the Joint Local Rules of the Northern and
# Southern Districts of Iowa, effective December 7, 2020 (S.D. Iowa
# Administrative Order 20-AO-0023-P), as served by this court
# (sources/iasd); the amendments the court has proposed are not in force
# and are not encoded. Earlier editions are not vendored, so a query
# before that date is a hole in the corpus. lit/iand-criminal declares
# the same rules for the Northern District and lit/iasd the civil layer.
# Habeas (28 U.S.C. §§ 2254, 2255) is lit/habeas's; an appeal goes to the
# Eighth Circuit under FRAP 4(b) (lit/frcrimp) and lit/ca8.
