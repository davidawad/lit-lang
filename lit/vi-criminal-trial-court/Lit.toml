# Criminal cases in the Superior Court of the Virgin Islands under the
# Virgin Islands Rules of Criminal Procedure (V.I. R. Crim. P.), as far as
# the vendored text states. The base text is the PDF the Judiciary serves
# (sources/vi-criminal-trial-court/), uploaded 2019-11 with no edition
# date; later promulgation orders are not checked, and its PROVENANCE
# entry records CURRENCY UNCONFIRMED, so in_force is the retrieval date
# and an earlier query is a hole in the corpus. By the PM's standing ruling
# of 2026-10-27 such a source yields holes, not values: this package cites
# the rules only for the structure of the case (which rule governs which
# step) and states no period, limit or amount from them. The rules' speedy
# trial protection is Rule 48(b) (dismissal for unnecessary delay), which
# states no period. Title 5 of the Virgin Islands Code (criminal procedure,
# including the jury provisions §§ 3601-3602 the rules cite and habeas
# corpus) and Part VI of the Superior Court Rules are not vendored; those
# cites stay holes. The appeal hand-off cites V.I. R. App. P. 5(b), whose
# vendored text is the consolidated Rules of Appellate Procedure (latest
# amendment line March 1, 2017; sources/vi-supreme-civil/); lit/core has
# no counting rule for the Virgin Islands appellate rules, so its period is
# stated in a note, not encoded as a counted deadline.
[package]
name = "vi-superior-court-criminal"
version = "0.1.0"
language = 1
pack_id = "vi-superior-court-criminal"
forum = "vi-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "virgin-islands"
title = "Superior Court of the Virgin Islands, criminal"
description = "Criminal cases in the Superior Court of the Virgin Islands under the Virgin Islands Rules of Criminal Procedure, as far as the vendored text states: the structure of the case from arrest and the initial appearance (with its probable-cause determination and bail) through the information, arraignment, pretrial motions, plea or trial, post-trial motions, sentence and judgment; no period from the currency-unconfirmed rules is stated. An appeal goes to the Supreme Court of the Virgin Islands under V.I. R. App. P. 5(b)."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Superior Court of the Virgin Islands (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

