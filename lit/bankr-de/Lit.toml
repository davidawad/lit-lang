path = "sources/bankr-de/de-local-rules-2025-02-01-sectioned.txt"
path_sha256 = "b50b5e9d26db508df06730f3ef19df5d13768a36d4defff75b9fa2cbc707f341"
sha256 = "13c172bf3bcd02fa6aa603a9f63ecbdf15f2ae3e5dcb1b72a36311107327fc70"
