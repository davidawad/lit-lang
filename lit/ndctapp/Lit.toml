# A civil appeal from a North Dakota district court to the North Dakota
# Supreme Court under the North Dakota Rules of Appellate Procedure, each
# rule as in force on October 27, 2026 with its own effective date
# (sources/ndctapp; the latest, N.D.R.App.P. 4 and 28, effective
# September 1, 2026). The vendored rules address the supreme court; the
# assignment of appeals to the North Dakota Court of Appeals (N.D.C.C.
# ch. 27-02.1) and the appealable-order statute (N.D.C.C. § 28-27-02) are
# not vendored, so the forum's Court of Appeals path and the statutory
# list of appealable orders are not modeled. Computation of time is
# N.D.R.App.P. 26(a), which counts North Dakota legal holidays (N.D.C.C.
# §§ 1-03-01, 1-03-02, 1-03-02.1, not vendored); core has no North
# Dakota calendar, so periods are stated in notes, not counted.
# Certiorari is a federal hand-off under Sup. Ct. R. 13.
[package]
name = "nd-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "nd-appellate-civil"
forum = "ndctapp"
authority = "StateRule"
jurisdiction_id = "north-dakota"
title = "North Dakota Supreme Court, civil appeals"
description = "Civil appeals from the North Dakota district courts to the North Dakota Supreme Court under the North Dakota Rules of Appellate Procedure, as far as the vendored text states: notice and its time, docketing, the record and transcript, briefing and page limits, oral argument, disposition, rehearing, mandate and dismissal. Certiorari is a federal hand-off under Sup. Ct. R. 13."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "North Dakota Supreme Court; North Dakota Court of Appeals"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

