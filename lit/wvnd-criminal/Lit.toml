# The Northern District of West Virginia's Local Rules of Criminal
# Procedure (LR Cr P) as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods the LR Cr P
# themselves state and re-encodes no FRCrimP, Speedy Trial Act or FRAP
# 4(b) period (those are lit/frcrimp's). Each period is counted under
# FRCrimP 45(a), which governs "any local rule". The rules are the Local
# Rules effective March 2018, which the court presents as current
# (sources/wvnd; an old edition, recorded as such in its PROVENANCE).
# Federal habeas is lit/habeas's; an appeal to the Fourth Circuit is
# lit/frcrimp's and lit/ca4's.
[package]
name = "wvnd-criminal-local-rules"
version = "0.1.0"
language = 1
