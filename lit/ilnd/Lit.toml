# The Local Rules of the United States District Court for the Northern
# District of Illinois as a local-rule layer over lit/frcp (28 U.S.C.
# § 2071; FRCP 83(a)): it declares only the periods and limits the local
# rules themselves state and re-encodes no FRCP deadline. Each period is
# counted under FRCP 6(a), which governs "any local rule". The rules are
# those effective September 1, 1999 with amendments through May 4, 2026
# (sources/ilnd). An appeal goes to the Seventh Circuit under lit/frap.
[package]
name = "ilnd-local-rules"
