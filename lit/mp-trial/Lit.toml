# Civil actions in the Commonwealth Superior Court of the Northern Mariana
# Islands under the NMI Rules of Civil Procedure as adopted January 9,
# 2019 with the general errata order of February 25, 2019
# (sources/mp-trial). Computation of time is NMI R. Civ. P. 6(a), which,
# unlike FRCP 6(a), excludes intermediate Saturdays, Sundays and legal
# holidays from a period of 10 days or less and counts Commonwealth legal
# holidays (1 CMC § 311); lit/core has no counting rule for it, so the
# rules' periods are stated in notes, not encoded as counted deadlines. An
# appeal hands off to the NMI Supreme Court package (lit/mp-supreme).
[package]
name = "mp-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "mp-superior-court-civil"
forum = "mp-trial"
authority = "StateRule"
title = "Commonwealth Superior Court of the Northern Mariana Islands, civil"
description = "Civil actions in the Commonwealth Superior Court under the NMI Rules of Civil Procedure, as far as the vendored text states: commencement and service, the response, pleading motions and amendment, default, discovery, summary judgment, trial, post-trial motions, entry of judgment and the notice of appeal to the NMI Supreme Court (lit/mp-supreme)."
in_force = "2019-02-25"
known_at = "2026-10-28"
unknown_before = "2019-02-25"
jurisdiction = "Commonwealth Superior Court of the Northern Mariana Islands (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

