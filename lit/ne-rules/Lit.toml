# The Nebraska base library (lg-u561.5 pattern): the trigger events the
# Nebraska court packages route their graphs on: lit/ne-supreme-court.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "ne-state-rules"
version = "0.1.0"
language = 1
pack_id = "ne-state-rules"
forum = "ne-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "nebraska"
title = "Nebraska state court rules (base library)"
description = "The rule layer Nebraska's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Nebraska state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
