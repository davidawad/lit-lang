# The Court of Federal Claims package, ported from
# packs/cofc-court-of-federal-claims.json (DESIGN §11).
#
# authority: the RCFC are the court's rules of practice under 28 U.S.C.
# § 2503(b), the FederalRule level of lit/core's lattice.
# in_force: the RCFC and Appendices J and H as amended through July 27, 2026,
# the as-of date of every vendored rules text the pack cites (the July 27,
# 2026 amendments revised RCFC 16, among others). Declarations whose current
# text is older say so with their own `effective` interval.
# Statute cites bind through usc-1491 and usc35-286, which carry the title
# prefixes: every 28 U.S.C. section the pack cites lives in the same vendored
# file, sources/usc-additional.txt.
[package]
name = "cofc"
version = "0.1.0"
language = 1
pack_id = "cofc"
forum = "cofc"
family = "cofc"
authority = "FederalRule"
title = "United States Court of Federal Claims"
description = "Civil litigation against the United States in the CoFC: claim accrual and the §2501 six-year limitations bar (with 35 U.S.C. §286 administrative-claim tolling on the §1498(a) patent track), the §1500 same-claim-pending trap, an optional §1491(b) bid-protest branch (Appendix C), complaint/service/RCFC 12 pleading, the general civil track (RCFC 16 scheduling, RCFC 26-37 discovery, RCFC 56 summary judgment), an Appendix H ADR off-ramp, the §1498(a) patent track's full Appendix J deadline cascade (early meeting through claim construction, mandatory settlement discussion, and the 'reasonable and entire compensation' damages remedy), bench trial (no jury), RCFC 58 judgment, RCFC 59 post-trial motions, RCFC 54(d) costs, and EAJA fee applications. Sourced from the court's own RCFC, Appendix H, and Appendix J PDFs (as amended through 7/27/2026), the court's current fee schedule (effective 7/28/2025), and verified statutory text; see cofc-SOURCES-NOTES.md."
jurisdiction = "United States Court of Federal Claims"
in_force = "2026-07-27"
known_at = "2026-09-28"
counting = "rcfc6"

[package.roles]
applicant = "self"
either = "nature"
examiner = "opponent"
office = "nature"

[dependencies]
cafc = { version = "^0.1.0", path = "../cafc" }
core = { version = "^1.0.0", path = "../core" }

