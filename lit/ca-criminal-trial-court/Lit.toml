title = "California superior courts, criminal"
description = "Felony prosecutions in the California superior courts under the Penal Code and Title 4 of the California Rules of Court, as far as the vendored text states: the structure of the case from arraignment on the information or indictment through pretrial motions, continuances and the Penal Code § 1382 dismissal, readiness and pre-voir dire conferences, trial, sentencing and habeas corpus; no period from the currency-unconfirmed sources is stated, and the rule 8.308 appeal period is a hole."
in_force = "2026-10-28"
