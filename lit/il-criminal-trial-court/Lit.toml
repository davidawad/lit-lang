# Criminal cases in the Illinois circuit courts under the Code of Criminal
# Procedure of 1963 (725 ILCS 5/) and the Illinois Supreme Court Rules,
# Article IV (criminal proceedings in the trial court) and Article VI
# (appeals in criminal cases), as far as the vendored text states. Both
# vendored texts are CURRENCY UNCONFIRMED (sources/il-criminal-trial-court/
# PROVENANCE.md): 725 ILCS 5/ as the General Assembly's database served it
# on 2026-10-28, which states no edition date and notes that recent laws
# may not yet be included, and the Supreme Court Rules as 43 per-rule PDFs
# with no consolidated edition date. By the PM's standing ruling of
# 2026-10-27 such a source yields holes, not values: this package cites
# the Code and the Rules only for the structure of the case (which section
# or rule governs which step) and states no period, limit or amount from
# them. in_force is the retrieval date, so an earlier query is a hole in
# the corpus. The Unified Code of Corrections (730 ILCS 5/: sentencing)
# and the Statute on Statutes (5 ILCS 70/1.11: computation of time) are
# not vendored; lit/core has no counting rule for Illinois.
[package]
name = "il-circuit-court-criminal"
version = "0.1.0"
language = 1
pack_id = "il-circuit-court-criminal"
forum = "il-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "illinois"
title = "Illinois circuit courts, criminal"
description = "Criminal cases in the Illinois circuit courts under the Code of Criminal Procedure of 1963 and Supreme Court Rules Articles IV and VI, as far as the vendored text states: the structure of the case from arrest and pretrial release through preliminary examination or indictment, arraignment, pretrial motions and the speedy-trial statute, plea or trial, post-trial motions, sentence and the appeal; no period from the currency-unconfirmed texts is stated."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Illinois trial courts of general criminal jurisdiction"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

