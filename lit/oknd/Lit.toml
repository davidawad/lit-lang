# The U.S. District Court for the Northern District of Oklahoma's Local
# Civil Rules (LCvR) as a local-rule layer over lit/frcp (28 U.S.C.
# § 2071; FRCP 83(a); LGnR1-1: the rules "supplement the Federal Rules of
# Civil and Criminal Procedure with local court procedure"): it declares
# only the periods and limits the civil rules themselves state and
# re-encodes no FRCP deadline. The rules are the Local Rules effective
# July 31, 2026 (Civil Rules; sources/nd-okla), the edition the court
# serves as current, so in_force is that date; earlier editions are not
# vendored, so a query before it is a hole in the corpus. The criminal
# rules are lit/oknd-criminal and bankruptcy matters lit/bankr-okn. An
# appeal goes to the Tenth Circuit under lit/frap.
