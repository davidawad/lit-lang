# The United States District Court for the Southern District of
# California's Civil Local Rules as a local-rule layer over lit/frcp (28
# U.S.C. § 2071; FRCP 83(a)): it declares only the periods and limits the
# Civil Local Rules themselves state and re-encodes no FRCP deadline. FRCP
# 6 computes a period stated in a local rule (S.D. Cal. CivLR 7.1(c)). The
# rules are the Local Rules revised as of June 1, 2026 (sources/fed-sdcal);
# the criminal, magistrate and bankruptcy parts are out of scope. The
# rules cite their subdivisions as 7.1.e.2; this package writes 7.1(e)(2).
# An appeal goes to the Ninth Circuit under lit/frap and lit/ca9.
[package]
name = "casd-local-rules"
version = "0.1.0"
language = 1
