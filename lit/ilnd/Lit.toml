authority = "LocalRule"
kind = "local-rule"
title = "N.D. Illinois: Local Rules"
description = "The Local Rules of the Northern District of Illinois as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the affiliate notification supplement, fees after denial of leave to proceed in forma pauperis, notices of presentment and the motion page limit, extension requests for the final pretrial conference, reassignment after remand, costs and the attorney's fee procedure, the receiver's inventory, magistrate judge reassignment and consent, motion status requests, sealed documents and exhibits after the case ends, and the transmittal of remand orders."
in_force = "2026-05-04"
known_at = "2026-10-28"
unknown_before = "2026-05-04"
jurisdiction = "United States District Court, N.D. Illinois"
counting = "frcp6"

