# The District Court of the Virgin Islands' Local Rules of Civil Procedure
# as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods and limits the local civil rules themselves
# state and re-encodes no FRCP deadline. Each period is counted under FRCP
# 6(a), which governs "any local rule" (LRCi 6.1(a) adds the days both
# divisions are closed to its "legal holiday"), so each deadline names
# `forum frcp` (lit/core's frcp6 computes frcp periods only). The rules
# are the edition effective February 1, 2026 (sources/vid, adopted by the
# order of January 30, 2026, Misc. No. 3:25-mc-0003); earlier editions are
# not vendored, so a query before that date is a hole in the corpus. The
# Local Rules of Criminal Procedure (forum vid-criminal) are not encoded.
# An appeal goes to the Third Circuit under lit/frap and lit/ca3.
[package]
name = "vid-local-rules"
version = "0.1.0"
language = 1
pack_id = "vid-local-rules"
forum = "vid"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "District Court of the Virgin Islands: Local Rules of Civil Procedure"
description = "The District Court of the Virgin Islands' Local Rules of Civil Procedure as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the civil cover sheet, withdrawal hearings, motion, response and reply periods (general, Rule 12, Rule 56, reconsideration and in limine), the page and word limit, expert deposition bills, deposition notice and the Rule 30(b)(6) conference, the discovery conference, trial briefs, interpreters, exhibits, bills of costs and the garnishment levy."
in_force = "2026-02-01"
known_at = "2026-10-28"
unknown_before = "2026-02-01"
jurisdiction = "District Court of the Virgin Islands"
# FRCP 6(a)(6)(C): the Virgin Islands' holidays close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-virgin-islands`).
counting = "frcp6-virgin-islands"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "vid-lrci"
issuer = "District Court of the Virgin Islands"
date = "2026-02-01"
designation = "Local Rules of Civil Procedure"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.vid-lrci]
title = "Local Rules of Civil Procedure of the District Court of the Virgin Islands (effective February 1, 2026)"
url = "https://www.vid.uscourts.gov/sites/vid/files/local_rules/260130_Local%20Rules%20Civil%20Procedure_effective%202.1.26[ECF%2010-1].pdf"
path = "sources/vid/local-rules-civ-2026-02-01-sectioned.txt"
path_sha256 = "f681ae577068a35019bb2203e10d01e771feaa11789e66b8ad2f6019e7eb4843"
sha256 = "0d9d6129e7a85ce24f03f6dfd0805940c8d2faa8b1b990589081c085d2076e5a"
as_of = "2026-02-01"
cite_prefixes = ["D.V.I. LRCi", "LRCi"]
section_heading = "LRCi {n}"
