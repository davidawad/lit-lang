# Civil actions in the Wyoming district courts under the Wyoming Rules of
# Civil Procedure, the consolidated edition including the amendments
# effective September 21, 2026 to Rules 4 and 41 (sources/wy-state-civil;
# the versions of Rules 4 and 41 in effect until that date are sectioned
# apart and not cited). Computation of time is W.R.C.P. 6(a), which carries
# a last day that falls on a Saturday, Sunday or legal holiday (a day
# recognized as one in Wyoming by the legislature, the governor, the chief
# justice or local officials) to the next day that is not one; core has no
# Wyoming holiday calendar, so the rules' periods are stated in notes, not
# encoded as counted deadlines. The Uniform Rules for the District Courts
# (U.R.D.C.) are not vendored. An appeal hands off to lit/wy-supreme.
[package]
name = "wy-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "wy-district-court-civil"
forum = "wy-state-civil"
authority = "StateRule"
jurisdiction_id = "wyoming"
title = "Wyoming district court, civil"
description = "Civil actions in the Wyoming district courts under the Wyoming Rules of Civil Procedure, as far as the vendored text states: commencement and service, the time to answer, Rule 12(b) motions, motion practice under Rule 6(c), default, scheduling and disclosures, summary judgment, trial and jury demand, post-trial motions, entry of judgment, costs and fees, voluntary and involuntary dismissal, and the appeal (lit/wy-supreme)."
in_force = "2026-09-21"
known_at = "2026-10-28"
unknown_before = "2026-09-21"
jurisdiction = "Wyoming district court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

