# The United States District Court for the District of Delaware's Local
# Rules of Civil Practice and Procedure as a local-rule layer over lit/frcp
# (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods and page
# limits the Local Rules themselves state and re-encodes no FRCP deadline.
# FRCP 6(a) computes a period stated in a local rule, as D. Del. LR
# 7.1.2(b) says for the motion schedule. The rules are the edition amended
# effective September 1, 2026 (sources/d-del). An appeal goes to the Third
# Circuit under lit/frap.
[package]
name = "ded-local-rules"
version = "0.1.0"
language = 1
pack_id = "ded-local-rules"
forum = "ded"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the District of Delaware: Local Rules of Civil Practice and Procedure"
description = "The District of Delaware's Local Rules of Civil Practice and Procedure as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): the reply in an arbitration-award proceeding, the affidavit of mailing for statutory service on a nonresident, the motion response and reply, the oral argument application, reargument and its answer, the statement of damages, the pretrial order exchange and filing, deposition notice, the bill of costs, objections and review, attorneys' fees after settlement, the statement of pending matters after removal or transfer, Delaware counsel and withdrawal, and the page limits on briefs and reargument."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "United States District Court, D. Del."
counting = "frcp6"

[package.roles]
