# Jurisdictional appeals to the Supreme Court of Ohio (lg-u561.5) under its
# Rules of Practice effective May 1, 2025 (sources/oh-appellate), from
# lit/oh-court-of-appeals. Computation of time is S.Ct.Prac.R. 3.03, which
# includes intermediate weekends and holidays and runs a carried-over last
# day to 11:59:59 p.m. Columbus time; lit/core has no counting rule for it,
# so the periods are stated in notes. Merits briefing is not modeled.
[package]
name = "oh-supreme-court-civil"
version = "0.1.0"
language = 1
pack_id = "oh-supreme-court-civil"
forum = "oh-supreme-court"
authority = "StateRule"
jurisdiction_id = "ohio"
title = "Supreme Court of Ohio, jurisdictional appeals (civil)"
description = "Jurisdictional appeals to the Supreme Court of Ohio from a court of appeals civil judgment under its Rules of Practice (May 1, 2025): the notice of appeal and memorandum in support of jurisdiction, and whether the Court accepts or declines the appeal. Merits briefing is not modeled."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "Supreme Court of Ohio (jurisdictional appeals, civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the brief and reconsideration-application limits of App.R. 19 and 26 and trigger events.
oh-state-rules = { version = "^0.1.0", path = "../oh-rules" }

[sources.oh-app-r]
