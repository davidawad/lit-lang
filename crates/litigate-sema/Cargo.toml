[package]
name = "litigate-sema"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
salsa.workspace = true
toml = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
pubgrub.workspace = true
litigate-base = { path = "../litigate-base" }
litigate-syntax = { path = "../litigate-syntax" }
rowan.workspace = true

# The SMT tier of refinements (SPEC §3.5). Z3 is a native library: a wasm
# build has no solver, and every question the tier asks there is `unknown`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
litigate-smt = { path = "../litigate-smt" }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest.workspace = true
# Integration tests count deadlines with the engine clock over lowered
# counting rules (a dev-only cycle: litigate-lower depends on this crate).
litigate-lower = { path = "../litigate-lower" }

[lints]
workspace = true
