# A civil appeal of right from the Superior Court of Guam to the Supreme
# Court of Guam under the Guam Rules of Appellate Procedure as of February
# 24, 2014 (sources/gu-supreme). Computation of time is GRAP 11(a), which
# excludes intermediate Saturdays, Sundays and legal holidays (1 GCA §
# 1000) from periods under eleven days unless stated in calendar days and
# has no counting rule in lit/core, so the rules' periods are stated in
# notes, not encoded as counted deadlines. The appellate jurisdiction
# statute (7 GCA § 3107) and the certiorari statute (28 U.S.C. § 1259) are
# not vendored and are not cited. A Superior Court appeal arrives from
# lit/gu-superior.
[package]
name = "gu-supreme-court-appellate"
version = "0.1.0"
language = 1
pack_id = "gu-supreme-court-appellate"
forum = "gu-supreme"
authority = "StateRule"
title = "Supreme Court of Guam, civil appeals"
description = "A civil appeal from the Superior Court of Guam to the Supreme Court of Guam under the Guam Rules of Appellate Procedure, as far as the vendored text states: notice, statement of jurisdiction, record, briefing and its length limits, oral argument, judgment, rehearing and mandate."
in_force = "2014-02-24"
known_at = "2026-10-28"
unknown_before = "2014-02-24"
jurisdiction = "Supreme Court of Guam (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

