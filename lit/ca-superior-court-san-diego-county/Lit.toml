# Civil actions in the Superior Court of California, County of San Diego
# (lg-u561.5): the statewide package lit/ca-superior for this county. Its
# graph is the statewide one: the court's local rules (divisions I and II,
# civil) are not vendored, so nothing here departs from the Code of Civil
# Procedure yet. Computation of time is CCP §§ 12-12a, which are not
# vendored, and lit/core has no California counting rule, so the periods
# are stated in notes, not encoded as counted deadlines. An appeal hands
# off to the California Court of Appeal (lit/ca-court-of-appeal, the
# Fourth Appellate District for this county), a limited civil appeal to
# lit/ca-superior-court-appellate-division.
[package]
name = "ca-superior-court-san-diego-county"
version = "0.1.0"
language = 1
pack_id = "ca-superior-court-san-diego-county"
forum = "ca-superior-court-san-diego-county"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "california"
title = "Superior Court of California, County of San Diego, civil"
description = "Superior Court of California, County of San Diego: the court's local rules (divisions I and II, civil) supplement the Code of Civil Procedure; they are not vendored and not modeled. Civil actions in the California superior courts under the Code of Civil Procedure, as far as the vendored chapters state: commencement, the summons and its 30-day response, demurrer, default, discovery, summary judgment, jury trial and its waiver, judgment notwithstanding the verdict and new trial, entry of judgment, dismissal, and the appeal (lit/ca-court-of-appeal)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Superior Court of California, County of San Diego (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: its trigger events (lg-u561.5).
ca-state-rules = { version = "^0.1.0", path = "../ca-rules" }

