# The Western District of Missouri's Local Rules, as applied in its
# criminal cases, as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods the Local Rules
# themselves state for a criminal case and re-encodes no FRCrimP, Speedy
# Trial Act or FRAP 4(b) period. The Local Criminal Rules are L.R. 99.0 to
# 99.10, and "all Local Civil Rules apply to criminal proceedings" unless
# the context clearly indicates otherwise (L.R. 99.0), so the motion,
# magistrate judge review, exhibit and transcript rules are declared here
# too. The rules are those "Adopted by the Court, Effective July 9, 2026"
# (sources/mowd), governing cases on and after that date; earlier
# editions are not vendored, so a query before it is a hole in the
# corpus. The district's civil layer is lit/mowd. Habeas (28
# U.S.C. §§ 2254, 2255; L.R. 9.2) is lit/habeas's; an appeal goes to the
# Eighth Circuit under FRAP 4(b) (lit/frcrimp) and lit/ca8.
