# Civil appeals to the Ohio courts of appeals under the Ohio Rules of
# Appellate Procedure as amended effective July 1, 2026 (sources/oh-appellate).
# The jurisdictional appeal to the Supreme Court of Ohio is
# lit/oh-supreme-court; the brief limits are lit/oh-rules' (lg-u561.5).
# Computation of time is App.R. 14(A), which excludes intermediate
# Saturdays, Sundays and legal holidays from a period of less than seven
# days; it takes its legal holidays from Ohio law, and lit/core has no
# counting rule for it, so the periods are stated in notes, not encoded as
# counted deadlines. The appeal comes from the common pleas package
# (lit/oh-common-pleas).
[package]
name = "oh-court-of-appeals-civil"
version = "0.1.0"
language = 1
pack_id = "oh-court-of-appeals-civil"
forum = "oh-court-of-appeals"
authority = "StateRule"
jurisdiction_id = "ohio"
title = "Ohio courts of appeals, civil appeals"
description = "Civil appeals to the Ohio courts of appeals under the Ohio Rules of Appellate Procedure (July 1, 2026): the notice, record, briefs, argument, the court's determination, reconsideration and en banc consideration, and the jurisdictional appeal to the Supreme Court of Ohio (decided in lit/oh-supreme-court). The brief limits are lit/oh-rules'."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "Ohio courts of appeals (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the brief and reconsideration-application limits of App.R. 19 and 26 and trigger events.
oh-state-rules = { version = "^0.1.0", path = "../oh-rules" }

[sources.oh-app-r]
