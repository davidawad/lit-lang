# Appeals to the Foreign Intelligence Surveillance Court of Review: the
# FISC side as the FISC Rules of Procedure, effective November 1, 2010
# (sources/fisc, shared with lit/fisc), state it -- the petition for
# review, the record and notification (FISC R. 31, 44, 54-59) -- and the
# Court of Review side as its own Rules of Procedure, May 2018 edition
# (sources/fiscr): the notice of appeal, the record, briefing, argument
# and entry of judgment (FISCR R. 5-7, 16-18). 50 U.S.C. § 1803 is
# vendored nowhere in sources/, so it is named in notes. FISC R. 10 and
# FISCR R. 11 have no counting rule in lit/core, so periods are stated in
# notes, not encoded as counted deadlines.
[package]
name = "fiscr"
version = "0.1.0"
language = 1
pack_id = "fiscr"
forum = "fiscr"
authority = "FederalRule"
title = "Foreign Intelligence Surveillance Court of Review"
description = "Appeals from the Foreign Intelligence Surveillance Court to the Court of Review under the vendored FISC Rules of Procedure and FISCR Rules of Procedure: the petition (notice of appeal) and its 30-day period, the effect of en banc proceedings, the stay, the record and its transmission, briefing, argument and entry of judgment."
in_force = "2010-11-01"
known_at = "2026-10-28"
unknown_before = "2010-11-01"
jurisdiction = "Foreign Intelligence Surveillance Court of Review"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

