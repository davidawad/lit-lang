# Civil actions in the Idaho district courts under the Idaho Rules of Civil
# Procedure, as far as the vendored text states: the rules as published on
# the Idaho Supreme Court's rules page (page dated 2026-07-01, amendments
# incorporated on their effective dates; sources/id-district). Time is
# computed under I.R.C.P. 2.2(a), whose legal holidays are Idaho's, not the
# federal ones; lit/core has no counting rule for it, so the periods are
# stated in notes, not encoded as counted deadlines. Appeals are governed
# by the Idaho Appellate Rules (sources/id-supreme), encoded in
# lit/id-supreme. The packages route on lit/id-rules' trigger events
# (lg-u561.5).
[package]
name = "id-district-civil"
version = "0.1.0"
language = 1
pack_id = "id-district-civil"
forum = "id-district"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "idaho"
title = "Idaho District Court, civil"
description = "Civil actions in the Idaho district courts under the Idaho Rules of Civil Procedure, as far as the vendored text states: commencement and the case information sheet, service and its 182-day limit, the time to answer and Rule 12 motions, amendment, default and default judgment, discovery sanctions, summary judgment and its timing, the jury demand and trial, judgment notwithstanding the verdict, new trial and alteration of judgment, costs, relief from judgment, and the notice of appeal under the Idaho Appellate Rules."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "Idaho District Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
id-state-rules = { version = "^0.1.0", path = "../id-rules" }

