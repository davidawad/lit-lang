# The Local Rules of Bankruptcy Procedure of the U.S. Bankruptcy Court for
# the Middle District of Georgia over lit/frbp (FRBP 9029(a); 28 U.S.C. §
# 2075): it declares only the periods and page limits the rules themselves
# state and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frbp9006).
#
# Layers: the Local Rules as of October 1, 2026 are the only vendored text
# (sources/bankr-gam/PROVENANCE.md), a consolidation that carries each
# rule's own adoption and amendment notes, the latest LBR 9013-1(d)'s page
# limits (amended October 1, 2026; LBR 9013-1 amended September 21, 2026,
# the only change since the April 17, 2026 version). No earlier version
# and no amending order is vendored, so the consolidation is the only
# layer and a query before October 1, 2026 is a hole in the corpus.
[package]
name = "bankr-gam-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-gam-local-rules"
forum = "bankr-gam"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Middle District of Georgia: Local Rules"
description = "The Bankr. M.D. Ga. Local Rules (as of October 1, 2026) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): extended schedules, chapter 13 amendments for new assets, separated joint cases, dismissal for missing documents, conversion amendments, the employment of professionals, chapter 11 and subchapter V claims bar dates, late-added creditors, valuation experts, chapter 11 consummation reports, debtor records, abandonment at the meeting of creditors, garnishment, exhibits, redaction, § 727 dismissals, costs, summary judgment (LBR 7056-1), motion page limits (LBR 9013-1(d)), certificates of service and jury consent."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "U.S. Bankruptcy Court for the Middle District of Georgia"
counting = "frbp9006"

[package.instrument]
source = "gamb-lbr"
issuer = "United States Bankruptcy Court for the Middle District of Georgia"
date = "2026-10-01"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.gamb-lbr]
title = "Local Rules of the United States Bankruptcy Court for the Middle District of Georgia (as of October 1, 2026)"
url = "https://www.gamb.uscourts.gov/USCourts/sites/default/files/local_rules/Local_Rules_Oct_2026.pdf"
path = "sources/bankr-gam/gamb-lbr-2026-10-01-sectioned.txt"
path_sha256 = "91af8b23a9f2565c56725413de6afb23ee4386318a9782c3af20c38094c37cb0"
sha256 = "223154ca120dcc6573dfa6ad25957f7fe1b5cf87e0bcdf8314792899e299e885"
