# The deadline domain's change files (lg-wvlf.5): the base layer of the
# certiorari period in a civil case, as the Rules of the Supreme Court in
# force from May 2, 2005 to November 13, 2017 state it (editions effective
# May 2, 2005, October 1, 2007, February 16, 2010 and July 1, 2013, each
# vendored in sources/change-scotus-rules-2005-2013-cert-excerpt.txt). The
# petition is due 90 days after entry of the judgment below, or after the
# denial of a timely rehearing petition there (Rule 13.1, 13.3), counted
# under Rule 30.1; a Justice may extend it by not more than 60 days (Rule
# 13.5). The expect tests of tests/expect/ replay the petitions of the
# civil cases the library cites against it, from the Court's dockets
# (sources/change-corpus/dockets).
[package]
name = "change-certiorari-base"
version = "1.0.0"
language = 1
pack_id = "change-certiorari-base"
forum = "scotus"
authority = "FederalRule"
title = "Deadline domain: the certiorari period in a civil case, 2005-2017 Rules of the Supreme Court (base)"
in_force = "2005-05-02"
known_at = "2026-10-28"

[package.roles]
petitioner = "self"
respondent = "opponent"
justice = "nature"
court = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../../../../lit/core" }

