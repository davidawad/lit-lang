# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the District
# of Colorado over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods and limits the Local Bankruptcy Rules themselves state
# and re-encodes no FRBP period. It is a base package, not a `kind =
# "local-rule"` layer: lit/core has no bankruptcy forum family (L2011, as
# for lit/bankr-mt). Each period is counted under FRBP 9006(a), the FRCP
# 6(a) method (core's frcp6). The rules are those the court's Local Rules
# page states are effective December 1, 2021 (sources/bankr-co, an HTML
# extract that drops the subsection letters, so cites stop at the rule); no
# amending order is vendored, so there are no dated layers and the package
# runs from December 1, 2021.
[package]
name = "bankr-co-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-co-local-rules"
forum = "bankr-co"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the District of Colorado: Local Bankruptcy Rules"
description = "The Bankr. D. Colo. Local Bankruptcy Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): meeting-of-creditors continuances, Rule 2004 examinations, chapter 11 interim compensation, chapter 13 attorney fee applications, chapter 11 dismissal motions, chapter 12 and 13 confirmation, small business plan service, final decrees, stay relief, exemption and lien avoidance objections, withdrawal of the reference, adversary motion practice, depositions and discovery disputes, summary judgment, attorney withdrawal, motion practice (L.B.R. 9013-1) and witness and exhibit lists."
in_force = "2021-12-01"
known_at = "2026-10-28"
unknown_before = "2021-12-01"
jurisdiction = "U.S. Bankruptcy Court for the District of Colorado"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.cob-lbr]
title = "Local Bankruptcy Rules of the United States Bankruptcy Court for the District of Colorado (effective December 1, 2021; HTML page)"
url = "https://www.cob.uscourts.gov/local-rules"
path = "sources/bankr-co/cob-local-rules-2021-12-01-sectioned.txt"
path_sha256 = "b4f6b57ff1af5e4e5e38190f74c90ad7837900fb1587c4316c0787841f82e281"
sha256 = "908f9d880b3248b8c62ff57c52f6e990cda626c6a0e14f7b9e0f6bdcebc7fb12"
as_of = "2021-12-01"
cite_prefixes = ["D. Colo. L.B.R."]
section_heading = "LBR {n}"
