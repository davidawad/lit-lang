# Civil actions in the Superior Court of the State of Delaware under its
# Rules of Civil Procedure, consolidated edition of Mar. 2026
# (sources/de-superior-civil). Two later amending orders (Mar. 13, 2026:
# Rules 5(g), 37(e), new Rules 141-146; Sept. 30, 2026: Rule 26(b)) are
# vendored as separate documents; no cite here binds to a provision they
# amend. Time is computed under Super. Ct. Civ. R. 6(a), which excludes
# intermediate weekends and Delaware legal holidays from a period under 11
# days; lit/core has no counting rule for it, so the periods are stated in
# notes, not encoded as counted deadlines. An appeal hands off to the
# Delaware Supreme Court package (lit/de-supreme-civil).
[package]
family = "state-civil"
name = "de-superior-civil"
version = "0.1.0"
language = 1
pack_id = "de-superior-civil"
forum = "de-superior-civil"
authority = "StateRule"
jurisdiction_id = "delaware"
title = "Delaware Superior Court, civil"
description = "Civil actions in the Superior Court of the State of Delaware under its Rules of Civil Procedure, as far as the vendored text states: commencement and the deposit for costs, service and its 120-day limit, the time to answer, Rule 12(b) motions and amendment, default judgment by the Prothonotary or the Court and setting it aside, discovery and its sanctions, summary judgment, jury demand and trial, post-trial motions and reargument, entry of judgment and costs, dismissal, and the appeal (lit/de-supreme-civil)."
in_force = "2026-03-23"
known_at = "2026-10-28"
unknown_before = "2026-03-23"
jurisdiction = "Superior Court of the State of Delaware (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
de-state-rules = { version = "^0.1.0", path = "../de-rules" }

