# Federal habeas corpus and the motion attacking a federal sentence: the
# limitation periods, gatekeeping and appeal certificate of 28 U.S.C.
# ch. 153 as the Antiterrorism and Effective Death Penalty Act of 1996
# (Pub. L. 104-132, Apr. 24, 1996) left them, with the Rules Governing
# Section 2254 Cases and Section 2255 Proceedings (as amended to Dec. 1,
# 2019). It declares only the periods those texts state. The criminal
# case and its FRAP 4(b) notice of appeal are lit/frcrimp's
# (`criminal-appeal`); the appeal from a final order here runs under FRAP
# 4(a) in lit/frap (2254 and 2255 Rule 11(b)), and the certificate of
# appealability is sought under FRAP 22 (Rule 11(a)), which states no
# period. The package is `FederalRule`, as lit/frcrimp's is beside the
# Speedy Trial Act: the authority lattice ranks a deadline by its package.
[package]
name = "habeas-corpus"
version = "0.1.0"
language = 1
pack_id = "habeas-corpus"
forum = "habeas"
authority = "FederalRule"
title = "Federal Habeas Corpus and Section 2255 Proceedings"
description = "Post-conviction review in the federal courts under 28 U.S.C. §§ 2241-2255 and the Rules Governing Section 2254 Cases and Section 2255 Proceedings: the one-year AEDPA limitation periods of § 2244(d)(1) (state prisoners) and § 2255(f) (federal prisoners), each running from the latest of its four triggers; the court of appeals' 30 days to decide a motion to authorize a second or successive application (§ 2244(b)(3)(D)); and the 14 days to object to a magistrate judge's proposed findings (Rule 8(b)). The appeal from a final order needs a certificate of appealability (§ 2253(c)) and runs under FRAP 4(a) (lit/frap); the direct criminal appeal is FRAP 4(b) (lit/frcrimp)."
jurisdiction = "U.S. District Courts and Courts of Appeals (28 U.S.C. ch. 153)"
in_force = "2024-12-01"
known_at = "2026-10-28"
unknown_before = "1996-04-24"
counting = "frcp6"

[package.roles]
applicant = "self"
respondent = "opponent"
court = "nature"

[dependencies]
# Types, the authority lattice, and the FRCP 6 / FRAP 26 counting rules.
core = { version = "^1.0.0", path = "../core" }

