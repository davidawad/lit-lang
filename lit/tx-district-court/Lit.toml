# Civil suits in the Texas district courts (general civil jurisdiction)
# under the Texas Rules of Civil Procedure, as far as the vendored text
# states. The base text is the TRCP "Last Amended October 1, 2026"
# (sources/tx-district-court), so in_force is that date; earlier editions
# are not vendored, so a query before it is a hole in the corpus. Time is
# computed under Tex. R. Civ. P. 4, which excludes the trigger day,
# includes the last day and rolls a last day falling on a Saturday, Sunday
# or legal holiday to the next day that is none of these; lit/core has no
# counting rule for Texas's legal holidays, so the periods are stated in
# notes, not encoded as counted deadlines. Each county's local rules
# (Tex. R. Civ. P. 3a) are not vendored; Travis County's district courts
# are lit/tx-district-court-travis. The appeal goes to a Texas court of
# appeals under the Texas Rules of Appellate Procedure
# (lit/tx-courts-of-appeals); its notice period is stated here from the
# vendored TRAP.
[package]
name = "tx-district-court-civil"
version = "0.1.0"
language = 1
pack_id = "tx-district-court-civil"
forum = "tx-district-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "texas"
title = "Texas district courts, civil"
description = "Civil suits in the Texas district courts under the Texas Rules of Civil Procedure (October 1, 2026), as far as the vendored text states: petition and citation, service, the answer day, the Rule 91a motion to dismiss and special exceptions, default judgment, the discovery control plan and initial disclosures, discovery sanctions, summary judgment, the jury request, trial and judgment, findings of fact, the motion for new trial and plenary power, dismissal for want of prosecution and reinstatement, nonsuit, and the notice of appeal (lit/tx-courts-of-appeals)."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Texas district courts (general civil jurisdiction)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
tx-state-rules = { version = "^0.1.0", path = "../tx-rules" }

[sources.tx-trcp]
title = "Texas Rules of Civil Procedure, last amended October 1, 2026 (Supreme Court of Texas)"
