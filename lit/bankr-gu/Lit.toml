# The Bankruptcy Local Rules of the Bankruptcy Division of the District
# Court of Guam over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075; BKLR
# 1001-1(b): the rules "supplement the Federal Rules of Bankruptcy
# Procedure"): it declares only the periods and limits the BKLR themselves
# state and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective November 20, 2023 (sources/bankr-gu); the earlier editions are
# not vendored, so a query before November 20, 2023 is a hole in the
# corpus. Appeals go to the District Court or the Ninth Circuit BAP under
# FRBP Part VIII (lit/frbp).
[package]
name = "bankr-gu-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-gu-local-rules"
forum = "bankr-gu"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "District Court of Guam, Bankruptcy Division: Bankruptcy Local Rules"
description = "The Bankruptcy Local Rules (BKLR) of the Bankruptcy Division of the District Court of Guam over the Federal Rules of Bankruptcy Procedure (lit/frbp): payment advices, conversion and § 521(i) dismissal, the responsible individual of an entity debtor, chapter 13 attorney fee disclosures, chapter 13 feasibility, dismissal and business reports, the chapter 11 claims bar date, claims filed on a creditor's behalf, claim objections, chapter 13 plan modification, confirmation and denial, chapter 11 disclosure statements, ballots, confirmation and final decrees, chapter 13 distributions on disputed claims, stay relief and stay extension, discharge certifications, review of rejected filings, small-estate sales, and motion practice with its page limits."
in_force = "2023-11-20"
known_at = "2026-10-28"
unknown_before = "2023-11-20"
jurisdiction = "District Court of Guam, Bankruptcy Division"
counting = "frcp6"

[package.instrument]
source = "gub-bklr"
issuer = "District Court of Guam, Bankruptcy Division"
date = "2023-11-20"
designation = "Bankruptcy Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
