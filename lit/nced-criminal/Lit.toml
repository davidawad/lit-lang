# The Eastern District of North Carolina's Local Criminal Rules of Practice
# and Procedure as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a)): it declares only the periods the Local Criminal Rules
# themselves state and re-encodes no FRCrimP, Speedy Trial Act or FRAP
# 4(b) period (those are lit/frcrimp's). Each period is counted under
# FRCrimP 45(a), which governs "any local rule". The rules are the May
# 2023 edition (sources/nced). Federal habeas is lit/habeas's; an appeal
# to the Fourth Circuit is lit/frcrimp's and lit/ca4's.
