# Civil actions in the Superior Court of the Virgin Islands under the
# Virgin Islands Rules of Civil Procedure (V.I. R. Civ. P.), as far as the
# vendored text states. The base text is the PDF the Judiciary still
# serves (sources/vi-superior-civil/vircp.txt; no edition line, PDF
# created August 8, 2019, so in_force is that date), and its PROVENANCE
# entry records CURRENCY UNCONFIRMED: the court's page shows no amendment
# date and later amendments are not listed. By the PM's standing ruling of
# 2026-10-27 such a source yields holes, not values: this package cites
# the base only for the structure of the action (which rule governs which
# step) and states no period, limit or amount from it. The promulgation
# order SCT-Prom-2023-0003 (effective September 1, 2023) is a separate
# dated layer, never merged into the base: its own source binding, cited
# by versions of the service, amendment and mediation steps that supersede
# the base's from its effective date; values it states are its own. It
# also adds June 19 to the legal holidays of Rule 6(a); lit/core has no
# counting rule for Rule 6, so no period here is counted. The Rules
# Governing the Superior Court (also CURRENCY UNCONFIRMED) are not cited.
# An appeal hands off to lit/vi-supreme-civil.
[package]
name = "vi-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "vi-superior-court-civil"
forum = "vi-superior-civil"
authority = "StateRule"
jurisdiction_id = "virgin-islands"
title = "Superior Court of the Virgin Islands, civil"
description = "Civil actions in the Superior Court of the Virgin Islands under the Virgin Islands Rules of Civil Procedure, as far as the vendored text states: the structure of the action from complaint through judgment, with the 2023 amendments to Rules 4, 15 and 90 as a dated layer; no period from the currency-unconfirmed base text is stated. An appeal hands off to the Supreme Court package (lit/vi-supreme-civil)."
in_force = "2019-08-08"
known_at = "2026-10-28"
unknown_before = "2019-08-08"
jurisdiction = "Superior Court of the Virgin Islands (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

