# Civil actions in the New Hampshire Superior Court under the Rules of the
# Superior Court (sources/nh-superior-civil, as published on 2026-10-27).
# Computation of time is Super. Ct. R. 2: the last day of a period that
# falls on a Saturday, Sunday or a legal holiday under RSA ch. 288 runs to
# the end of the next day that is none of them, and core has no New
# Hampshire holiday calendar, so the rules' periods are stated in notes,
# not encoded as counted deadlines. An appeal hands off to lit/nh-supreme.
[package]
name = "nh-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "nh-superior-court-civil"
forum = "nh-superior-civil"
authority = "StateRule"
jurisdiction_id = "new-hampshire"
title = "New Hampshire Superior Court, civil"
description = "Civil actions in the New Hampshire Superior Court under the Rules of the Superior Court, as far as the vendored text states. An appeal to the Supreme Court hands off to the New Hampshire appellate package (lit/nh-supreme)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "New Hampshire Superior Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

