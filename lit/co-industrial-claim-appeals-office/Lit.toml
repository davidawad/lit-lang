# Review by the Colorado Industrial Claim Appeals Office of an
# administrative law judge's workers' compensation order, and the appeal
# from the panel's order to the court of appeals (lg-u561.5), from the
# petitioner's side. The panel's own procedure (the petition to review,
# its time, the briefs before the panel and the panel's order) is set by
# statute, part 3 of article 43 of title 8, C.R.S., which is not vendored:
# those values stay holes, noted as such. The appeal to the court of
# appeals is C.A.R. 3.1 (Chapter 32 of the 2023 Colorado Revised Statutes
# court-rules volume, OLLS, sources/co-state-appellate) as Rule Change
# 2025(02) (January 9, 2025) restates it, its own source; the court of
# appeals mandate in these cases is C.A.R. 41(b)(1)(B) as Rule Change
# 2024(11) (May 16, 2024) restates it, and the time to petition for
# certiorari is C.A.R. 52(b)(2), which no later order changes. Computation
# of time is C.A.R. 26(a), with the legal holidays of C.A.R. 26(b), for
# which lit/core has no counting rule, so the periods are stated in notes,
# not encoded as counted deadlines. Certiorari is lit/co-supreme-court's.
# The trigger events are lit/co-rules'. The package is in force from Rule
# Change 2025(02).
[package]
name = "co-industrial-claim-appeals-office"
version = "0.1.0"
language = 1
pack_id = "co-industrial-claim-appeals-office"
forum = "co-industrial-claim-appeals-office"
authority = "StateRule"
jurisdiction_id = "colorado"
family = "state-civil"
title = "Colorado Industrial Claim Appeals Office, review of workers' compensation orders"
description = "Panel review of an administrative law judge's workers' compensation order, whose statutory procedure (C.R.S. title 8, article 43, part 3) is not vendored and stays holes, and the appeal from the panel's order to the Colorado Court of Appeals under C.A.R. 3.1: the notice, the record, the briefing periods and priority, the mandate and the time to petition for certiorari."
in_force = "2025-01-09"
known_at = "2026-10-28"
unknown_before = "2025-01-09"
jurisdiction = "Colorado Industrial Claim Appeals Office"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
co-state-rules = { version = "^0.1.0", path = "../co-rules" }

