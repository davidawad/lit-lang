# Criminal prosecutions in the South Dakota circuit courts. South Dakota
# criminal procedure is statutory: SDCL Title 23A, vendored as the South
# Dakota Legislature's statutes API serves it with no edition date
# (sources/sd-criminal-trial-court): CURRENCY UNCONFIRMED. Every cite is
# therefore a hole naming its section, each value in a note the vendored
# text's, unverified, as for lit/bankr-arw. The re-extracted text includes
# full chapter text, including §§ 23A-4, 23A-8, 23A-29, 23A-30,
# 23A-32-15 and 23A-43-2. Currency remains unconfirmed, so values from
# those provisions stay holes with notes.
# The package runs
# from the newest effective date the vendored 23A-44-5.1 history states,
# September 1, 2021. Periods are stated in notes: lit/core has no South
# Dakota counting rule. An appeal goes to the Supreme Court (lit/sd);
# federal habeas is lit/habeas's.
