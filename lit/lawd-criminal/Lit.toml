description = "The U.S. District Court for the Western District of Louisiana's local criminal rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the memorandum page limits the criminal rules adopt from the civil rules; every criminal filing period is left to the court."
