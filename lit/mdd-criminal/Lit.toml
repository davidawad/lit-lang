description = "The District of Maryland's criminal Local Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): motion opposition, reply and reconsideration periods adopted from the civil rules, the surety's period after a bail forfeiture, and the memoranda on an appeal from a magistrate judge in a criminal case."
