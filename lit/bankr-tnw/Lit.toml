# The Local Rules of the U.S. Bankruptcy Court for the Western District of
# Tennessee over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods and page limit the rules themselves state and re-encodes
# no FRBP period. Each period is counted under FRBP 9006(a), the FRCP 6(a)
# method (core's frcp6). The rules are those effective September 24, 2026;
# General Order 26-0002 adopts new TNWB LBR 2016-1 and 3011-1 effective the
# same day, and the consolidation already carries both rules, so there is
# one layer (the order and the new rules are vendored as sources for the
# record). The earlier editions are not vendored, so a query before
# September 24, 2026 is a hole in the corpus.
[package]
name = "bankr-tnw-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-tnw-local-rules"
forum = "bankr-tnw"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Western District of Tennessee: Local Rules"
description = "The Bankr. W.D. Tenn. Local Rules (effective September 24, 2026, including TNWB LBR 2016-1 and 3011-1 adopted by General Order 26-0002) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): chapter 11, 12 and 13 first monthly reports, chapter 11 ballots, tallies, confirmation orders, final reports and final decree motions, the chapter 12 summary, insurance and tax returns, chapter 13 confirmation objections, unclaimed funds objections, no-stay orders, cited opinions, mediated settlements, exhibit withdrawal, trustee review of proposed orders, orders on bench rulings, and the 25-page adversary memorandum limit."
in_force = "2026-09-24"
known_at = "2026-10-28"
unknown_before = "2026-09-24"
jurisdiction = "U.S. Bankruptcy Court for the Western District of Tennessee"
counting = "frcp6"

[package.instrument]
source = "tnwb-lbr"
issuer = "United States Bankruptcy Court for the Western District of Tennessee"
date = "2026-09-24"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

