# The U.S. District Court for the Southern District of Texas's civil
# Local Rules (LR3 to LR83, with their sub-rules) as a local-rule layer
# over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the
# periods the civil Local Rules themselves state and re-encodes no FRCP
# deadline. Each period is counted under FRCP 6, which governs a period
# stated in a local rule (FRCP 6(a)); Texas's own holidays (FRCP
# 6(a)(6)(C)) are not vendored and not modeled. The rules are the edition
# the court serves as current (effective May 1, 2000, "Reprinted March
# 2026", newest listed change LR 16.4 effective March 27, 2026;
# sources/txsd), so in_force is March 27, 2026; earlier editions are not
# vendored, so a query before it is a hole in the corpus. The criminal
# rules are lit/txsd-criminal's; the attorney rules and appendices are not
# encoded. An appeal goes to the Fifth Circuit under lit/frap.
[package]
name = "txsd-local-rules"
version = "0.1.0"
language = 1
pack_id = "txsd-local-rules"
forum = "txsd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Southern District of Texas: Local Rules (civil)"
description = "The U.S. District Court for the Southern District of Texas's civil Local Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): submission of opposed motions and the response and reply periods, objections to an ADR referral and the report after ADR, objections to the authenticity and admissibility of exhibits, the bill of costs and objections to it, and the withdrawal and removal of exhibits."
in_force = "2026-03-27"
known_at = "2026-10-28"
unknown_before = "2026-03-27"
jurisdiction = "U.S. District Court for the Southern District of Texas (civil)"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "txsd-lr"
issuer = "U.S. District Court for the Southern District of Texas"
date = "2026-03-27"
designation = "Local Rules, Civil Rules (reprinted March 2026)"

