workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
    - when: never

stages:
  - verify
  - tag
  - binaries
  - release

variables:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_BUILD_JOBS: "4"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  GIT_DEPTH: "0"

cache:
  key: "rust-1.97.1-$CI_JOB_NAME"
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

ci:
  stage: verify
  image: rust:1.97.1-bookworm
  timeout: 3h
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends build-essential clang cmake curl emacs-nox git jq libssl-dev nodejs npm pkg-config python3 python3-yaml
    - curl --fail --silent --show-error --location https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install --yes nodejs
    - cargo install --locked just
    - cargo install --locked cargo-nextest
    - cargo install --locked cargo-llvm-cov
    - cargo install --locked cargo-audit
    - cargo install --locked cargo-deny
    - cargo install --locked typos-cli
    - cargo install --locked wasm-bindgen-cli --version 0.2.127
    - rustup toolchain install nightly --component llvm-tools-preview
  script:
    - python3 scripts/gitlab-ci-contract-test.py
    - just ci

auto-release-tag:
  stage: tag
  image: rust:1.97.1-bookworm
  resource_group: release-tagging
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      if [ -z "${RELEASE_TAG_TOKEN:-}" ]; then
        echo 'auto-release: configure protected RELEASE_TAG_TOKEN (write_repository) to enable version tagging'
        exit 0
      fi
      next="$(scripts/release/next-version.sh "$CI_COMMIT_SHA")"
      if [ -z "$next" ]; then
        echo 'auto-release: no releasable Conventional Commits since the last tag'
        exit 0
      fi
      scripts/release/prepare.sh "$next"
      git config user.name 'litgraph-release[bot]'
      git config user.email 'release-bot@users.noreply.gitlab.com'
      git commit -qam "chore(release): v$next"
      git tag -a "v$next" -m "litgraph $next"
      git remote set-url origin "https://oauth2:${RELEASE_TAG_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:refs/heads/${CI_DEFAULT_BRANCH}" "refs/tags/v$next"

.release-linux:
  stage: binaries
  image: rust:1.97.1-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends build-essential jq musl-tools
    - rustup target add "$TARGET"
  script:
    - cargo build --release --locked -p litigate-cli -p litigate-lsp --target "$TARGET"
    - name="litgraph-${CI_COMMIT_TAG}-${TARGET}"
    - mkdir -p "dist/${name}"
    - cp "target/${TARGET}/release/litigate" "target/${TARGET}/release/litigate-lsp" "dist/${name}/"
    - cp README.md LICENSE "dist/${name}/" 2>/dev/null || true
    - built="$(find "target/${TARGET}/release/build" -path '*/litgraph-packs-*/out/packs' -type d | head -n 1)"
    - test -n "$built"
    - cp -r "$built" "dist/${name}/packs"
    - scripts/release/lit-roots.sh "target/${TARGET}/release/litigate" > "dist/${name}/LITLOCK-ROOTS"
    - cp "dist/${name}/LITLOCK-ROOTS" dist/LITLOCK-ROOTS
    - tar -C dist -czf "dist/${name}.tar.gz" "$name"
    - cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
  artifacts:
    paths:
      - dist/
    expire_in: never

linux-binaries:
  extends: .release-linux
  parallel:
    matrix:
      - TARGET: x86_64-unknown-linux-gnu
      - TARGET: x86_64-unknown-linux-musl

.release-macos:
  stage: binaries
  tags:
    - saas-macos-medium-m1
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  before_script:
    - curl --fail --silent --show-error --location https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add "$TARGET"
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cargo build --release --locked -p litigate-cli -p litigate-lsp --target "$TARGET"
    - name="litgraph-${CI_COMMIT_TAG}-${TARGET}"
    - mkdir -p "dist/${name}"
    - cp "target/${TARGET}/release/litigate" "target/${TARGET}/release/litigate-lsp" "dist/${name}/"
    - cp README.md LICENSE "dist/${name}/" 2>/dev/null || true
    - built="$(find "target/${TARGET}/release/build" -path '*/litgraph-packs-*/out/packs' -type d | head -n 1)"
    - test -n "$built"
    - cp -r "$built" "dist/${name}/packs"
    - scripts/release/lit-roots.sh "target/${TARGET}/release/litigate" > "dist/${name}/LITLOCK-ROOTS"
    - cp "dist/${name}/LITLOCK-ROOTS" dist/LITLOCK-ROOTS
    - tar -C dist -czf "dist/${name}.tar.gz" "$name"
    - cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
  artifacts:
    paths:
      - dist/
    expire_in: never

macos-binaries:
  extends: .release-macos
  parallel:
    matrix:
      - TARGET: aarch64-apple-darwin
      - TARGET: x86_64-apple-darwin

wasm-binaries:
  stage: binaries
  image: rust:1.97.1-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  before_script:
    - rustup target add wasm32-unknown-unknown
    - cargo install --locked wasm-bindgen-cli --version 0.2.127
  script:
    - cargo build --release --locked -p litigate-wasm --target wasm32-unknown-unknown
    - mkdir -p dist/wasm/web dist/wasm/node
    - wasm-bindgen --target web --out-dir dist/wasm/web target/wasm32-unknown-unknown/release/litigate_wasm.wasm
    - wasm-bindgen --target nodejs --out-dir dist/wasm/node target/wasm32-unknown-unknown/release/litigate_wasm.wasm
    - tar -C dist/wasm/web -czf dist/litigate-wasm-web.tar.gz .
    - tar -C dist/wasm/node -czf dist/litigate-wasm-node.tar.gz .
    - cd dist && sha256sum litigate-wasm-web.tar.gz litigate-wasm-node.tar.gz > litigate-wasm.sha256
  artifacts:
    paths:
      - dist/
    expire_in: never

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.58.0
  needs:
    - job: linux-binaries
      artifacts: true
    - job: macos-binaries
      artifacts: true
    - job: wasm-binaries
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  script:
    - test -f dist/LITLOCK-ROOTS
    - |
      {
        printf '## Lit.lock Merkle roots\n\n```\n'
        cat dist/LITLOCK-ROOTS
        printf '```\n\nDownload a platform archive and verify it with its adjacent `.sha256` file.\n'
      } > release-notes.md
    - glab release create "$CI_COMMIT_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/litigate-wasm.sha256 dist/LITLOCK-ROOTS --name "Litgraph $CI_COMMIT_TAG" --notes-file release-notes.md --use-package-registry
