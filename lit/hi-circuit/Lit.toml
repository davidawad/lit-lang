# Civil actions in the circuit courts of Hawai'i under the Hawai'i Rules of
# Civil Procedure as amended through May 21, 2026, effective July 1, 2026
# (sources/hi-circuit). Computation of time is HRCP 6(a), which excludes
# intermediate Saturdays, Sundays and holidays (HRS § 8-1 days) from a
# period of less than 7 days and has no counting rule in lit/core, so the
# rules' periods are stated in notes, not encoded as counted deadlines;
# HRCP 6(e) adds 2 days after service by mail. An appeal hands off to
# lit/hi-ica. No amending order after the consolidated edition is vendored,
# so the edition is the only layer; no earlier edition is vendored, so a
# query before July 1, 2026 is a hole in the corpus.
[package]
name = "hi-circuit-court-civil"
version = "0.1.0"
language = 1
pack_id = "hi-circuit-court-civil"
forum = "hi-circuit"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "hawaii"
title = "Hawai'i Circuit Court, civil"
description = "Civil actions in the circuit courts of Hawai'i under the Hawai'i Rules of Civil Procedure, as far as the vendored text states. An appeal hands off to the Hawai'i appellate package (lit/hi-ica)."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "Hawaii Circuit Court"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
hi-state-rules = { version = "^0.1.0", path = "../hi-rules" }

