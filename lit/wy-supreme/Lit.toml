# A civil appeal from a Wyoming district court to the Wyoming Supreme
# Court under the Wyoming Rules of Appellate Procedure, the consolidated
# edition including the amendments effective January 19, 2026 to Rules
# 3.02 and 3.09 (sources/wy-state-appellate; the versions in effect until
# that date are sectioned apart and not cited). Wyoming has no
# intermediate appellate court for these appeals. Computation of time is
# W.R.A.P. 14.02, which counts Wyoming legal holidays; core has no Wyoming
# calendar, so periods are stated in notes, not counted. The docket fee is
# set by order of the court and published in the Rules of the Supreme
# Court of Wyoming (W.R.A.P. 2.09(a)), which are not vendored: the amount
# is a hole. Certiorari is a federal hand-off under Sup. Ct. R. 13; the
# vendored Supreme Court rules are in force from March 16, 2026, so the
# package is bound from that date.
[package]
name = "wy-supreme-court-civil-appeals"
version = "0.1.0"
language = 1
pack_id = "wy-supreme-court-civil-appeals"
forum = "wy-state-appellate"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "wyoming"
title = "Wyoming Supreme Court, civil appeals"
description = "Civil appeals from the Wyoming district courts to the Wyoming Supreme Court under the Wyoming Rules of Appellate Procedure, as far as the vendored text states: the appealable order, notice and its time, cross-appeals, the transcript and record, docketing, briefing and page limits, amicus briefs, the brief-only and oral argument dockets, disposition, rehearing, mandate, costs and dismissal. Certiorari is a federal hand-off under Sup. Ct. R. 13."
in_force = "2026-03-16"
known_at = "2026-10-28"
unknown_before = "2026-03-16"
jurisdiction = "Wyoming Supreme Court (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
wy-state-rules = { version = "^0.1.0", path = "../wy-rules" }

