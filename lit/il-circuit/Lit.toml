# Civil actions in the Illinois circuit courts under the Code of Civil
# Procedure, Article II (735 ILCS 5/2-101 et seq.), as the Illinois General
# Assembly's ILCS database displayed it on 2026-10-27 (sources/il-circuit;
# the page states no edition date), and the Illinois Supreme Court Rules
# the outline cites, each as the court linked it on 2026-10-27
# (sources/illappct). Computation of time is the Statute on Statutes (5
# ILCS 70/1.11), which is not vendored and has no counting rule in
# lit/core, so the periods are stated in notes, not encoded as counted
# deadlines. An appeal hands off to lit/illappct.
[package]
name = "il-circuit-court-civil"
version = "0.1.0"
language = 1
pack_id = "il-circuit-court-civil"
forum = "il-circuit"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "illinois"
title = "Illinois circuit court, civil"
description = "Civil actions in the Illinois circuit courts under the Code of Civil Procedure (735 ILCS 5/Art. II) and the Illinois Supreme Court Rules, as far as the vendored text states. An appeal hands off to the Illinois Appellate Court package (lit/illappct)."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "Illinois circuit court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
il-state-rules = { version = "^0.1.0", path = "../il-rules" }

