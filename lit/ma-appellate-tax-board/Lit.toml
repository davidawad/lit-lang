sha256 = "0811b8698254509d2830120cc2b1596e76d7d24d913603842617efd6ac391b34"
as_of = "2026-09-01"
cite_prefixes = ["Mass. R. A. P."]
section_heading = "Rule {n}"

[sources.mass-gen-laws]
title = "General Laws of Massachusetts, NOT VENDORED: no statute text is under sources/; every cite naming it is a hole"
