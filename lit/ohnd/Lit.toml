# The United States District Court for the Northern District of Ohio's
# Local Civil Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071;
# FRCP 83(a)): it declares only the periods and limits the Local Civil
# Rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule. The rules are the full-text
# edition the court publishes as "Civil Rules 4-10-2026" (sources/ohnd),
# whose newest revision (LR 3.16) is effective April 10, 2026; the Local
# Criminal and Patent Rules are separate documents, not vendored. An appeal
# goes to the Sixth Circuit under lit/frap and lit/ca6.
[package]
name = "ohnd-local-rules"
version = "0.1.0"
language = 1
pack_id = "ohnd-local-rules"
forum = "ohnd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Northern District of Ohio: Local Civil Rules"
description = "The Northern District of Ohio's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion opposition and reply periods and memorandum page limits, the page limit on filings by unrepresented parties and prisoners, the default judgment period when every defendant is in default, the case management conference agenda, the cutoff for discovery disputes, Social Security review briefing and its limits, and appeals and objections to a magistrate judge's orders and reports."
in_force = "2026-04-10"
known_at = "2026-10-28"
unknown_before = "2026-04-10"
