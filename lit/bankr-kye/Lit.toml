# The Local Rules of the U.S. Bankruptcy Court for the Eastern District of
# Kentucky over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only
# the periods the Local Rules themselves state and re-encodes no FRBP
# period. Each period is counted under FRBP 9006(a), the FRCP 6(a) method
# (core's frbp9006). The rules are those effective December 1, 2024; the
# court's general orders page lists no later order amending them
# (sources/bankr-kye/PROVENANCE.md), so the consolidation is the only layer.
# The earlier editions are not vendored, so a query before December 1, 2024
# is a hole in the corpus.
[package]
name = "bankr-kye-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-kye-local-rules"
forum = "bankr-kye"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Eastern District of Kentucky: Local Rules"
description = "The Bankr. E.D. Ky. Local Rules (effective December 1, 2024) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): payment advices, the corrected social security number certificate, 14-day hearing notice, Rule 2004 objections, chapter 7 interim distributions, small fee applications, chapter 13 fee certification and dismissed-case fees, the FRBP 2016(b) statement of later counsel, attorney discipline notice, chapter 13 plan objections and adequate protection orders, disclosure statement and confirmation objections, ballot summaries, the post-confirmation progress report, abandonment objections and amended claims after stay relief, discharge certifications and responses, custodian reports, hearing responses (KYEB LBR 9014-1), order service and exhibits."
in_force = "2024-12-01"
known_at = "2026-10-28"
unknown_before = "2024-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Eastern District of Kentucky"
counting = "frbp9006"

[package.instrument]
source = "kyeb-lbr"
issuer = "United States Bankruptcy Court for the Eastern District of Kentucky"
date = "2024-12-01"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

