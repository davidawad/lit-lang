path = "sources/fed-didaho/didaho-local-civil-rules-packet-2026-10-27-sectioned.txt"
path_sha256 = "cd724975f097a38678edcd34535f4600ebf75163e12bb0d4e817c1a81c7194ec"
sha256 = "8e7e03dc3e8cb94999855f56aa707d3f7460d64f4b813d2c6d144f1bc48aeefc"
as_of = "2026-08-17"
cite_prefixes = ["Dist. Idaho Loc. Civ. R."]
section_heading = "Loc. Civ. R. {n}"
