# Civil actions in the Georgia superior courts, as far as the Uniform
# Superior Court Rules (file dated April 9, 2026) and the Civil Practice
# Act (O.C.G.A. Title 9, Chapter 11, current through the 2026 Special
# Session), both in sources/ga-state-civil, state. Periods are in notes,
# not counted deadlines: the Act computes them under O.C.G.A. § 1-3-1
# (O.C.G.A. § 9-11-6(a)), which is not vendored, nor are the new-trial
# period (O.C.G.A. § 5-5-40) or the notice-of-appeal period (O.C.G.A.
# § 5-6-38). The Supreme Court of Georgia's order of October 5, 2026
# (effective November 5, 2026) amends Uniform Rules 4.3, 10.2 and 21
# only, none of which this package cites. An appeal hands off to
# lit/gactapp. The package models the law in force on October 28, 2026,
# the date the Act's text was retrieved; the April 9, 2026 Uniform Rules
# file is still the current one then.
[package]
name = "ga-superior-court-civil"
version = "0.1.0"
language = 1
pack_id = "ga-superior-court-civil"
forum = "ga-state-civil"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "georgia"
title = "Georgia superior courts, civil"
description = "Civil actions in the Georgia superior courts under the Uniform Superior Court Rules (April 9, 2026 file) and the Civil Practice Act: filing, service and its return, the answer period, default certificates, motion practice and summary judgment statements, discovery, pretrial, the trial calendar, dismissal at call, new trial and settlement. Periods are stated, not counted. An appeal hands off to the Court of Appeals package (lit/gactapp)."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Georgia superior courts (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

