# Appellate-jurisdiction review in the Commonwealth Court of Pennsylvania
# (lg-u561.5), under the Pennsylvania Rules of Appellate Procedure
# (sources/pa-appellate-civil): the petition for review of a quasijudicial
# order of a government unit (Chapter 15) and the appeal from a court of
# common pleas (Chapter 9), through the certified record, briefing,
# argument, decision, reargument and the hand-off to lit/pa-supreme-court
# for allowance of appeal. Which matters the court hears is set by statute
# (42 Pa.C.S. §§ 761-763), which is not vendored. Original-jurisdiction
# petitions for review (Pa.R.A.P. 1516(b)) are not modeled.
