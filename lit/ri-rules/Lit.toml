# The Rhode Island base library (lg-u561.5 pattern): the trigger events the
# Rhode Island court packages route their graphs on: lit/ri-superior-civil
# and lit/ri-supreme.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "ri-state-rules"
version = "0.1.0"
language = 1
pack_id = "ri-state-rules"
forum = "ri-state-rules"
authority = "StateRule"
jurisdiction_id = "rhode-island"
title = "Rhode Island state court rules (base library)"
description = "The rule layer Rhode Island's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-02-17"
known_at = "2026-10-28"
unknown_before = "2026-02-17"
jurisdiction = "Rhode Island state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
