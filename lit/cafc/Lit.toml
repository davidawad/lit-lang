# The Federal Circuit's appellate procedure, ported from
# packs/cafc-federal-circuit.json (`litigate diff --against` it is empty).
#
# `authority`: the Federal Circuit Rules are local rules adopted under FRAP
# 47 (Fed. Cir. R. 47(a)), and every declaration here is the court's own
# statement of its procedure, so the package ranks as `LocalRule`. Statutory
# and FRAP periods it restates name their source in their cites.
#
# `in_force`: the December 1, 2025 edition of the Federal Circuit Rules of
# Practice (source `fedcir-rules`), the text every node transcribes; it is
# also the date FRAP 39(e)(3)(A), cited by the bill-of-costs edge, took
# effect (Supreme Court order of April 23, 2025). The edition does not date
# each local rule's last amendment, so no earlier start is claimed for the
# procedure as a whole; the deadlines carry their own sourced intervals.
[package]
name = "cafc"
version = "0.1.0"
language = 1
pack_id = "cafc"
forum = "cafc"
authority = "LocalRule"
title = "U.S. Court of Appeals for the Federal Circuit — Appellate Procedure"
description = "Federal Circuit appellate procedure from four origin tribunals (district court patent judgments, PTAB final written decisions, ITC final determinations, and Court of Federal Claims judgments) through docketing, the mediation program, motions practice, briefing, the joint appendix, oral argument or submission without argument, panel decision (including Fed. Cir. R. 36 judgments of affirmance without opinion), rehearing/rehearing en banc, mandate and costs, and certiorari to the Supreme Court. This is the Federal-Circuit-specific counterpart to frap-appellate-procedure.json (general FRAP flow) and the terminal that ptab-patent-trial-appeal-board.json and itc-337.json link into via their federal-circuit-window / federal-circuit-appeal-window edges."
jurisdiction = "U.S. Court of Appeals for the Federal Circuit / Fed. Cir. R. / FRAP / 28 U.S.C. Ch. 83"
in_force = "2025-12-01"
known_at = "2026-06-09"
counting = "frap26"

[package.roles]
applicant = "self"
court = "nature"
either = "nature"
examiner = "opponent"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

