# Discretionary review in the Supreme Court of Kentucky of a Court of
# Appeals civil decision (lg-u561.5), under the Kentucky Rules of Appellate
# Procedure, current with amendments received through June 1, 2026,
# including Order 2026-01 (effective April 1, 2026) (sources/ky-appellate),
# from lit/ky-court-of-appeals. Computation of time is RAP 6(A); lit/core
# has no counting rule or holiday calendar for Kentucky, so the periods are
# stated in notes. Direct appeals of right, transfer (RAP 17, modeled in
# lit/ky-court-of-appeals) and original proceedings (RAP 60) are not
# modeled. The brief limits are lit/ky-rules'.
[package]
name = "ky-supreme-court-civil"
version = "0.1.0"
language = 1
pack_id = "ky-supreme-court-civil"
forum = "ky-supreme-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "kentucky"
title = "Supreme Court of Kentucky, discretionary review (civil)"
description = "Discretionary review in the Supreme Court of Kentucky of a Court of Appeals civil decision under the Kentucky Rules of Appellate Procedure (as amended effective April 1, 2026): the motion for discretionary review and its response, the cross motion, merits briefing after a grant, submission and oral argument, the opinion and its finality, and the petition for rehearing. The brief limits are lit/ky-rules'."
in_force = "2026-04-01"
known_at = "2026-10-28"
unknown_before = "2026-04-01"
jurisdiction = "Supreme Court of Kentucky (discretionary review, civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: the RAP brief, rehearing and discretionary-review limits and trigger events.
ky-state-rules = { version = "^0.1.0", path = "../ky-rules" }

[sources.ky-rap]
title = "Kentucky Rules of Appellate Procedure (current with amendments received through June 1, 2026; Westlaw public-access site)"
url = "https://govt.westlaw.com/kyrules/Index"
path = "sources/ky-appellate/ky-appellate-rules-westlaw-sectioned.txt"
path_sha256 = "6319e474853fdca1e971d6615f83eb48fa14eb69744b4db945539b39c343ec90"
as_of = "2026-06-01"
cite_prefixes = ["RAP"]
section_heading = "RAP {n}"
