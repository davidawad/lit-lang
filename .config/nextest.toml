  | (package(litigate-lower) & binary(golden) & test(=example_clock_snapshot))
  | (package(litigate-lower) & binary(golden) & test(=example_pack_snapshot))
  | (package(litigate-lower) & binary(graph_errors) & test(=a_flag_payoff_needs_a_currency_with_a_lowering))
