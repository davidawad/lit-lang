# The United States District Court for the Northern District of Ohio's
# Local Criminal Rules as a local-rule layer over lit/frcrimp (28 U.S.C.
# § 2071; FRCrimP 57(a)): it declares only the periods the Local Criminal
# Rules themselves state and re-encodes no FRCrimP, Speedy Trial Act or
# FRAP 4(b) period. FRCrimP 45(a) computes a period stated in a local rule.
# The rules are the full set the court publishes as "Full_Criminal_Rules_
# 10-1-2024" (sources/ohnd); later single-rule redlines on the court's
# local-rules page are not vendored. An appeal goes to the Sixth Circuit
# under lit/frap and lit/ca6; federal habeas is lit/habeas.
[package]
name = "ohnd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "ohnd-criminal-local-rules"
forum = "ohnd-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Northern District of Ohio: Local Criminal Rules"
description = "The Northern District of Ohio's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the response to objections to a magistrate judge's report, the earliest sentencing date after a plea or verdict, the six-week presentence report disclosure, the revised report and statement of unresolved objections two weeks before sentencing, the parties' sentencing positions one week before, and the violation report disclosed 48 hours before a revocation hearing."
in_force = "2024-10-01"
known_at = "2026-10-28"
unknown_before = "2024-10-01"
jurisdiction = "United States District Court, N.D. Ohio (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "ohnd-lcrr"
issuer = "United States District Court for the Northern District of Ohio"
date = "2024-10-01"
designation = "Local Criminal Rules (Full_Criminal_Rules_10-1-2024)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRCrimP periods; this package layers only the court's local criminal rules over them.
frcrimp-criminal-procedure = { version = "^2024.12.0", path = "../frcrimp" }

