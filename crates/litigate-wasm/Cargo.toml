[package]
name = "litigate-wasm"
description = "litigate as WebAssembly: compile .lit/.case source and run engine ops in-process, in the browser or Node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The compiler: `litigate` over an in-memory file tree, and the engine it
# lowers into. Cite verification uses the source corpus it embeds, so
# results match the native CLI.
litigate-cli = { path = "../litigate-cli" }
litigate-engine = { path = "../litigate-engine" }
serde.workspace = true
serde_json.workspace = true
# Pinned to the wasm-bindgen-cli in nixpkgs (the flake's dev shell); the CLI
# and the crate must match exactly.
wasm-bindgen = "=0.2.127"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# rand's OS entropy source needs the JS backend in the browser. The engine
# only uses seeded RNGs, but the dependency must still compile.
getrandom = { version = "0.2", features = ["js"] }
