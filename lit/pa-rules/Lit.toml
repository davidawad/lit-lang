# The Pennsylvania base library (lg-u561.5): what the Pennsylvania court
# packages share: the brief word limits of the Pennsylvania Rules of
# Appellate Procedure (sources/pa-appellate-civil), which govern the Superior
# Court (lit/pa-superior-court), the Commonwealth Court and the Supreme Court
# (lit/pa-supreme-court), and the trigger events the court packages route
# their graphs on. No procedure of its own.
[package]
name = "pa-state-rules"
version = "0.1.0"
