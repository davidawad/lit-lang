# Ported from packs/frcp-civil-procedure.json (bead lg-litigate-epic-tuq.16).
# The pack states the Federal Rules of Civil Procedure "as amended to Dec. 1,
# 2024" (the frcp-rules source); Rule 12, the newest rule it relies on, was
# last amended effective December 1, 2024 (sources/frcp.txt history note), so
# the procedure as a whole is in force from that date. Declarations whose
# current version is older say so with their own `effective` clause.
# unknown_before: every start date here is a lower bound (lit/frcp/periods.lit
# "Effective dates"): an earlier text, not vendored, may have said otherwise,
# so a query before 2024-12-01 that no version answers is a hole in the
# corpus (L3010), not a day with no rule.
[package]
name = "frcp-civil-procedure"
version = "2024.12.0"
language = 1
pack_id = "frcp-civil-procedure"
forum = "frcp"
family = "district-civil"
authority = "FederalRule"
title = "Federal Civil Litigation Under the FRCP"
description = "Pre-filing/jurisdiction & venue -> pleading (service, Rule 12 responses, default) -> amendment & joinder -> discovery (Rule 26 conference through Rule 37 sanctions and CBI-style protective orders) -> pretrial motions (summary judgment, Daubert, motions in limine) -> trial -> post-trial motions (Rule 50/59/60) -> judgment & appeal (28 U.S.C. 1291/1292, FRAP 4, cross-appeal). Citations checked against the FRCP, FRAP, and Title 28 as reflected in content/rulepacks/frcp-fragment.json and the situations corpus; approximate figures (filing fees) are flagged inline. Direct structural counterpart to content/statecharts/mpep-prosecution.json and content/statecharts/itc-337.json for the FRCP pack. Walk mode teaches the FRAP 4(a)(4) tolling trap, the unextendable Rule 59(e)/60(b) and removal clocks, and the jurisdictional (Bowles v. Russell) character of the notice-of-appeal deadline."
jurisdiction = "Federal Rules of Civil Procedure / U.S. District Courts"
in_force = "2024-12-01"
known_at = "2024-12-01"
unknown_before = "2024-12-01"
counting = "frcp6"

[package.roles]
applicant = "self"
court = "nature"
either = "nature"
examiner = "nature"
office = "nature"

# sources/frcp.txt is now the December 1, 2025 print. It is word for word
# the December 1, 2024 text in every rule but Rules 16 and 26, which carry
# the amendments effective December 1, 2025, and the new Rule 16.1
# (sources/PROVENANCE.md). Those amendments are the layer lit/frcp-2025,
# which cites them as `FRCP (2025)`; this package's cites stay the earlier
# layer, as of 2024-12-01, and none names an amended provision.
