path_sha256 = "ed23ddba2d8d71524c635ead3b0c74d46248b2fc903fc116579f51bff9b15de7"
as_of = "2026-10-01"
cite_prefixes = ["Ariz. R. Civ. P."]
section_heading = "Rule {n}"

[sources.arcap]
