# The United States District Court for the District of Kansas's Rules of
# Practice as a local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP
# 83(a)): it declares only the periods and limits the Rules of Practice
# themselves state and re-encodes no FRCP deadline. FRCP 6(a) computes a
# period stated in a local rule. The rules are the Rules of Practice
# adopted effective April 1, 2026 (sources/d-kan), which the court's
# local-rules page lists as current; the criminal rules (CR) and the
# bankruptcy rules (Part XIV) are out of scope. An appeal goes to the Tenth
# Circuit under lit/frap and lit/ca10.
[package]
name = "ksd-local-rules"
version = "0.1.0"
language = 1
pack_id = "ksd-local-rules"
forum = "ksd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the District of Kansas: Rules of Practice (civil)"
description = "The District of Kansas's Rules of Practice as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): sealing, extensions, motion responses and replies and their page limits, supplemental authority, reconsideration, show-cause responses, amended pleadings, deposition notice and objections, discovery motions, removed actions, costs, statutory attorney's fees, journal entries, agency review and Social Security appeals."
in_force = "2026-04-01"
known_at = "2026-10-28"
unknown_before = "2026-04-01"
jurisdiction = "United States District Court, D. Kan."
# FRCP 6(a)(6)(C): Kansas's holidays close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-kansas`).
counting = "frcp6-kansas"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "ksd-rules"
issuer = "United States District Court for the District of Kansas"
date = "2026-04-01"
designation = "Rules of Practice (effective April 1, 2026)"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.ksd-rules]
title = "Rules of Practice of the United States District Court for the District of Kansas (effective April 1, 2026)"
url = "https://www.ksd.uscourts.gov/sites/ksd/files/MASTER%20COPY%20updated%204%2027%2026.pdf"
path = "sources/d-kan/d-kan-local-rules-2026-sectioned.txt"
path_sha256 = "aa997f61649e526629529161843e01d98c8691d08fce5efbb564616e30266c19"
sha256 = "887b23a5a4f9a432dd85a828884b0d48482f0ee061d3fc3a5898467a9043aeab"
as_of = "2026-04-01"
cite_prefixes = ["D. Kan. Rule"]
section_heading = "D. Kan. Rule {n}"
