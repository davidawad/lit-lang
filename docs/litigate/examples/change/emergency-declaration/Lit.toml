# Change example (docs/litigate/CHANGE.md §4): an emergency declaration.
# No Civil Rules emergency has been declared under FRCP 87 (the research
# register found none), so this is a synthetic what-if layer:
# `authoritative = false` admits it only to a counterfactual world. It
# declares a 90-day emergency (FRCP 87(b)(1)(B)) in which a court may extend
# the Rule 59(e) time locked by Rule 6(b)(2), by at most 30 days after the
# order (FRCP 87(c)(2)(A)).
