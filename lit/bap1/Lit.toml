# The Local Rules of the Bankruptcy Appellate Panel for the First Circuit
# over lit/frbp (FRBP 8026; 1st Cir. BAP L.R. 8001-1(a), 8026-1(a)): it
# declares only the periods the panel's own rules state and re-encodes no
# FRBP period (notice, election, record, briefing, motions, rehearing and
# the direct-review periods are lit/frbp's; the 28 U.S.C. § 158(c)(1)
# election is lit/frbp's too). The rules are those effective December 1,
# 2014 (sources/ca1-bap/PROVENANCE.md), the edition the panel's site
# serves. Amended General Order No. 2 (December 16, 2024) governs
# electronic filing and states no period; it is noted where L.R. 8011-1
# refers to it, not declared as a layer. General Order No. 1 (2009)
# predates and is superseded by the 2014 edition. The package is in force
# from the FRBP December 1, 2025 edition it composes with, a lower bound: a
# query before then is a hole in the corpus. Each period is counted under
# FRBP 9006(a) (core's frbp9006; L.R. 8024-1(b) takes its legal holidays
# from FRBP 9006(a)). It is a `kind = "local-rule"` layer in lit/core's
# `bankruptcy-appellate` family (FRBP 8026(a)(1)(A)).
[package]
name = "first-circuit-bankruptcy-appellate-panel"
version = "0.1.0"
language = 1
pack_id = "first-circuit-bankruptcy-appellate-panel"
forum = "bap1"
family = "bankruptcy-appellate"
authority = "LocalRule"
kind = "local-rule"
title = "First Circuit Bankruptcy Appellate Panel Procedure"
description = "Appeals before the Bankruptcy Appellate Panel for the First Circuit under the current Federal Rules of Bankruptcy Procedure (lit/frbp) and the panel's local rules: the filing fee, district court election and its waiver, indicative rulings, the record, clerk orders on procedural motions and their reconsideration, summary disposition, briefing, oral argument, dismissal for failure to prosecute and reinstatement, rehearing and further review in the First Circuit."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "United States Bankruptcy Appellate Panel for the First Circuit (28 U.S.C. § 158(b))"
counting = "frbp9006"

[package.instrument]
source = "bap1-rules"
issuer = "United States Bankruptcy Appellate Panel for the First Circuit"
date = "2014-12-01"
designation = "Local Rules"

[package.roles]
applicant = "self"
appellee = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods themselves (Part 8 appeal periods); this package layers the panel's local rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

