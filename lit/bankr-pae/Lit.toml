# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Eastern
# District of Pennsylvania over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075):
# it declares only the periods and page limits the Local Bankruptcy Rules
# themselves state and re-encodes no FRBP period. Each period is counted
# under FRBP 9006(a), the FRCP 6(a) method (core's frcp6).
#
# Layers: the Local Bankruptcy Rules effective December 1, 2025 are the
# only vendored text (sources/bankr-pae/PROVENANCE.md). The district
# court's order of November 14, 2025 approving the changes is not vendored
# and its changes are already in this consolidation, so the consolidation
# is the only layer. No earlier edition is vendored, so a query before
# December 1, 2025 is a hole in the corpus.
[package]
name = "bankr-pae-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-pae-local-rules"
forum = "bankr-pae"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Eastern District of Pennsylvania: Local Bankruptcy Rules"
description = "The Bankr. E.D. Pa. Local Bankruptcy Rules (effective December 1, 2025) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): complex case reconsideration, cash collateral notice, the involuntary matrix, dismissal and conversion filings, the converted chapter 13 final report, the claims agent and creditor matrices, Rule 2004 examinations, employment and fee objections, chapter 13 fee applications, payments on account, claim objections, disclosure statement objections, distribution reports, insider compensation, chapter 12 and 13 final reports and discharge, unsealing, withdrawal of the reference, resolutions of contested matters and adversary proceedings, sales, dispositive motions, appeal fees, transcripts, disclosures, expedited appeals and brief extensions, application and motion objections (L.B.R. 9013-3, 9014-3), certificates of service, jury consent, mediation and its 2-page memorandum limit, and the student loan management program."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Eastern District of Pennsylvania"
counting = "frcp6"

[package.instrument]
source = "bankr-pae-lbr"
issuer = "United States Bankruptcy Court for the Eastern District of Pennsylvania"
date = "2025-12-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

