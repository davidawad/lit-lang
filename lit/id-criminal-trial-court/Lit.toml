# Criminal cases in the Idaho district courts under the Idaho Criminal
# Rules (I.C.R.), as far as the vendored text states. The base text is
# the rules page the Idaho Supreme Court publishes
# (sources/id-criminal-trial-court), which lists amending orders but
# states no consolidated edition date; its PROVENANCE entry records
# CURRENCY UNCONFIRMED, so in_force is the retrieval date and an earlier
# query is a hole in the corpus. By the PM's standing ruling of
# 2026-10-27 such a source yields holes, not values: this package cites
# the rules only for the structure of the case and states no period,
# limit or amount from them. Idaho's speedy-trial statute (Idaho Code
# § 19-3501) and the other Idaho Code provisions the rules invoke are not
# vendored. The appeal hand-off cites Idaho Appellate Rule 14, bound to
# the text lit/id-supreme binds (page dated July 1, 2026;
# sources/id-supreme), whose period is stated; lit/core has no counting
# rule for it, so it is stated in a note, not encoded.
[package]
name = "id-district-court-criminal"
version = "0.1.0"
language = 1
pack_id = "id-district-court-criminal"
forum = "id-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "idaho"
title = "Idaho district courts, criminal"
description = "Criminal cases in the Idaho district courts under the Idaho Criminal Rules, as far as the vendored text states: the structure of the case from initial appearance through preliminary hearing, indictment or information, arraignment, discovery, pretrial motions, dismissal for delay, plea or trial, post-trial motions and sentencing; no period from the currency-unconfirmed rules is stated. An appeal goes to the Idaho Supreme Court under I.A.R. 14."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "Idaho district courts (criminal)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.id-icr]
