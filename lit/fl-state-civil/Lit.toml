# Civil actions in the Florida circuit courts under the Florida Rules of
# Civil Procedure (the Florida Bar's October 1, 2026 edition,
# sources/fl-state-civil). Computation of time is governed by Florida Rule
# of General Practice and Judicial Administration 2.514 (Fla. R. Civ. P.
# 1.090(a)), which is not vendored, so the rules' periods are stated in
# notes, not encoded as counted deadlines. An appeal hands off to
# lit/fl-state-appellate.
