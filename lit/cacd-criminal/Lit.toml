# The U.S. District Court for the Central District of California's Local
# Criminal Rules (Chapter III of its Local Rules, L.Cr.R.) as a
# local-rule layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it
# declares only the periods the local criminal rules themselves state and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (one source
# of truth: lit/frcrimp). Each period is counted under FRCrimP 45(a),
# which governs "any local rule", so each deadline names `forum frcrimp`.
# The rules are the Chapter III file each page of which is dated
# 12/1/2025 (sources/fed-cdcal); earlier editions are not vendored, so a
# query before that date is a hole in the corpus. The Local Civil Rules
# govern criminal proceedings where applicable directly or by analogy
# (L.Cr.R. 57-1) and live in lit/cacd. An appeal goes to the Ninth Circuit
# under lit/frcrimp's FRAP 4(b) period.
