# The Local Rules of the Bankruptcy Appellate Panel of the Sixth Circuit
# over lit/frbp (FRBP 8026; 6th Cir. BAP LBR 8026-1): it declares only the
# period and the limit the panel's own rules state and re-encodes no FRBP
# period (notice, election, record, briefing, motions, rehearing and the
# direct-review periods are lit/frbp's; 28 U.S.C. § 158(c)(1) election is
# lit/frbp's too). The rules are those "As Amended December 1, 2014", the
# edition the panel's site serves (sources/ca6-bap/PROVENANCE.md); no
# later order amends them, so the edition is the only layer. The package
# is in force from the FRBP December 1, 2025 edition it composes with, a
# lower bound: a query before then is a hole in the corpus. Each period is
# counted under FRBP 9006(a), the FRCP 6(a) method (core's frcp6). Like
# lit/bap8 and lit/bap9 it is a base package, not a `kind = "local-rule"`
# layer: its forum `bap6` is in none of lit/core's forum families (the
# bankruptcy family holds the bankruptcy courts, not the appellate
# panels), so a layer there would be L2011.
[package]
name = "sixth-circuit-bankruptcy-appellate-panel"
version = "0.1.0"
language = 1
pack_id = "sixth-circuit-bankruptcy-appellate-panel"
forum = "bap6"
authority = "FederalRule"
title = "Sixth Circuit Bankruptcy Appellate Panel Procedure"
description = "Appeals before the Bankruptcy Appellate Panel of the Sixth Circuit under the current Federal Rules of Bankruptcy Procedure (lit/frbp) and the panel's local rules: district court election, dismissal for non-prosecution after the clerk's default notice, clerk orders on procedural motions and their reconsideration, briefing, oral argument, disposition, rehearing and further review in the Sixth Circuit."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "Bankruptcy Appellate Panel of the Sixth Circuit"
counting = "frcp6"

[package.roles]
applicant = "self"
appellee = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods themselves (Part 8 appeal periods); this package layers the panel's local rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

