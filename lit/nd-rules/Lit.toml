# The North Dakota base library (lg-u561.5): the trigger events the North Dakota court
# packages route their graphs on: lit/nd-district, lit/ndctapp and the
# outlines outlines/eighth-circuit/north-dakota/state-supreme-court.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "nd-state-rules"
version = "0.1.0"
language = 1
pack_id = "nd-state-rules"
forum = "nd-state-rules"
authority = "StateRule"
jurisdiction_id = "north-dakota"
title = "North Dakota state court rules (base library)"
description = "The rule layer North Dakota's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "North Dakota state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
