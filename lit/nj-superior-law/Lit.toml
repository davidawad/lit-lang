description = "Civil actions in the Law Division of the New Jersey Superior Court under the New Jersey Rules of Court, as far as the vendored text states: the summons and service, the time to answer and its extension, motions to dismiss and amendment, entry of default and judgment by default, discovery, its end dates and dismissal for failure to make discovery, summary judgment, trial and the motion for judgment, settlement of the form of judgment, the new trial motion, relief from judgment, and the appeal (lit/nj-appellate-civil)."
in_force = "2026-09-01"
