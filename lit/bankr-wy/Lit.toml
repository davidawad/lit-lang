# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the District
# of Wyoming over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods and limits the Local Bankruptcy Rules themselves state
# and re-encodes no FRBP period. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules are those
# effective July 1, 2012 (sources/bankr-wy). The one amending order,
# General Order 14-02 (filed June 25, 2014 per its OCR'd stamp, so the
# date is to verify), only replaces the list in LBR 1001-1(D) of the
# District Court local rules that apply in the bankruptcy court; it states
# no period, page limit or filing rule of its own, and its vendored text
# is OCR, so it adds no dated layer of values and is bound below for the
# record only. The package runs from July 1, 2012.
[package]
name = "bankr-wy-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-wy-local-rules"
forum = "bankr-wy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of Wyoming: Local Bankruptcy Rules"
description = "The Bankr. D. Wyo. Local Bankruptcy Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): notice of added creditors, fee applications after conversion, notice and objection periods (LBR 2002-1), Rule 2004 examinations, chapter 11 fiduciary tax accounts, fee application objections, chapter 13 fee applications, new debt notices, claim objections, chapter 13 amended plans and notice, chapter 12 notice, ballot reports, final decrees and final fee applications, stay relief and stay continuation, exemption objection responses, IRS setoff notices, depositions and discovery motions, costs, motion practice and memoranda page limits (LBR 9013-1, 9013-2), certificates of service, settlements, witness and exhibit lists, proposed orders and video appearances."
in_force = "2012-07-01"
known_at = "2026-10-28"
unknown_before = "2012-07-01"
jurisdiction = "U.S. Bankruptcy Court for the District of Wyoming"
counting = "frcp6"

[package.instrument]
source = "wyb-lbr"
issuer = "United States Bankruptcy Court for the District of Wyoming"
date = "2012-07-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.wyb-lbr]
