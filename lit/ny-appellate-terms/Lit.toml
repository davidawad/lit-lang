# An appeal to an Appellate Term of the New York Supreme Court (First and
# Second Departments) from the Civil Court, the District Courts and the
# City, Town and Village Courts, as far as the vendored text states: only
# the time to take an appeal, CPLR 5513, vendored in
# sources/ny-appellate-division-court-of-appeals (the most recent revision
# the NY Senate Open Legislation site showed on 2026-10-27). The court acts
# governing appeals from the lower courts (UCCA, UDCA, UCtCA and UJCA
# art. 17), the First Department Appellate Term's rules (22 NYCRR Part
# 640) and appeals from the Appellate Term to the Appellate Division by
# permission (CPLR 5703) are not vendored: their values stay holes. The
# Second Department Appellate Terms' rules (22 NYCRR Part 731) are
# vendored in sources/ny-appellate-terms from Cornell LII's copy, whose
# sections mix two numberings: only the sections of the current numbering
# are cited (see that PROVENANCE.md). 22 NYCRR Part 732 is repealed. The
# period is stated in a note, not counted (General Construction Law §§ 20,
# 25-a and CPLR 2103 are not vendored; core has no New York holiday
# calendar).
[package]
name = "ny-appellate-terms-civil-appeals"
version = "0.1.0"
language = 1
pack_id = "ny-appellate-terms-civil-appeals"
forum = "ny-appellate-terms-of-the-supreme-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "new-york"
title = "Appellate Terms of the Supreme Court of New York: civil appeals"
description = "A civil appeal to an Appellate Term of the Supreme Court as far as the vendored text states: the time to take the appeal under CPLR 5513 and, in the Second Department, the filing, briefing, calendar, reargument and order rules of 22 NYCRR Part 731. The First Department's Part 640 and the lower-court acts are not vendored and stay holes."
in_force = "2026-10-29"
known_at = "2026-10-29"
unknown_before = "2026-10-29"
jurisdiction = "Appellate Terms of the Supreme Court of New York"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
ny-state-rules = { version = "^0.1.0", path = "../ny-rules" }

