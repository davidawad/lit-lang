[sources.ks-sct-rules]
title = "Reports of Rules Adopted by the Supreme Court of the State of Kansas, 2026 Edition"
url = "https://www.kscourts.gov/KSCourts/media/KsCourts/Rules/2026-RuleBook.pdf"
path = "sources/ks-state-appellate/kansas-2026-rulebook-sectioned.txt"
path_sha256 = "847c087e907f9696356fd0f57fc545bd354df58b085e8183608d0b93a9592dc9"
sha256 = "6e897c9c92c2ca8be21ad0dc4710e0694ceac979d2d60115bbb9547b747d2bd0"
