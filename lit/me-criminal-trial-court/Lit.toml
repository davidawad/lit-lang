# Criminal cases in the Maine Unified Criminal Docket under the Maine
# Rules of Unified Criminal Procedure (M.R.U. Crim. P.), with advisory
# notes, including amendments effective October 1, 2026
# (sources/me-criminal-trial-court/). Computation of time is M.R.U.
# Crim. P. 45(a): intermediate Saturdays, Sundays and legal holidays are
# excluded from periods under 7 days, and core has no Maine counting rule
# or holiday calendar, so the rules' periods are stated in notes, not
# encoded as counted deadlines (as lit/me-superior-civil does). The
# criminal appeal hands off to the Law Court under M.R. App. P. 2B(b),
# whose text is the edition including amendments effective November 1,
# 2024 (sources/me-law-court/). Maine's statutes (Title 15, including the
# Bail Code and post-conviction review, and Title 17-A) are not vendored;
# those cites stay holes. Earlier editions are not vendored, so a query
# before October 1, 2026 is a hole in the corpus.
[package]
name = "me-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "me-criminal-trial-court"
forum = "me-criminal-trial-court"
authority = "StateRule"
jurisdiction_id = "maine"
title = "Maine Unified Criminal Docket, criminal"
description = "Criminal cases in the Maine Unified Criminal Docket under the Maine Rules of Unified Criminal Procedure, as far as the vendored text states: probable cause after a warrantless arrest, initial appearance and bail, indictment or waiver, arraignment, automatic discovery, the dispositional conference and pretrial motions, dismissal for unnecessary delay or for want of an indictment, plea or trial, post-trial motions, sentencing and judgment. An appeal goes to the Law Court within 21 days under M.R. App. P. 2B(b)."
in_force = "2026-10-01"
known_at = "2026-10-28"
unknown_before = "2026-10-01"
jurisdiction = "Maine Unified Criminal Docket (Superior and District Courts, criminal)"

