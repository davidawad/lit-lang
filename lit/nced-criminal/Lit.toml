title = "United States District Court, Eastern District of North Carolina: Local Criminal Rules"
description = "The Eastern District of North Carolina's Local Criminal Rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the pretrial-motion and response periods, the government's discovery conference, trial subpoenas, voir dire and jury instruction requests, the presentence interview, notice of retained counsel, motion responses, translations, related-case notices, sealed documents, change of address, courtroom technology, and the memoranda on an appeal from a magistrate judge."
