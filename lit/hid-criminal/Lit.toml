# The U.S. District Court for the District of Hawaii's Criminal Local
# Rules (CrimLR) as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a)): it declares only the periods and limits the local
# criminal rules themselves state and re-encodes no FRCrimP, Speedy Trial
# Act or FRAP 4(b) period (one source of truth: lit/frcrimp). Each period
# is counted under FRCrimP 45(a), which governs "any local rule", so each
# deadline names `forum frcrimp`. The rules are the edition effective
# January 1, 2023 (filed December 16, 2022; sources/fed-dhaw); no later
# amendment order was found on the court's page, and earlier editions are
# not vendored, so a query before January 1, 2023 is a hole in the
# corpus. Attorney admission and discipline (CrimLR 83.1 to 84.1) are not
# part of the criminal case and are not encoded; habeas proceedings
# (CrimLR 85.1) belong to lit/habeas. An appeal goes to the Ninth Circuit
# under lit/frcrimp's FRAP 4(b) period.
