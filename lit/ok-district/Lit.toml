# Civil actions in the Oklahoma district courts, as far as the vendored
# text states. Oklahoma civil procedure is statutory: the Oklahoma
# Pleading Code (12 O.S. §§ 2001-2027), the new-trial and appeal sections
# (12 O.S. §§ 651-655, 990A-994) and the Oklahoma Supreme Court Rules are
# not vendored (OSCN blocked the fetch: lg-l6xh, #16; sources/ok-state-
# civil vendors only 12 O.S. §§ 1-31, none of them procedure), so every
# step those govern keeps a cite hole. The Rules for District Courts of
# Oklahoma, Rules 1-29 (PARTIAL, currency unconfirmed; sources/ok-state-
# civil, retrieved October 28, 2026), are vendored and cited: service and
# the time to plead, motion practice, the time to assert various claims,
# the pretrial conference, notice of a default hearing, summary judgment,
# the new-trial motion and vacation of judgments. Rules 30 onward are not
# vendored. Computation of time is 12 O.S. § 2006, not vendored and not in
# lit/core, so periods are stated in notes, not counted. The rules state
# no edition date, so in_force is the retrieval date. The appeal hands off
# to lit/ok-supreme-court, which assigns cases to lit/ok-court-of-civil-
# appeals.
