# Civil appeals to the Ohio courts of appeals under the Ohio Rules of
# Appellate Procedure as amended effective July 1, 2026, and jurisdictional
# appeals to the Supreme Court of Ohio under its Rules of Practice effective
# May 1, 2025 (sources/oh-appellate). Computation of time is App.R. 14(A),
# which excludes intermediate Saturdays, Sundays and legal holidays from a
# period of less than seven days, and S.Ct.Prac.R. 3.03, which includes
# them and runs a carried-over last day to 11:59:59 p.m. Columbus time;
# both take their legal holidays from Ohio law, and lit/core has no
# counting rule for either, so the periods are stated in notes, not
# encoded as counted deadlines. The appeal comes from the common pleas package
# (lit/oh-common-pleas).
[package]
name = "oh-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "oh-appellate-civil"
forum = "oh-appellate"
authority = "StateRule"
jurisdiction_id = "ohio"
title = "Ohio courts of appeals and Supreme Court of Ohio, civil appeals"
description = "Civil appeals under the Ohio Rules of Appellate Procedure and the Supreme Court of Ohio Rules of Practice, as far as the vendored text states: the notice of appeal and its time, the record, briefing and its word limits, oral argument, determination and judgment, reconsideration and en banc consideration, and the jurisdictional appeal to the Supreme Court of Ohio."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "Ohio courts of appeals; Supreme Court of Ohio"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

