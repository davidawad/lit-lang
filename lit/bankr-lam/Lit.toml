# The Local Rules of the U.S. Bankruptcy Court for the Middle District of
# Louisiana over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares
# only the periods and limits the Local Rules and the court's standing
# orders themselves state and re-encodes no FRBP period. Each period is
# counted under FRBP 9006(a), the FRCP 6(a) method (core's frcp6).
#
# Layers, in date order: the Local Rules as amended January 1, 2022;
# Standing Order 2024-2 (December 3, 2024; LR 4001-1(f), no period, so
# not bound); Standing Order 2025-1 (November 25, 2025; the objection
# deadline for Monday 2:00 p.m. hearings, text vendored and bound).
# Standing Orders 2026-1 to 2026-3 state practice requirements without
# amending a rule's text and are not vendored (sources/bankr-lam).
[package]
name = "bankr-lam-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-lam-local-rules"
forum = "bankr-lam"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Middle District of Louisiana: Local Rules"
description = "The Bankr. M.D. La. Local Rules, with Standing Order 2025-1 as a dated layer, over the Federal Rules of Bankruptcy Procedure (lit/frbp): the electronic filing declaration, consolidated mailing lists, chapter 13 dismissal defenses, meeting rescheduling review, Rule 2004 protective orders, the counsel procedures statement, chapter 13 confirmation objections, amendments, modifications and discharge, chapter 11 monthly reports, adversary proof of service, motion practice (LR 9013-1 to 9014-1) with its objection deadlines and page limits, and removal records."
in_force = "2022-01-01"
known_at = "2026-10-28"
unknown_before = "2022-01-01"
jurisdiction = "U.S. Bankruptcy Court for the Middle District of Louisiana"
counting = "frcp6"

[package.instrument]
source = "lamb-lr"
issuer = "United States Bankruptcy Court for the Middle District of Louisiana"
date = "2022-01-01"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

