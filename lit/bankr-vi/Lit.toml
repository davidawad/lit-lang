# The Local Bankruptcy Rules of the District Court of the Virgin Islands,
# Bankruptcy Division, over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods and page limits the Local Bankruptcy Rules
# themselves state and re-encodes no FRBP period. Each period is counted
# under FRBP 9006(a), the FRCP 6(a) method (core's frcp6); the rules' days
# are calendar days (LBR 9006-1(C)).
#
# Layers: the vendored text (sources/bankr-vi/PROVENANCE.md) is the court's
# order of January 30, 2026 (ECF 10, Misc. No. 3:25-mc-0003) adopting the
# revised Local Bankruptcy Rules effective February 1, 2026, with the rules
# attached in their entirety (ECF 10-3; LBR 1001-3). The order replaces the
# rules whole rather than amending a vendored consolidation, so it and its
# rules are the one layer, in force February 1, 2026. No earlier edition
# is vendored, so a query before February 1, 2026 is a hole in the corpus.
[package]
name = "bankr-vi-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-vi-local-rules"
forum = "bankr-vi"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "District Court of the Virgin Islands, Bankruptcy Division: Local Bankruptcy Rules"
description = "The District Court of the Virgin Islands' Local Bankruptcy Rules (effective February 1, 2026) as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): certificates of service, tax returns, other income, chapter 13 income proof and domestic support disclosure before the meeting of creditors, Rule 2004 examinations, delinquent tax returns and the business questionnaire, insider compensation, added-creditor claims, chapter 13 claim transfers, deficiencies, amended and late claims and claim objections, ballots, chapter 11 accountings and final decrees, withdrawal of the reference, custodians, sales and the 5-page sale motion statement, adversary motions, replies and continuances, third-party defendants, motion responses and sur-replies (LBR 9006-1, 9013-1), jury demands, mediation and exhibits."
in_force = "2026-02-01"
known_at = "2026-10-28"
unknown_before = "2026-02-01"
jurisdiction = "District Court of the Virgin Islands, Bankruptcy Division"
counting = "frcp6"

[package.instrument]
source = "bankr-vi-lbr"
issuer = "District Court of the Virgin Islands"
date = "2026-01-30"
designation = "Order of January 30, 2026 (Misc. No. 3:25-mc-0003) adopting the Local Bankruptcy Rules effective February 1, 2026"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

