description = "Felony and gross misdemeanor prosecutions in the Nevada district courts under NRS Title 14: appearance before a magistrate, bail, the preliminary examination, indictment or information, arraignment and plea, discovery, pretrial motions and the NRS 178.556 dismissal for delay, trial, post-verdict motions, sentencing, and the NRAP 4(b) notice of appeal, with every period stated in notes from the vendored statutes and rules."
