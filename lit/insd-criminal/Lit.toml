# The U.S. District Court for the Southern District of Indiana's local
# criminal rules as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071;
# FRCrimP 57(a)): it declares only the periods and limits the local
# criminal rules themselves state and re-encodes no FRCrimP, Speedy Trial
# Act or FRAP 4(b) period (one source of truth: lit/frcrimp). Each period
# is counted under FRCrimP 45(a), which governs "any local rule", so each
# deadline names `forum frcrimp`. The rules are the edition the court
# serves as current (amendments through July 1, 2026; sources/insd), so
# in_force is that date; earlier editions are not vendored, so a query
# before it is a hole in the corpus. Amendments the court noticed on
# October 16, 2026 take effect December 1, 2026 and are not vendored; they
# will be a dated layer over this one. The court's Speedy Trial Act plan
# (18 U.S.C. § 3165) and its standard orders under L. Cr. R. 7-1 are not
# vendored. An appeal goes to the Seventh Circuit under lit/frcrimp's
# FRAP 4(b) period and lit/ca7.
[package]
name = "insd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "insd-criminal-local-rules"
forum = "insd-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Southern District of Indiana: Local Criminal Rules"
description = "The U.S. District Court for the Southern District of Indiana's local criminal rules as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the motion to quash a grand-jury subpoena, the objection to a related-case reassignment motion, the parties' versions of the offense for the presentence report, and the sealing procedure's designating-party statement, unsealing after a denial and the 10-page brief limits."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
