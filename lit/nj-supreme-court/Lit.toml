# Certification proceedings in the Supreme Court of New Jersey on a final
# judgment of the Appellate Division, under Part II of the New Jersey
# Rules of Court as far as the vendored text states: the rules the earlier
# outline cited, as published with amendments effective on or before
# September 1, 2026 (sources/nj-appellate-civil, the copy lit/nj-appellate-
# civil cites). Computation of time is governed by R. 1:3-1, which is not
# vendored, and lit/core has no counting rule for it, so the periods are
# stated in notes, not encoded as counted deadlines. Direct appeals to the
# Supreme Court (R. 2:2-1) and its original proceedings are not vendored
# and not modeled. The appeal to the Appellate Division is
# lit/nj-appellate-civil.
[package]
name = "nj-supreme-court"
version = "0.1.0"
language = 1
pack_id = "nj-supreme-court"
forum = "nj-supreme-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "new-jersey"
title = "Supreme Court of New Jersey, certification of Appellate Division judgments"
description = "Certification in the Supreme Court of New Jersey of a final judgment of the Appellate Division, as far as the vendored text states: the notice of petition and its fee, the cross petition, the petition's form, length and time, the grounds for certification, argument, the opinion and judgment, reconsideration and stays pending certification."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "Supreme Court of New Jersey"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: its trigger events (lg-u561.5).
nj-state-rules = { version = "^0.1.0", path = "../nj-rules" }

[sources.nj-rules]
title = "New Jersey Rules of Court (cited appellate rules), amendments effective on or before Sept. 1, 2026"
url = "https://www.njcourts.gov/attorneys/rules-of-court"
path = "sources/nj-appellate-civil/rules-of-court-cited-2026-09-01.txt"
path_sha256 = "46f0f8e357d3d84e1625181279e8ae7e5dbf8d564b0bf1726f39cf778530af1f"
as_of = "2026-09-01"
cite_prefixes = ["N.J. Ct. R."]
section_heading = "N.J. Ct. R. {n}"
