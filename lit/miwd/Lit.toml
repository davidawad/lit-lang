# The United States District Court for the Western District of Michigan's
# Local Civil Rules as a local-rule layer over lit/frcp (28 U.S.C. § 2071;
# FRCP 83(a)): it declares only the periods and limits the Local Civil
# Rules themselves state and re-encodes no FRCP deadline. FRCP 6(a)
# computes a period stated in a local rule. The rules are the Local Rules
# of Practice and Procedure as amended by Administrative Order 26-RL-067
# (August 13, 2026), in force from October 12, 2026 (sources/miwd); the
# earlier edition is not vendored, so the layer starts on that date. The
# general and criminal rules are out of scope. An appeal goes to the Sixth
# Circuit under lit/frap and lit/ca6.
[package]
name = "miwd-local-rules"
version = "0.1.0"
language = 1
pack_id = "miwd-local-rules"
forum = "miwd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Western District of Michigan: Local Civil Rules"
description = "The Western District of Michigan's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): dispositive and nondispositive motion responses and replies and their word and page limits, objections to the authenticity of an electronic signature, Social Security review answers and briefing, marshal-served subpoenas, the bill of costs and motions to disallow costs, Social Security fee motions and responses, and appeals of and objections to a magistrate judge's orders and reports with their responses."
in_force = "2026-10-12"
known_at = "2026-10-28"
unknown_before = "2026-10-12"
jurisdiction = "United States District Court, W.D. Mich."
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "miwd-lcivr"
issuer = "United States District Court for the Western District of Michigan"
date = "2026-10-12"
designation = "Local Civil Rules (as amended by Administrative Order 26-RL-067, effective October 12, 2026)"

[dependencies]
