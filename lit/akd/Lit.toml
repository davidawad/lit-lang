# The District of Alaska's Local Civil Rules as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods and
# limits the Local Civil Rules themselves state and re-encodes no FRCP
# deadline. Each period is counted under FRCP 6(a), which governs "any
# local rule". The rules are the 2025 Revised Edition, effective October
# 15, 2025 (sources/fed-dak). An appeal goes to the Ninth Circuit under
# lit/frap.
[package]
name = "akd-local-rules"
version = "0.1.0"
language = 1
pack_id = "akd-local-rules"
forum = "akd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, District of Alaska: Local Civil Rules"
description = "The District of Alaska's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion briefing and its page and word limits, oral argument and evidentiary hearing requests, reconsideration, amended pleadings, the standard pretrial times, related cases, settlement closing papers, administrative agency appeals, trial briefs, exhibits, voir dire and jury instructions, costs, prejudgment interest, satisfaction of judgments, magistrate judge declination, and remote public access."
in_force = "2025-10-15"
known_at = "2026-10-28"
unknown_before = "2025-10-15"
jurisdiction = "United States District Court, D. Alaska"
counting = "frcp6"

