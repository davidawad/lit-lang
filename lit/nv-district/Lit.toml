# Civil actions in the Nevada district courts under the Nevada Rules of
# Civil Procedure, as far as the vendored text states: the rules
# "Including Amendments Through October 31, 2025" as published by the
# Nevada Legislature's law library (sources/nv-district). Time is computed
# under NRCP 6(a), whose legal holidays are those NRS 236.015 sets aside,
# not the federal ones; lit/core has no counting rule for them, so the
# periods are stated in notes, not encoded as counted deadlines. Appeals
# are governed by the Nevada Rules of Appellate Procedure
# (sources/nv-supreme), encoded in lit/nv-supreme.
[package]
name = "nv-district-civil"
version = "0.1.0"
language = 1
pack_id = "nv-district-civil"
forum = "nv-district"
authority = "StateRule"
jurisdiction_id = "nevada"
title = "Nevada District Court, civil"
description = "Civil actions in the Nevada district courts under the Nevada Rules of Civil Procedure, as far as the vendored text states: commencement and the 120-day service limit, the time to answer and Rule 12 motions, amendment, default and default judgment, the early case conference and its report, summary judgment and its timing, the jury demand, want of prosecution, judgment and notice of its entry, renewed judgment as a matter of law, new trial and alteration of judgment, attorney fees, relief from judgment, and the notice of appeal under the Nevada Rules of Appellate Procedure."
in_force = "2025-10-31"
known_at = "2026-10-28"
unknown_before = "2025-10-31"
jurisdiction = "Nevada District Court (civil)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

