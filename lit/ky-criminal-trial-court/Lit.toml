# Criminal cases in the Kentucky trial courts under the Kentucky Rules of
# Criminal Procedure (RCr), current with amendments received through
# October 1, 2026 as published on the Westlaw public-access site the
# Kentucky courts point to (sources/ky-criminal-trial-court). Computation
# of time is RCr 1.10(a): the day of the event is excluded, a last day
# falling on a Saturday, Sunday or legal holiday runs to the next day that
# is none of those, and a period of less than seven days excludes
# intermediate Saturdays, Sundays and legal holidays; lit/core has no
# counting rule or holiday calendar for Kentucky, so the periods are stated
# in notes, not encoded as counted deadlines. The rules state no
# speedy-trial period beyond RCr 9.02; the statutory periods (KRS 500.110
# among them) are not vendored and stay holes. The criminal appeal's time
# is RCr 12.04; the Rules of Appellate Procedure govern the appeal itself
# (RCr 12.02; sources/ky-appellate). Federal habeas is lit/habeas.
