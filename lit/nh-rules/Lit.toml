# The New Hampshire base library (lg-u561.5): the trigger events the New
# Hampshire civil court packages route their graphs on: lit/nh-superior-
# civil (the Superior Court) and lit/nh-supreme (the appeal to the
# Supreme Court). It declares no period: the rules' periods are stated in
# the court packages' notes, as N.H. Super. Ct. R. 2 and N.H. Sup. Ct. R.
# 27(1) count New Hampshire legal holidays and core has no New Hampshire
# calendar. No procedure of its own.
[package]
name = "nh-state-rules"
version = "0.1.0"
language = 1
pack_id = "nh-state-rules"
forum = "nh-state-rules"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "new-hampshire"
title = "New Hampshire state court rules (base library)"
description = "The rule layer New Hampshire's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "New Hampshire state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
