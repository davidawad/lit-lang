# The U.S. District Court for the District of Rhode Island's Local Rules
# applicable to criminal proceedings (LR Cr 6 to 58) as a local-rule layer
# over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it declares only the
# periods the LR Cr rules themselves state and re-encodes no FRCrimP,
# Speedy Trial Act or FRAP 4(b) period (one source of truth:
# lit/frcrimp). Each period is counted under FRCrimP 45(a), which governs
# "any local rule" (LR Cr 47 cross-refers to it), so each deadline names
# `forum frcrimp`. The rules are the Local Rules "Effective January 1,
# 2006, As Amended through April 1, 2024" (sources/dri), the edition the
# court's local-rules page lists and lit/rid also binds; earlier editions
# are not vendored, so a query before it is a hole in the corpus. An
# appeal goes to the First Circuit under lit/frcrimp's FRAP 4(b) period.
[package]
name = "rid-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "rid-criminal-local-rules"
forum = "rid-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the District of Rhode Island: Local Rules (criminal)"
description = "The District of Rhode Island's Local Rules applicable to criminal proceedings as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the plea agreement filing, the exchange of discovery requests, inspection of subpoenaed materials, recorded-conversation transcripts and objections, objection to magistrate judge empanelment and voir dire questions, sentencing witnesses and expert reports, motion responses and replies, and objections to magistrate judge rulings and recommendations."
in_force = "2024-04-01"
known_at = "2026-10-28"
unknown_before = "2024-04-01"
jurisdiction = "U.S. District Court for the District of Rhode Island (criminal)"
counting = "frcrimp45"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "dri-lrcr"
issuer = "United States District Court for the District of Rhode Island"
date = "2024-04-01"
designation = "Local Rules applicable to criminal proceedings"

