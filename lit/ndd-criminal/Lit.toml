# The District of North Dakota's Criminal Rules (D.N.D. Crim. L.R.) as a
# local-rule layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)): it
# declares only the periods and limits the criminal rules themselves
# state and re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period.
# The rules are the court's Local Rules "Effective October 6, 2025"
# (sources/ndd), the edition its local-rules page lists, so the package
# runs from that date; earlier editions are not vendored, so a query
# before it is a hole in the corpus. The general rules (D.N.D. Gen. L.R.)
# apply in civil and criminal proceedings and state no party period in a
# criminal case; lit/ndd declares the civil layer. Habeas (28 U.S.C.
# §§ 2254, 2255) is lit/habeas's; an appeal goes to the Eighth Circuit
# under FRAP 4(b) (lit/frcrimp) and lit/ca8.
