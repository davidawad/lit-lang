# A civil action in a Mississippi circuit court under the Mississippi Rules
# of Civil Procedure (the courts.ms.gov file dated 2026-07-01, amendments in
# the text through September 10, 2025; sources/ms-circuit-court). Computation
# of time is M.R.C.P. 6(a), which counts by Mississippi legal holidays and
# days the courthouse or clerk's office is closed; lit/core has no
# Mississippi counting rule, so the rules' periods are stated in notes, not
# encoded as counted deadlines. Appeals go to lit/ms-appellate. Chancery
# jurisdiction rests on the Constitution and statute, which are not
# vendored.
[package]
name = "ms-circuit-court-civil"
version = "0.1.0"
language = 1
pack_id = "ms-circuit-court-civil"
forum = "ms-circuit-court"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "mississippi"
title = "Mississippi circuit courts, civil"
description = "A civil action in a Mississippi circuit court under the Mississippi Rules of Civil Procedure, as far as the vendored text states: commencement, service and its 120-day limit, the answer and Rule 12 motions, amendment, default and setting it aside, discovery and sanctions, summary judgment, trial setting and jury trial, post-trial motions, judgment, and dismissal (voluntary, involuntary and on the clerk's motion for want of prosecution)."
in_force = "2026-07-01"
known_at = "2026-10-28"
unknown_before = "2026-07-01"
jurisdiction = "Mississippi circuit courts (civil; chancery courts are separate)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
ms-state-rules = { version = "^0.1.0", path = "../ms-rules" }

