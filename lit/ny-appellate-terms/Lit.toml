# An appeal to an Appellate Term of the New York Supreme Court (First and
# Second Departments) from the Civil Court, the District Courts and the
# City, Town and Village Courts, as far as the vendored text states: only
# the time to take an appeal, CPLR 5513, vendored in
# sources/ny-appellate-division-court-of-appeals (the most recent revision
# the NY Senate Open Legislation site showed on 2026-10-27). The court acts
# governing appeals from the lower courts (UCCA, UDCA, UCtCA and UJCA
# art. 17), the Appellate Terms' own rules (22 NYCRR Parts 640, 731 and
# 732) and appeals from the Appellate Term to the Appellate Division by
# permission (CPLR 5703) are not vendored: their values stay holes. The
# period is stated in a note, not counted (General Construction Law §§ 20,
# 25-a and CPLR 2103 are not vendored; core has no New York holiday
# calendar).
