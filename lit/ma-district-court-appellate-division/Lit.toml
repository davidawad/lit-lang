# Civil appeals from the District Court and the Boston Municipal Court to
# their Appellate Division, and the further appeal to the Appeals Court,
# from the appellant's side. The Appellate Division's own procedure is the
# District/Municipal Courts Rules for Appellate Division Appeal
# (Mass. R. Civ. P. 64(b)) and G.L. c. 231, §§ 108-109, neither vendored,
# so its cites and periods stay holes. The further appeal, from the
# appellate division as a "lower court" (Mass. R. A. P. 1(c)), is taken
# under Mass. R. A. P. 3(a) and 4(a) (sources/ma-appeals-sjc).
[package]
name = "ma-district-court-appellate-division"
version = "0.1.0"
language = 1
pack_id = "ma-district-court-appellate-division"
forum = "ma-district-court-appellate-division"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "massachusetts"
title = "Massachusetts District Court, Appellate Division"
description = "Civil appeals and reports from the District Court and the Boston Municipal Court to the Appellate Division through its decision, and the further appeal to the Appeals Court under Mass. R. A. P. 3(a) and 4(a), as far as the vendored text states. The Dist./Mun. Cts. R. A. D. A. and G.L. c. 231, §§ 108-109 are not vendored and stay holes; the further appeal itself is lit/ma-appeals-court."
in_force = "2026-09-01"
known_at = "2026-10-28"
unknown_before = "2026-09-01"
jurisdiction = "Massachusetts District Court and Boston Municipal Court, Appellate Division"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer: its trigger events (lg-u561.5).
ma-state-rules = { version = "^0.1.0", path = "../ma-rules" }

