# Ported from packs/mpep-prosecution.json (`litigate import`, then made
# strict). in_force is the MPEP 9th ed. Rev. 01.2024 date every MPEP source
# below records as `as_of`: the pack's citations were verified against that
# edition, so it is the earliest date this package claims to be in force.
# known_at is the vendored 37 C.F.R. corpus date (`cfr-37-patents.as_of`).
# The rules here are agency regulations (37 C.F.R.) and their statutes, so
# the package level is core's `Regulation`. The MPEP itself is guidance,
# not regulation, and no declaration rests on it: every counting rule,
# calendar and deadline cites 37 C.F.R. or 35 U.S.C., and MPEP sections
# appear only as node and edge cites and notes, which take no part in
# precedence. The 35 U.S.C. deadlines (§§ 119(e), 251(d), 315(b),
# 321(c)) sit at the package level too, below their statutes' rank; none
# delegates, so no lower authority can displace them.
[package]
name = "mpep-prosecution"
version = "0.1.0"
language = 1
pack_id = "mpep-prosecution"
forum = "uspto"
authority = "Regulation"
title = "U.S. Utility Patent Prosecution"
description = "Canonical pre-filing → prosecution → appeal → issuance flowchart for a U.S. nonprovisional utility application. MPEP and 37 CFR citations verified against live USPTO/eCFR sources (2024-07-01 edition). Walk mode teaches the RCE-vs-appeal fork economics, the unextendable 6-month ceiling, and abandonment-as-permadeath."
jurisdiction = "USPTO / MPEP"
in_force = "2024-01-31"
known_at = "2026-01-01"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[package.roles]
applicant = "self"
either = "nature"
examiner = "nature"
office = "nature"

# 35 U.S.C. §§ 41, 111, 119, 132, 133, 141, 145 and 151 are vendored in
# the prosecution-fragments file; the other 35 U.S.C. sections in
# usc-additional.txt (bound through `usc35-154`). A cite binds to the
# binding whose file holds its heading.
