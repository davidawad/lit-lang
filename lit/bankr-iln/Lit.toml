# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Northern
# District of Illinois over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods the Local Rules themselves state and
# re-encodes no FRBP period. Each period is counted under FRBP 9006(a),
# the FRCP 6(a) method (core's frcp6). The rules are those "As amended,
# Effective September 1, 2024" (sources/bankr-iln/PROVENANCE.md); the
# amendments are consolidated in that edition and no later amending order
# is vendored, so the consolidation is the only layer. No earlier edition
# is vendored, so a query before September 1, 2024 is a hole in the
# corpus.
[package]
name = "bankr-iln-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-iln-local-rules"
forum = "bankr-iln"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Northern District of Illinois: Local Bankruptcy Rules"
description = "The Bankr. N.D. Ill. Local Bankruptcy Rules as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): filing-fee installments, divided joint cases, chapter 11 ballot reports, identification of unrepresented debtors, dismissal of discharge proceedings, bills of costs, motion notice and presentment (LBR 9013-1), modified orders served on pro se parties, the state court record after removal, attorney discipline and restricted filers, exhibits, Complex Chapter 11 Case designation and omnibus motion practice, and the fifteen-page limit."
in_force = "2024-09-01"
known_at = "2026-10-28"
unknown_before = "2024-09-01"
jurisdiction = "U.S. Bankruptcy Court for the Northern District of Illinois"
counting = "frcp6"

[package.instrument]
source = "ilnb-lbr"
issuer = "United States Bankruptcy Court for the Northern District of Illinois"
date = "2024-09-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

