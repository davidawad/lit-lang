# Civil appeals from the Superior Court to the Supreme Court of the Virgin
# Islands under the Virgin Islands Rules of Appellate Procedure (VIRAP),
# as far as the vendored text states (sources/vi-supreme-civil). The base
# text is the consolidated PDF the court still serves (its latest
# amendment line is "Restated and Amended March 1, 2017", so in_force is
# March 1, 2017); its currency was checked against the court's
# promulgation-order archives (lg-w6fv, 2026-10-28; lg-61j4, 2026-10-29).
# Three later orders are separate dated layers, never merged into the
# base: S. Ct. Prom. No. 2020-0004 repeals the base's Rule 40 (Electronic
# Filing and Service) effective August 31, 2020, leaving e-filing and
# e-service to the V.I. Electronic Filing Rules, which are not vendored;
# no step here cites the base's Rule 40, so the order is named here and
# not bound; SCT-Prom-2023-0003
# (Rule 16(b), effective September 1, 2023) changes only the computation
# of time, which is not encoded here, so it is named in notes and not
# bound; SCT-Prom-2024-0001 (Rules 31 and 40, effective December 1, 2024)
# is bound as its own source, cited by a version of the rehearing step that
# supersedes the base's from its effective date; its Rule 40 (en banc) is a
# new rule, not the repealed e-filing rule. That order's extract is
# the OCR text layer of a scanned PDF and no second public source of the
# same edition is vendored, so no number is taken from it. Time is
# computed under VIRAP 16(b), whose legal holidays (1 V.I.C. § 171) differ
# from the federal ones; lit/core has no counting rule for it, so periods
# are stated in notes, not encoded as counted deadlines. The Internal
# Operating Procedures (sources/vi-supreme-civil/iops-2014-04-01.txt) are
# CURRENCY UNCONFIRMED and are not cited. The trial-court side is
# lit/vi-superior-civil; review of the Supreme Court's final decisions on
# certiorari belongs to lit/scotus.
[package]
name = "vi-supreme-court-civil-appeals"
version = "0.1.0"
language = 1
pack_id = "vi-supreme-court-civil-appeals"
forum = "vi-supreme-civil"
authority = "StateRule"
jurisdiction_id = "virgin-islands"
title = "Supreme Court of the Virgin Islands, civil appeals"
description = "Civil appeals from the Superior Court to the Supreme Court of the Virgin Islands under the Virgin Islands Rules of Appellate Procedure, as far as the vendored text states: the notice of appeal and its time, the docket fee, the transcript and record, appellate mediation, briefs and their word limits, oral argument, entry of judgment, rehearing (as replaced effective December 1, 2024), costs, the mandate and its stay pending certiorari, and voluntary dismissal."
in_force = "2017-03-01"
known_at = "2026-10-28"
unknown_before = "2017-03-01"
jurisdiction = "Supreme Court of the Virgin Islands (civil appeals)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

