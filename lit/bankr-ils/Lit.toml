# The Local Rules of Bankruptcy Procedure of the U.S. Bankruptcy Court for
# the Southern District of Illinois over lit/frbp (FRBP 9029(a); 28 U.S.C.
# § 2075): it declares only the periods the Local Rules themselves state
# and re-encodes no FRBP period. It is a base package, not a `kind =
# "local-rule"` layer: lit/core has no bankruptcy forum family (L2011 for
# `bankr-ils`), as for lit/bankr-ct. Each period is counted under FRBP
# 9006(a), the FRCP 6(a) method (core's frcp6). The rules took effect June
# 1, 2012 (LBR 1001(C)); the vendored text is the edition "Revised
# December 1, 2015 to Reflect Updated Form Numbers and Names", the court's
# current version (sources/bankr-ils/PROVENANCE.md), so `in_force` is that
# revision and the consolidation is the only layer. The June 1, 2012 text
# is not vendored, so a query before December 1, 2015 is a hole in the
# corpus.
[package]
name = "bankr-ils-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-ils-local-rules"
forum = "bankr-ils"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Southern District of Illinois: Local Rules of Bankruptcy Procedure"
description = "The Bankr. S.D. Ill. Local Rules of Bankruptcy Procedure as a local-rule layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): involuntary schedules, amended matrices, payment advices, state tax returns, reinstatement, Rule 2004 motions, chapter 7 trustee reports, interim compensation, withdrawal of counsel, the chapter 11 claims bar date, ballots, closing a chapter 11 case early, stay relief oppositions, lien avoidance and redemption notices, withdrawal of the reference, auction proceeds, adversary pretrial exchanges, dismissal of adversary proceedings, summary judgment, briefs and their page limits, and jury consent."
in_force = "2015-12-01"
known_at = "2026-10-28"
unknown_before = "2015-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Southern District of Illinois"
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.ilsb-lbr]
title = "Local Rules of Bankruptcy Procedure of the United States Bankruptcy Court for the Southern District of Illinois (June 1, 2012; revised December 1, 2015)"
url = "https://www.ilsb.uscourts.gov/sites/ilsb/files/LocalRules-BkSoDistrict_12-01-15.pdf"
path = "sources/bankr-ils/ilsb-lbr-2015-12-01-sectioned.txt"
path_sha256 = "6543bdc901c48b26cbcb4f3a1a988d142aaef7fd3aacd3fe8e0fd633d8e12046"
sha256 = "146f9f0632cb4d4b329f0574e32dbf4a091647cae4695fc19504271375580e95"
as_of = "2015-12-01"
cite_prefixes = ["Bankr. S.D. Ill. LBR"]
section_heading = "LBR {n}"
