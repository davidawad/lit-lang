# The District Court of Guam's Civil Local Rules of Practice as a
# local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a); CVLR 1(c):
# the rules "supplement the Federal Rules of Civil Procedure"): it declares
# only the periods and limits the CVLR themselves state and re-encodes no
# FRCP deadline. Each period is counted under FRCP 6(a), which governs "any
# local rule". The rules are those effective July 22, 2019
# (sources/fed-dguam). An appeal goes to the Ninth Circuit under lit/frap.
[package]
