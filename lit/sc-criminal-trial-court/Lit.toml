title = "South Carolina court of general sessions, criminal"
description = "Criminal cases in the South Carolina court of general sessions under Title 17 of the South Carolina Code, as far as the vendored text states: release, the statutory demand for trial and discharge on failure to indict and try, new trials, the ten-day criminal notice of appeal of SCACR Rule 203(b)(2) and its stay by a timely post-trial motion, and the one-year post-conviction relief limit. Title 17 is CURRENCY UNCONFIRMED and the SCRCrimP is not vendored, so their cites are holes."
in_force = "2026-04-30"
known_at = "2026-10-28"
unknown_before = "2026-04-30"
jurisdiction = "South Carolina trial courts of general criminal jurisdiction"

