# The Local Rules of the U.S. Bankruptcy Court for the District of Kansas
# over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it declares only the
# periods and limits the Local Rules themselves state and re-encodes no
# FRBP period. Each period is counted under FRBP 9006(a), the FRCP 6(a)
# method (core's frbp9006). The rules are those effective December 1, 2024
# (sources/bankr-ks), which carry each rule's amendment history and the
# standing orders then in effect; no later amending order is vendored, so
# there are no dated layers and the package runs from December 1, 2024.
[package]
name = "bankr-ks-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-ks-local-rules"
forum = "bankr-ks"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the District of Kansas: Local Rules"
description = "The Bankr. D. Kan. Local Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): BNC notice corrections, Rule 2004 examinations, chapter 7 priority claim amendments, mortgage creditor notices, the subchapter V claims bar date, chapter 13 mortgage checklists and payee changes, chapter 11 final decree applications, conditional stay relief orders, stay extension motions, tax return and information duties, subchapter V discharge, abandonment, motions to dismiss, depositions and protective orders, intervention on dismissal of a § 727 complaint, costs, summary judgment, proposed orders, show cause responses, brief page limits, motion timing, mediation reports, remand and journal entries."
in_force = "2024-12-01"
known_at = "2026-10-28"
unknown_before = "2024-12-01"
jurisdiction = "U.S. Bankruptcy Court for the District of Kansas"
counting = "frbp9006"

[package.instrument]
source = "ksb-lbr"
issuer = "United States Bankruptcy Court for the District of Kansas"
date = "2024-12-01"
designation = "Local Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.ksb-lbr]
