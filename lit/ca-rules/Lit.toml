# The California base library (lg-u561.5): what the California court
# packages share. The California Rules of Court, Title 8
# (sources/ca-court-of-appeal), govern the Courts of Appeal
# (lit/ca-court-of-appeal and its six districts) and the Supreme Court
# (lit/ca-supreme-court); the court packages route their graphs on this
# library's trigger events. It declares no period: the rules' periods are
# stated in the court packages' notes. No procedure of its own.
[package]
name = "ca-state-rules"
version = "0.1.0"
language = 1
pack_id = "ca-state-rules"
forum = "ca-state-rules"
authority = "StateRule"
jurisdiction_id = "california"
title = "California state court rules (base library)"
description = "The rule layer California's court packages share: the trigger events of the California Rules of Court, Title 8, and the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "California state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
