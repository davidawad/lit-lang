name = "nysd-criminal-local-rules"
version = "0.1.0"
language = 1
pack_id = "nysd-criminal-local-rules"
forum = "nysd-criminal"
family = "district-criminal"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. District Court for the Southern District of New York: Local Criminal Rules"
description = "The Southern District of New York's Local Criminal Rules (the Joint Local Rules of the Southern and Eastern Districts) as a local-rule layer over the Federal Rules of Criminal Procedure (lit/frcrimp): the supplemental disclosure statement, the government's and the defense's expert disclosures before trial, the motion opposition and reply periods, and the reconsideration period with its memorandum page limits."
in_force = "2026-01-02"
known_at = "2026-10-28"
unknown_before = "2026-01-02"
