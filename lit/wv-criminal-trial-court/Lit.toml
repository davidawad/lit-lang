description = "Criminal cases in the West Virginia circuit courts under the West Virginia Rules of Criminal Procedure, as far as the vendored text states: the preliminary examination within 10 or 20 days, pretrial motions at the time the court sets, the alibi notice, dismissal for unnecessary delay, the post-verdict motions within ten days, the reduction of sentence within 120 days, and the 30-day notice of intent to appeal with the appeal perfected within four months. The source is CURRENCY UNCONFIRMED, so every cite is a hole."
