description = "Criminal cases in the Connecticut Superior Court under the 2026 Connecticut Practice Book, as far as the vendored text states: arraignment by the first court day after arrest, the 48-hour probable cause determination, pretrial release, pretrial motions within ten days after the first pretrial conference, discovery, plea or trial within the speedy-trial limits of Sections 43-39 to 43-41, the five-day motions for judgment of acquittal and new trial, sentencing, the thirty-day application for sentence review, and the twenty-day appeal from the pronouncement of sentence."
