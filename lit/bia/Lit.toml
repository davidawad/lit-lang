# Appeals from immigration judges to the Board of Immigration Appeals and
# motions before the Board under 8 C.F.R. Part 1003, as published in the
# eCFR current through October 23, 2026 (sources/bia, the sectioned
# extract). The Part states its own filing rules (8 C.F.R.
# § 1003.38(b)(3): calendar days, a last day on a Saturday, Sunday or
# legal holiday carried to the next business day), which no counting rule
# in lit/core encodes, so its periods are stated in notes, not encoded as
# counted deadlines. The Immigration and Nationality Act (8 U.S.C.) and
# the fee schedule of 8 C.F.R. § 1103.7 are vendored nowhere in sources/,
# so they are named in notes and every cite binds to Part 1003. The eCFR
# states the text current to its date, not each section's effective date,
# so the package is in force from that date.
[package]
name = "bia"
version = "0.1.0"
language = 1
pack_id = "bia"
forum = "bia"
authority = "Regulation"
title = "Board of Immigration Appeals"
description = "Appeals from immigration judges to the Board of Immigration Appeals and motions to reconsider or reopen under 8 C.F.R. Part 1003, as far as the vendored text states: the notice of appeal and its 10- or 30-day period, fees, summary dismissal and en banc acceptance, briefing, the Board's scope of review and dispositions, and motions to reconsider and reopen."
in_force = "2026-10-23"
known_at = "2026-10-27"
unknown_before = "2026-10-23"
jurisdiction = "Board of Immigration Appeals (Executive Office for Immigration Review)"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.cfr-8-1003]
title = "8 C.F.R. Part 1003 (Executive Office for Immigration Review), eCFR current through October 23, 2026"
