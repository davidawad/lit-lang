# A civil appeal from a Utah district court to the Utah Supreme Court or,
# on transfer, the Utah Court of Appeals, under the Utah Rules of
# Appellate Procedure, each rule as in force on October 26, 2026 with its
# own effective date (sources/ut-state-appellate; the latest, URAP 3, 5
# and 11, effective May 1, 2026). Computation of time is URAP 22(a): a
# legal holiday is any holiday Utah recognizes and observes, as listed on
# a court web page that is not vendored, and core has no Utah calendar, so
# periods are stated in notes, not counted. Review of a Court of Appeals
# decision is by certiorari to the Utah Supreme Court (URAP 45-51).
[package]
name = "ut-appellate-civil"
version = "0.1.0"
language = 1
pack_id = "ut-appellate-civil"
forum = "ut-state-appellate"
authority = "StateRule"
jurisdiction_id = "utah"
title = "Utah Supreme Court and Court of Appeals, civil appeals"
description = "Civil appeals from the Utah district courts under the Utah Rules of Appellate Procedure, as far as the vendored text states: appealability and interlocutory petitions, the notice of appeal and its time, the docketing statement, the record and transcript, briefing and its length limits, oral argument, decision, rehearing, remittitur, and certiorari to the Utah Supreme Court."
in_force = "2026-10-26"
known_at = "2026-10-28"
unknown_before = "2026-10-26"
jurisdiction = "Utah Supreme Court; Utah Court of Appeals"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

[sources.urap]
title = "Utah Rules of Appellate Procedure, each rule as in force on October 26, 2026"
url = "https://legacy.utcourts.gov/rules/viewall.php?type=urap"
path = "sources/ut-state-appellate/utah-urap-all-rules-sectioned.txt"
path_sha256 = "d69fcfe874d6a0518319e08d04f4ec6e069f5727d56c3df994e57301ab2a5888"
sha256 = "0d36f22202ea09e7f5bd334b7af79c96a4a37473ecce883c6a004115d5c037a5"
as_of = "2026-10-26"
cite_prefixes = ["URAP"]
section_heading = "URAP {n}"
