# The Middle District of North Carolina's Local Rules of Criminal Practice
# (LCrR) as a local-rule layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP
# 57(a)): it declares only the periods the LCrR state, and those of the
# Local Civil Rules LCrR 57.1 applies to criminal proceedings, and
# re-encodes no FRCrimP, Speedy Trial Act or FRAP 4(b) period (those are
# lit/frcrimp's). Each period is counted under FRCrimP 45(a), which governs
# "any local rule". The rules are the LCrR and Local Civil Rules effective
# June 1, 2026 (sources/ncmd). Federal habeas is lit/habeas's; an appeal to
# the Fourth Circuit is lit/frcrimp's and lit/ca4's.
