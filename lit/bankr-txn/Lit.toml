# The Local Bankruptcy Rules of the U.S. Bankruptcy Court for the Northern
# District of Texas over lit/frbp (FRBP 9029(a); 28 U.S.C. § 2075): it
# declares only the periods and limits the Local Bankruptcy Rules
# themselves state and re-encodes no FRBP period. Each period is counted
# under FRBP 9006(a), the FRCP 6(a) method (core's frbp9006). The rules are
# those revised as of December 1, 2025 (General Order 2025-04
# incorporated); General Orders 2026-01 and 2026-02 are procedures that
# amend no rule's text and earlier editions are not vendored
# (sources/bankr-txn), so the package runs from December 1, 2025.
[package]
name = "bankr-txn-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-txn-local-rules"
forum = "bankr-txn"
family = "bankruptcy"
authority = "LocalRule"
kind = "local-rule"
title = "U.S. Bankruptcy Court for the Northern District of Texas: Local Bankruptcy Rules"
description = "The Bankr. N.D. Tex. Local Bankruptcy Rules over the Federal Rules of Bankruptcy Procedure (lit/frbp): the involuntary mailing list, means-test exclusions, amended exemptions and income schedules, conversion filings, retroactive employment, retainers, local counsel, the chapter 11 bar date, omnibus claim objections and estimation, chapter 11, 12 and 13 confirmation objections and ballots, conditional disclosure statement approval, stay relief responses, discovery, affidavits and continuation motions, adversary motion practice, brief limits and pretrial orders, summary judgment brief limits, negative notice (L.B.R. 9007-1), hearing exhibits and exhibit removal."
in_force = "2025-12-01"
known_at = "2026-10-28"
unknown_before = "2025-12-01"
jurisdiction = "U.S. Bankruptcy Court for the Northern District of Texas"
# FRBP 9006(a)(6)(C): the holidays of Texas close a forward-counted period, here and in
# the FRBP periods this package recounts (core's `frbp9006-texas`).
counting = "frbp9006-texas"
recounts = ["frbp-bankruptcy-procedure"]

[package.instrument]
source = "txnb-lbr"
issuer = "United States Bankruptcy Court for the Northern District of Texas"
date = "2025-12-01"
designation = "Local Bankruptcy Rules"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; this package layers only the court's local bankruptcy rules over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.txnb-lbr]
title = "Local Bankruptcy Rules of the United States Bankruptcy Court for the Northern District of Texas (revised as of December 1, 2025)"
