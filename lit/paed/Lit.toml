# The United States District Court for the Eastern District of
# Pennsylvania's Local Rules of Civil Procedure as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods the
# Local Civil Rules themselves state and re-encodes no FRCP deadline. FRCP
# 6(a) computes a period stated in a local rule. The rules are the
# consolidated edition the court publishes as amended through May 8, 2023
# (sources/paed). The one later amending order, of Oct. 8, 2024 (effective
# Sept. 9, 2024), adds a case-assignment category to Local Civil Rule 40.1
# and states no period or limit, so no declaration here rests on it. An
# appeal goes to the Third Circuit under lit/frap.
