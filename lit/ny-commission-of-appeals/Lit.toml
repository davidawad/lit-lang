# The New York Commission of Appeals, a historical court that heard
# causes pending in the Court of Appeals under the judiciary article as
# amended in 1869 (N.Y. Const. art. VI, § 5 (1869)). Neither that
# constitutional text, the statutes organizing the Commission nor its
# practice is vendored: every cite and value is a hole, and the
# Commission's dates of sitting are not encoded (in_force is the date of
# promotion, not of the court). There is no source binding to declare.
[package]
name = "ny-commission-of-appeals"
version = "0.1.0"
language = 1
pack_id = "ny-commission-of-appeals"
forum = "ny-commission-of-appeals"
family = "state-civil"
authority = "StateRule"
jurisdiction_id = "new-york"
title = "New York Commission of Appeals"
description = "The structure of an appeal heard by the New York Commission of Appeals, a historical court. No rule text is vendored, so every cite and value is a hole."
in_force = "2026-10-28"
known_at = "2026-10-28"
unknown_before = "2026-10-28"
jurisdiction = "New York Commission of Appeals"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The state's shared rule layer (its trigger events).
ny-state-rules = { version = "^0.1.0", path = "../ny-rules" }
