# The U.S. Bankruptcy Court for the Southern District of Iowa over lit/frbp
# (FRBP 9029(a); 28 U.S.C. § 2075). The court has no local bankruptcy
# rules: its Bankruptcy Rules page states that "Effective August 4, 2003,
# this court's local rules were abolished" and that attorneys and pro se
# parties consult the Federal Rules of Bankruptcy Procedure
# (sources/bankr-ias/PROVENANCE.md). So this package declares no local
# period, page limit, filing or service rule: every period in the court is
# lit/frbp's, and none is restated here. It is a base package, not a
# `kind = "local-rule"` layer: lit/core has no bankruptcy forum family
# (L2011 for `bankr-ias`), as for lit/bankr-dc.
#
# Layers: none. No amending order or later rule text is vendored; the
# abolition date, August 4, 2003, opens the package.
[package]
name = "bankr-ias-local-rules"
version = "0.1.0"
language = 1
pack_id = "bankr-ias-local-rules"
forum = "bankr-ias"
authority = "LocalRule"
title = "U.S. Bankruptcy Court for the Southern District of Iowa: no local bankruptcy rules (abolished August 4, 2003)"
description = "The Bankr. S.D. Iowa layer over the Federal Rules of Bankruptcy Procedure (lit/frbp): the court abolished its local rules effective August 4, 2003 and directs attorneys and pro se parties to the FRBP, so the layer declares no local period, page limit, filing or service rule."
in_force = "2003-08-04"
known_at = "2026-10-28"
unknown_before = "2003-08-04"
jurisdiction = "U.S. Bankruptcy Court for the Southern District of Iowa"
counting = "frcp6"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
# The FRBP periods; the court has no local bankruptcy rules to layer over them.
frbp-bankruptcy-procedure = { version = "^0.1.0", path = "../frbp" }

[sources.frbp]
title = "Federal Rules of Bankruptcy Procedure, December 1, 2025 edition"
url = "https://www.uscourts.gov/sites/default/files/document/federal-rules-of-bankruptcy-procedure.pdf"
path = "sources/frbp.txt"
path_sha256 = "0c8e487aa7093bcee260d9037c459344f489b4096d3cdd91177ebb2d76c403d8"
as_of = "2025-12-01"

[sources.iasb-rules-page]
title = "U.S. Bankruptcy Court for the Southern District of Iowa, Bankruptcy Rules page (local rules abolished effective August 4, 2003)"
url = "https://www.iasb.uscourts.gov/bankruptcy-rules"
path = "sources/bankr-ias/iasb-bankruptcy-rules-page.txt"
