</style></head><body><div><p dir="ltr" class="s2043662Normal"><span xml:space="preserve" class="s2043662SENU">15-6-55(c). </span><span class="s2043662CL">Setting aside default.</span></p><p dir="ltr" class="s2043662Normal-000000"><span class="s2043662DefaultParagraphFont">For good cause shown the court may set aside a judgment by default in accordance with § 15-6-60(b).</span></p><p dir="ltr" class="s2043662Normal"><span xml:space="preserve" class="s2043662000001"> </span></p><p dir="ltr" class="s2043662Normal"><span class="s2043662SCL">Source:</span><span xml:space="preserve" class="s2043662SCL-000002">  SD RCP, Rule 55 (c), as adopted by Sup. Ct. Order March 29, 1966, effective July 1, 1966; Supreme Court Rule 84-6.</span></p></div></body></html>
