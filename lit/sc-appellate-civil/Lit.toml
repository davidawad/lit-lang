# A civil appeal from the court of common pleas to the South Carolina Court
# of Appeals (or, in the cases Rule 203(d)(1)(A) lists, the Supreme Court)
# under Part II of the South Carolina Appellate Court Rules, then
# certiorari in the Supreme Court under Rule 242, as the rule pages on
# sccourts.org served them on 2026-10-28 (sources/sc-appellate-civil).
# Parts I and II last state an amendment by order of April 30, 2024; none
# of the 2026 orders vendored beside them touches Parts I or II, and the
# package shares lit/sc-circuit-civil's in-force date. Rule 263(a)
# computes time like SCRCP 6(a) and allows no added days for mail; no
# lit/core counting rule encodes it, so the rules' periods are stated in
# notes, not counted deadlines. The decision statute the outline cited
# (S.C. Code § 14-3-330) is not vendored and is not cited. A circuit
# court appeal arrives from lit/sc-circuit-civil.
[package]
name = "sc-appellate-court-civil"
version = "0.1.0"
language = 1
pack_id = "sc-appellate-court-civil"
forum = "sc-appellate-civil"
authority = "StateRule"
title = "South Carolina Court of Appeals and Supreme Court, civil"
description = "A civil appeal from a South Carolina circuit court and certiorari to the Supreme Court under the South Carolina Appellate Court Rules, as far as the vendored text states. A circuit court appeal arrives from lit/sc-circuit-civil."
in_force = "2026-04-30"
known_at = "2026-10-28"
unknown_before = "2026-04-30"
jurisdiction = "South Carolina Court of Appeals; South Carolina Supreme Court"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }

