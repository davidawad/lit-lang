# The New York base library (lg-u561.5 pattern): the trigger events the
# New York court packages route their graphs on: lit/ny-supreme-civil,
# lit/ny-appellate-division, lit/ny-court-of-appeals and the outlines
# under outlines/second-circuit/new-york/.
# It declares no period: the rules' periods are stated in the court
# packages' notes. No procedure of its own.
[package]
name = "ny-state-rules"
version = "0.1.0"
language = 1
pack_id = "ny-state-rules"
forum = "ny-state-rules"
authority = "StateRule"
jurisdiction_id = "new-york"
title = "New York state court rules (base library)"
description = "The rule layer New York's court packages share: the trigger events their graphs route on. No procedure of its own."
in_force = "2026-10-27"
known_at = "2026-10-28"
unknown_before = "2026-10-27"
jurisdiction = "New York state courts"

[package.roles]
applicant = "self"
court = "nature"
office = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
