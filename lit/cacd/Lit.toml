# The United States District Court for the Central District of
# California's Local Civil Rules (Chapter I of its Local Rules) as a
# local-rule layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it
# declares only the periods and limits the Local Civil Rules themselves
# state and re-encodes no FRCP deadline. FRCP 6(a) computes a period stated
# in a local rule. The rules are Chapter I as last amended June 1, 2026
# (sources/fed-cdcal); Chapters II-IV (admiralty, criminal, bankruptcy) are
# not vendored and are out of scope. An appeal goes to the Ninth Circuit
# under lit/frap and lit/ca9.
[package]
name = "cacd-local-rules"
version = "0.1.0"
language = 1
pack_id = "cacd-local-rules"
forum = "cacd"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Central District of California: Local Civil Rules"
description = "The Central District of California's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): notice of motion, the pre-filing conference, opposition and reply before the hearing, reconsideration, the brief word limit, final pretrial conference papers, discovery joint stipulations, costs before the clerk, attorney's fees and other costs, and review of a magistrate judge's nondispositive ruling."
in_force = "2026-06-01"
known_at = "2026-10-28"
unknown_before = "2026-06-01"
jurisdiction = "United States District Court, C.D. Cal."
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
