# Criminal cases in the North Carolina superior court under the Criminal
# Procedure Act, Chapter 15A of the General Statutes (sources/
# nc-criminal-trial-court), with the criminal notice of appeal of N.C. R.
# App. P. 4 (sources/nc-appellate-civil, Codified 2 September 2025). The
# Chapter 15A extract states no edition date and its PROVENANCE records
# CURRENCY UNCONFIRMED, so every Chapter 15A cite is a hole, `?("...,
# CURRENCY UNCONFIRMED")`, and its periods are stated in notes as the
# vendored text states them, unverified; the NCRAP cites bind. lit/core
# has no North Carolina counting rule, so no period is a counted deadline.
# North Carolina has no speedy-trial statute in force: G.S. 15A-701
# through 15A-710 (Article 35) were repealed by S.L. 1989, c. 688.
# Federal habeas is lit/habeas's.
[package]
name = "nc-criminal-trial-court"
version = "0.1.0"
language = 1
pack_id = "nc-criminal-trial-court"
forum = "nc-criminal-trial-court"
authority = "StateRule"
title = "North Carolina superior court, criminal"
description = "Criminal cases in the North Carolina superior court under Chapter 15A of the General Statutes, as far as the vendored text states: first appearance, the probable-cause hearing, the time for pretrial motions and suppression motions, the motion for appropriate relief within 10 days after judgment, and the 14-day criminal notice of appeal of N.C. R. App. P. 4(a). Chapter 15A is CURRENCY UNCONFIRMED, so its cites are holes."
in_force = "2025-09-02"
known_at = "2026-10-28"
unknown_before = "2025-09-02"
jurisdiction = "North Carolina trial courts of general criminal jurisdiction"

