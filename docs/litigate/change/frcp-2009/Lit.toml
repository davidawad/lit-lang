# The deadline domain's change files (lg-fq2.6): the Supreme Court's order of
# March 26, 2009 amending the FRCP, effective December 1, 2009, with the
# time-computation amendments of Rule 6 (lit/core's `frcp6@2009-12-01`).
# Rules 50(b), 59(b) and 59(e) go from 10 days to 28, Rule 23(f) from 10 to
# 14: "shall govern in all proceedings thereafter commenced and, insofar as
# just and practicable, all proceedings then pending".
