# The deadline domain's change files (lg-fq2.6): the Supreme Court's order of
# April 25, 2005 amending FRAP 4(a)(6), effective December 1, 2005. The
# window to move to reopen stays 7 days, now after notice of entry "under
# Federal Rule of Civil Procedure 77(d)": the amendment settles which notice
# opens it (the circuit split `frap-4a6-notice`, VALIDATION.md §4), not how
# long it is.
