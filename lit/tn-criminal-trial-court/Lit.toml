description = "Criminal cases in the Tennessee trial courts under the Tennessee Rules of Criminal Procedure, as far as the vendored text states and with every rule period a hole while its currency is unconfirmed: the initial appearance and preliminary hearing, bindover or discharge, indictment, presentment or information, arraignment and pleas, pretrial motions, jury trial, judgment of acquittal, new trial and arrest of judgment motions, sentence and judgment, dismissal for unnecessary delay, and the 30-day appeal as of right to the Court of Criminal Appeals with its post-trial tolling."
in_force = "2026-10-28"
