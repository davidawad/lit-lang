# Civil actions in the North Carolina Superior Court under the North
# Carolina Rules of Civil Procedure (N.C. Gen. Stat. Chapter 1A), as the
# General Assembly's Chapter 1A PDF stated them with changes through S.L.
# 2026-30 (sources/nc-superior-civil); the same rules govern civil
# practice in the district court. Rule 6(a) computes time and excludes
# intermediate Saturdays, Sundays and holidays from a period of less than
# seven days; no lit/core counting rule encodes it, so the rules' periods
# are stated in notes, not counted deadlines. An appeal hands off to
# lit/nc-appellate-civil.
