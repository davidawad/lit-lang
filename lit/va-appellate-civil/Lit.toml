# A civil appeal of right to the Court of Appeals of Virginia under Part
# Five A of the Rules of the Supreme Court of Virginia, then review in the
# Supreme Court of Virginia under Part Five (the Court's all-Parts
# compilation as currently effective; the latest amendment it states is
# effective September 15, 2026; sources/va-circuit-civil, the same file as
# lit/va-circuit-civil). Computation of time is Code § 1-210, which is not
# vendored and has no counting rule in lit/core, so the rules' periods are
# stated in notes, not encoded as counted deadlines. The appellate
# jurisdiction statute the outline cited (Code § 17.1-405) is not vendored
# and is not cited. A circuit court appeal arrives from
# lit/va-circuit-civil.
