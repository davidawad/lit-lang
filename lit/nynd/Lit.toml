# The Northern District of New York's Local Rules of Practice (civil,
# Sections I-X, effective January 1, 2026) as a local-rule layer over
# lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods
# and limits the Local Rules themselves state and re-encodes no FRCP
# deadline. Each period is counted under FRCP 6 (L.R. 6.1). The rules are
# the edition effective January 1, 2026 (sources/ndny); earlier editions
# are not vendored, so a query before that date is a hole in the corpus.
# The criminal, Social Security, habeas corpus, admiralty and patent
# rules (Sections XI-XV) are not encoded. An appeal goes to the Second
# Circuit under lit/frap.
[package]
name = "nynd-local-rules"
version = "0.1.0"
language = 1
pack_id = "nynd-local-rules"
forum = "nynd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Northern District of New York: Local Rules of Practice (civil)"
description = "The Northern District of New York's civil Local Rules of Practice as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): expedited service, removal of a summons-with-notice action, motion briefing and its page limits, cross-motions, amicus briefs, the RICO statement, amended pleadings, motions to compel after the discovery cut-off, stipulations of dismissal after settlement, taxation of costs, reconsideration, appeals from and objections to magistrate judges, and bankruptcy appeal briefing."
in_force = "2026-01-01"
known_at = "2026-10-28"
unknown_before = "2026-01-01"
jurisdiction = "United States District Court, N.D.N.Y."
# FRCP 6(a)(6)(C): the holidays of New York close a forward-counted period, here and in
# the FRCP periods this package recounts (core's `frcp6-new-york`).
counting = "frcp6-new-york"
recounts = ["frcp-civil-procedure"]

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "nynd-lr"
issuer = "Board of Judges of the United States District Court for the Northern District of New York"
date = "2026-01-01"
designation = "Local Rules of Practice"

[dependencies]
core = { version = "^1.0.0", path = "../core" }
frcp-civil-procedure = { version = "^2024.12.0", path = "../frcp" }

[sources.nynd-lr]
title = "Local Rules of Practice of the United States District Court for the Northern District of New York (effective January 1, 2026)"
url = "https://www.nynd.uscourts.gov/sites/nynd/files/local_rules/Local%20Rules%202026_Final.pdf"
path = "sources/ndny/local-rules-civil-sectioned.txt"
path_sha256 = "46720686bf917452128290578c6850c859575a83cc016741fefd51b52221e047"
sha256 = "707fdaa7e094b33f33ee9a44753473626949234f550a0e726ac9a9c2eb9dea96"
as_of = "2026-01-01"
cite_prefixes = ["N.D.N.Y. L.R."]
section_heading = "L.R. {n}"
