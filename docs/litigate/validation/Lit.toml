# Validation of the deadline domain (lg-fq2.5; docs/litigate/VALIDATION.md):
# golden tests from the worked examples of the 2009 Committee Notes to FRCP 6
# and FRAP 26, and every collected timeliness ruling of the lg-fq2.3 corpus
# (sources/change-corpus/rulings/MANIFEST.json) counted under the rules in
# force on its own dates. The package declares only the periods the rulings
# and the Notes count; the counting is lit/core's FRCP 6 and FRAP 26
# history, selected by each trigger's date. Public law and the opinions'
# own facts only.
[package]
name = "change-validation"
version = "1.0.0"
language = 1
pack_id = "change-validation"
forum = "frcp"
family = "district-civil"
authority = "FederalRule"
title = "Validation: the 2009 Committee Note examples and the timeliness rulings"
in_force = "1968-07-01"
known_at = "2026-10-27"

[package.roles]
movant = "self"
court = "nature"

[dependencies]
core = { version = "^1.0.0", path = "../../../lit/core" }

[sources.frcp]
title = "Federal Rules of Civil Procedure, as amended to Dec. 1, 2024"
