cite_prefixes = ["FRAP (2008 ed.)"]
section_heading = "FRAP (2008 ed.) Rule {n}"

[[cite_syntax.rules]]
prefixes = ["FRAP", "Fed. R. App. P.", "Fed R App P", "F.R.A.P."]
