# A criminal appeal to the Alabama Court of Criminal Appeals under the
# Alabama Rules of Appellate Procedure, which govern that court as well as
# the Supreme Court and the Court of Civil Appeals (Ala. R. App. P. 1).
# Rules 1, 3, 4, 10, 28, 34, 39, 40 and 41 are the per-rule texts current
# through the October 1, 2025 amendments (sources/al-state-appellate); the
# other rules are the per-rule PDFs served October 28, 2026
# (sources/al-court-of-criminal-appeals). Computation of time (Ala. R.
# App. P. 26) has no counting rule in core, so the periods are stated in
# notes, not counted. Further review by certiorari continues in the Alabama
# Supreme Court (Ala. R. App. P. 39), which is not modeled here.
[package]
name = "al-court-of-criminal-appeals"
version = "0.1.0"
language = 1
pack_id = "al-court-of-criminal-appeals"
forum = "al-court-of-criminal-appeals"
authority = "StateRule"
jurisdiction_id = "alabama"
title = "Alabama Court of Criminal Appeals"
description = "A criminal appeal to the Alabama Court of Criminal Appeals under the Alabama Rules of Appellate Procedure: the notice of appeal and its time, the record and transcript, briefing and its length limits, submission, decision, rehearing, the certificate of judgment and the hand-off to certiorari review in the Alabama Supreme Court."
in_force = "2025-10-01"
known_at = "2026-10-28"
unknown_before = "2025-10-01"
jurisdiction = "Alabama Court of Criminal Appeals"

[package.roles]
