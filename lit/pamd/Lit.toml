# The United States District Court for the Middle District of
# Pennsylvania's Local Rules of Court as a local-rule layer over lit/frcp
# (28 U.S.C. § 2071; FRCP 83(a)): it declares only the periods and limits
# the Local Rules themselves state and re-encodes no FRCP deadline. FRCP
# 6(a) computes a period stated in a local rule. The rules are the edition
# effective December 1, 2014 (sources/pamd), which the court's page states
# were last amended that day. An appeal goes to the Third Circuit under
# lit/frap.
[package]
name = "pamd-local-rules"
version = "0.1.0"
language = 1
pack_id = "pamd-local-rules"
forum = "pamd"
family = "district-civil"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court for the Middle District of Pennsylvania: Local Rules of Court"
description = "The Middle District of Pennsylvania's Local Rules of Court as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion briefing periods and brief length, reconsideration, third-party joinder, service of an amended pleading adding a defendant, the attorneys' conference and case management statement, the pretrial memorandum, class determination, the default close of discovery, bills of costs, appeals and objections to a magistrate judge's orders and reports, and Social Security review briefing and its limits."
in_force = "2014-12-01"
known_at = "2026-10-28"
unknown_before = "2014-12-01"
jurisdiction = "United States District Court, M.D. Pa."
counting = "frcp6"

[package.roles]
applicant = "self"
opponent = "opponent"
court = "nature"

[package.instrument]
source = "pamd-lr"
issuer = "United States District Court for the Middle District of Pennsylvania"
date = "2014-12-01"
designation = "Local Rules of Court (effective December 1, 2014)"

