[package]
name = "litigate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "litigate_cli"
path = "src/lib.rs"

[[bin]]
name = "litigate"
path = "src/main.rs"

[dependencies]
ariadne.workspace = true
clap.workspace = true
litigate-engine = { path = "../litigate-engine" }
litigate-base = { path = "../litigate-base" }
litigate-import = { path = "../litigate-import" }
litigate-lower = { path = "../litigate-lower" }
litigate-sema = { path = "../litigate-sema" }
litigate-syntax = { path = "../litigate-syntax" }
litigate-verify = { path = "../litigate-verify" }
salsa.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
litgraph-packs = { path = "../litgraph-packs" }
assert_cmd.workspace = true
insta = { workspace = true, features = ["json"] }
proptest.workspace = true
# A real MCP client driving `litigate mcp` over stdio in tests/mcp.rs.
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "transport-child-process",
] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }

[lints]
workspace = true
