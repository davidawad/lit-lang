# The Middle District of Florida's criminal-case Local Rules as a
# local-rule layer over lit/frcrimp (28 U.S.C. § 2071; FRCrimP 57(a)). The
# Local Rules dated November 1, 2025 (sources/md-fla) have no criminal
# part; their criminal-case provisions, the division for a criminal action
# (Local Rule 1.04(c)) and extrajudicial disclosure in a criminal action
# (Local Rule 3.11), state no period or limit, so the layer declares
# none and re-encodes no FRCrimP, Speedy Trial Act or FRAP period.
