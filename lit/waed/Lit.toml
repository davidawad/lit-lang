# The Eastern District of Washington's Local Civil Rules as a local-rule
# layer over lit/frcp (28 U.S.C. § 2071; FRCP 83(a)): it declares only the
# periods and limits the Local Civil Rules themselves state and re-encodes
# no FRCP deadline. Each period is counted under FRCP 6(a), which governs
# "any local rule". The rules are those effective November 17, 2025
# (sources/fed-edwash). An appeal goes to the Ninth Circuit under lit/frap
# and lit/ca9.
[package]
name = "waed-local-rules"
version = "0.1.0"
language = 1
pack_id = "waed-local-rules"
forum = "waed"
authority = "LocalRule"
kind = "local-rule"
title = "United States District Court, Eastern District of Washington: Local Civil Rules"
description = "The Eastern District of Washington's Local Civil Rules as a local-rule layer over the Federal Rules of Civil Procedure (lit/frcp): motion response and reply periods for counsel and pro se litigants, memorandum page limits, the statement noting a party's death, deposition designations and objections, the notice of issues to be tried, pro se addresses, voir dire questions, costs and retaxation, notice before a motion for default, injunction motions, and the response in attorney discipline."
in_force = "2025-11-17"
known_at = "2026-10-28"
unknown_before = "2025-11-17"
jurisdiction = "United States District Court, E.D. Washington"
counting = "frcp6"

